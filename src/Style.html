<style>
:root{
  --bg:#04121c; --bg2:#071c2a;
  --glass:rgba(10,28,42,.72); --glass2:rgba(14,36,52,.86);
  --line:rgba(120,190,225,.16); --line2:rgba(120,190,225,.28);
  --txt:#eaf4fb; --mut:#8ba6b8; --mut2:#5f7d8f;
  --acc:#2ee6a8; --acc2:#1fc4c0;
  /* 톤 3개: 남색(바탕) · 민트(브랜드) · 산호(주의) — 이 밖의 색은 쓰지 않는다 */
  --cor:#ff7f5a; --cor2:#e0563a; --corl:#ffb08a;
  --S:#2ee6a8; --A:#7fd8cf; --B:#b5cad8; --C:#ff7f5a; --D:#e0563a;
  --r:26px; --r2:18px; --r3:12px;
  --sp:cubic-bezier(.22,1.2,.36,1);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--txt);
  font-feature-settings:'tnum';
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
h1,h2,h3,h4,p{margin:0}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--line);
}

/* ── 지도 ─────────────────────────────── */
#map{position:fixed;inset:0;background:var(--bg);z-index:0}
.leaflet-container{background:#04121c;font-family:inherit}
.leaflet-control-attribution{
  background:rgba(4,18,28,.6)!important;color:var(--mut2)!important;
  font-size:9px!important;border-radius:8px 0 0 0;
}
.leaflet-control-attribution a{color:var(--mut)!important}
.leaflet-control-zoom{display:none}

/* 베이스맵 전환 (지도·위성·밝게) — 바텀시트 접힌 높이(148px) 위 */
/* 겹 단추들은 아래에서 위로 쌓고, 여는 알약은 언제나 맨 아래에 둔다(엄지에 가깝게) */
.leaflet-bottom.leaflet-left{z-index:650;display:flex;flex-direction:column;align-items:flex-start}
.leaflet-bottom.leaflet-left .leaflet-control.basesw{
  order:1;                 /* 배경(지도·위성·밝게) — 맨 위 */
  margin:0 0 8px 12px;
}
.leaflet-bottom.leaflet-left .leaflet-control.eosw{
  order:2;                 /* 지형 겹 */
  margin:0 0 8px 12px;
}
.leaflet-bottom.leaflet-left .leaflet-control.wdsw{
  order:3;                 /* 바다(바람·조류) */
  margin:0 0 8px 12px;
}
.leaflet-bottom.leaflet-left .leaflet-control.laysw{
  order:99;
  margin:0 0 calc(162px + var(--safeB)) 12px;   /* 추천 목록 판을 피해 그 위에 */
}
/* 목록을 닫아 지도만 볼 때는 알약도 아래로 내려온다 — 「추천 목록」 단추 바로 위 */
body.sheet-off .leaflet-bottom.leaflet-left .leaflet-control.laysw{
  margin-bottom:calc(64px + var(--safeB));
}
.eosw .basebtn.on{
  background:linear-gradient(100deg,#ff7f5a,#e0563a);color:#241302;
  box-shadow:0 2px 9px rgba(255,127,90,.4);
}
.eosw .basebtn.gg.on{
  background:linear-gradient(100deg,#1fc4c0,#0fb98a);color:#04202e;
  box-shadow:0 2px 9px rgba(31,196,192,.4);
}
.basesw{flex-wrap:wrap;max-width:min(76vw,330px)}
.bsep{flex:0 0 auto;width:1px;height:16px;margin:0 3px;background:rgba(255,255,255,.2);align-self:center}
.basebtn.fl3::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0;background:var(--mut2)}
.basebtn.fl3[data-fl="mud"]::before{background:#8a6a45}
.basebtn.fl3[data-fl="sand"]::before{background:#f2dfa6;border-radius:2px}
.basebtn.fl3[data-fl="mix"]::before{background:linear-gradient(135deg,#8a6a45 50%,#f2dfa6 50%);border-radius:2px}
.eosw .basebtn.fl3.on{
  background:linear-gradient(100deg,#f2dfa6,#8a6a45);color:#241a06;
  box-shadow:0 2px 9px rgba(200,165,110,.45);
}
.eosw .basebtn.cl.on{
  background:linear-gradient(100deg,#e8d5a0,#7f97a8);color:#10202b;
  box-shadow:0 2px 9px rgba(160,180,200,.4);
}
.eosw .basebtn.fl.on{
  background:linear-gradient(100deg,#e6d3a3,#8a6f52);color:#241a06;
  box-shadow:0 2px 9px rgba(180,150,110,.45);
}
.eosw .basebtn.rk.on{
  background:linear-gradient(100deg,#ffb08a,#ff7f5a);color:#241a06;
  box-shadow:0 2px 9px rgba(255,176,138,.4);
}
.basesw{
  display:flex;gap:3px;padding:4px;
  background:#0a1e2b;border:1px solid rgba(140,200,235,.3);
  border-radius:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.25);
}
.basebtn{
  -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
  padding:8px 13px;border-radius:10px;background:transparent;
  color:#cadeeb;font-family:inherit;font-size:12.5px;font-weight:700;line-height:1;
  letter-spacing:-.2px;transition:background .16s,color .16s;
}
.basebtn:hover{color:#fff;background:rgba(255,255,255,.09)}

/* ── 겹 접기 ───────────────────────────
   배경·지형·바다 단추 세 줄은 평소 접혀 있고, 알약 하나만 지도 위에 남는다.
   지도를 최대한 넓게 쓰는 것이 목적이다. */
.leaflet-bottom.leaflet-left .basesw:not(.laysw){
  transform-origin:0 100%;
  transition:opacity .18s ease, transform .18s var(--sp);
}
body:not(.lay-open) .leaflet-bottom.leaflet-left .basesw:not(.laysw){
  display:none;
}
body.lay-open .leaflet-bottom.leaflet-left .basesw:not(.laysw){
  animation:layIn .2s var(--sp) both;
}
@keyframes layIn{ from{opacity:0;transform:translateY(6px) scale(.97)} to{opacity:1;transform:none} }
.laysw{ padding:3px; }
.laytog{
  display:flex;align-items:center;gap:7px;padding:8px 12px;
}
.laytog .lay-i{ width:13px;height:12px;position:relative;display:inline-block;flex:0 0 auto }
.laytog .lay-i::before,.laytog .lay-i::after{
  content:'';position:absolute;left:0;right:0;height:4px;
  border:1.4px solid currentColor;border-radius:2px;transform:skewX(-20deg);
}
.laytog .lay-i::before{ top:0 }
.laytog .lay-i::after{ bottom:0;opacity:.55 }
.laytog .lay-n{
  min-width:16px;height:16px;padding:0 4px;border-radius:8px;
  background:rgba(46,230,168,.18);color:var(--acc);
  font-size:10px;font-weight:800;line-height:16px;text-align:center;
}
.laytog.on{
  background:linear-gradient(100deg,var(--acc),var(--acc2));color:#04121c;
  box-shadow:0 2px 9px rgba(46,230,168,.4);
}
@media (prefers-reduced-motion:reduce){
  body.lay-open .leaflet-bottom.leaflet-left .basesw:not(.laysw){ animation:none }
}
.basebtn.on{
  background:linear-gradient(100deg,var(--acc),var(--acc2));color:#04121c;font-weight:800;
  box-shadow:0 2px 9px rgba(46,230,168,.4);
}


/* 카카오맵 배경 — 밝은 지도 위에서 또렷하게 (핀 전면 보정) */
body.map-kakao .pin{
  border:2.5px solid #fff;
  box-shadow:0 1px 3px rgba(0,0,0,.28),0 5px 14px rgba(15,35,55,.35);
}
body.map-kakao .pin::before{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
body.map-kakao .pin::after{background:#12324a;box-shadow:0 0 0 1.5px #fff}
body.map-kakao .pin.sm{opacity:.96;border-width:2px}
body.map-kakao .pin.on{border-color:#12324a}
body.map-kakao .pin-top{box-shadow:0 0 0 3px rgba(11,151,104,.4),0 5px 14px rgba(15,35,55,.4)}
body.map-kakao .pin-top .halo{border-color:#0b9768}
body.map-kakao .vignette{opacity:.22}
body.map-kakao .leaflet-container{background:transparent}

/* 위성 모드: 배경이 밝아 핀 테두리·비네트를 강하게 */
body.map-sat .vignette{
  background:
    radial-gradient(120% 58% at 50% 0%,rgba(2,10,16,.82) 0%,transparent 52%),
    radial-gradient(140% 52% at 50% 100%,rgba(2,10,16,.86) 0%,transparent 56%);
}
body.map-sat .pin{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 3px 12px rgba(0,0,0,.6)}
body.map-sat .leaflet-container{background:#0b1a22}
/* OSM 타일 다크 모드 — 색을 뒤집고 색상환을 되돌려 어두운 지도로 만든다 */
.osm-dark{filter:invert(1) hue-rotate(180deg) brightness(.82) contrast(.95) saturate(.32)}

.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(4,18,28,.9) 0%,transparent 55%),
    radial-gradient(140% 55% at 50% 100%,rgba(4,18,28,.92) 0%,transparent 60%);
}

/* 마커 */
.pin{
  width:38px;height:38px;display:grid;place-items:center;
  border-radius:50%;font-size:12.5px;font-weight:800;letter-spacing:-.3px;
  color:#04121c;border:2px solid rgba(255,255,255,.35);
  box-shadow:0 4px 16px rgba(0,0,0,.5);
  transition:transform .25s var(--sp);
  transform-origin:50% 124%;            /* 꼬리 끝을 축으로 커진다 — 지점이 안 밀린다 */
}
/* 꼬리 — 이 삼각형 끝이 실제 좌표다 */
.pin::before{
  content:'';position:absolute;left:50%;top:calc(100% - 1px);
  width:0;height:0;margin-left:-5px;
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-top:10px solid var(--pinc,#2ee6a8);
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.55));
}
/* 좌표 자리에 찍는 점 — 어느 배율에서도 정확히 어디인지 보인다 */
.pin::after{
  content:'';position:absolute;left:50%;top:calc(100% + 8px);
  width:5px;height:5px;margin-left:-2.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6);
}
.pin.sm{width:26px;height:26px;font-size:10.5px;opacity:.85;border-width:1.5px;transform-origin:50% 127%}
.pin.sm::before{margin-left:-4px;border-left-width:4px;border-right-width:4px;border-top-width:8px}
.pin.sm::after{top:calc(100% + 6px);width:4px;height:4px;margin-left:-2px}
.pin.on{transform:scale(1.28);border-color:#fff;z-index:999}
.pin-S{background:linear-gradient(140deg,#2ee6a8,#0fb98a);--pinc:#16c497}
.pin-A{background:linear-gradient(140deg,#7fd8cf,#1fc4c0);--pinc:#4ccfc6}
.pin-B{background:linear-gradient(140deg,#c9d9e4,#8ba6b8);--pinc:#a9bfcc}
.pin-C{background:linear-gradient(140deg,#ffb08a,#ff7f5a);color:#2a1000;--pinc:#ff9670}
.pin-D{background:linear-gradient(140deg,#ff7f5a,#e0563a);color:#2a0808;--pinc:#ea6a4c}
.pin-top{box-shadow:0 0 0 3px rgba(46,230,168,.35),0 4px 18px rgba(0,0,0,.55)}
.pin-top .halo{
  position:absolute;inset:-7px;border-radius:50%;
  border:2px solid var(--acc);animation:pulse 2.2s infinite;pointer-events:none;
}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}


/* ── 물때표·바람 오버레이 ── */
.mtwrap{position:fixed;inset:0;z-index:1200;background:rgba(3,12,20,.62);
  display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.mtwrap[hidden]{display:none!important}
.mtcard{width:min(720px,100%);max-height:min(86vh,780px);display:flex;flex-direction:column;
  border-radius:20px;overflow:hidden;background:#07202f;border:1px solid rgba(140,200,235,.3);
  box-shadow:0 24px 70px rgba(0,0,0,.6)}
.mthead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mthead h3{margin:0;font-size:16px;flex:1}
.mthead select{background:#0a2436;color:#d7e8f2;border:1px solid rgba(140,200,235,.35);
  border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13.5px;max-width:46%}
.mtx{-webkit-appearance:none;appearance:none;border:0;background:rgba(255,255,255,.08);color:#cadeeb;
  width:32px;height:32px;border-radius:10px;font-size:18px;cursor:pointer}
.mtbody{overflow:auto;-webkit-overflow-scrolling:touch}
.mtload{padding:34px 0;text-align:center;color:#8ba6b8}
.mtt{width:100%;border-collapse:collapse;font-size:13px}
.mtt th{position:sticky;top:0;background:#0a2436;color:#9fc0d4;font-size:11.5px;font-weight:800;
  padding:9px 8px;text-align:center;letter-spacing:.2px}
.mtt th span{font-weight:600;color:#6d8ba0}
.mtt td{padding:9px 8px;text-align:center;border-top:1px solid rgba(140,200,235,.12);line-height:1.5;vertical-align:middle}
.mtt tr.today{background:rgba(46,230,168,.09)}
.mtt tr.today .mtd{color:var(--acc);font-weight:800}
.mtt .mtd em{font-style:normal;color:#8ba6b8;margin-left:2px}
.mtt .mtd em.sun{color:#ffa38a}
.mtt .mtd em.sat{color:#b5cad8}
.mtt .mtm{font-weight:800;color:#a4e9d4}
.mtt .mth b,.mtt .mtl b{font-size:14px;letter-spacing:-.2px}
.mtt .mth b{color:#1fc4c0}
.mtt .mtl b{color:#ff7f5a}
.mtt .mtwind{color:#9fc0d4;font-size:12px}
.mtt .mtdim,.mtdim{color:#6d8ba0;font-size:12px;font-weight:400}
.mtfoot{padding:10px 14px;border-top:1px solid var(--line);color:#8ba6b8;font-size:11.5px;line-height:1.5}
.mtfoot b{color:#d7e8f2}
.sort.mtbtn{background:linear-gradient(100deg,rgba(31,196,192,.18),rgba(46,230,168,.14));
  border:1px solid rgba(31,196,192,.4);color:#a4e9d4;font-weight:800}
/* 윈디 */
.wdcard{width:min(900px,100%);height:min(86vh,720px)}
.wdbody{flex:1;min-height:0}
.wdbody iframe{width:100%;height:100%;border:0;display:block}
.wdsw{margin-bottom:8px}
.basebtn#wdBtn.on{background:linear-gradient(100deg,#7fd8cf,#2ee6a8);color:#04121c;box-shadow:0 2px 9px rgba(46,230,168,.4)}
.wind-arrow{background:none;border:0;pointer-events:none}
.wind-arrow svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.wind-spd{position:absolute;left:50%;top:100%;transform:translate(-50%,-3px);font-size:9.5px;font-weight:800;letter-spacing:-.2px;text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.5)}
.wind-spd i,.cur-spd i{font-style:normal;font-size:7px;font-weight:700;opacity:.8;margin-left:1px}
/* 조류 */
.basebtn#crBtn.on{background:linear-gradient(100deg,#ffb08a,#ff7f5a);color:#2a1000;box-shadow:0 2px 9px rgba(255,127,90,.4)}
.cur-arrow{background:none;border:0;pointer-events:none}
.cur-arrow svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.cur-spd{position:absolute;left:50%;top:100%;transform:translate(-50%,-3px);font-size:9px;font-weight:800;letter-spacing:-.2px;text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 3px rgba(0,0,0,.5)}
.dt-cur{margin:16px 0 0;padding:8px 12px;border-radius:11px;background:rgba(255,255,255,.045);border:1px solid var(--line);font-size:12.5px;line-height:1.5;color:#cfe3ef;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.dt-cur[hidden]{display:none}
.dt-cur b{color:var(--acc);font-weight:800}
.dt-cur .dt-cur-l{font-size:10.5px;color:var(--mut2);font-weight:700}
.dt-cur em{font-style:normal;color:var(--corl);font-weight:700}
/* 군 통제 경고 */
.mil-box{margin-top:16px;border-color:rgba(255,176,138,.4);background:linear-gradient(135deg,rgba(255,176,138,.12),rgba(255,127,90,.05))}
.mil-box.mil2{border-color:rgba(224,86,58,.5);background:linear-gradient(135deg,rgba(224,86,58,.16),rgba(255,127,90,.06))}
.row-isl.row-mil{background:rgba(255,127,90,.16);color:var(--corl)}
.row-isl.row-kd{background:rgba(255,255,255,.08);color:var(--mut)}
.dt-head .kd{font-weight:800;color:var(--acc)}
.dt-head .kd-F{color:var(--acc2)}
.dt-head .kd-B{color:var(--mut)}
.row-isl.row-prot{background:rgba(224,86,58,.2);color:#ffb08a}
.prot-box{margin-top:16px;border-color:rgba(224,86,58,.5)}
.prot-box .zn-row b{color:#ffb08a}

/* ── 상단 ─────────────────────────────── */
.topbar{
  position:fixed;z-index:20;left:12px;right:12px;top:calc(10px + var(--safeT));
  height:54px;border-radius:20px;padding:0 8px 0 16px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 10px 34px rgba(0,0,0,.42);
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.logo{
  font-size:20px;font-weight:800;letter-spacing:-.6px;
  background:linear-gradient(100deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tagline{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);color:var(--txt);transition:.2s var(--sp);
}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.12)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.spin svg{animation:spin .9s linear infinite}
/* 물때표는 사람들이 제일 많이 찾는 것이라 상단에서 한 톤 도드라지게 둔다 */
.icon-btn.icon-mt{background:rgba(46,230,168,.15);color:var(--acc)}
.icon-btn.icon-mt:active{background:rgba(46,230,168,.28)}
/* 좁은 휴대폰에서 단추가 넷이면 빠듯하다 — 조금 줄여 브랜드 글자를 살린다 */
@media (max-width:380px){
  .icon-btn{width:34px;height:34px;border-radius:11px}
  .icon-btn svg{width:17px;height:17px}
  .topbar .tagline{display:none}
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 날짜 스트립 */
.datestrip{
  position:fixed;z-index:19;left:0;right:0;top:calc(72px + var(--safeT));
  display:flex;gap:7px;padding:0 38px;overflow-x:auto;scrollbar-width:none;scroll-padding:0 38px;
}
.datestrip::-webkit-scrollbar{display:none}
.dchip{
  flex:0 0 auto;min-width:56px;padding:7px 12px;border-radius:15px;
  background:rgba(10,28,42,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid var(--line);text-align:center;line-height:1.25;
  transition:.22s var(--sp);
}
.dchip b{display:block;font-size:13.5px;font-weight:700}
.dchip span{display:block;font-size:9.5px;color:var(--mut)}
.dchip.on{
  background:linear-gradient(140deg,var(--acc),var(--acc2));border-color:transparent;
  color:#04121c;box-shadow:0 6px 20px rgba(46,230,168,.3);
}
.dchip.on span{color:rgba(4,18,28,.62)}
.dchip:active{transform:scale(.94)}

/* 모드 토글 */
.seg{
  position:fixed;z-index:20;left:50%;transform:translateX(-50%);
  top:calc(120px + var(--safeT));
  display:flex;padding:4px;border-radius:17px;box-shadow:0 8px 26px rgba(0,0,0,.4);
}
.seg-btn{
  position:relative;z-index:2;padding:8px 18px;border-radius:14px;
  font-size:13px;font-weight:700;color:var(--mut);
  display:flex;align-items:center;gap:5px;transition:color .25s;
}
.seg-btn span{font-size:13px}
.seg-btn.active{color:#04121c}
.seg-pill{

.mtt .mtfl{min-width:64px}

.flowb i{display:block;height:100%;background:linear-gradient(90deg,#1fc4c0,#2ee6a8);border-radius:3px}

.rec-best{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:8px;font-size:10.5px;font-weight:800;

.rec-good{display:inline-block;margin-top:2px;padding:1px 7px;border-radius:8px;font-size:10.5px;font-weight:800;
  background:rgba(46,230,168,.18);color:#2ee6a8}
.mtt tr[data-best] td{background:rgba(46,230,168,.06)}
.mtt tr[data-best] .mtd{color:#2ee6a8;font-weight:800}
.mtfoot .rec-star{font-size:13px}
.rec-why{display:inline-block;margin-top:2px;font-size:10px;line-height:1.3;color:#9db4c4;font-weight:600}
.mtfoot .up{color:#ffa38a}.mtfoot .dn{color:#b5cad8}

.mtnight b{color:#a4e9d4}
@media(max-width:680px){
  .mtcard:has(.mtt-full){width:100%}
  .mtt-narrow th,.mtt-narrow td{padding:7px 3px;font-size:11px}
  .mtt-narrow .mtm .mtsub{display:none}
  .mtt-narrow .mtfl{min-width:44px}
}
