<style>
:root{--ink:#1b2a32;--mut:#6a7a84;--line:#e2e8ec;--brand:#0b7a5a;--brand2:#0aa07a}
*{box-sizing:border-box}
html,body{background:#eef1f3}
body{margin:0;color:var(--ink);font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',system-ui,-apple-system,sans-serif;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:0 15px 60px}
header{background:linear-gradient(100deg,var(--brand),var(--brand2));color:#fff;padding:11px 0}
header .in{max-width:920px;margin:0 auto;padding:0 15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;font-weight:800;font-size:16px}
header .nav{margin-left:auto;display:flex;gap:14px;font-size:13px}
header .nav a{font-weight:600;opacity:.92}
h1{font-size:26px;letter-spacing:-.02em;margin:16px 2px 6px}
.lead{color:#40515a;font-size:14.5px;margin:0 2px 8px;max-width:720px}
h2{font-size:18px;margin:24px 2px 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rcard{display:block;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 14px rgba(30,50,64,.05);padding:14px 15px;text-decoration:none;color:var(--ink);transition:transform .12s,box-shadow .12s}
.rcard:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(30,50,64,.1)}
.rcard b{display:block;font-size:15.5px}
.rcard span{display:block;color:var(--mut);font-size:12px;margin:3px 0 6px}
.rcard em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--brand)}
footer{color:var(--mut);font-size:12px;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
footer a{color:var(--brand)}
</style>
</head>
