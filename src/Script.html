<script>
(function(){
'use strict';

/* ══════════════ 상태 ══════════════ */
/* 빌드 시점이 아니라 방문자의 실제 오늘(한국시)로 맞춘다 — 정적판은 BOOT.today가 빌드 날짜로 굳는다 */
try {
  var _kst = new Date(Date.now() + 9*36e5).toISOString().slice(0,10);
  if (/^\d{4}-\d{2}-\d{2}$/.test(_kst)) BOOT.today = _kst;
} catch(e){}
var S = {
  ds: BOOT.today, mode: 'haeru', rows: [], sort: 'score', filter: 'all', want: null,
  fmode: 'haeru', sel: null, me: null, markers: {}, loading: false, cur: null,
  near: false, rad: 60, meMk: null
};
var $ = function(id){ return document.getElementById(id); };
var el = function(t, c, h){ var e = document.createElement(t); if(c) e.className = c; if(h!=null) e.innerHTML = h; return e; };
var WD = ['일','월','화','수','목','금','토'];
var MODE_NAME = { haeru:'해루질', fish:'낚시' };

function toast(msg, ms){
  var t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(function(){ t.hidden = true; }, ms||2400);
}
function hm(min){
  if (min === null || min === undefined) return '--:--';
  var m = ((min % 1440) + 1440) % 1440;
  return ('0'+Math.floor(m/60)).slice(-2) + ':' + ('0'+(m%60)).slice(-2);
}
function hmH(h){ return hm(Math.round(h*60)); }
function dstr(d){
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function parseDs(ds){ var a = ds.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function dist(a, b, c, d){
  var R = 6371, r = Math.PI/180;
  var x = (c-a)*r, y = (d-b)*r;
  var h = Math.sin(x/2)*Math.sin(x/2) + Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ══════════════ 휴대폰 판별 ══════════════
 * 휴대폰은 화면도 좁고 자료도 데이터 요금으로 받는다. 무거운 겹은 기본으로 접어 두고,
 * 필요한 사람만 단추로 켠다. 켠 선택은 저장돼 다음에도 그대로 열린다. */
var PHONE = (function(){
  try { return matchMedia('(max-width: 820px)').matches || navigator.maxTouchPoints > 1; }
  catch(e){ return false; }
})();

/* ══════════════ 지도 ══════════════ */
var map = L.map('map', {
  center: [36.35, 127.3], zoom: 7, zoomControl: false,
  attributionControl: true, minZoom: 6, maxZoom: 19
});
try { window._hrnMap = map; } catch(e){}   // 점검용 — 자동 화면검사가 지도를 움직일 때 쓴다

/* ══════════════ 카카오맵 배경 연동 ══════════════
 * data/kakao.json 에 {"key":"자바스크립트키"} 가 있으면 카카오맵을 배경으로 깐다.
 * 라이브러리(핀·어장·갯골 그리기)는 그대로 두고, 카카오맵 화면을 밑에 동기화하는
 * 방식이라 기존 기능이 전혀 안 바뀐다. 키가 없거나 로딩이 실패하면 조용히
 * 지금의 오픈스트리트맵으로 돈다. */
var KAKAO = { on:false, map:null, div:null, off:19, want:'ROADMAP' };
function kl_(z){ return Math.max(1, Math.min(14, KAKAO.off - z)); }
function kSync_(){
  if (!KAKAO.on) return;
  var c = map.getCenter();
  try {
    KAKAO.map.setLevel(kl_(map.getZoom()));
    KAKAO.map.setCenter(new kakao.maps.LatLng(c.lat, c.lng));
    kAlign_();
  } catch(e){}
}
/* 드래그하는 동안(move)은 초당 수십 번 불린다. 그때마다 카카오 지도의 단계·중심을 다시 넣으면
   배경이 매 프레임 재배치돼 휴대폰이 버틴다. 손가락이 움직이는 동안에는 화면 변환(translate)만
   손보고, 단계·중심·정합은 손을 뗀 뒤(moveend·zoomend) 한 번만 한다. */
var KRAF = 0;
function kSyncLite_(){
  if (!KAKAO.on || KRAF) return;
  KRAF = requestAnimationFrame(function(){
    KRAF = 0;
    try { kAlign_(true); } catch(e){}
  });
}
/* 카카오 배경을 라이브러리(Leaflet) 좌표계에 정합시킨다.
   ── 중심 정렬(translate)만으로는 부족하다. 카카오(EPSG:5181 TM)와 Leaflet(EPSG:3857 웹메르카토르)은
      위도에 따라 축척(해상도)이 달라서, 중심은 맞아도 확대·가장자리로 갈수록 핀이 지형과 어긋난다.
      그래서 두 지도의 「경도 1도당 화면 픽셀폭」을 재서 그 비율만큼 카카오 배경을 scale 로 맞춘다. */
function kAlign_(light){
  try {
    var c = map.getCenter();
    var proj = KAKAO.map.getProjection();
    var kp  = proj.containerPointFromCoords(new kakao.maps.LatLng(c.lat, c.lng));
    var dLng = 0.02;
    var kp2 = proj.containerPointFromCoords(new kakao.maps.LatLng(c.lat, c.lng + dLng));
    var lp0 = map.latLngToContainerPoint([c.lat, c.lng]);
    var lp1 = map.latLngToContainerPoint([c.lat, c.lng + dLng]);
    var kpx = Math.abs(kp2.x - kp.x), lpx = Math.abs(lp1.x - lp0.x);
    var s = (kpx > 0.5 && lpx > 0.5) ? (lpx / kpx) : 1;   // 카카오를 Leaflet 축척에 맞추는 배율
    if (!isFinite(s) || s <= 0) s = 1;
    /* 단계 자가보정 — 배율이 0.71 미만/1.41 초과면 카카오 확대단계가 한 단계 어긋난 것(초기 레이아웃 전 보정 실패 등).
       배경을 반으로 줄여 검은 여백이 생기는 대신, 단계를 옮기고 다시 잰다. */
    var tries = light ? 2 : 0;                 // 드래그 중에는 자가보정 고리를 돌지 않는다
    while ((s < 0.71 || s > 1.41) && tries < 2){
      KAKAO.off += (s < 0.71) ? 1 : -1;
      KAKAO.map.setLevel(kl_(map.getZoom()));
      KAKAO.map.setCenter(new kakao.maps.LatLng(c.lat, c.lng));
      proj = KAKAO.map.getProjection();
      kp  = proj.containerPointFromCoords(new kakao.maps.LatLng(c.lat, c.lng));
      kp2 = proj.containerPointFromCoords(new kakao.maps.LatLng(c.lat, c.lng + dLng));
      kpx = Math.abs(kp2.x - kp.x);
      s = (kpx > 0.5 && lpx > 0.5) ? (lpx / kpx) : 1;
      if (!isFinite(s) || s <= 0) s = 1;
      tries++;
    }
    s = Math.max(0.5, Math.min(2, s));
    var dx = KAKAO.div.clientWidth/2 - kp.x, dy = KAKAO.div.clientHeight/2 - kp.y;
    /* 회전 보정 — 카카오(TM, 중앙자오선 127°E)는 자오선이 127°로 수렴하지만 웹메르카토르는 자오선이 수직이라
       127°에서 멀어질수록(동해안·포항·울산) 배경이 핀 대비 미세하게 기울어진다. 자오선수렴각
       γ = (경도−127)·sin(위도) 만큼 배경을 돌려 맞춘다. 실측: 포항 화면귀퉁이 잔차 19px→2px. */
    var g = (c.lng - 127) * Math.sin(c.lat * Math.PI / 180);
    if (!isFinite(g)) g = 0;
    g = Math.max(-3, Math.min(3, g));
    KAKAO.div.style.transformOrigin = '50% 50%';
    KAKAO.div.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(' + s.toFixed(4) + ') rotate(' + g.toFixed(4) + 'deg)';
  } catch(e){}
}
function kSetType_(t){
  if (!KAKAO.on) return;
  KAKAO.want = t;
  try { KAKAO.map.setMapTypeId(kakao.maps.MapTypeId[t]); } catch(e){}
}
function kakaoShow_(show){
  if (!KAKAO.div) return;
  KAKAO.div.style.display = show ? 'block' : 'none';
  var mc = document.querySelector('.leaflet-container');
  if (mc) mc.style.background = show ? 'transparent' : '';
  document.body.classList.toggle('map-kakao', !!show);
  if (show){
    // 라이브러리 타일·내장 해안선은 걷는다 — 카카오가 배경이다
    Object.keys(LIVE).forEach(function(k){ if (LIVE[k] && map.hasLayer(LIVE[k])) map.removeLayer(LIVE[k]); });
    if (map.hasLayer(SATLBL)) map.removeLayer(SATLBL);
    coastVis_(false);
    kSync_();
  }
}
function kakaoInit_(){
  var mapEl = document.getElementById('map');
  var d = document.createElement('div');
  d.id = 'kmap';
  /* 4% 여유(블리드) — 축척·회전 보정으로 배경을 돌리고 키워도 화면 귀퉁이가 비지 않게 */
  d.style.cssText = 'position:fixed;top:-4%;left:-4%;right:-4%;bottom:-4%;z-index:0;pointer-events:none;';
  mapEl.parentNode.insertBefore(d, mapEl);
  KAKAO.div = d;
  var c = map.getCenter();
  KAKAO.map = new kakao.maps.Map(d, {
    center: new kakao.maps.LatLng(c.lat, c.lng), level: 12,
    draggable: false, scrollwheel: false, disableDoubleClick: true, keyboardShortcuts: false
  });
  /* 레벨 보정 — 두 지도의 화면 폭(경도 범위)을 견줘 축척 상수를 맞춘다 */
  try {
    KAKAO.map.setLevel(kl_(map.getZoom()));
    KAKAO.map.setCenter(new kakao.maps.LatLng(c.lat, c.lng));
    var kb = KAKAO.map.getBounds(), lb = map.getBounds();
    var kw = kb.getNorthEast().getLng() - kb.getSouthWest().getLng();
    var lw = lb.getEast() - lb.getWest();
    if (kw > 0 && lw > 0){
      var adj = Math.round(Math.log(kw/lw)/Math.log(2));
      if (adj) KAKAO.off -= adj;
    }
  } catch(e){}
  KAKAO.on = true;
  map.on('move', kSyncLite_);
  map.on('zoomend moveend', kSync_);
  /* 확대 애니메이션 동안은 카카오를 잠깐 숨긴다 — 축척이 어긋난 채 겹쳐 보이지 않게 */
  map.on('zoomstart', function(){ if (KAKAO.div && !KAKAO.div.hidden) KAKAO.div.style.opacity = '0'; });
  map.on('zoomend', function(){ if (KAKAO.div){ kSync_(); KAKAO.div.style.opacity = '1'; } });
  window.addEventListener('resize', function(){ try { KAKAO.map.relayout(); kSync_(); } catch(e){} });
  kakaoShow_(true);
  kSetType_('ROADMAP');
  /* 베이스 버튼을 카카오 모드로: 지도=카카오 일반, 위성=카카오 위성+지명, 어둡게=기존 다크 지도 */
  var bs = document.querySelectorAll('.basesw:not(.eosw) .basebtn');
  for (var i = 0; i < bs.length; i++){
    var b = bs[i], k = b.getAttribute('data-b');
    if (k === 'lite') b.textContent = '어둡게';
  }
  curBase = 'dark';   // '지도' 버튼이 켜진 상태로 통일
  for (var j = 0; j < bs.length; j++)
    bs[j].className = 'basebtn' + (bs[j].getAttribute('data-b') === 'dark' ? ' on' : '');
}
function kakaoBoot_(){
  try {
    fetch('data/kakao.json').then(function(r){ return r.ok ? r.json() : null; })
      .then(function(cfg){
        if (!cfg || !cfg.key) return;
        var s = document.createElement('script');
        s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(cfg.key) + '&libraries=services&autoload=false';
        s.onload = function(){ try { kakao.maps.load(kakaoInit_); } catch(e){} };
        document.head.appendChild(s);
      }).catch(function(){});
  } catch(e){}
}
kakaoBoot_();
/* ── 베이스맵 — 키 없이 쓸 수 있는 공급원만 둔다.
      한 곳이 죽으면 다음 후보로 자동 교체된다. ── */
var TILE_TAIL = ' | 물때 국립해양조사원 · 기상 Open-Meteo';
var TILE_SRC = {
  dark: [
    /* OSM 을 어둡게 뒤집어 쓴다 — 키가 필요 없고, 한글 지명·도로가 끝까지 나온다 */
    { u:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', a:'지도 OpenStreetMap', mz:19, sd:'abc', cl:'osm-dark' },
    { u:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      a:'지도 Esri', mz:16 }
  ],
  sat: [
    { u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      a:'위성 Esri · Maxar', mz:19 }
  ],
  lite: [
    { u:'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', a:'지도 OpenStreetMap', mz:19, sd:'abc' },
    { u:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      a:'지도 Esri', mz:19 }
  ]
};
var SATLBL = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxZoom:19, maxNativeZoom:19, opacity:.92, className:'basetiles' });

var LIVE = {};          // 현재 붙어 있는 레이어

function makeTile_(kind, idx){
  var c = TILE_SRC[kind] && TILE_SRC[kind][idx];
  if (!c) return null;
  var opt = { attribution: c.a + TILE_TAIL, maxZoom: 19, maxNativeZoom: c.mz,
              className: 'basetiles' + (c.cl ? ' ' + c.cl : '') };
  if (c.sd) opt.subdomains = c.sd;
  var tl = L.tileLayer(c.u, opt);
  var good = 0, bad = 0;
  /* 타일이 한 장이라도 오면 내장 약도(해안선)는 걷는다 — 진짜 지도가 기본이다 */
  tl.on('tileload',  function(){ good++; coastVis_(false); });
  tl.on('tileerror', function(){
    bad++;
    // 한 장도 못 받은 채 연달아 실패하면 그 공급원은 죽은 것으로 본다
    if (good === 0 && bad >= 5 && !tl._swapped && TILE_SRC[kind][idx + 1]){
      tl._swapped = true;
      var nx = makeTile_(kind, idx + 1);
      if (nx && curBase === kind){
        if (map.hasLayer(tl)) map.removeLayer(tl);
        nx.addTo(map); nx.bringToBack();
        LIVE[kind] = nx;
      }
    }
  });
  return tl;
}

function getBase_(kind){
  if (!LIVE[kind]) LIVE[kind] = makeTile_(kind, 0);
  return LIVE[kind];
}

/* 기본은 진짜 지도다 — 바다로드처럼 실제 지형·도로·지명이 그대로 보여야
   포인트가 어디인지 맞는지 한눈에 확인된다. 내장 해안선(약도)은
   타일이 오기 전 첫 화면과, 타일 공급이 전부 막힌 환경의 폴백으로만 쓴다. */
/* 정적판에서는 아래에 실제 약도 겹이 끼워진다. 스프레드시트판에는 없으므로 자리만 잡아 둔다. */
if (typeof COAST_LAYER === 'undefined'){ var COAST_LAYER = null; }

/* 내장 약도 보이기/걷기 — 타일이 로드되면 걷는다.
   약도 자료는 필요할 때만 받는다(coastLoad_). 카카오 배경이 뜨는 평소에는 아예 받지 않는다. */
function coastVis_(show){
  if (show){
    if (typeof coastLoad_ === 'function') coastLoad_();
    if (COAST_LAYER && !map.hasLayer(COAST_LAYER)) COAST_LAYER.addTo(map);
  } else {
    if (COAST_LAYER && map.hasLayer(COAST_LAYER)) map.removeLayer(COAST_LAYER);
  }
}

var curBase = 'dark';
getBase_('dark').addTo(map);

function setBase_(k){
  if (k === curBase) return;
  if (!TILE_SRC[k]) return;
  /* 카카오 모드: 지도=카카오 일반, 위성=카카오 위성+지명, 어둡게=기존 다크 지도 */
  if (typeof KAKAO !== 'undefined' && KAKAO.on){
    Object.keys(LIVE).forEach(function(kk){ if (LIVE[kk] && map.hasLayer(LIVE[kk])) map.removeLayer(LIVE[kk]); });
    if (map.hasLayer(SATLBL)) map.removeLayer(SATLBL);
    if (k === 'lite'){
      kakaoShow_(false);
      var dk = getBase_('dark');
      dk.addTo(map); dk.bringToBack();
    } else {
      kakaoShow_(true);
      kSetType_(k === 'sat' ? 'HYBRID' : 'ROADMAP');
    }
    curBase = k;
    document.body.className = document.body.className.replace(/\s*map-sat\b/,'') + (k === 'sat' ? ' map-sat' : '');
    var kb = document.querySelectorAll('.basesw:not(.eosw) .basebtn');
    for (var i2 = 0; i2 < kb.length; i2++) kb[i2].className = 'basebtn' + (kb[i2].getAttribute('data-b') === k ? ' on' : '');
    try { localStorage.setItem('hrn_base', k); } catch(e){}
    return;
  }
  var old = LIVE[curBase];
  if (old && map.hasLayer(old)) map.removeLayer(old);
  if (map.hasLayer(SATLBL)) map.removeLayer(SATLBL);
  var nx = getBase_(k);
  nx.addTo(map); nx.bringToBack();
  if (k === 'sat') SATLBL.addTo(map);
  coastVis_(false);
  curBase = k;
  document.body.className = document.body.className.replace(/\s*map-sat\b/,'') + (k === 'sat' ? ' map-sat' : '');
  var bs = document.querySelectorAll('.basebtn');
  for (var i=0;i<bs.length;i++) bs[i].className = 'basebtn' + (bs[i].getAttribute('data-b') === k ? ' on' : '');
  try { localStorage.setItem('hrn_base', k); } catch(e){}
}

var baseCtl = L.control({position:'bottomleft'});
baseCtl.onAdd = function(){
  var d = L.DomUtil.create('div','basesw');
  d.innerHTML = '<button class="basebtn on" data-b="dark" type="button">지도</button>'
              + '<button class="basebtn" data-b="sat" type="button">위성</button>'
              + '<button class="basebtn" data-b="lite" type="button">밝게</button>';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.on(d, 'click', function(e){
    var t = e.target;
    while (t && t !== d && !(t.className && String(t.className).indexOf('basebtn') >= 0)) t = t.parentNode;
    if (t && t !== d) setBase_(t.getAttribute('data-b'));
  });
  return d;
};
baseCtl.addTo(map);
try { var sv = localStorage.getItem('hrn_base'); if (sv === 'sat' || sv === 'lite') setBase_(sv); } catch(e){}

/* 어장·갯골 켜고 끄기 — 기본은 켬. 어장은 10레벨, 갯골은 12레벨부터 그려진다 */
var eoCtl = L.control({position:'bottomleft'});
eoCtl.onAdd = function(){
  var d = L.DomUtil.create('div','basesw eosw');
  d.innerHTML = '<button class="basebtn on fl" id="flBtn" type="button">갯벌</button>'
              + '<button class="basebtn cl" id="clBtn" type="button">해안 재질</button>'
              + '<button class="basebtn on" id="eoBtn" type="button">어장</button>'
              + '<button class="basebtn gg' + (GG_ON ? ' on' : '') + '" id="ggBtn" type="button">갯골</button>'
              + '<button class="basebtn rk' + (RK_ON ? ' on' : '') + '" id="rkBtn" type="button">갯바위</button>'
              + '<button class="basebtn ac" id="acBtn" type="button">사고</button>'

    } else if (t && t.id === 'ggBtn'){

    }
  });
  try { if (localStorage.getItem('hrn_cl') === '1'){ CL_ON = true; d.querySelector('#clBtn').className = 'basebtn cl on'; clVis_(); } } catch(e){}
  try { if (localStorage.getItem('hrn_flat') === '0'){ FLAT_ON = false; d.querySelector('#flBtn').className = 'basebtn fl'; } } catch(e){}
  try { if (localStorage.getItem('hrn_eo') === '0'){ EO_ON = false; d.querySelector('#eoBtn').className = 'basebtn'; } } catch(e){}
  try { if (localStorage.getItem('hrn_gg') === '1'){ GG_ON = true; d.querySelector('#ggBtn').className = 'basebtn gg on'; ggVis_(); } } catch(e){}
  try { var rkv = localStorage.getItem('hrn_rk');
        if (rkv === '0' && RK_ON){ RK_ON = false; d.querySelector('#rkBtn').className = 'basebtn rk'; }
        else if (rkv === '1' && !RK_ON){ RK_ON = true; d.querySelector('#rkBtn').className = 'basebtn rk on'; rkVis_(); } } catch(e){}
  try { if (localStorage.getItem('hrn_ac') === '1'){ AC_ON = true; d.querySelector('#acBtn').className = 'basebtn ac on'; acVis_(); } } catch(e){}

/* 핀 — 원은 좌표 위에 뜨고, 꼬리 끝과 흰 점이 실제 좌표를 가리킨다.
   iconAnchor 의 세로값 = 원 높이 + 꼬리 + 점까지의 거리 */
var PIN_TAIL = 13, PIN_TAIL_SM = 10;
function pinIcon(r, isTop, small){
  var w = small ? 26 : 38, tail = small ? PIN_TAIL_SM : PIN_TAIL;
  return L.divIcon({
    className: '',
    html: '<div class="pin '+(tideOnly_()?'pin-tide':'pin-'+r.grade)+(small?' sm':'')+(isTop&&!tideOnly_()?' pin-top':'')+'" style="position:relative">'
        + (tideOnly_() ? '≈' : r.score) + (isTop && !tideOnly_() ? '<i class="halo"></i>' : '') + '</div>',
    iconSize: [w, w + tail],
    iconAnchor: [w/2, w + tail]
  });
}
function drawPins(){
  Object.keys(S.markers).forEach(function(k){ map.removeLayer(S.markers[k]); });
  S.markers = {};
  var z = map.getZoom();
  var placed = [];                       // 큰 핀이 이미 차지한 화면 좌표
  /* 낮은 배율에서는 자리 다툼에서 밀린 핀을 아예 생략한다 — 첫 화면이 깔끔해야 한다.
     rows 는 점수순이라 남는 핀이 곧 그 동네 1등이고, 확대하면 다 나온다. */
  var MIN  = z >= 11 ? 0 : (z >= 9 ? 40 : 52);
  var HIDE = z < 10;                     // 겹침 시 생략(저배율) / 작게 표시(고배율)
  var fv = favs();
  /* 화면 밖 핀은 아예 만들지 않는다. 예전엔 전국 600곳을 매번 다시 만들며 서로 겹치는지까지
     견줘서, 확대할 때마다 휴대폰이 1초 가까이 멈췄다. */
  var vb = map.getBounds().pad(0.35);
  S.rows.forEach(function(r, idx){
    if (idx > 0 && !vb.contains([r.la, r.lo])) return;
    var pt = map.latLngToLayerPoint([r.la, r.lo]);
    var small = false;
    for (var k=0;k<placed.length;k++){
      var dx = placed[k].x - pt.x, dy = placed[k].y - pt.y;
      if (dx*dx + dy*dy < MIN*MIN){ small = true; break; }
    }
    if (small && HIDE && fv.indexOf(r.i) < 0) return;   // 즐겨찾기는 항상 보인다
    if (!small) placed.push(pt);
    var m = L.marker([r.la, r.lo], { icon: pinIcon(r, idx === 0, small), zIndexOffset: 1000 - idx });
    m.on('click', function(){ openDetail(r.i); });
    m.addTo(map);
    S.markers[r.i] = m;
  });
}
var PIN_T = 0;
map.on('zoomend moveend', function(){
  /* 화면 밖 핀을 생략하므로 옮긴 뒤에도 다시 그려야 새 자리 핀이 나온다. 연달아 부르지 않게 묶는다. */
  clearTimeout(PIN_T);
  PIN_T = setTimeout(function(){ if (S.rows.length) drawPins(); }, 120);
});

/* ══════════════ 해경 출입통제구역 오버레이 ══════════════
 * 연안사고예방법 제10조 출입통제 장소 — 위반 시 100만원 이하 과태료(제25조).
 * 공고 좌표(poly)는 붉은 다각형, 위치가 대략적인 곳(est)은 점선 원으로 그린다. */
var ZONE_LAYER = L.layerGroup().addTo(map);
var ZONE_STYLE = { color:'#e0563a', weight:1.6, opacity:.85, fillColor:'#e0563a', fillOpacity:.16 };
var ZONE_STYLE_EST = { color:'#ff7f5a', weight:1.4, opacity:.7, dashArray:'5 4', fillColor:'#e0563a', fillOpacity:.08 };
var ZONE_STYLE_KK = { color:'#e0563a', weight:1.8, opacity:.9, fillColor:'#e0563a', fillOpacity:.18 };
var ZONE_STYLE_KE = { color:'#ff7f5a', weight:1.6, opacity:.8, dashArray:'5 4', fillColor:'#e0563a', fillOpacity:.1 };
function zonePopup_(z){
  return '<div style="max-width:230px;line-height:1.5">'
    + '<b style="color:#e0563a">⛔ 출입통제구역</b><br><b>' + z.n + '</b>'
    + '<br><span style="color:#666">' + (z.g || '') + '</span>'
    + (z.period ? '<br>통제: ' + z.period : '')
    + (z.why ? '<br>사유: ' + z.why : '')
    + '<br><b style="color:#e0563a">위반 시 100만원 이하 과태료</b> <span style="color:#888">(연안사고예방법)</span>'
    + (z.est ? '<br><span style="color:#ffb08a">※ 표시 위치는 대략적입니다 — 현장 안내판을 확인하세요</span>' : '')
    + '</div>';
}
function drawZones_(list){
  ZONE_LAYER.clearLayers();
  (list || []).forEach(function(z){
    if (!z || !z.la || !z.lo) return;
    var zs  = brightMap_() ? ZONE_STYLE_KK : ZONE_STYLE;
    var zse = brightMap_() ? ZONE_STYLE_KE : ZONE_STYLE_EST;
    var sh = (z.poly && z.poly.length >= 3)
      ? L.polygon(z.poly, zs)
      : L.circle([z.la, z.lo], Object.assign({ radius: 400 }, z.est ? zse : zs));
    sh.bindTooltip('⛔ ' + z.n, { direction:'top', opacity:.9 });
    sh.bindPopup(zonePopup_(z));
    sh.addTo(ZONE_LAYER);
  });
}
function loadZones_(){
  if (loadZones_._done) return; loadZones_._done = true;
  try {
    google.script.run.withSuccessHandler(function(zs){
      if (zs && zs.length) drawZones_(zs);
    }).apiZones();
  } catch(e){}
}

/* ══════════════ 어장 오버레이 — 국립해양조사원 어장정보도 2025 ══════════════
 * 면허어장 지적 1만4천여 개. 해루질꾼에게 제일 중요한 건 마을어업 구역이다 —
 * 어촌계가 관리하는 수역이라 조개·해조류를 캐면 수산업법 위반(어업권 침해)이 된다.
 * 전국 4MB 를 0.5도 격자 54조각으로 쪼개 두고, 확대했을 때 보이는 조각만 받는다. */
var EO_RENDER = L.canvas({ padding: .3 });          // 폴리곤이 많아 캔버스로 그린다
var EO_LAYER  = L.featureGroup().addTo(map);
var EO_ON = true, EO_MINZ = PHONE ? 11 : 10;
var EO_IDX = null, EO_CELL = {};                     // 셀 캐시: 'y|x' → 도형 배열|'loading'
var EO_STYLE = {
  M: { c:'#ff7f5a', fo:.20 },   // 마을어업 — 경고색
  P: { c:'#1fc4c0', fo:.12 },   // 패류양식
  H: { c:'#2ee6a8', fo:.12 },   // 해조류양식
  Y: { c:'#b5cad8', fo:.12 },   // 기타 양식
  J: { c:'#1fc4c0', fo:.12 }    // 정치망
};
/* 밝은 지도(카카오) 위에서는 더 진한 색을 쓴다 */
var EO_STYLE_K = {
  M: { c:'#e0563a', fo:.24 },
  P: { c:'#0fb98a', fo:.16 },
  H: { c:'#0fb98a', fo:.16 },
  Y: { c:'#8ba6b8', fo:.16 },
  J: { c:'#0fb98a', fo:.16 }
};
function brightMap_(){ return document.body.classList.contains('map-kakao'); }
function eoStyleOf_(k){ return (brightMap_() ? EO_STYLE_K : EO_STYLE)[k] || EO_STYLE.Y; }
var EO_NAME = { M:'마을어업 (어촌계 관리수역)', P:'패류 양식장', H:'해조류 양식장', Y:'양식장', J:'정치망 어장' };
function eoPopup_(f){
  var s = '<div style="max-width:230px;line-height:1.5">'
    + '<b style="color:' + eoStyleOf_(f.k).c + '">■ ' + EO_NAME[f.k] + '</b>';
  if (f.f) s += '<br>품목: ' + f.f;
  if (f.a) s += '<br>' + f.a;
  if (f.ha) s += '<br>면적 ' + f.ha + 'ha';
  if (f.e)  s += ' · 면허 ~' + f.e;
  if (f.k === 'M')
    s += '<br><b style="color:#ffa38a">여기서 조개·해조류를 캐면 안 됩니다</b>'
       + '<br><span style="color:#888">어촌계 면허 수역 — 수산업법 위반(어업권 침해) 소지</span>';
  else if (f.k === 'J')
    s += '<br><span style="color:#888">그물이 설치된 수역입니다 — 가까이 가지 마세요</span>';
  else
    s += '<br><span style="color:#888">면허 양식장입니다 — 시설물·양식물에 손대면 안 됩니다</span>';
  s += '<br><span style="color:#667">출처 국립해양조사원 어장정보도</span></div>';
  return s;
}
function eoDrawCell_(key){
  var feats = EO_CELL[key];
  if (!feats || feats === 'loading' || feats._drawn) return;
  feats._drawn = true;
  feats.forEach(function(f){
    (f.p || []).forEach(function(ring){
      var st = eoStyleOf_(f.k);
      var pg = L.polygon(ring, { renderer: EO_RENDER, color: st.c, weight: brightMap_() ? 1.2 : 1,
                                 opacity: brightMap_() ? .75 : .55, fillColor: st.c, fillOpacity: st.fo });
      pg._eo = f;
      pg.addTo(EO_LAYER);
    });
  });
}
function eoRefresh_(){
  if (!EO_ON || map.getZoom() < EO_MINZ){ return; }
  var load = function(){
    if (!EO_IDX || !EO_IDX.cells) return;
    var b = map.getBounds();
    EO_IDX.cells.forEach(function(c){
      if (c.y > b.getNorth() || c.y + .5 < b.getSouth()) return;
      if (c.x > b.getEast()  || c.x + .5 < b.getWest())  return;
      var key = c.y + '|' + c.x;
      if (EO_CELL[key]){ eoDrawCell_(key); return; }
      EO_CELL[key] = 'loading';
      fetch('data/eo/' + c.f).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ if (j){ EO_CELL[key] = j; eoDrawCell_(key); } else delete EO_CELL[key]; })
        .catch(function(){ delete EO_CELL[key]; });
    });
  };
  if (EO_IDX){ load(); return; }
  if (EO_IDX === 'loading') return;
  EO_IDX = 'loading';
  fetch('data/eo/index.json').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ EO_IDX = j || {cells:[]}; load(); })
    .catch(function(){ EO_IDX = {cells:[]}; });
}
function eoVis_(){
  var show = EO_ON && map.getZoom() >= EO_MINZ;
  if (show){ if (!map.hasLayer(EO_LAYER)) EO_LAYER.addTo(map); eoRefresh_(); }
  else { if (map.hasLayer(EO_LAYER)) map.removeLayer(EO_LAYER); }
}
map.on('moveend zoomend', eoVis_);

/* ══════════════ 해안선 재질 — 모래·자갈·암반·뻘·절벽·방파제 ══════════════
 * 국립해양조사원 배포용 해안선은 구간마다 재질이 붙어 있다(CSLN_KND).

 * 0.25도 조각으로 나눠 보이는 데만 받는다. */
var CL_LAYER = L.featureGroup(), CL_ON = false, CL_MINZ = 11, CL_IDX = null, CL_CELL = {};
var CL_KIND = {
  mud:    { c:'#8a6a45', w:4.2, d:null,      ko:'뻘 해안',   t:'낙지·가무락·칠게 — 발이 깊이 빠진다' },
  mudsand:{ c:'#c2a06d', w:4,   d:'12 5',    ko:'뻘+모래 해안', t:'바지락·백합·낙지가 섞여 나온다' },
  sand:   { c:'#f2dfa6', w:4,   d:null,      ko:'모래 해안', t:'맛조개·동죽·백합 — 갯벌화가 편하다' },
  sandgv: { c:'#e0c98f', w:3.6, d:'9 4 2 4', ko:'모래+자갈 해안', t:'고둥·게, 물가에 미역·톳' },
  gravel: { c:'#9fb3c2', w:3.6, d:'2 5',     ko:'자갈 해안', t:'고둥·거북손 — 미끄러우니 조심' },
  rock:   { c:'#5b7a90', w:4.2, d:null,      ko:'암반 해안', t:'굴·홍합·거북손, 갯바위 낚시 자리' },
  cliff:  { c:'#6d8ba1', w:5,   d:'3 3',     ko:'절벽 해안', t:'접근 자체가 위험 — 위에서 내려가지 말 것' },
  art:    { c:'#d8dde2', w:3.4, d:'7 6',     ko:'인공 해안(방파제·부두)', t:'낚시 자리 — 해루질 바닥은 아니다' },
  flat:   { c:'#7d919f', w:2.4, d:'1 6',     ko:'평탄 해안', t:'재질이 안 잡힌 곳 — 앞바다 갯벌 색을 함께 보세요' }
};
function clPop_(k){
  var d = CL_KIND[k] || CL_KIND.flat;
  return '<div style="max-width:220px;line-height:1.5"><b style="color:' + d.c + '">— ' + d.ko + '</b>'
    + '<br>' + d.t + '<br><span style="color:#888">출처 국립해양조사원 배포용 해안선</span></div>';
}
function clDrawCell_(key){
  var fs = CL_CELL[key];
  if (!fs || fs === 'loading' || fs._drawn) return;
  fs._drawn = true;
  var bright = brightMap_();
  fs.forEach(function(it){
    var d = CL_KIND[it[0]] || CL_KIND.flat;
    var ln = L.polyline(it[1], { renderer: EO_RENDER, color: d.c, weight: d.w,
                                 dashArray: d.d || null,
                                 opacity: bright ? 1 : .88, lineCap: d.d ? 'butt' : 'round', lineJoin:'round' });
    ln._cl = it[0];
    ln.addTo(CL_LAYER);
  });
}
function clRefresh_(){
  if (!CL_ON || map.getZoom() < CL_MINZ) return;
  var load = function(){
    if (!CL_IDX || !CL_IDX.cells) return;
    var b = map.getBounds(), G = CL_IDX.grid || .25;
    CL_IDX.cells.forEach(function(c){
      if (c.y > b.getNorth() || c.y + G < b.getSouth()) return;
      if (c.x > b.getEast()  || c.x + G < b.getWest())  return;
      var key = c.y + '|' + c.x;
      if (CL_CELL[key]){ clDrawCell_(key); return; }
      CL_CELL[key] = 'loading';
      fetch('data/cl/' + c.f).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ if (j){ CL_CELL[key] = j; clDrawCell_(key); } else delete CL_CELL[key]; })
        .catch(function(){ delete CL_CELL[key]; });
    });
  };
  if (CL_IDX && CL_IDX !== 'loading'){ load(); return; }
  if (CL_IDX === 'loading') return;
  CL_IDX = 'loading';
  fetch('data/cl/index.json').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ CL_IDX = j || {cells:[]}; load(); })
    .catch(function(){ CL_IDX = {cells:[]}; });
}
function clVis_(){
  var show = CL_ON && map.getZoom() >= CL_MINZ;
  if (show){ if (!map.hasLayer(CL_LAYER)) CL_LAYER.addTo(map); clRefresh_(); }
  else { if (map.hasLayer(CL_LAYER)) map.removeLayer(CL_LAYER); }
}
map.on('moveend zoomend', clVis_);

/* ══════════════ 갯벌 범위 — 지형을 점이 아니라 면으로 ══════════════
 * 핀 하나로는 「여기 갯벌」만 알 뿐, 어디까지 드러나고 어떤 바닥인지 알 수 없다.
 * 국립해양조사원 조간대(간석지) 면을 250m 격자로 눌러, 펄·모래·혼합을 색으로 칠한다.
 * 자료는 72KB 한 장이라 처음 켤 때 한 번만 받는다. */
var FLAT_LAYER = L.featureGroup(), FLAT_ON = true, FLAT_DATA = null, FLAT_MINZ = PHONE ? 9 : 8;
var FLAT_COL = {
  mud:  { d:'#6f5133', l:'#4f3f2b', ko:'펄갯벌',  t:'낙지·가무락·칠게가 붙는 바닥' },
  sand: { d:'#f5e3a8', l:'#c9a54e', ko:'모래갯벌', t:'맛조개·동죽·백합이 나오는 바닥' },
  mix:  { d:'#c08f57', l:'#a17342', ko:'혼합갯벌', t:'바지락·굴·박하지가 섞여 나온다' }
};
function flatPop_(f){
  var c = FLAT_COL[f] || FLAT_COL.mix;
  return '<div style="max-width:220px;line-height:1.5"><b style="color:' + c.l + '">▨ ' + c.ko + '</b>'
    + '<br>' + c.t
    + '<br><span style="color:#888">물이 빠지면 드러나는 구역 · 출처 국립해양조사원 조간대 자료</span></div>';
}
function flatDraw_(){
  FLAT_LAYER.clearLayers();
  if (!FLAT_DATA || !FLAT_DATA.r) return;
  var G = FLAT_DATA.g || .0025, bright = brightMap_();
  var on = Object.keys(S.floors || {}).filter(function(k){ return S.floors[k]; });
  var b = map.getBounds(), z = map.getZoom();
  /* 화면 밖 여유폭. 예전엔 낮은 배율에서 1.2도(화면의 몇 배)까지 그려서 사각형 수천 개가
     매번 새로 만들어졌다. 화면 한 뼘만 더 그리면 끊김 없이 충분하다. */
  var pad = z >= 11 ? .12 : (z >= 9 ? .25 : .45);
  var s0 = b.getSouth()-pad, n0 = b.getNorth()+pad, w0 = b.getWest()-pad, e0 = b.getEast()+pad;
  Object.keys(FLAT_DATA.r).forEach(function(f){
    var c = FLAT_COL[f] || FLAT_COL.mix;
    /* 지형 칩을 켰으면 고른 지형만 진하게, 나머지는 흐리게 깔아 견줄 수 있게 한다 */
    var dim = on.length && on.indexOf(f) < 0;
    var col = bright ? c.l : c.d;
    FLAT_DATA.r[f].forEach(function(q){
      var y = q[0]*G, x = q[1]*G, w = q[2]*G;
      if (y > n0 || y+G < s0 || x > e0 || x+w < w0) return;
      var pg = L.rectangle([[y, x],[y+G, x+w]], {
        renderer: EO_RENDER,
        stroke: !dim, color: col, weight: 1, opacity: dim ? 0 : (bright ? .5 : .38),
        fillColor: col, fillOpacity: dim ? .1 : (bright ? .5 : .42)
      });
      pg._ft = f;                        // 설명창은 눌렀을 때 만든다 (사각형이 1만 개다)
      pg.addTo(FLAT_LAYER);
    });
  });
}
FLAT_LAYER.on('click', function(e){
  var l = e.layer || e.target;
  if (!l || !l._ft) return;
  L.popup().setLatLng(e.latlng).setContent(flatPop_(l._ft)).openOn(map);
});
function flatVis_(){
  var show = FLAT_ON && map.getZoom() >= FLAT_MINZ;
  if (!show){ if (map.hasLayer(FLAT_LAYER)) map.removeLayer(FLAT_LAYER); return; }
  if (!map.hasLayer(FLAT_LAYER)){ FLAT_LAYER.addTo(map); try { FLAT_LAYER.eachLayer(function(l){ if(l.bringToBack) l.bringToBack(); }); } catch(e){} }
  if (FLAT_DATA === 'loading') return;
  if (!FLAT_DATA){
    FLAT_DATA = 'loading';
    fetch('data/flat.json').then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ FLAT_DATA = j || {r:{}}; flatDraw_(); })
      .catch(function(){ FLAT_DATA = {r:{}}; });
    return;
  }
  flatDraw_();
}
map.on('moveend zoomend', flatVis_);
setTimeout(function(){ try { flatVis_(); } catch(e){} }, 400);   /* 첫 화면에도 갯벌이 깔리게 */

/* ══════════════ 갯골 오버레이 — 개방해 갯골(상세) 4만6천여 개 ══════════════
 * 갯벌 고립사고의 주범. 밀물 때 갯골부터 물이 차서 퇴로가 끊긴다.
 * 12레벨 이상 확대했을 때 보이는 0.25도 조각만 받는다. */
var GG_LAYER = L.featureGroup();
var GG_ON = false, GG_MINZ = 13;   // 자료가 12MB로 가장 무겁다 — 기본은 접어 두고 단추로 켠다
var GG_IDX = null, GG_CELL = {};
var GG_POP = '<div style="max-width:210px;line-height:1.5"><b style="color:#a4e9d4">〰 갯골(물길)</b>'
  + '<br>밀물 때 이곳부터 물이 찹니다 — <b style="color:#ffa38a">갯골 건너편에 있으면 퇴로가 끊깁니다</b>.'
  + '<br><span style="color:#888">들어가기 전에 돌아올 길에 갯골이 없는지 확인하세요 · 출처 국립해양조사원</span></div>';
function ggDrawCell_(key){
  var feats = GG_CELL[key];
  if (!feats || feats === 'loading' || feats._drawn) return;
  feats._drawn = true;
  feats.forEach(function(rings){
    rings.forEach(function(ring){
      var gc = brightMap_() ? '#0fb98a' : '#1fc4c0';
      var pg = L.polygon(ring, { renderer: EO_RENDER, color: gc, weight: brightMap_() ? 1.2 : 1,
                                 opacity: brightMap_() ? .8 : .65, fillColor: gc,
                                 fillOpacity: brightMap_() ? .28 : .22 });
      pg._gg = 1;
      pg.addTo(GG_LAYER);
    });
  });
}
function ggRefresh_(){
  if (!GG_ON || map.getZoom() < GG_MINZ) return;
  var load = function(){
    if (!GG_IDX || !GG_IDX.cells) return;
    var b = map.getBounds(), G = GG_IDX.grid || .25;
    GG_IDX.cells.forEach(function(c){
      if (c.y > b.getNorth() || c.y + G < b.getSouth()) return;
      if (c.x > b.getEast()  || c.x + G < b.getWest())  return;
      var key = c.y + '|' + c.x;
      if (GG_CELL[key]){ ggDrawCell_(key); return; }
      GG_CELL[key] = 'loading';
      fetch('data/gg/' + c.f).then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ if (j){ GG_CELL[key] = j; ggDrawCell_(key); } else delete GG_CELL[key]; })
        .catch(function(){ delete GG_CELL[key]; });
    });
  };
  if (GG_IDX && GG_IDX !== 'loading'){ load(); return; }
  if (GG_IDX === 'loading') return;
  GG_IDX = 'loading';
  fetch('data/gg/index.json').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ GG_IDX = j || {cells:[]}; load(); })
    .catch(function(){ GG_IDX = {cells:[]}; });
}
function ggVis_(){
  var show = GG_ON && map.getZoom() >= GG_MINZ;
  if (show){ if (!map.hasLayer(GG_LAYER)) GG_LAYER.addTo(map); ggRefresh_(); }
  else { if (map.hasLayer(GG_LAYER)) map.removeLayer(GG_LAYER); }
}
map.on('moveend zoomend', ggVis_);

/* ══════════════ 연안 인명사고 히트맵 — 개방해 인명사고(2025) 2만여 건 ══════════════
 * 안전 정보이자 B2G·보험 상품의 근거. 위험도 = 건수 + 사망·실종 가중. 기본은 꺼둔다(원하면 켜기). */
var AC_LAYER = L.layerGroup();
var AC_ON = false, AC_LOADED = false, AC_DATA = null;
function acRisk_(c){ return c.n + (c.d + c.m) * 4; }        // 사망·실종은 4배 가중
function acColor_(r){ return r >= 40 ? '#e0563a' : r >= 18 ? '#e0563a' : r >= 8 ? '#ff7f5a' : '#ffb08a'; }
function acDraw_(){

      + (c.m ? ' · 실종 <b style="color:#e0563a">' + c.m + '명</b>' : '')
      + '<br>주 유형: ' + c.t
      + '<br><span style="color:#888">출처 국립해양조사원 인명사고(2025)</span></div>');
    pg.addTo(AC_LAYER);
  });
}
function acVis_(){

/* ══════════════ 데이터 ══════════════ */

/* ══════════════ 주소로 바로 들어오기 ══════════════
 * 유튜버가 "영흥도 편" 영상에 링크를 걸면 그 지점이 바로 열려야 한다.
 * 홈으로만 보내면 사용자가 직접 찾아야 하고, 대부분 거기서 이탈한다.
 *   ?spot=151        지점 상세 바로 열기
 *   ?sp=낙지         그 대상을 노릴 수 있는 자리만 추려서 보기
 *   ?d=2026-08-30    날짜 지정
 *   ?ref=haeru_tv    레퍼럴 코드 (기존)
 * 해시 형태도 받는다: #/spot/151 · #/species/낙지
 */
function parseRoute_(){
  var q = {};
  (location.search || '').replace(/^\?/, '').split('&').forEach(function(kv){
    if (!kv) return;
    var i = kv.indexOf('=');
    var k = i < 0 ? kv : kv.slice(0, i);
    var v = i < 0 ? '' : kv.slice(i + 1).replace(/\+/g, ' ');
    try { q[k] = decodeURIComponent(v); } catch(e){ q[k] = v; }
  });
  var h = (location.hash || '').replace(/^#\/?/, '');
  if (h){
    var seg = h.split('/');
    try {
      if (seg[0] === 'spot' && seg[1]) q.spot = decodeURIComponent(seg[1]);
      if ((seg[0] === 'species' || seg[0] === 'sp') && seg[1]) q.sp = decodeURIComponent(seg[1]);
    } catch(e){}
  }
  return q;
}

/* 주소를 지금 보고 있는 화면에 맞춘다 — 뒤로가기로 상세가 닫히게 한다 */
function pushRoute_(kind, val){
  if (!window.history || !history.pushState) return;
  var ref = '';
  try { var rj = JSON.parse(localStorage.getItem('hrn_ref') || 'null'); if (rj && rj.c) ref = rj.c; } catch(e){}
  var qs = [];
  if (kind === 'spot' && val) qs.push('spot=' + encodeURIComponent(val));
  if (kind === 'sp' && val)   qs.push('sp=' + encodeURIComponent(val));
  if (S.ds && S.ds !== todayStr_()) qs.push('d=' + S.ds);
  if (ref) qs.push('ref=' + encodeURIComponent(ref));
  var url = location.pathname + (qs.length ? '?' + qs.join('&') : '');
  try { history.pushState({ k: kind, v: val }, '', url); } catch(e){}
}

/* 지금 화면의 공유 주소 */
function shareUrl_(kind, val){
  var ref = '';
  try { var rj = JSON.parse(localStorage.getItem('hrn_ref') || 'null'); if (rj && rj.c) ref = rj.c; } catch(e){}
  var qs = [];
  if (kind === 'spot' && val) qs.push('spot=' + encodeURIComponent(val));
  if (kind === 'sp' && val)   qs.push('sp=' + encodeURIComponent(val));
  if (ref) qs.push('ref=' + encodeURIComponent(ref));
  return location.origin + location.pathname + (qs.length ? '?' + qs.join('&') : '');
}

/* 첫 로딩이 끝난 뒤 주소대로 화면을 연다 */
function applyRoute_(){
  var q = parseRoute_();
  if (q.sp && !S.want){
    S.want = q.sp;
    if (typeof renderWant === 'function') try { renderWant(); } catch(e){}
  }
  if (q.spot){
    var id = parseInt(q.spot, 10);
    if (!isNaN(id)) setTimeout(function(){ openDetail(id); }, 260);
  }
}

function load(){
  if (S.loading) return;
  S.loading = true;
  $('btnReload').classList.add('spin');
  renderSkeleton();
  google.script.run
    .withSuccessHandler(function(res){
      S.loading = false;
      $('btnReload').classList.remove('spin');
      $('boot').classList.add('hide');
      if (!res || !res.rows){ toast('데이터를 불러오지 못했습니다'); return; }
      if (res.empty || !res.rows.length){
        S.rowsAll = []; S.rows = []; render();
        toast(res.msg || '조건에 맞는 자리가 없습니다', 3200);
        return;
      }
      S.rowsAll = res.rows;
      applyFloor_();
      S.shown = res.shown; S.total = res.total;
      S.gen = res.generated;
      render();
      loadZones_();
      loadNofish_();
      if (FEED === null) loadFeed_(); else buildTicker_();
      if (!S._routed){ S._routed = true; applyRoute_(); }
    })
    .withFailureHandler(function(e){
      S.loading = false;
      $('btnReload').classList.remove('spin');
      $('boot').classList.add('hide');
      toast('오류: ' + (e && e.message ? e.message : '불러오기 실패'));
    })
    .apiBoard(S.ds, S.mode, {
      want: S.want,
      isl: S.filter === 'isl' || S.filter === 'car' ? true : (S.filter === 'land' ? false : null),
      car: S.filter === 'car'
    });
}

/* ══════════════ 렌더 ══════════════ */
/* 시야를 그 바다 기준으로 읽어 준다.
   서해에서 1.2m 는 아주 맑은 날이고, 제주에서 1.2m 는 흙탕물이다.
   미터만 보여주면 서해 사람은 늘 「나쁨」만 보게 된다. */
var VIS_BAND_UI = { W:[0.10, 2.0], S:[0.20, 5.0], E:[0.60, 12], J:[0.60, 12] };
var SEA_KO = { W:'서해', S:'남해', E:'동해', J:'제주' };
function visLabel_(v, sea, q, word){
  var m = (v >= 1) ? (v.toFixed(1) + 'm') : (Math.round(v*100) + 'cm');
  if (word) return '시야 ' + m + ' · ' + (SEA_KO[sea] || '') + ' 기준 ' + word;
  var b = VIS_BAND_UI[sea];
  if (!b) return '시야 ' + m;
  var q2 = (Math.log(v) - Math.log(b[0])) / (Math.log(b[1]) - Math.log(b[0]));
  var w = q2 >= 0.80 ? '최상' : q2 >= 0.60 ? '맑음' : q2 >= 0.38 ? '보통' : q2 >= 0.18 ? '탁함' : '거의 안 보임';
  return '시야 ' + m + ' · ' + (SEA_KO[sea] || '') + ' 기준 ' + w;
}
function visQ_(v, sea){
  if (v == null) return -1;
  var b = VIS_BAND_UI[sea] || VIS_BAND_UI.S;
  return Math.max(0, Math.min(1, (Math.log(v) - Math.log(b[0])) / (Math.log(b[1]) - Math.log(b[0]))));
}

function sorted(){
  var a = S.rows.slice();
  if (S.sort === 'near' && S.me){
    a.forEach(function(r){ r._d = dist(S.me[0], S.me[1], r.la, r.lo); });
    a.sort(function(x,y){ return x._d - y._d; });
  } else if (S.sort === 'time'){
    a.sort(function(x,y){
      var xa = x.win ? x.win[0] : 99999, ya = y.win ? y.win[0] : 99999;
      return xa - ya;
    });
  } else if (S.sort === 'vis'){
    /* 미터로 줄을 세우면 늘 동해·제주가 위에 온다. 서해 사람에게는 쓸모가 없다.
       「그 바다치고 오늘이 맑은 날인가」로 세운다. 시야를 못 낸 자리는 뒤로. */
    a.sort(function(x,y){
      var xq = (x.visQ != null) ? x.visQ : visQ_(x.vis, x.s);
      var yq = (y.visQ != null) ? y.visQ : visQ_(y.vis, y.s);
      return (yq - xq) || (y.raw - x.raw);
    });
  } else if (S.near && S.me){
    /* 내 위치 모드의 추천순 — 거리로 최대 6점까지 깎아, 가까우면서 좋은 자리가 위로 온다 */
    var sp = S.rad || 150;
    a.sort(function(x,y){
      return (y.raw - 6*Math.min(1,(y._d||0)/sp)) - (x.raw - 6*Math.min(1,(x._d||0)/sp));
    });
  } else {
    a.sort(function(x,y){ return y.raw - x.raw; });
  }
  var f = favs();
  if (f.length){
    a.sort(function(x,y){ return (f.indexOf(y.i) >= 0 ? 1 : 0) - (f.indexOf(x.i) >= 0 ? 1 : 0); });
  }
  return a;
}

}

/* ══════════ 속보 줄 ══════════
   한 번에 한 건만 보여준다. 10분에 한 건씩, 하루 단위로 섞은 순서로
   번갈아 나온다. 20건이면 한 바퀴가 약 3시간 20분 — 하루 종일 같은 줄이
   붙어 있지 않고, 그렇다고 정신없이 흐르지도 않는다.
   ① 제보  ② 위판 역산(항구에서 많이 잡히면 그 앞바다에 있다)  ③ 기사
   자료가 하나도 없으면 오늘의 1~3위가 대신 돈다.                        */
var FEED = null;

function kmBetween_(la1, lo1, la2, lo2){
  var R = 6371, d2r = Math.PI/180;
  var dLa = (la2-la1)*d2r, dLo = (lo2-lo1)*d2r;
  var a = Math.sin(dLa/2)*Math.sin(dLa/2)
        + Math.cos(la1*d2r)*Math.cos(la2*d2r)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/** 위판 한 건 → 근처 지점 추천 문장 */
function tickFromCatch_(c){
  if (!c || !c.항구) return null;
  var near = [];
  if (c.la != null && c.lo != null && typeof POINTS !== 'undefined'){
    var best = null, bd = 1e9;
    for (var i = 0; i < POINTS.length; i++){
      var d = kmBetween_(c.la, c.lo, POINTS[i].la, POINTS[i].lo);
      if (d < bd){ bd = d; best = POINTS[i]; }
    }
    if (best && bd <= 40) near = [best];
  }
  var t = c.항구 + ' 위판에 ' + c.품목 + (c.양 ? ' ' + c.양 : '');
  if (near.length)
    return { tag:'위판', cls:'t-gi', text: t + ' — 근처 ' + near[0].n + ' 앞바다에 붙었다는 뜻', i: near[0].i };
  return { tag:'위판', cls:'t-gi', text: t + ' — 그 앞바다가 살아 있습니다', i: null };
}

function tickerPool_(){
  var pool = [];
  if (FEED && FEED.제보) FEED.제보.forEach(function(r){
    if (r && r.글) pool.push({ tag:'제보', cls:'t-bo',
      text: (r.지점 ? r.지점 + ' · ' : '') + r.글, i: r.번호 || null });
  });
  if (FEED && FEED.위판) FEED.위판.forEach(function(c){
    var t = tickFromCatch_(c); if (t) pool.push(t);
  });
  if (FEED && FEED.기사) FEED.기사.forEach(function(a){
    if (a && a.제목) pool.push({ tag:'기사', cls:'t-gi',
      text: '「' + a.제목 + '」' + (a.출처 ? ' — ' + a.출처 : ''),
      i: a.번호 || null, url: a.url || null });
  });
  if (!pool.length && S.rows && S.rows.length){
    S.rows.slice().sort(function(x,y){ return y.raw - x.raw; }).slice(0,3)
      .forEach(function(r, k){
        pool.push({ tag:(k+1)+'위', cls:'t-nu', text: r.n + ' ' + r.score + '점 — ' + (r.verdict||''), i: r.i });
      });
  }
  return pool;
}

/** 하루 단위 고정 셔플 — 같은 날엔 누구나 같은 순서를 본다 */
function dayShuffle_(arr){
  var d = new Date(), seed = d.getFullYear()*372 + (d.getMonth()+1)*31 + d.getDate();
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    seed = (seed * 9301 + 49297) % 233280;
    var j = Math.floor(seed / 233280 * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var TK_SLOT_MIN = 10;
function tickerShow_(){
  var tk = $('ticker'), tr = $('tkTrack');
  if (!tk || !tr) return;
  var pool = dayShuffle_(tickerPool_());
  if (!pool.length){ tk.hidden = true; document.body.classList.remove('has-ticker'); return; }
  tk.hidden = false; document.body.classList.add('has-ticker');

  var now = new Date();
  var slot = Math.floor((now.getHours()*60 + now.getMinutes()) / TK_SLOT_MIN);
  if (window.__tkSlot != null) slot = window.__tkSlot;      // 검증용
  var it = pool[slot % pool.length];
  if (tk._key === it.text) return;                          // 같은 건이면 그대로
  tk._key = it.text;

  var sp = el('span','tk-it' + ((it.i != null || it.url) ? ' go' : ''),
    '<i class="tk-tag ' + it.cls + '">' + it.tag + '</i>' + it.text);
  if (it.i != null) sp.onclick = function(){ openDetail(it.i); };
  else if (it.url) sp.onclick = function(){ try { window.open(it.url, '_blank', 'noopener'); } catch(e){} };

  tr.innerHTML = ''; tr.classList.add('still'); tr.appendChild(sp);
  if (!NOMO){
    sp.classList.add('tk-in');
    /* 줄보다 길면 천천히 한 번 갔다 온다 — 목록 전체가 흐르는 게 아니라 이 한 건만 */
    nextFrame_(function(){
      var over = tr.scrollWidth - tr.parentNode.clientWidth;
      if (over > 8){
        tr.style.setProperty('--ov', over + 'px');
        tr.style.animationDuration = Math.max(10, Math.round(over / 22)) + 's';
        tr.classList.add('pong');
      } else { tr.classList.remove('pong'); }
    });
  }
}

function buildTicker_(){
  tickerShow_();
  var tk = $('ticker');
  if (tk && !tk._clock) tk._clock = setInterval(tickerShow_, 30000);   // 슬롯이 바뀌었나 30초마다 본다
}

function loadFeed_(){
  try {
    fetch('data/feed.json', { cache:'default' })
      .then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(j){ FEED = j; buildTicker_(); })
      .catch(function(){ buildTicker_(); });
  } catch(e){ buildTicker_(); }
}

function renderPick(){
  /* 내 위치 모드에서는 점수만 보지 않는다 — 반경 끝자락에서 한두 점 높은 자리보다
     가까우면서 좋은 자리가 실제로 더 나은 선택이다. 거리는 최대 6점까지만 깎는다. */
  var near = S.near && S.me;
  var span = near ? (S.rad || 150) : 0;
  var top = S.rows.slice().sort(function(a,b){
    if (near) return (b.raw - 6*Math.min(1, (b._d||0)/span)) - (a.raw - 6*Math.min(1, (a._d||0)/span));
    return b.raw - a.raw;
  })[0];
  if (!top){ $('pick').hidden = true; $('pickRestore').hidden = true; return; }
  S.cur = top;
  if (pickClosed()){ $('pick').hidden = true; $('pickRestore').hidden = false; $('pickRestore').classList.toggle('hasWant', !!S.want); }
  else { $('pick').hidden = false; $('pickRestore').hidden = true; }
  var TO = tideOnly_();
  $('pickScore').textContent = TO ? '≈' : top.score;
  $('pickRing').style.setProperty('--v', TO ? 0 : top.score);
  $('pickRing').style.background = TO
    ? 'conic-gradient(rgba(120,190,225,.4) 100%,rgba(255,255,255,.08) 0)'
    : 'conic-gradient(var(--'+top.grade+') calc('+top.score+'*1%),rgba(255,255,255,.08) 0)';
  $('pickName').textContent = top.n;
  $('pickVerdict').textContent = TO
    ? '물때만 보는 날짜입니다. 정확한 점수는 7일 이내만 제공됩니다 — 물때·진입/퇴로 시각만 참고하세요.'
    : top.verdict;
  var c = $('pickChips'); c.innerHTML = '';
  c.appendChild(el('span','chip', top.r));
  if (top._d != null) c.appendChild(el('span','chip hot',
    '내 위치에서 ' + (top._d < 10 ? top._d.toFixed(1) : Math.round(top._d)) + 'km'));
  c.appendChild(el('span','chip hot', top.mul + ' · 조차 ' + top.range + 'm'));
  if (top.win) c.appendChild(el('span','chip hot', hm(top.win[0]) + '~' + hm(top.win[1])));
  if (S.mode === 'haeru' && top.vis != null)
    c.appendChild(el('span','chip', '시야 ' + (top.vis >= 1 ? top.vis.toFixed(1) + 'm' : Math.round(top.vis*100) + 'cm')));
  if (S.mode === 'fish' && top.cur != null)
    c.appendChild(el('span','chip', '조류 ' + top.cur.toFixed(1) + '노트'));
  if (top.isl && top.fr) c.appendChild(el('span','chip', '배 ' + top.fr[0] + ' ' + top.fr[1] + '분'));
  (top.targets||[]).slice(0,3).forEach(function(t){ c.appendChild(el('span','chip', t)); });
  (top.banned||[]).slice(0,1).forEach(function(t){ c.appendChild(el('span','chip warn', t + ' 금어기')); });
  if (top.warn && top.warn.length) c.appendChild(el('span','chip warn', top.warn[0]));
  // 원픽 영상 자리 — 유튜버에게 주는 대가이자 나중의 광고 자리
  var pv = $('pickVid');
  if (!pv){
    pv = el('a','pickvid'); pv.id = 'pickVid';
    pv.target = '_blank';
    $('pick').querySelector('.pick-inner').insertBefore(pv, $('pickCta'));
  }
  if (top.vid && top.vid.u){
    var v = top.vid;
    pv.hidden = false;
    pv.href = v.u;
    pv.rel = 'noopener' + (v.paid ? ' sponsored nofollow' : '');
    pv.className = 'pickvid' + (v.paid ? ' paid' : '');
    pv.innerHTML = (v.thumb ? '<img src="' + v.thumb + '" alt="" loading="lazy">' : '<span class="ph">▶</span>')
      + '<span class="pv-t"><b>' + (v.t || (v.target + ' 잡는 법')) + '</b>'
      + (v.ch ? '<i>' + v.ch + '</i>' : '') + '</span>'
      + (v.paid ? '<em>광고</em>' : '');
    pv.onclick = function(e){ e.stopPropagation(); refEvent('pickvid'); };
  } else {
    pv.hidden = true;
  }

  $('pickCta').onclick = function(){ openDetail(top.i); };

  bd.dataset.n = top.n; bd.dataset.s = top.score;

function renderList(){
  syncSortBtns();
  var l = $('list'); l.innerHTML = '';
  var arr = sorted();
  $('sheetTitle').textContent = (S.near ? '내 주변 ' : '') + MODE_NAME[S.mode] + ' ' +
    (S.sort==='near' ? '가까운 순' : S.sort==='time' ? '시간 빠른 순'
     : S.sort==='vis' ? '시야 좋은 순' : '추천 순위')
    + (S.near && S.rad ? ' · 반경 ' + S.rad + 'km' : '');
  /* 반경 안이 오늘 신통치 않으면 솔직히 말한다 — 밖에 훨씬 나은 자리가 있으면 거리와 점수까지 */

    var inBest = arr.reduce(function(m,r){ return r.raw > m.raw ? r : m; }, arr[0]);
    var out = null;
    (S.rowsAll || []).forEach(function(r){
      if (r._d == null || (S.rad && r._d <= S.rad)) return;
      if (!out || r.raw > out.raw) out = r;
    });

      var nn = el('div','near-note',
        '반경 ' + (S.rad || '전국') + (S.rad ? 'km' : '') + ' 안에서는 오늘 <b>' + inBest.score + '점</b>이 최고입니다. '

      nn.onclick = function(){ openDetail(out.i); };
      l.appendChild(nn);
    }
  }
  arr.forEach(function(r, i){
    var row = el('div','row' + (S.sel===r.i?' on':''));
    row.appendChild(el('div','row-rank', String(i+1)));

    var body = el('div','row-body');
    var top = el('div','row-top');
    if (favs().indexOf(r.i) >= 0) top.appendChild(el('span','row-fav','★'));
    top.appendChild(el('span','row-name', r.n));
    if (r.isl) top.appendChild(el('span','row-isl', r.fr ? '배 '+r.fr[1]+'분' : '섬'));
    if (r.mil) top.appendChild(el('span','row-isl row-mil', r.mil >= 2 ? '군통제·야간금지' : '군통제'));
    if (r.prot) top.appendChild(el('span','row-isl row-prot', '보호구역'));
    if (r.kd === 'B') top.appendChild(el('span','row-isl row-kd', '겸용'));
    top.appendChild(el('span','row-reg', r.r));
    if (r._d != null) top.appendChild(el('span','row-dist', (r._d < 10 ? r._d.toFixed(1) : Math.round(r._d)) + 'km'));
    body.appendChild(top);
    body.appendChild(el('div','row-verdict', tideOnly_()
      ? '물때·진입/퇴로만 제공 — 점수는 7일 이내'
      : r.verdict));

    var ch = el('div','row-chips');
    var visChip = null;
    if (S.mode === 'haeru' && r.vis != null)
      visChip = el('span', 'chip' + (S.sort==='vis' ? ' vis-on' : ''), visLabel_(r.vis, r.s, r.visQ, r.visWord));
    if (visChip && S.sort === 'vis') ch.appendChild(visChip);   // 시야순일 땐 맨 앞에

function autoDetail_(){

/* ── 화면이 살아나는 느낌 ──
   숫자가 갑자기 튀어나오는 것보다, 차오르는 걸 눈으로 보는 편이
   "계산해서 낸 값"이라는 인상을 준다. 값 자체는 건드리지 않는다.
   움직임을 싫어하는 사람(운영체제 설정)에게는 전부 끈다. */
var NOMO = false;
try { NOMO = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}

/** 다음 프레임에 실행 — 브라우저가 시작값을 먼저 그리게 한다 */
function nextFrame_(fn){
  if (NOMO) { fn(); return; }
  requestAnimationFrame(function(){ requestAnimationFrame(fn); });
}

/** 숫자가 올라가는 효과 */
function countUp_(node, to, ms){
  if (NOMO || !node) { if (node) node.textContent = to; return; }
  var from = 0, t0 = null;
  function step(t){
    if (t0 === null) t0 = t;
    var k = Math.min(1, (t - t0) / (ms || 900));
    var e = 1 - Math.pow(1 - k, 3);                 // 끝에서 부드럽게 멈춘다
    node.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/** 상세를 열 때마다 등장 효과를 다시 태운다 */
function fillBars_(root){
  if (!root) return;
  var bs = root.querySelectorAll('.gauge-t i[data-w], .wade-bar i[data-w]');
  nextFrame_(function(){
    for (var i = 0; i < bs.length; i++) bs[i].style.width = bs[i].getAttribute('data-w') + '%';
  });
}

function playIn_(root){
  if (!root) return;
  fillBars_(root);
  var secs = root.querySelectorAll('.sec, .verdict, .dt-head, .wade, .risk');
  for (var i = 0; i < secs.length; i++){
    secs[i].classList.remove('rise');
    if (!NOMO) secs[i].style.animationDelay = Math.min(i * 70, 780) + 'ms';
  }
  nextFrame_(function(){
    for (var j = 0; j < secs.length; j++) secs[j].classList.add('rise');
  });
}

function renderDetail(d){

/* 상세 화면 순서 — 사람들이 먼저 찾는 것부터: 0 물때 → 1 어종 → 2 시야 → 3 들어가고 나오기 → 4 앞으로 7일 → 나머지.
   머리·날짜줄·한 줄 결론·안전 경고는 짧으니 맨 위에 그대로 둔다. */
var DT_ORDER = [
  /* ── 언제 가나 — 가장 먼저 알고 싶은 것 ── */
  ['물때 ·',10],['만조 · 간조',11],['지금 실제 바다',12],
  ['언제 들어가고',13],['드러나는 갯벌',14],['파도가 어디까지',15],
  /* ── 무엇을 잡나 ── */
  ['노릴 어종',20],['채집물',20],
  /* ── 어디로 어떻게 ── */
  ['세부 포인트',30],['들어가는 길',31],['수중 시야',32],['바다와 하늘',33],['조류와 달',34],
  /* ── 앞날과 기록 ── */
  ['앞으로 7일',40],['실제 조황',41],['같은 날',42],
  /* ── 준비물 ── */
  ['준비물',50],['채비와 미끼',50],
  /* ── 규정과 경고 — 정보를 다 본 뒤 ── */
  ['금지체장',80],['잡으면 안 되는',81],['확인할 것',85],['점수를 이렇게',86],['근거와 주의',87],
  /* ── 홍보·제휴 — 맨 아래 ── */
  ['잡는 법 영상',90],['조건 맞춤 장비',91],['이 근처',92]
];

function orderDetail_(b){
  var kids = Array.prototype.slice.call(b.children);
  function rank(n){
    var rk = n.getAttribute && n.getAttribute('data-rk');
    if (rk) return +rk;
    var c = n.className || '';
    if (/dt-head/.test(c)) return 0;
    if (/dt-verdict/.test(c) && !/sec/.test(c)) return 2;
    if (/adcard/.test(c)) return 95;
    if (/dt-actions/.test(c)) return 99;
    var t = n.querySelector && n.querySelector('.sec-t');
    if (t){
      var tx = t.textContent || '';
      for (var i = 0; i < DT_ORDER.length; i++) if (tx.indexOf(DT_ORDER[i][0]) >= 0) return DT_ORDER[i][1];
      return 80;
    }
    return 3;
  }
  kids.map(function(n, i){ return { n:n, r:rank(n), i:i }; })
      .sort(function(a, c){ return a.r - c.r || a.i - c.i; })
      .forEach(function(x){ b.appendChild(x.n); });
}

/* 조석 곡선 SVG */
function tideSVG(meta, win){
  var W = 320, H = 108, PT = 10, PB = 20;
  var ev = (meta.events||[]).slice().sort(function(a,b){ return a.t-b.t; });
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if (!ev.length) return svg;

  // 앞뒤로 가상 극점을 붙여 0~24시를 모두 덮는다
  var pts = ev.slice();
  var P = 6.2103;
  while (pts[0].t > 0)      pts.unshift({ k: pts[0].k==='H'?'L':'H', t: pts[0].t - P, lv: oppLv(pts, pts[0]) });
  while (pts[pts.length-1].t < 24){
    var last = pts[pts.length-1];
    pts.push({ k: last.k==='H'?'L':'H', t: last.t + P, lv: oppLv(pts, last) });
  }
  function oppLv(list, ref){
    for (var k=0;k<list.length;k++){ if (list[k].k !== ref.k) return list[k].lv; }
    return ref.lv;
  }
  var lvs = pts.map(function(p){ return p.lv; });
  var mn = Math.min.apply(null,lvs), mx = Math.max.apply(null,lvs);
  if (mx - mn < 10) mx = mn + 10;
  var X = function(t){ return t/24*W; };
  var Y = function(l){ return PT + (1 - (l-mn)/(mx-mn)) * (H-PT-PB); };

  function level(t){
    for (var k=0;k<pts.length-1;k++){
      if (t >= pts[k].t && t <= pts[k+1].t){
        var a = pts[k], b2 = pts[k+1];
        var f = (t - a.t)/(b2.t - a.t);
        return (a.lv + b2.lv)/2 + (a.lv - b2.lv)/2 * Math.cos(Math.PI*f);
      }
    }
    return pts[pts.length-1].lv;
  }
  var dpath = '', apath = '';
  for (var t=0; t<=24; t+=0.25){
    var x = X(t).toFixed(1), y = Y(level(t)).toFixed(1);
    dpath += (t===0 ? 'M' : 'L') + x + ' ' + y;
  }
  apath = dpath + 'L'+W+' '+(H-PB)+'L0 '+(H-PB)+'Z';

  // 그라데이션
  var defs = document.createElementNS(ns,'defs');
  defs.innerHTML = '<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#1fc4c0" stop-opacity=".38"/>'+
    '<stop offset="100%" stop-color="#1fc4c0" stop-opacity="0"/></linearGradient>';
  svg.appendChild(defs);

  // 야간 음영
  function shade(a, b2){
    if (b2 <= a) return;
    var r = document.createElementNS(ns,'rect');
    r.setAttribute('x', X(a)); r.setAttribute('y', 0);
    r.setAttribute('width', X(b2)-X(a)); r.setAttribute('height', H-PB);
    r.setAttribute('fill','rgba(2,10,18,.45)');
    svg.appendChild(r);
  }
  if (meta.sunrise != null) shade(0, meta.sunrise);
  if (meta.sunset != null)  shade(meta.sunset, 24);

  // 추천 시간창
  function drawWin(a2, b3){
    if (b3 > a2){
      var hi = document.createElementNS(ns,'rect');
      hi.setAttribute('x', X(a2)); hi.setAttribute('y', 0);
      hi.setAttribute('width', X(b3)-X(a2)); hi.setAttribute('height', H-PB);
      hi.setAttribute('fill','rgba(46,230,168,.16)');
      hi.setAttribute('stroke','rgba(46,230,168,.5)'); hi.setAttribute('stroke-width','1');
      hi.setAttribute('class','tide-win');
      svg.appendChild(hi);
      var lb = document.createElementNS(ns,'text');
      lb.setAttribute('x', (X(a2)+X(b3))/2); lb.setAttribute('y', H-PB-5);
      lb.setAttribute('text-anchor','middle'); lb.setAttribute('font-size','9');
      lb.setAttribute('fill','#2ee6a8'); lb.setAttribute('font-weight','800');
      lb.setAttribute('class','tide-win-lb');
      lb.textContent = '추천';
      svg.appendChild(lb);
    }
  }
  if (win){
    var wa = win[0], wb = win[1];
    drawWin(Math.max(0, wa), Math.min(24, wb));
    if (wb > 24) drawWin(0, wb - 24);        // 자정을 넘긴 부분
    if (wa < 0)  drawWin(24 + wa, 24);
  }

  var area = document.createElementNS(ns,'path');
  area.setAttribute('d', apath); area.setAttribute('fill','url(#tg)');
  area.setAttribute('class','tide-area');
  svg.appendChild(area);
  var line = document.createElementNS(ns,'path');
  line.setAttribute('d', dpath); line.setAttribute('fill','none');
  line.setAttribute('class','tide-line');
  line.setAttribute('stroke','#1fc4c0'); line.setAttribute('stroke-width','2'); line.setAttribute('stroke-linecap','round');
  svg.appendChild(line);

  // 극점 표시
  ev.forEach(function(e){
    var c = document.createElementNS(ns,'circle');
    c.setAttribute('cx', X(e.t)); c.setAttribute('cy', Y(e.lv)); c.setAttribute('r', 3.2);
    c.setAttribute('fill', e.k==='H' ? '#1fc4c0' : '#2ee6a8');
    svg.appendChild(c);
    var tx = document.createElementNS(ns,'text');
    tx.setAttribute('x', Math.min(W-16, Math.max(16, X(e.t))));
    tx.setAttribute('y', Y(e.lv) + (e.k==='H' ? -8 : 14));
    tx.setAttribute('text-anchor','middle'); tx.setAttribute('font-size','9');
    tx.setAttribute('fill', e.k==='H' ? '#a4e9d4' : '#7fe8c4'); tx.setAttribute('font-weight','700');
    tx.textContent = hmH(e.t);
    svg.appendChild(tx);
  });

  // 현재 시각
  if (S.ds === BOOT.today){
    var now = new Date(); var nt = now.getHours() + now.getMinutes()/60;
    var nl = document.createElementNS(ns,'line');
    nl.setAttribute('x1', X(nt)); nl.setAttribute('x2', X(nt));
    nl.setAttribute('y1', 0); nl.setAttribute('y2', H-PB);
    nl.setAttribute('stroke','#fff'); nl.setAttribute('stroke-width','1');
    nl.setAttribute('stroke-dasharray','3 3'); nl.setAttribute('opacity','.55');
    svg.appendChild(nl);
  }
  // 기준선
  var base = document.createElementNS(ns,'line');
  base.setAttribute('x1',0); base.setAttribute('x2',W);
  base.setAttribute('y1',H-PB); base.setAttribute('y2',H-PB);
  base.setAttribute('stroke','rgba(255,255,255,.12)'); base.setAttribute('stroke-width','1');
  svg.appendChild(base);
  return svg;
}

/* ══════════════ 날짜 ══════════════ */
/* ── 물때만 날짜 ──
   기상 예보는 7일이 한계다. 그 너머 날짜는 점수를 지어내지 않고
   물때·진입/퇴로처럼 조석만으로 계산되는 것만 보여준다. */
var WX_DAYS = 6;                       // 오늘 포함 7일 (오늘+6)
function tideOnlyDs_(ds){
  try {
    var b = parseDs(BOOT.today), d = parseDs(ds);
    return Math.round((d - b) / 86400000) > WX_DAYS;
  } catch(e){ return false; }
}
function tideOnly_(){ return tideOnlyDs_(S.ds); }

function renderDates(){
  var n = $('datestrip'); n.innerHTML = '';
  var base = parseDs(BOOT.today);   // 서버 기준 오늘
  for (var k=-1; k<=13; k++){
    var d = new Date(base.getTime() + k*86400000);
    var ds = dstr(d);
    var far = k > WX_DAYS;
    var lbl = k===0 ? '오늘' : k===1 ? '내일' : k===-1 ? '어제' : (d.getMonth()+1)+'/'+d.getDate();
    var c = el('button','dchip'+(ds===S.ds?' on':'')+(far?' far':'')+(k===0?' today':''),
      '<b>'+lbl+'</b><span>'+(far?'물때만':WD[d.getDay()])+'</span>');
    (function(x, fx){ c.onclick = function(){
      if (S.ds===x) return; S.ds = x; renderDates(); load();
      if (fx) toast('정확한 점수는 7일 이내만 제공됩니다 — 이 날짜는 물때·진입/퇴로만 보여드립니다', 3600);
    }; })(ds, far);
    n.appendChild(c);
  }
  /* 오늘을 보고 있으면 왼쪽 시작점에, 다른 날짜면 그 칸을 가운데로.
     레이아웃이 끝난 뒤 잡아야 폭이 0이 아니어서 제대로 붙는다 */
  var apply = function(){
    var td = n.querySelector('.dchip.today');
    var on = n.querySelector('.dchip.on');
    if (S.ds === BOOT.today && td){
      td.scrollIntoView({ inline:'start', block:'nearest' });
      n.scrollLeft = Math.max(0, n.scrollLeft - 6);
    } else if (on){
      on.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
    }
    dsCtlSync_();
  };
  dsCtl_();
  requestAnimationFrame(function(){ requestAnimationFrame(apply); });
}

/* ── 날짜줄 이동 단추 — 좌우 화살표 + 「오늘」 복귀 ── */
function dsCtl_(){
  var st = $('datestrip'); if (!st) return;
  if (!$('dsPrev')){
    var mk = function(id, html, fn){
      var b = document.createElement('button');
      b.id = id; b.className = 'dsctl'; b.type = 'button'; b.innerHTML = html; b.onclick = fn;
      document.body.appendChild(b); return b;
    };
    mk('dsPrev', '&#8249;', function(){ st.scrollBy({ left:-280, behavior:'smooth' }); });
    mk('dsNext', '&#8250;', function(){ st.scrollBy({ left: 280, behavior:'smooth' }); });
    mk('dsToday', '오늘', function(){
      if (S.ds !== BOOT.today){ S.ds = BOOT.today; renderDates(); load(); }
      else {
        var on2 = st.querySelector('.dchip.on');
        if (on2) on2.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
      }
    });
    st.addEventListener('scroll', function(){ dsCtlSync_(); }, { passive:true });
    window.addEventListener('resize', function(){ dsCtlSync_(); });
  }
  dsCtlSync_();
}
function dsCtlSync_(){
  var st = $('datestrip'); if (!st || !$('dsPrev')) return;
  var r = st.getBoundingClientRect();
  var midY = (r.top + r.height/2);
  var place = function(id, x, fromRight){
    var b = $(id); if (!b) return;
    b.style.top = midY + 'px';
    if (fromRight){ b.style.right = x + 'px'; b.style.left = 'auto'; }
    else { b.style.left = x + 'px'; b.style.right = 'auto'; }
  };
  place('dsPrev', r.left + 2, false);
  place('dsNext', (window.innerWidth - r.right) + 2, true);

(function(){
  var sheet = $('sheet'), h = $('handle');
  var closedY = null, startY = 0, cur = 0, dragging = false;
  function closed(){
    return sheet.classList.contains('open') ? 0 : sheet.offsetHeight - 148 - (window.__sb||0);
  }
  function setY(y){ sheet.style.setProperty('--sy', y + 'px'); }
  function down(e){
    dragging = true; sheet.classList.add('drag');
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    cur = sheet.classList.contains('open') ? 0 : sheet.offsetHeight - 148;
    e.preventDefault();
  }
  function move(e){
    if (!dragging) return;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - startY + cur;
    y = Math.max(0, Math.min(sheet.offsetHeight - 100, y));
    setY(y);
  }
  function up(){
    if (!dragging) return;
    dragging = false; sheet.classList.remove('drag');
    var y = parseFloat(getComputedStyle(sheet).getPropertyValue('--sy')) || 0;
    var open = y < (sheet.offsetHeight - 148) / 2;
    sheet.style.removeProperty('--sy');
    sheet.classList.toggle('open', open);
    syncPick();
  }
  h.addEventListener('touchstart', down, { passive:false });
  h.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('mouseup', up);
  h.addEventListener('click', function(){
    if (!dragging){ sheet.classList.toggle('open'); syncPick(); }
  });
})();

/* 상세 패널 아래로 밀어 닫기 */
(function(){
  var p = $('detailPanel'), h = $('detailHandle');

  function down(e){ on = true; sy = (e.touches?e.touches[0].clientY:e.clientY); p.classList.add('drag'); e.preventDefault(); }
  function move(e){
    if (!on) return;
    var dy = Math.max(0, (e.touches?e.touches[0].clientY:e.clientY) - sy);
    p.style.transform = 'translateY(' + dy + 'px)';
  }
  function up(e){
    if (!on) return; on = false; p.classList.remove('drag');
    var dy = parseFloat((p.style.transform.match(/([\d.]+)px/)||[0,0])[1]) || 0;
    p.style.transform = '';
    if (dy > 110) closeDetail();
  }
  h.addEventListener('touchstart', down, { passive:false });
  h.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);

})();

function bizClick(id, kind, extra){
  if (!id) return;
  var rec = { id:id, kind:kind||'partner', t:Date.now(),
              spot:(window.__detail && window.__detail.point) ? window.__detail.point.i : null,
              ref:(typeof refCode==='function' ? refCode() : ''),

  try {
    var q = JSON.parse(localStorage.getItem('hrn_biz') || '[]');
    q.push(rec); if (q.length > 500) q = q.slice(-500);
    localStorage.setItem('hrn_biz', JSON.stringify(q));
  } catch(e){}
  bizFlush_();
}
var BIZ_CFG = null, BIZ_SENDING = false;
function bizFlush_(){
  if (BIZ_SENDING) return;
  var go = function(cfg){
    if (!cfg || !cfg.url) return;
    var q = [];
    try { q = JSON.parse(localStorage.getItem('hrn_biz') || '[]'); } catch(e){}
    if (!q.length) return;
    BIZ_SENDING = true;
    var send = function(r){
      if (cfg.form){
        /* 구글 폼으로 보내는 방식 — 서버 없이도 시트에 쌓인다 */
        var fd = new FormData();
        var f = cfg.form;
        if (f.id)   fd.append(f.id,   r.id);
        if (f.kind) fd.append(f.kind, r.kind);
        if (f.spot) fd.append(f.spot, r.spot === null ? '' : String(r.spot));
        if (f.ref)  fd.append(f.ref,  r.ref || '');
        if (f.uid)  fd.append(f.uid,  r.uid || '');
        if (f.t)    fd.append(f.t,    new Date(r.t).toISOString());
        return fetch(cfg.url, { method:'POST', mode:'no-cors', body:fd });
      }
      return fetch(cfg.url, { method:'POST', mode:'no-cors',
        headers:{'content-type':'text/plain'}, body: JSON.stringify(r) });
    };
    Promise.all(q.map(function(r){ return send(r).catch(function(){}); }))
      .then(function(){ try { localStorage.setItem('hrn_biz','[]'); } catch(e){} })
      .catch(function(){})
      .then(function(){ BIZ_SENDING = false; });
  };
  if (BIZ_CFG !== null) return go(BIZ_CFG);
  fetch('data/track.json', {cache:'default'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ BIZ_CFG = (j && j.url) ? j : {}; go(BIZ_CFG); })
    .catch(function(){ BIZ_CFG = {}; });
}

function shopChip(name){
  var esc = function(v){ return String(v).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var d = window.__detail;
  var hit = null;
  if (d && d.shop && d.shop.items){
    var items = d.shop.items;
    // 1순위 — 이 도구가 실제로 묶인 상품군
    for (var i = 0; i < items.length && !hit; i++){
      if (items[i].u && items[i].src && items[i].src.indexOf(name) >= 0) hit = items[i];
    }
    // 2순위 — 이름이 같거나 서로를 포함
    for (var j = 0; j < items.length && !hit; j++){
      var it = items[j];
      if (!it.u) continue;
      if (name === it.n || String(name).indexOf(it.n) >= 0 || String(it.n).indexOf(name) >= 0) hit = it;
    }
  }
  if (!hit) return '<span class="chip">' + esc(name) + '</span>';
  return '<a class="chip buy" href="' + esc(hit.u) + '" target="_blank" rel="noopener sponsored nofollow">'
       + esc(name) + ' <em>사기</em></a>';
}

function meAsk_(cb){
  if (!navigator.geolocation){ toast('이 기기에서는 위치를 쓸 수 없습니다'); cb && cb(false); return; }

    S.me = [pos.coords.latitude, pos.coords.longitude];
    meSave_(S.me[0], S.me[1]);

  }, function(err){
    if (g) g.classList.remove('geo-wait');
    toast(err && err.code === 1
      ? '위치 권한이 꺼져 있습니다 — 주소창의 자물쇠에서 위치를 허용해 주세요'
      : '위치를 확인하지 못했습니다', 3600);

/* 대상 검색 — 이름과 다른 이름(별명)을 함께 훑는다 */
function spMatch_(x, q){
  if (!q) return true;
  if (x.n.indexOf(q) >= 0) return true;
  var al = x.a || [];
  for (var k = 0; k < al.length; k++) if (al[k].indexOf(q) >= 0) return true;
  return false;
}
function drawSpecies_(){
  var q = ($('wantQ') && $('wantQ').value || '').trim();
  var list = SPLIST.filter(function(x){ return spMatch_(x, q); });
  var body = $('finderBody'); body.innerHTML = '';
  var g = el('div','spgrid');
  var any = el('div','spcard' + (S.want ? '' : ' on'), '<b>전체</b><span>대상 지정 없음</span>');
  any.onclick = function(){ pickWant(null); };
  g.appendChild(any);
  list.forEach(function(x){
    var cls = 'spcard' + (x.banned ? ' ban' : (x.season >= 2 ? ' peak' : '')) + (S.want === x.n ? ' on' : '');
    var sub = x.banned ? '금어기'
            : x.season >= 3 ? '제철 · ' + x.spots + '곳'
            : x.season === 2 ? '시즌 · ' + x.spots + '곳'
            : x.season > 0  ? x.spots + '곳'
            : '철 아님';
    var c = el('div', cls, '<b>' + x.n + '</b><span>' + sub + '</span>');
    c.onclick = function(){
      if (x.banned){
        var bn = x.ban || {};
        toast(x.n + '은(는) ' + (bn.from ? bn.from + '~' + bn.to + ' ' : '') + '금어기입니다', 3600);
        return;
      }
      pickWant(x.n);
    };
    g.appendChild(c);
  });
  body.appendChild(g);
  if (!list.length){
    var no = el('div','gauge-l','「' + q + '」에 맞는 대상이 없습니다.');
    no.style.padding = '20px 4px'; body.appendChild(no);
  }
  var note = el('div','gauge-l', q
    ? list.length + '개 찾았습니다.'
    : '많이 찾는 순서로 세웠습니다. 철이 아닌 대상과 금어기는 아래쪽에 있습니다.');
  note.style.padding = '12px 4px 4px';
  body.appendChild(note);
}

/* ══════════════ 물때표 한눈에 — 상세로 안 들어가고 바로 본다 ══════════════
 * 요일·물때·만조·간조(수위 숫자)·물흐름·날씨를 한 표로. 수위(cm)가 주인공이다. */
var MT = { el:null, sel:null };
function mtDayWx_(p, dd){
  var rec = WXC && WXC[dd + '|' + gridKey_(p.la, p.lo)];
  if (!rec || !rec.wind) return null;
  var w = rec.wind, dgs = rec.wdir || [], cl = rec.cloud || [], rn = rec.rain || [];
  var n = Math.min(24, w.length), ws = 0, cd = 0, rs = 0, dx = 0, dy = 0;
  for (var i = 0; i < n; i++){
    ws += w[i] || 0; cd += cl[i] || 0; rs += rn[i] || 0;
    var a = (dgs[i] || 0) * Math.PI / 180; dx += Math.sin(a); dy += Math.cos(a);
  }
  var deg = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
  var D8 = ['북','북동','동','남동','남','남서','서','북서'];
  return { w: ws/n, dir: D8[Math.round(deg/45) % 8],
           sky: rs > 1 ? '비' : cd/n >= 70 ? '흐림' : cd/n >= 35 ? '구름' : '맑음' };
}
function mtFlow_(range){
  if (range == null) return '';
  return range >= 7 ? '급함' : range >= 5 ? '셈' : range >= 3 ? '보통' : '느림';
}
function mtBuild_(){
  if (MT.el) return;
  var d = el('div','mtwrap');
  d.id = 'mtwrap'; d.hidden = true;
  d.innerHTML =
      '<div class="mtcard glass">'
    +   '<div class="mthead">'
    +     '<h3>물때표</h3>'
    +     '<select id="mtSel" aria-label="지점 선택"></select>'
    +     '<button class="mtx" id="mtClose" aria-label="닫기">×</button>'
    +   '</div>'
    +   '<div class="mtbody" id="mtBody"><p class="mtload">물때를 불러오는 중…</p></div>'
    +   '<a class="mtcal" href="calendar/">📅 이 달 물때달력 무료 인쇄·PDF — <b>해루질 추천일(★) 한눈에</b></a>'
    +   '<div class="mtfoot"><b class="rec-star">★</b> 그날의 해루질·낚시 추천도 · 만조·간조 옆 <b>굵은 숫자가 조위(cm)</b>, <b class="up">▲</b>/<b class="dn">▼</b>는 전날 대비 증감 · 물때 국립해양조사원 · 기상 오픈메테오 · 8일째부터는 물때만</div>'
    + '</div>';
  document.body.appendChild(d);
  MT.el = d;
  d.addEventListener('click', function(e){ if (e.target === d) mtClose_(); });
  d.querySelector('#mtClose').onclick = mtClose_;
  d.querySelector('#mtSel').onchange = function(){ mtLoad_(+this.value); };
}
function mtClose_(){ if (MT.el) MT.el.hidden = true; }
function openMultae(forceId, forceName){
  mtBuild_();
  var sel = MT.el.querySelector('#mtSel');
  sel.innerHTML = '';
  var seen = {};
  var fv = favs();
  var cands = [];
  if (forceId != null && !seen[forceId]){ seen[forceId]=1; cands.push({i:forceId, n:(forceName||'')}); }
  S.rows.forEach(function(r){ if (fv.indexOf(r.i) >= 0 && !seen[r.i]){ seen[r.i]=1; cands.push({i:r.i,n:'★ '+r.n}); } });
  S.rows.slice(0, 20).forEach(function(r){ if (!seen[r.i]){ seen[r.i]=1; cands.push({i:r.i,n:r.n}); } });
  cands.forEach(function(c){
    var o = document.createElement('option'); o.value = c.i; o.textContent = c.n; sel.appendChild(o);
  });
  MT.el.hidden = false;
  var first = (forceId != null) ? forceId : ((S.sel && seen[S.sel]) ? S.sel : (cands[0] && cands[0].i));
  if (first != null){ sel.value = first; mtLoad_(+first); }
}
function mtLoad_(id){
  var body = MT.el.querySelector('#mtBody');
  body.innerHTML = '<p class="mtload">물때를 불러오는 중…</p>';
  google.script.run.withSuccessHandler(function(d){
    if (!d || d.error || !d.week){ body.innerHTML = '<p class="mtload">불러오지 못했습니다</p>'; return; }
    var p = d.point;
    /* 예보 닿는 날짜의 날씨를 미리 받아 둔다 (있는 것만) */
    var jobs = d.week.slice(0, 7).map(function(w){
      return (typeof ensureWeather === 'function') ? ensureWeather(w.ds).catch(function(){}) : Promise.resolve();
    });
    Promise.all(jobs).then(function(){
      var moonIco = function(ld){
        /* 음력 일자로 달 모양 — 1 삭, 15 보름, 30 그믐 */
        if (ld == null) return '';
        var p2 = (ld - 1) / 29.53;
        if (p2 < .04 || p2 > .96) return '🌑';
        if (p2 < .21) return '🌒'; if (p2 < .29) return '🌓';
        if (p2 < .46) return '🌔'; if (p2 < .54) return '🌕';
        if (p2 < .71) return '🌖'; if (p2 < .79) return '🌗';
        return '🌘';
      };
      var prevHi = null, prevLo = null;
      var mMode = S.mode === 'fish' ? 'f' : 'h';
      /* 이 지점의 15일 조차(range) 최소~최대로 정규화 → 물흐름·해루질 추천의 기준.
         이렇게 하면 사리 2~3일만 '급/셈'으로 뜨고, 나머지는 보통/느림 (바다타임식) */
      var _rg = d.week.map(function(w){ return (w.range != null ? w.range : null); }).filter(function(v){ return v != null; });
      var _rMin = _rg.length ? Math.min.apply(null, _rg) : 0;
      var _rMax = _rg.length ? Math.max.apply(null, _rg) : 1;
      var recession01 = function(w){
        if (w.range == null || _rMax <= _rMin) return null;
        return Math.max(0, Math.min(1, (w.range - _rMin) / (_rMax - _rMin)));
      };
      var flowLbl_ = function(r){
        if (r == null) return '';
        return r >= 0.8 ? '급함' : r >= 0.55 ? '셈' : r >= 0.3 ? '보통' : '느림';
      };
      var narrow = false; try { narrow = window.matchMedia('(max-width:680px)').matches; } catch(e){}
      var h = '<table class="mtt mtt-full' + (narrow?' mtt-narrow':'') + '"><thead><tr>'
            + '<th>날짜</th><th>물때</th><th>' + (mMode==='h'?'해루질':'낚시') + '<br>추천</th><th>물흐름</th>'
            + '<th>만조 <span>시각·조위·증감</span></th><th>간조 <span>시각·조위·증감</span></th>'
            + (narrow ? '<th>야간</th>' : '<th>해<br>뜸/짐</th><th>달<br>뜸/짐</th>')
            + '<th>날씨</th>'
            + '</tr></thead><tbody>';
      d.week.forEach(function(w, i){
        var dt = parseDs(w.ds);
        var wd = WD[dt.getDay()];
        var hi = (w.ev || []).filter(function(e){ return e.k === 'H'; });
        var lo = (w.ev || []).filter(function(e){ return e.k === 'L'; });
        /* 전날 대비 조위 증감(cm) — 물이 더 빠지는지/차는지를 화살표로 */
        var fmt = function(list, prevRef){
          if (!list.length) return '—';
          var out = list.map(function(e){
            var s2 = hm(e.m);
            if (e.lv != null){
              s2 += ' <b>' + e.lv + '</b>';
              if (prevRef != null){
                var dv = e.lv - prevRef;
                if (Math.abs(dv) >= 3) s2 += ' <i class="' + (dv>0?'up':'dn') + '">' + (dv>0?'▲':'▼') + Math.abs(dv) + '</i>';
              }
            }
            return s2;
          }).join('<br>');
          return out;
        };
        var curHi = hi.length ? hi[hi.length-1].lv : null;
        var curLo = lo.length ? lo[lo.length-1].lv : null;
        var hiCell = fmt(hi, prevHi), loCell = fmt(lo, prevLo);
        prevHi = curHi; prevLo = curLo;
        var wx = i < 7 ? mtDayWx_(p, w.ds) : null;
        var wxs = wx ? (wx.sky + '<br><span class="mtwind">' + wx.dir + ' ' + wx.w.toFixed(1) + '</span>') : '<span class="mtdim">—</span>';
        var rec01 = recession01(w);
        var flow = rec01 != null ? Math.round(rec01*100) : (w.flow != null ? w.flow : null);
        var flowBar = flow != null
          ? '<div class="flowb"><i style="width:' + Math.min(100,flow) + '%"></i></div><span class="mtsub">' + flowLbl_(rec01) + '</span>'
          : '—';
        /* 추천 별 + 초간략 이유 */
        var sc = (mMode === 'f') ? w.f : w.h;
        var stars, slab = '', why = '';
        if (mMode === 'h'){
          /* 해루질 = 물이 최대로 빠지는 날(사리)이 최고. 여기에 맑으면 가점, 비/강풍은 감점. */
          var t01 = rec01 != null ? rec01 : (sc != null ? sc/100 : 0.4);
          var sky = (i < 7 && wx) ? wx.sky : null;
          var wf = 1;
          if (sky === '비') wf = 0.25; else if (sky === '흐림') wf = 0.72; else if (sky === '구름') wf = 0.9; else if (sky === '맑음') wf = 1.08;
          if (i < 7 && wx && wx.w >= 9) wf *= 0.85;
          var comb = Math.max(0, Math.min(1, t01 * 0.72 * wf + t01 * 0.28));
          var st5 = Math.round(comb*5);
          if (t01 >= 0.85 && sky !== '비') st5 = Math.max(st5, 4);
          if (t01 >= 0.6 && sky !== '비' && sky !== '흐림') st5 = Math.max(st5, 3);
          st5 = Math.max(0, Math.min(5, st5));
          stars = '<span class="rec-star">' + '★'.repeat(st5) + '<span class="rec-off">' + '★'.repeat(5-st5) + '</span></span>';
          slab = st5 >= 5 ? '<span class="rec-best">강추</span>' : st5 >= 4 ? '<span class="rec-good">추천</span>' : '';
          var tp = t01 >= 0.8 ? '물 많이 빠짐' : t01 >= 0.55 ? '물 잘 빠짐' : t01 >= 0.3 ? '물 보통' : '물 적게 빠짐';
          why = tp + (sky ? (' · ' + sky) : '');
        } else {
          /* 낚시 = 어종별 조류 적합도 기반 엔진 점수 유지 */
          if (sc != null && i < 7){
            var st5f = Math.max(0, Math.min(5, Math.round(sc/20)));
            stars = '<span class="rec-star">' + '★'.repeat(st5f) + '<span class="rec-off">' + '★'.repeat(5-st5f) + '</span></span>';
            slab = sc >= 78 ? '<span class="rec-best">강추</span>' : sc >= 62 ? '<span class="rec-good">추천</span>' : '';
          } else {
            var fp = flow || 0, goodF = (fp >= 30 && fp <= 70);
            stars = '<span class="rec-star rec-approx">' + (goodF ? '★★★☆☆' : '★★☆☆☆') + '</span>';
            slab = goodF ? '<span class="rec-good">물때 좋음</span>' : '';
          }
        }
        var recCell = stars + (slab ? '<br>' + slab : '') + (why ? '<br><span class="rec-why">' + why + '</span>' : '');
        var sunC = (w.sr!=null||w.ss!=null) ? (hm(w.sr) + '<br><span class="mtsub">' + hm(w.ss) + '</span>') : '—';
        var moonC = (w.mr!=null||w.ms!=null) ? (hm(w.mr) + '<br><span class="mtsub">' + hm(w.ms) + '</span>') : '—';
        /* 야간 골든타임 — 해 지고, 달빛 적을 때(달 지면 더 어둡다)가 밤 채집 명당.
           해루질에 특히 중요: 낙지·꽃게가 달 밝으면 경계한다. */
        var night = '—';
        if (w.ss != null){
          var afterDark = hm(w.ss);
          if (w.bright != null && w.bright >= 55 && w.ms != null && w.ms > w.ss){
            night = '<b>' + hm(w.ms) + '~</b><br><span class="mtsub">달 진 뒤(달빛 ' + w.bright + '%)</span>';
          } else if (w.bright != null && w.bright < 35){
            night = '<b>' + afterDark + '~</b><br><span class="mtsub">어두운 밤(달빛 ' + w.bright + '%)</span>';
          } else {
            night = '<b>' + afterDark + '~</b><br><span class="mtsub">일몰 후</span>';
          }
        }
        var today = i === 0;
        var bestRow = (sc != null && i < 7 && sc >= 78);
        h += '<tr' + (today ? ' class="today"' : '') + (bestRow ? ' data-best="1"' : '') + '>'
          + '<td class="mtd">' + (dt.getMonth()+1) + '.' + dt.getDate()
            + ' <em' + (dt.getDay()===0?' class="sun"':dt.getDay()===6?' class="sat"':'') + '>' + wd + '</em></td>'
          + '<td class="mtm">' + moonIco(w.ld) + ' ' + (w.mul || '—')
            + (w.ld!=null?'<br><span class="mtsub">달빛 ' + w.bright + '%</span>':'') + '</td>'
          + '<td class="mtrec">' + recCell + '</td>'
          + '<td class="mtfl">' + flowBar + '</td>'
          + '<td class="mth">' + hiCell + '</td>'
          + '<td class="mtl">' + loCell + '</td>'
          + (narrow ? ('<td class="mtsm mtnight">' + night + '</td>')
                    : ('<td class="mtsm">' + sunC + '</td><td class="mtsm">' + moonC + '</td>'))
          + '<td class="mtw">' + wxs + '</td>'
          + '</tr>';
      });
      h += '</tbody></table>';
      body.innerHTML = h;
    });
  }).withFailureHandler(function(){
    body.innerHTML = '<p class="mtload">불러오지 못했습니다</p>';
  }).apiPoint(id, S.ds, null);
}
