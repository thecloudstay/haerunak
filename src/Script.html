/* 상단 물때표 단추 — 사람들이 제일 많이 찾는 것이 물때다. 목록을 열지 않고 바로 연다.
   내 위치를 아는 경우 가장 가까운 자리로 맞춰 연다. */
(function(){
  var b = $('btnTide');
  if (!b) return;
  b.onclick = function(){
    var id = null, nm = '';
    try {
      if (S.sel != null) id = S.sel;
      else if (S.rows && S.rows.length){
        var best = S.rows[0];
        if (S.me){
          for (var i = 0; i < S.rows.length; i++){
            if (S.rows[i]._d != null && (best._d == null || S.rows[i]._d < best._d)) best = S.rows[i];
          }
        }
        id = best.i; nm = best.n;
      }
    } catch(e){}
    openMultae(id, nm);
  };
})();

/* 주소에 ?mt=1 이 붙어 들어오면 열자마자 물때표를 띄운다 —
   홈 화면 바로가기·위젯에서 「오늘 물때」로 곧장 들어올 수 있게 */
(function(){
  try {
    var q = location.search || '';
    if (q.indexOf('mt=1') >= 0) setTimeout(function(){ try { $('btnTide').click(); } catch(e){} }, 1400);
    else if (q.indexOf('geo=1') >= 0) setTimeout(function(){ try { $('btnGeo').click(); } catch(e){} }, 900);
  } catch(e){}
})();

/* ══════════════ 바람·풍향 — 지도 위에 실시간 바람 화살표(Open-Meteo, 카카오/지도 직접 표시) ══════════════
   기존 윈디 iframe(embed.windy.com)은 접속 차단·X-Frame 문제로 자주 에러가 나서 제거.
   대신 사이트가 이미 받는 Open-Meteo 격자 바람으로 화살표를 직접 그린다 → 팝업 없음, 카카오 위에서도 동작. */
var WINDL = { layer:null, on:false, ds:null };
function windColor_(ms){
  /* 팔레트 3톤 안에서: 잔잔=중립 → 적당=민트 → 강풍=산호 */
  return ms>=12 ? '#e0563a' : ms>=8 ? '#ff7f5a' : ms>=5 ? '#2ee6a8' : ms>=2 ? '#7fd8cf' : '#9db4c4';
}
function windHour_(){
  /* S.ds가 오늘이면 현재 한국시각 시(時), 아니면 정오 12시 */
  try {
    if (S.ds === BOOT.today){ return new Date(Date.now()+9*36e5).getUTCHours(); }
  } catch(e){}
  return 12;
}
function windArrowIcon_(deg, ms){
  /* 바람 — 공기가 흘러가는 결. 꼬리에서 머리로 갈수록 진해지는 굽은 줄기 + 옆에 짧은 돌풍 줄 + 열린 꺾쇠 머리.
     세기는 크기·줄기 굵기로, 색은 3톤 안에서. 화살표는 바람이 불어가는 쪽을 가리킨다. */
  var col = windColor_(ms), k = 0.78 + Math.min(0.55, ms/22), gid = 'wg' + col.slice(1);
  var sw = 2 + Math.min(1.6, ms/9);
  var svg = '<svg width="38" height="38" viewBox="0 0 38 38" style="transform:rotate('+deg+'deg) scale('+k.toFixed(2)+');overflow:visible">'
    + '<defs><linearGradient id="'+gid+'" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="'+col+'" stop-opacity="0"/><stop offset=".55" stop-color="'+col+'" stop-opacity=".75"/><stop offset="1" stop-color="'+col+'" stop-opacity="1"/></linearGradient></defs>'
    + '<path d="M19 34 C 14.5 27, 23.5 21, 19 9" fill="none" stroke="url(#'+gid+')" stroke-width="'+sw.toFixed(1)+'" stroke-linecap="round"/>'
    + '<path d="M13.5 13.5 L19 7 L24.5 13.5" fill="none" stroke="'+col+'" stroke-width="'+sw.toFixed(1)+'" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<path d="M11.5 29 C 9.5 25, 13 22.5, 11.5 18" fill="none" stroke="'+col+'" stroke-opacity=".42" stroke-width="1.4" stroke-linecap="round"/>'
    + '<path d="M27 28 C 25.5 25, 28 22.5, 26.5 19.5" fill="none" stroke="'+col+'" stroke-opacity=".3" stroke-width="1.2" stroke-linecap="round"/>'
    + '</svg>';
  return L.divIcon({ className:'wind-arrow', html:svg
    + '<span class="wind-spd" style="color:'+col+'">'+Math.round(ms)+'<i>m/s</i></span>',
    iconSize:[38,38], iconAnchor:[19,19] });
}
function windDraw_(){
  if (!WINDL.on) return;
  if (!WINDL.layer){ WINDL.layer = L.layerGroup().addTo(map); }
  WINDL.layer.clearLayers();
  var ds = S.ds, hr = windHour_();
  /* 이 날짜의 모든 기상 격자셀을 모은다 */
  var cells = [];
  for (var key in WXC){
    if (key.indexOf(ds + '|') !== 0) continue;
    var gk = key.slice(ds.length+1), parts = gk.split(',');
    var la = +parts[0], lo = +parts[1];
    if (isNaN(la) || isNaN(lo)) continue;
    var rec = WXC[key];
    if (!rec || !rec.wind) continue;
    var ms = rec.wind[hr];
    if (ms == null) continue;
    var dg = (rec.wdir && rec.wdir[hr] != null) ? rec.wdir[hr] : 0;
    cells.push({ la: la, lo: lo, ms: ms, dg: dg });
  }
  if (!cells.length){ var b0=document.getElementById('wdBtn'); if(b0) b0.classList.add('on'); return; }
  /* 화면 위에 규칙적인 표시격자를 깔고, 각 지점을 가장 가까운 기상셀에서 샘플링 —
     저배율에선 여러 셀이 촘촘히, 고배율에선 인근 셀 바람이 화면을 채운다 */
  var b = map.getBounds();
  var sw = b.getSouthWest(), ne = b.getNorthEast();
  var sz = map.getSize();
  var cols = Math.max(3, Math.min(11, Math.round(sz.x / 88)));
  var rows = Math.max(3, Math.min(11, Math.round(sz.y / 88)));
  var dLa = (ne.lat - sw.lat) / rows, dLo = (ne.lng - sw.lng) / cols;
  var seen = {};
  for (var r = 0; r < rows; r++){
    for (var c = 0; c < cols; c++){
      var pLa = sw.lat + dLa * (r + 0.5);
      var pLo = sw.lng + dLo * (c + 0.5);
      /* 가장 가까운 기상셀 찾기 */
      var best = null, bd = 1e9;
      for (var i = 0; i < cells.length; i++){
        var ce = cells[i];
        var dd = (ce.la - pLa) * (ce.la - pLa) + (ce.lo - pLo) * (ce.lo - pLo);
        if (dd < bd){ bd = dd; best = ce; }
      }
      if (!best) continue;
      /* 표시지점이 어떤 셀에서도 너무 멀면(내륙 깊숙이 등) 건너뜀 — 약 0.5도 */
      if (bd > 0.25) continue;
      /* 같은 셀을 같은 화면칸에서 중복으로 그리지 않도록 위치 스냅 */
      var kk = pLa.toFixed(3) + ',' + pLo.toFixed(3);
      if (seen[kk]) continue; seen[kk] = 1;
      L.marker([pLa, pLo], { icon: windArrowIcon_((best.dg + 180) % 360, best.ms), interactive:false, keyboard:false, zIndexOffset:-500 }).addTo(WINDL.layer);
    }
  }
  var btn = document.getElementById('wdBtn'); if (btn) btn.classList.add('on');
}
function windToggle_(){
  WINDL.on = !WINDL.on;
  var btn = document.getElementById('wdBtn');
  if (!WINDL.on){
    if (WINDL.layer) WINDL.layer.clearLayers();
    if (btn) btn.classList.remove('on');
    return;
  }
  if (btn){ btn.classList.add('on'); btn.textContent = '바람'; }
  var ds = S.ds;
  if (typeof ensureWeather === 'function'){
    ensureWeather(ds).then(function(){ windDraw_(); }).catch(function(){ windDraw_(); });
  } else { windDraw_(); }
}
map.on('moveend', function(){ if (WINDL.on) windDraw_(); if (CURL.on) curDraw_(); });

/* ══════════════ 조류(유향·유속) 겹쳐 보기 ══════════════
   국립해양조사원 수치조류도 예측을 자동작업이 data/cur/<날짜>/<시>.json 으로 받아 둔다.
   화살표는 물이 흘러가는 쪽을 가리키고, 색·길이는 유속(cm/s). 해루질은 전류(물 멈춤) 전후가 안전하다. */
var CURL = { layer:null, on:false, cache:{}, miss:{} };
function curColor_(v){ /* cm/s — 약함=중립 → 보통=민트 → 셈=산호 (3톤) */
  return v>=100 ? '#e0563a' : v>=60 ? '#ff7f5a' : v>=30 ? '#2ee6a8' : v>=15 ? '#7fd8cf' : '#9db4c4';
}
function curHour_(){
  try { if (S.ds === BOOT.today){ return new Date(Date.now()+9*36e5).getUTCHours(); } } catch(e){}
  return 12;
}
function curArrowIcon_(deg, v){
  /* 조류 — 물이 미는 결. 앞에 꽉 찬 물머리(쐐기), 뒤로 물결 마루가 겹겹이 따라온다.
     유속이 셀수록 마루가 많아지고 굵어진다. 값은 낚시꾼이 쓰는 노트로. */
  var col = curColor_(v), n = v >= 60 ? 3 : v >= 25 ? 2 : 1, sw = 1.8 + Math.min(1.4, v/70);
  var k = 0.8 + Math.min(0.5, v/160);
  var svg = '<svg width="38" height="38" viewBox="0 0 38 38" style="transform:rotate('+deg+'deg) scale('+k.toFixed(2)+');overflow:visible">';
  for (var i = 0; i < n; i++){
    var y = 18 + i*6, op = (1 - i*0.28).toFixed(2);
    svg += '<path d="M11 '+(y+2)+' q4 -4 8 0 t8 0" fill="none" stroke="'+col+'" stroke-opacity="'+op+'" stroke-width="'+sw.toFixed(1)+'" stroke-linecap="round"/>';
  }
  svg += '<path d="M19 4 L27.5 15 L19 11.5 L10.5 15 Z" fill="'+col+'"/></svg>';
  return L.divIcon({ className:'cur-arrow', html:svg + '<span class="cur-spd" style="color:'+col+'">'+(v/51.44).toFixed(1)+'<i>kn</i></span>', iconSize:[38,38], iconAnchor:[19,19] });
}
function curLoad_(ds, hh){
  var key = ds + '/' + (hh<10?'0':'') + hh;
  if (CURL.cache[key]) return Promise.resolve(CURL.cache[key]);
  if (CURL.miss[key]) return Promise.resolve(null);
  return fetch('data/cur/' + key + '.json', {cache:'default'})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ if(!j || !j.g || !j.g.length) throw 0; CURL.cache[key] = j; return j; })
    .catch(function(){ CURL.miss[key] = 1; return null; });
}
function curDraw_(){
  if (!CURL.on) return;
  if (!CURL.layer){ CURL.layer = L.layerGroup().addTo(map); }
  var ds = S.ds, hh = curHour_();
  curLoad_(ds, hh).then(function(j){
    if (!CURL.on) return;
    CURL.layer.clearLayers();
    var btn = document.getElementById('crBtn');
    if (!j){ if (btn){ btn.classList.add('on'); btn.textContent = '조류·자료없음'; } return; }
    if (btn){ btn.classList.add('on'); btn.textContent = '조류 ' + (hh<10?'0':'') + hh + '시'; }
    var cells = j.g;   /* [위도,경도,유속,유향] */
    var b = map.getBounds(), sz = map.getSize();
    /* 화면 표시격자마다 가장 가까운 예측격자 값을 샘플링 — 바람과 같은 방식이라 어느 배율에서도 적당히 보인다 */
    var sw = b.getSouthWest(), ne = b.getNorthEast();
    var cols = Math.max(3, Math.min(11, Math.round(sz.x/88))), rows = Math.max(3, Math.min(11, Math.round(sz.y/88)));
    var dLa = (ne.lat-sw.lat)/rows, dLo = (ne.lng-sw.lng)/cols;
    var lim = Math.max(0.02, Math.pow(Math.min(dLa, dLo)*0.8, 2));   /* 격자에서 화면칸 하나 넘게 떨어지면(육지 깊숙이) 비움 */
    for (var r=0;r<rows;r++) for (var q=0;q<cols;q++){
      var pLa = sw.lat + dLa*(r+0.5), pLo = sw.lng + dLo*(q+0.5), best=null, bd=1e9;
      for (var k=0;k<cells.length;k++){ var e=cells[k]; var dd=(e[0]-pLa)*(e[0]-pLa)+(e[1]-pLo)*(e[1]-pLo); if(dd<bd){bd=dd;best=e;} }
      if (!best || bd > lim) continue;
      L.marker([pLa, pLo], { icon: curArrowIcon_(best[3], best[2]), interactive:false, keyboard:false, zIndexOffset:-600 }).addTo(CURL.layer);
    }
  });
}
function curToggle_(){
  CURL.on = !CURL.on;
  var btn = document.getElementById('crBtn');
  if (!CURL.on){ if (CURL.layer) CURL.layer.clearLayers(); if (btn){ btn.classList.remove('on'); btn.textContent = '조류'; } return; }
  curDraw_();
}
/* ══════════════ 범례 — 색이 무슨 뜻인지 지도 위에서 바로 ══════════════
   갯벌·해안 재질은 색으로 말하는 겹이라, 색표가 없으면 절반만 전달된다. */
var LEG_OPEN = !PHONE;                     // 휴대폰에서는 지도를 넓게 — 기본은 접어 둔다
try { var lv = localStorage.getItem('hrn_leg'); if (lv === '1') LEG_OPEN = true; else if (lv === '0') LEG_OPEN = false; } catch(e){}
function legHtml_(){
  var bright = (typeof brightMap_ === 'function') ? brightMap_() : false;
  var rows = [];
  if (typeof FLAT_ON !== 'undefined' && FLAT_ON && map.getZoom() >= FLAT_MINZ){
    rows.push('<b>물 빠지면 드러나는 갯벌</b>');
    ['mud','mix','sand'].forEach(function(k){
      var c = FLAT_COL[k]; if (!c) return;
      rows.push('<span><i style="background:' + (bright ? c.l : c.d) + '"></i>' + c.ko + '</span>');
    });
  }
  if (typeof CL_ON !== 'undefined' && CL_ON && map.getZoom() >= CL_MINZ){
    rows.push('<b>해안 재질</b>');
    ['mud','mudsand','sand','sandgv','gravel','rock','cliff','art','flat'].forEach(function(k){
      var d = CL_KIND[k]; if (!d) return;
      var svg = '<svg class="ln" viewBox="0 0 26 8" aria-hidden="true"><line x1="1" y1="4" x2="25" y2="4" stroke="' + d.c
              + '" stroke-width="' + Math.min(5, d.w) + '" stroke-linecap="' + (d.d ? 'butt' : 'round') + '"'
              + (d.d ? ' stroke-dasharray="' + d.d + '"' : '') + '/></svg>';
      rows.push('<span>' + svg + d.ko.replace(/\s*\(.*\)/,'') + '</span>');
    });
  }
  if (!rows.length) return '';
  return '<div class="leg-t">범례<button class="leg-x" id="legX" type="button" aria-label="접기">' + (LEG_OPEN ? '−' : '+') + '</button></div>'
       + (LEG_OPEN ? '<div class="leg-b">' + rows.join('') + '</div>' : '');
}
var legCtl = L.control({ position: 'bottomright' });
legCtl.onAdd = function(){
  var d = L.DomUtil.create('div', 'legend');
  d.id = 'legend';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.on(d, 'click', function(e){
    if (e.target && e.target.id === 'legX'){
      LEG_OPEN = !LEG_OPEN;
      try { localStorage.setItem('hrn_leg', LEG_OPEN ? '1' : '0'); } catch(err){}
      legDraw_();
    }
  });
  return d;
};
legCtl.addTo(map);
function legDraw_(){
  var d = document.getElementById('legend');
  if (!d) return;
  var h = legHtml_();
  d.innerHTML = h;
  d.style.display = h ? '' : 'none';
}
map.on('zoomend moveend', legDraw_);
setTimeout(legDraw_, 600);

/* 지도 왼쪽 아래 — 어장·갯골 토글 옆에 바람·조류 단추 */
var wdCtl = L.control({position:'bottomleft'});
wdCtl.onAdd = function(){
  var d = L.DomUtil.create('div','basesw wdsw');
  d.innerHTML = '<button class="basebtn" id="wdBtn" type="button">바람</button><button class="basebtn" id="crBtn" type="button">조류</button>';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.on(d.querySelector('#wdBtn'), 'click', function(){ windToggle_(); });
  L.DomEvent.on(d.querySelector('#crBtn'), 'click', function(){ curToggle_(); });
  return d;
};
wdCtl.addTo(map);

/* ══════════════ 겹 단추 접기 ══════════════
 * 지도 왼쪽 아래에 배경·지형·바다 단추가 세 줄로 쌓여 휴대폰에서는 지도의 아래 절반을
 * 가렸다. 평소에는 알약 하나로 접어 두고, 누르면 세 줄이 펼쳐진다.
 * 펼친 상태는 저장돼 다음에도 그대로다. 지도가 주인공이고 단추는 손님이다. */
var LAY_OPEN = !PHONE;                     // 휴대폰은 접어 두고, 넓은 화면은 펼쳐 둔다
try { var lay = localStorage.getItem('hrn_lay'); if (lay === '1') LAY_OPEN = true; else if (lay === '0') LAY_OPEN = false; } catch(e){}

function layCount_(){
  var n = 0;
  if (FLAT_ON) n++;
  if (CL_ON) n++;
  if (EO_ON) n++;
  if (GG_ON) n++;
  if (RK_ON) n++;
  if (AC_ON) n++;
  try { if (WINDL && WINDL.on) n++; } catch(e){}
  try { if (CURL && CURL.on) n++; } catch(e){}
  return n;
}
function layApply_(){
  document.body.classList.toggle('lay-open', LAY_OPEN);
  var b = document.getElementById('layTog');
  if (!b) return;
  b.classList.toggle('on', LAY_OPEN);
  b.setAttribute('aria-expanded', LAY_OPEN ? 'true' : 'false');
  b.innerHTML = '<i class="lay-i" aria-hidden="true"></i><span>겹</span>'
              + (LAY_OPEN ? '' : '<b class="lay-n">' + layCount_() + '</b>');
}
var layCtl = L.control({position:'bottomleft'});
layCtl.onAdd = function(){
  var d = L.DomUtil.create('div','basesw laysw');
  d.innerHTML = '<button class="basebtn laytog" id="layTog" type="button"'
              + ' aria-label="지도에 겹쳐 볼 것 고르기" aria-expanded="false"></button>';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.on(d, 'click', function(){
    LAY_OPEN = !LAY_OPEN;
    try { localStorage.setItem('hrn_lay', LAY_OPEN ? '1' : '0'); } catch(e){}
    layApply_();
  });
  return d;
};
layCtl.addTo(map);
layApply_();
/* 겹을 켜고 끌 때마다 알약의 숫자를 고쳐 준다 — 접어 둬도 몇 개가 켜졌는지 보인다 */
document.addEventListener('click', function(e){
  var t = e.target;
  if (t && t.closest && t.closest('.basesw')) setTimeout(layApply_, 0);
}, true);

window.__icons = { wind: windArrowIcon_, cur: curArrowIcon_ };   // 견본 확인용

})();
</script>
