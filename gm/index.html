<title>관리자</title>
<style>
body{margin:0;background:#05141f;color:#d7e8f2;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',sans-serif;min-height:100vh}
.gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px}
.gate input{padding:13px 16px;border-radius:12px;border:1px solid rgba(140,200,235,.35);background:#0a1e2b;color:#fff;font-size:16px;width:230px;text-align:center}
.gate button{padding:13px 26px;border-radius:12px;border:0;background:linear-gradient(100deg,#2ee6a8,#35d0ff);color:#04121c;font-weight:800;font-size:15px;cursor:pointer}
.gate p{color:#8ba6b8;font-size:13px}
#app{display:none;max-width:760px;margin:0 auto;padding:18px}
h1{font-size:19px}
.warn{background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;color:#fcd34d;margin-bottom:14px}
.card{background:#0a1e2b;border:1px solid rgba(140,200,235,.22);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card b{font-size:15px}
.card .exp{color:#ff9c9c;font-weight:700}
.card .sub{color:#8ba6b8;font-size:13px;line-height:1.6;margin-top:4px}
.tagf{display:inline-block;padding:2px 9px;border-radius:8px;font-size:12px;font-weight:800;margin-right:6px}
.f가무락{background:rgba(46,230,168,.18);color:#2ee6a8}
.f백합{background:rgba(53,208,255,.18);color:#35d0ff}
.f굴{background:rgba(255,176,32,.18);color:#ffb020}
.f바지락{background:rgba(200,160,255,.2);color:#c8a0ff}
a.map{color:#35d0ff;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div style="font-size:34px">&#128274;</div>
  <input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
  <button onclick="go()">열기</button>
  <p id="msg">관리자 전용 자료입니다</p>
</div>
<div id="app">
  <h1>강화도 조개 어장 — 면허 만료 목록</h1>
  <div class="warn">&#9888; 관리자 전용 참고자료입니다. 면허가 만료됐어도 갱신 절차가 진행 중이거나 어촌계가 계속 관리하는 곳일 수 있습니다. 현장 안내판과 어촌계 확인이 우선입니다. 이 목록은 국립해양조사원 어장정보도(2025)의 면허 종료일 기준입니다.</div>
  <div id="list"></div>
</div>

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function go(){
  var pw=document.getElementById('pw').value;
  try{
    var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(BLOB.s),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(BLOB.i)},key,b64(BLOB.c));
    render(JSON.parse(new TextDecoder().decode(pt)));
  }catch(e){ document.getElementById('msg').textContent='비밀번호가 맞지 않습니다'; }
}
document.getElementById('pw').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
function render(rows){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  var el=document.getElementById('list');
  rows.forEach(function(r){
    var d=document.createElement('div'); d.className='card';
    var end=r.end.slice(0,4)+'.'+(+r.end.slice(4,6))+'.'+(+r.end.slice(6,8));
    d.innerHTML='<span class="tagf f'+r.farm+'">'+r.farm+'</span><b>'+r.addr+'</b>'
      +' <span class="exp">면허 만료 '+end+'</span>'
      +'<div class="sub">'+r.knd+' &middot; '+r.ha+'ha &middot; 면허번호 '+r.no
      +' &middot; <a class="map" target="_blank" rel="noopener" href="https://map.kakao.com/link/map/'+encodeURIComponent(r.addr)+','+r.la+','+r.lo+'">지도에서 보기</a></div>';
    el.appendChild(d);
  });
}
</script>
