<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물때달력 무료 다운로드 — 해루낚</title>
<meta name="description" content="전국 서해안 지역별 월간 물때달력을 무료로 내려받으세요. 만조·간조 시각, 물때, 조위, 물흐름을 한 장에. 인쇄하면 그대로 PDF가 됩니다. 바다타임 유료 달력과 달리 해루낚은 무료입니다.">
<link rel="canonical" href="https://haerunak.com/calendar/">
<style>
:root{--bg:#0a1922;--card:#0f2431;--line:rgba(140,200,235,.18);--acc:#2ee6a8;--acc2:#35d0ff;--mut:#8ba6b8;--hi:#35d0ff;--lo:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#dce9f0;font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-size:22px;margin:0}
.top .free{background:linear-gradient(100deg,var(--acc),var(--acc2));color:#04121c;font-weight:800;font-size:12px;padding:3px 10px;border-radius:10px}
.sub{color:var(--mut);font-size:13.5px;line-height:1.6;margin:0 0 16px}
.sub a{color:var(--acc2);text-decoration:none}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ctl select,.ctl button{font-family:inherit;font-size:14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:#dce9f0;padding:10px 13px;cursor:pointer}
.ctl .mv{font-size:16px;font-weight:800;min-width:110px;text-align:center}
.ctl .dl{background:linear-gradient(100deg,var(--acc),var(--acc2));color:#04121c;font-weight:800;border:0}
.cal{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cal-h{display:flex;align-items:baseline;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.cal-h b{font-size:18px}.cal-h span{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{padding:8px 4px;font-size:12px;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line)}
th.sun{color:#ff8f8f}th.sat{color:#7db8ff}
td{border:1px solid var(--line);vertical-align:top;height:96px;padding:5px 6px;position:relative}
td.off{background:rgba(0,0,0,.15)}
.dn{font-weight:800;font-size:13px}
.dn.sun{color:#ff8f8f}.dn.sat{color:#7db8ff}
.mul{font-size:11px;color:var(--acc);font-weight:700;margin-left:4px}
.moon{position:absolute;top:5px;right:6px;font-size:12px}
.ti{margin-top:3px;font-size:10.5px;line-height:1.5}
.ti .h b{color:var(--hi)}.ti .l b{color:var(--lo)}
.ti em{font-style:normal;color:var(--mut)}
.foot{color:var(--mut);font-size:12px;line-height:1.6;margin-top:14px}
.foot b{color:#dce9f0}
.back{display:inline-block;margin-top:18px;color:var(--acc2);text-decoration:none;font-weight:700}
@media print{
  body{background:#fff;color:#111}
  .wrap{max-width:none;padding:0}
  .top,.sub,.ctl,.foot,.back{display:none}
  .cal{border:1px solid #333;border-radius:0}
  th{color:#333;border-bottom:1px solid #333}
  td{border:1px solid #999;height:104px}
  .dn.sun,.th.sun{color:#c00}.dn.sat{color:#06c}
  .mul{color:#0a7}.ti .h b{color:#06c}.ti .l b{color:#c60}.moon{color:#333}
  .cal-h b{color:#111}
}
@media(max-width:640px){td{height:auto;min-height:64px}.ti{font-size:9px}.moon{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>물때달력</h1><span class="free">무료 다운로드</span></div>
  <p class="sub">서해안 지역별 한 달 물때를 한 장에. 지역·달을 고르고 <b>「인쇄·PDF 저장」</b>을 누르면 그대로 저장됩니다. 만조 <b style="color:#35d0ff">▲</b> 간조 <b style="color:#ffb020">▼</b> 옆 숫자는 조위(cm). · <a href="/">해루낚 홈으로</a></p>
  <div class="ctl">
    <select id="reg"></select>
    <button id="prev">‹</button>
    <div class="mv" id="mv"></div>
    <button id="next">›</button>
    <button class="dl" id="dl">🖨 인쇄·PDF 저장</button>
  </div>
  <div class="cal">
    <div class="cal-h"><b id="calTitle"></b><span id="calReg"></span></div>
    <table><thead><tr>
      <th class="sun">일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th class="sat">토</th>
    </tr></thead><tbody id="calBody"></tbody></table>
  </div>
  <p class="foot"><b>물때</b>는 자체 조석계산 기준입니다(공식 예보 연동 준비 중). 실제 출조 전 현장 물때를 한 번 더 확인하세요. · 기상·바람은 <a href="/" style="color:#35d0ff">해루낚 지도</a>에서. · 무단 재판매 금지, 개인·동호회 이용은 자유입니다.</p>
  <a class="back" href="/">← 해루낚으로 돌아가기</a>
</div>
<script>
var SYN = 29.530588853;      // 삭망월(일)
var LUNI_DAY = 24.8412;      // 태음일(시간)
var SEMI = 12.4206;          // 반일주조 주기(시간)
var MULTTAE = ['7물','8물','9물','10물','11물','12물','13물','조금','무시','1물','2물','3물','4물','5물','6물'];
function toJD_(d){ return d.getTime()/86400000 + 2440587.5; }
function moonAge_(y,m,d){
  var dt = new Date(Date.UTC(y, m-1, d, 3, 0, 0)); // KST 12시 = UTC 03시
  var age = ((toJD_(dt) - 2451550.26) % SYN + SYN) % SYN;
  return age;
}
function multtae_(age, sea){
  var lunarDay = Math.round(age) + 1;          // 음력 일자 근사(삭 당일=1일)
  if (lunarDay > 30) lunarDay = 30;
  var idx = (lunarDay - 1) % 15;
  if (sea && sea !== 'W') idx = (idx + 1) % 15;   // 남해·동해·제주는 한 물 앞선 표기
  return { name: MULTTAE[idx], idx: idx, lunarDay: lunarDay };
}
function moonBright_(age){
  return (1 - Math.cos(2*Math.PI*age/SYN)) / 2;
}
function moonTransit_(age, lon){
  var solarNoon = 12 + (135 - lon)/15;
  return ((solarNoon + age * (LUNI_DAY - 24)) % LUNI_DAY + LUNI_DAY) % LUNI_DAY;
}
function sunTimes_(y,m,d,lat,lon){
  var rad = Math.PI/180;
  var jd = toJD_(new Date(Date.UTC(y, m-1, d, 0,0,0)));
  var lw = -lon;
  var n = Math.round(jd - 2451545.0 - 0.0009 - lw/360);
  var Js = 2451545.0 + 0.0009 + lw/360 + n;
  var M = (357.5291 + 0.98560028*(Js - 2451545.0)) % 360;
  var C = 1.9148*Math.sin(M*rad) + 0.0200*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  var lam = (M + C + 180 + 102.9372) % 360;
  var Jt = Js + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*lam*rad);
  var dec = Math.asin(Math.sin(lam*rad) * Math.sin(23.44*rad));
  var cosW = (Math.sin(-0.833*rad) - Math.sin(lat*rad)*Math.sin(dec)) / (Math.cos(lat*rad)*Math.cos(dec));
  if (cosW > 1) return { rise:null, set:null, noon:12 };     // 극야
  if (cosW < -1) return { rise:0, set:24, noon:12 };         // 백야
  var w = Math.acos(cosW)/rad;
  var f = function(J){ return ((J - Math.floor(jd)) * 24 + 9 + 12) % 24; }; // KST 변환
  return { rise: f(Jt - w/360), set: f(Jt + w/360), noon: f(Jt) };
}
function calcTide_(p, y, mo, d){
  var age = moonAge_(y, mo, d);
  // 조석 지연(age of tide): 사리는 삭·망 당일이 아니라 약 하루 뒤에 온다
  var eff = age - 1.0;
  var phase = 2*Math.PI*eff/SYN;
  var sf = 1 + 0.447*Math.cos(2*phase);                       // 실측 대조로 보정한 계수
  var anom = 1 + 0.05*Math.cos(2*Math.PI*(eff+3)/27.5545);    // 근지점 보정(근사)
  var range = p.mr * sf * anom * 0.94;                        // m
  var msl = p.mr * 100 * 0.78;                           // 평균해면 cm
  var half = range * 100 / 2;

  var base = moonTransit_(age, p.lo) + p.hi;             // 첫 만조
  var ev = [];
  for (var k = -2; k <= 3; k++){
    var th = base + k*SEMI;
    if (th >= 0 && th < 24) ev.push({k:'H', t:th, lv: Math.round(msl + half)});
    var tl = base + k*SEMI + SEMI/2;
    if (tl >= 0 && tl < 24) ev.push({k:'L', t:tl, lv: Math.round(msl - half)});
  }
  ev.sort(function(a,b){ return a.t - b.t; });
  return { events: ev, range: range, src: 'calc' };
}

var REGIONS = [{"n":"영흥도","r":"인천 옹진","la":37.2593,"lo":126.4658,"mr":5.8,"hi":4.6},{"n":"대부도 남서","r":"경기 안산","la":37.25196,"lo":126.56321,"mr":6.01,"hi":4.7},{"n":"제부도","r":"경기 화성","la":37.17825,"lo":126.62067,"mr":6.08,"hi":4.8},{"n":"무의도","r":"인천 중구","la":37.3728,"lo":126.4012,"mr":5.87,"hi":4.5},{"n":"을왕리·용유","r":"인천 중구","la":37.447,"lo":126.372,"mr":5.87,"hi":4.5},{"n":"인천 송도","r":"인천 연수","la":37.37428,"lo":126.62472,"mr":6.08,"hi":4.6},{"n":"강화 외포","r":"인천 강화","la":37.70054,"lo":126.37502,"mr":5.4,"hi":5},{"n":"석모도","r":"인천 강화","la":37.66131,"lo":126.3266,"mr":5.54,"hi":5},{"n":"대산","r":"충남 서산","la":37.01111,"lo":126.35653,"mr":5.13,"hi":4.4},{"n":"태안","r":"충남 태안","la":36.72993,"lo":126.27938,"mr":4.46,"hi":4.6},{"n":"만리포","r":"충남 태안","la":36.78531,"lo":126.1338,"mr":4.19,"hi":4.5},{"n":"안면암","r":"충남 태안","la":36.53,"lo":126.38,"mr":4.46,"hi":4.8},{"n":"무창포","r":"충남 보령","la":36.24792,"lo":126.5378,"mr":4.46,"hi":5},{"n":"위도","r":"전북 부안","la":35.62157,"lo":126.30366,"mr":3.92,"hi":5.2},{"n":"격포항","r":"전북 부안","la":35.61781,"lo":126.46444,"mr":4.19,"hi":5.4},{"n":"영광","r":"전남 영광","la":35.38,"lo":126.42,"mr":4.39,"hi":5.8},{"n":"목포","r":"전남 목포","la":34.76853,"lo":126.38239,"mr":2.97,"hi":6.2},{"n":"오이도 갯벌","r":"경기 시흥","la":37.3459,"lo":126.6864,"mr":6.08,"hi":4.6},{"n":"왜목마을해수욕장","r":"충남 당진","la":37.0532,"lo":126.5175,"mr":5.67,"hi":4.7},{"n":"대천해수욕장 남부","r":"충남 보령","la":36.2911,"lo":126.5183,"mr":4.46,"hi":5},{"n":"춘장대해수욕장","r":"충남 서천","la":36.2229,"lo":126.5091,"mr":4.46,"hi":5}];
var hm=function(h){var m=Math.round(((h%24)+24)%24*60);return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2);};
var moonIco=function(ld){var pp=(ld-1)/29.53;if(pp<.04||pp>.96)return '\u{1F311}';if(pp<.21)return '\u{1F312}';if(pp<.29)return '\u{1F313}';if(pp<.46)return '\u{1F314}';if(pp<.54)return '\u{1F315}';if(pp<.71)return '\u{1F316}';if(pp<.79)return '\u{1F317}';return '\u{1F318}';};
var now=new Date(Date.now()+9*36e5);
var curY=now.getUTCFullYear(), curM=now.getUTCMonth()+1;
var regSel=document.getElementById('reg');
REGIONS.forEach(function(r,i){var o=document.createElement('option');o.value=i;o.textContent=r.n+' ('+r.r+')';regSel.appendChild(o);});
function render(){
  var p=REGIONS[+regSel.value];
  document.getElementById('mv').textContent=curY+'. '+curM;
  document.getElementById('calTitle').textContent=curY+'년 '+curM+'월';
  document.getElementById('calReg').textContent=p.n+' · '+p.r+' 물때';
  var first=new Date(Date.UTC(curY,curM-1,1)), start=first.getUTCDay();
  var days=new Date(Date.UTC(curY,curM,0)).getUTCDate();
  var body=document.getElementById('calBody');body.innerHTML='';
  var row;
  for(var cell=0;cell<Math.ceil((start+days)/7)*7;cell++){
    if(cell%7===0){row=document.createElement('tr');body.appendChild(row);}
    var td=document.createElement('td');
    var dnum=cell-start+1;
    if(dnum<1||dnum>days){td.className='off';row.appendChild(td);continue;}
    var dow=(start+dnum-1)%7;
    var t=calcTide_(p,curY,curM,dnum);
    var age=moonAge_(curY,curM,dnum), mt=multtae_(age,'W'), ld=Math.round(age)+1;
    var hi=t.events.filter(function(e){return e.k==='H';}), lo=t.events.filter(function(e){return e.k==='L';});
    var fH=hi.map(function(e){return '<div class="h">'+hm(e.t)+' <b>'+e.lv+'</b></div>';}).join('');
    var fL=lo.map(function(e){return '<div class="l">'+hm(e.t)+' <b>'+e.lv+'</b></div>';}).join('');
    td.innerHTML='<span class="dn'+(dow===0?' sun':dow===6?' sat':'')+'">'+dnum+'</span>'
      +'<span class="mul">'+mt.name+'</span><span class="moon">'+moonIco(ld)+'</span>'
      +'<div class="ti">'+fH+fL+'</div>';
    row.appendChild(td);
  }
}
document.getElementById('prev').onclick=function(){curM--;if(curM<1){curM=12;curY--;}render();};
document.getElementById('next').onclick=function(){curM++;if(curM>12){curM=1;curY++;}render();};
regSel.onchange=render;
document.getElementById('dl').onclick=function(){window.print();};
render();
</script>
</body>
</html>
