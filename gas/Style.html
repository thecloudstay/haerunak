<style>
:root{
  --bg:#04121c; --bg2:#071c2a;
  --glass:rgba(10,28,42,.72); --glass2:rgba(14,36,52,.86);
  --line:rgba(120,190,225,.16); --line2:rgba(120,190,225,.28);
  --txt:#eaf4fb; --mut:#8ba6b8; --mut2:#5f7d8f;
  --acc:#2ee6a8; --acc2:#35d0ff;
  --S:#2ee6a8; --A:#a3e635; --B:#fbbf24; --C:#fb923c; --D:#f87171;
  --r:26px; --r2:18px; --r3:12px;
  --sp:cubic-bezier(.22,1.2,.36,1);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--txt);
  font-feature-settings:'tnum';
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
h1,h2,h3,h4,p{margin:0}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--line);
}

/* ── 지도 ─────────────────────────────── */
#map{position:fixed;inset:0;background:var(--bg);z-index:0}
.leaflet-container{background:#04121c;font-family:inherit}
.leaflet-control-attribution{
  background:rgba(4,18,28,.6)!important;color:var(--mut2)!important;
  font-size:9px!important;border-radius:8px 0 0 0;
}
.leaflet-control-attribution a{color:var(--mut)!important}
.leaflet-control-zoom{display:none}

/* 베이스맵 전환 (지도·위성·밝게) — 바텀시트 접힌 높이(148px) 위 */
.leaflet-bottom.leaflet-left{z-index:19}
.leaflet-bottom.leaflet-left .leaflet-control.basesw{
  margin:0 0 calc(162px + var(--safeB)) 12px;
}
.basesw{
  display:flex;gap:2px;padding:3px;
  background:rgba(6,22,33,.82);border:1px solid rgba(255,255,255,.13);
  border-radius:11px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 6px 18px rgba(0,0,0,.4);
}
.basebtn{
  -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
  padding:6px 10px;border-radius:8px;background:transparent;
  color:var(--mut);font-family:inherit;font-size:11.5px;font-weight:600;line-height:1;
  letter-spacing:-.2px;transition:background .16s,color .16s;
}
.basebtn:hover{color:var(--txt)}
.basebtn.on{background:rgba(46,230,168,.16);color:#7fe8c4}

/* 위성 모드: 배경이 밝아 핀 테두리·비네트를 강하게 */
body.map-sat .vignette{
  background:
    radial-gradient(120% 58% at 50% 0%,rgba(2,10,16,.82) 0%,transparent 52%),
    radial-gradient(140% 52% at 50% 100%,rgba(2,10,16,.86) 0%,transparent 56%);
}
body.map-sat .pin{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 3px 12px rgba(0,0,0,.6)}
body.map-sat .leaflet-container{background:#0b1a22}

.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(4,18,28,.9) 0%,transparent 55%),
    radial-gradient(140% 55% at 50% 100%,rgba(4,18,28,.92) 0%,transparent 60%);
}

/* 마커 */
.pin{
  width:38px;height:38px;display:grid;place-items:center;
  border-radius:50%;font-size:12.5px;font-weight:800;letter-spacing:-.3px;
  color:#04121c;border:2px solid rgba(255,255,255,.35);
  box-shadow:0 4px 16px rgba(0,0,0,.5);
  transition:transform .25s var(--sp);
}
.pin.sm{width:26px;height:26px;font-size:10.5px;opacity:.82;border-width:1.5px}
.pin.on{transform:scale(1.28);border-color:#fff;z-index:999}
.pin-S{background:linear-gradient(140deg,#2ee6a8,#0fb98a)}
.pin-A{background:linear-gradient(140deg,#b9f04a,#84cc16)}
.pin-B{background:linear-gradient(140deg,#fcd34d,#f59e0b)}
.pin-C{background:linear-gradient(140deg,#fdba74,#f97316);color:#2a1000}
.pin-D{background:linear-gradient(140deg,#fca5a5,#ef4444);color:#2a0808}
.pin-top::after{
  content:'';position:absolute;inset:-7px;border-radius:50%;
  border:2px solid var(--acc);animation:pulse 2.2s infinite;
}
@keyframes pulse{0%{transform:scale(.85);opacity:.9}70%{transform:scale(1.5);opacity:0}100%{opacity:0}}

/* ── 상단 ─────────────────────────────── */
.topbar{
  position:fixed;z-index:20;left:12px;right:12px;top:calc(10px + var(--safeT));
  height:54px;border-radius:20px;padding:0 8px 0 16px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 10px 34px rgba(0,0,0,.42);
}
.brand{display:flex;align-items:baseline;gap:9px;min-width:0}
.logo{
  font-size:20px;font-weight:800;letter-spacing:-.6px;
  background:linear-gradient(100deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.tagline{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{
  width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
  background:rgba(255,255,255,.06);color:var(--txt);transition:.2s var(--sp);
}
.icon-btn:active{transform:scale(.9);background:rgba(255,255,255,.12)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 날짜 스트립 */
.datestrip{
  position:fixed;z-index:19;left:0;right:0;top:calc(72px + var(--safeT));
  display:flex;gap:7px;padding:0 12px;overflow-x:auto;scrollbar-width:none;
}
.datestrip::-webkit-scrollbar{display:none}
.dchip{
  flex:0 0 auto;min-width:56px;padding:7px 12px;border-radius:15px;
  background:rgba(10,28,42,.72);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border:1px solid var(--line);text-align:center;line-height:1.25;
  transition:.22s var(--sp);
}
.dchip b{display:block;font-size:13.5px;font-weight:700}
.dchip span{display:block;font-size:9.5px;color:var(--mut)}
.dchip.on{
  background:linear-gradient(140deg,var(--acc),var(--acc2));border-color:transparent;
  color:#04121c;box-shadow:0 6px 20px rgba(46,230,168,.3);
}
.dchip.on span{color:rgba(4,18,28,.62)}
.dchip:active{transform:scale(.94)}

/* 모드 토글 */
.seg{
  position:fixed;z-index:20;left:50%;transform:translateX(-50%);
  top:calc(120px + var(--safeT));
  display:flex;padding:4px;border-radius:17px;box-shadow:0 8px 26px rgba(0,0,0,.4);
}
.seg-btn{
  position:relative;z-index:2;padding:8px 18px;border-radius:14px;
  font-size:13px;font-weight:700;color:var(--mut);
  display:flex;align-items:center;gap:5px;transition:color .25s;
}
.seg-btn span{font-size:13px}
.seg-btn.active{color:#04121c}
.seg-pill{
  position:absolute;z-index:1;top:4px;left:4px;height:calc(100% - 8px);
  border-radius:14px;background:linear-gradient(140deg,var(--acc),var(--acc2));
  transition:transform .38s var(--sp),width .38s var(--sp);
}

/* ── 원픽 카드 ────────────────────────── */
.pick{position:fixed;z-index:18;transition:opacity .3s var(--sp),transform .3s var(--sp);left:12px;right:12px;top:calc(170px + var(--safeT));animation:drop .5s var(--sp)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.pick.fade{opacity:0;transform:translateY(-10px) scale(.97);pointer-events:none}
.pick-inner{border-radius:var(--r);padding:16px;box-shadow:0 16px 44px rgba(0,0,0,.5);position:relative;overflow:hidden}
.pick-inner::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 100% at 0% 0%,rgba(46,230,168,.14),transparent 60%);
}
.pick-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.pick-badge{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:.6px;
  padding:4px 9px;border-radius:8px;
  background:linear-gradient(100deg,var(--acc),var(--acc2));color:#04121c;
}
.pick-btns{display:flex;gap:6px}
.pick-min{
  width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  background:rgba(255,255,255,.07);color:var(--mut);transition:.25s var(--sp);
}
.pick-min svg{width:16px;height:16px;transition:transform .3s var(--sp)}
.pick-min:active{transform:scale(.9)}
/* 접힌 상태 — 지도가 훤히 보이고, 카드 아무 데나 누르면 다시 펴진다 */
.pick.mini .pick-inner{padding:10px 14px;cursor:pointer}
.pick.mini .pick-verdict,.pick.mini .chips,.pick.mini .pick-cta,.pick.mini .demo-note{display:none}
.pick.mini .pick-top{margin-bottom:0}
.pick.mini .pick-main{display:none}
.pick.mini .pick-badge::after{content:' · ' attr(data-n) ' ' attr(data-s) '점'}
.pick.mini .pick-min svg{transform:rotate(180deg)}
.pick-main{display:flex;gap:14px;align-items:flex-start}
.ring{
  flex:0 0 auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--acc) calc(var(--v,0)*1%),rgba(255,255,255,.08) 0);
  position:relative;
}
.ring::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#0a1d2b}
.ring span{position:relative;z-index:1;font-size:20px;font-weight:800;letter-spacing:-1px}
.ring.sm{width:44px;height:44px}
.ring.sm::after{inset:4px;background:#0c2131}
.ring.sm span{font-size:15px}
.pick-txt{min-width:0;flex:1}
.pick-txt h2{font-size:19px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.pick-verdict{font-size:13.5px;line-height:1.5;color:#cfe3ef}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{
  font-size:11px;font-weight:600;padding:4px 9px;border-radius:9px;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:#bcd6e5;
}
.chip.hot{background:rgba(46,230,168,.14);border-color:rgba(46,230,168,.35);color:var(--acc)}
.chip.warn{background:rgba(248,113,113,.13);border-color:rgba(248,113,113,.32);color:#fca5a5}
.pick-cta{
  width:100%;margin-top:13px;padding:12px;border-radius:15px;
  background:linear-gradient(100deg,var(--acc),var(--acc2));color:#04121c;
  font-size:14px;font-weight:800;transition:.2s var(--sp);
}
.pick-cta:active{transform:scale(.97)}

/* ── 바텀시트 ────────────────────────── */
.sheet{
  position:fixed;z-index:22;left:0;right:0;bottom:0;
  height:78vh;border-radius:var(--r) var(--r) 0 0;border-bottom:0;
  --sy:calc(78vh - 148px - var(--safeB));
  transform:translateY(var(--sy));
  transition:transform .42s var(--sp);
  display:flex;flex-direction:column;
  box-shadow:0 -14px 44px rgba(0,0,0,.5);
}
.sheet.open{--sy:0px}
.sheet.drag{transition:none}
.handle{padding:9px 0 5px;display:grid;place-items:center;cursor:grab;touch-action:none;flex:0 0 auto}
.handle i{width:38px;height:4px;border-radius:4px;background:rgba(255,255,255,.22);display:block}
.sheet-head{padding:2px 18px 10px;flex:0 0 auto}
.sheet-head h3{font-size:15.5px;font-weight:800;letter-spacing:-.3px;margin-bottom:9px}
.sorts{display:flex;gap:6px}
.sort{
  font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:11px;
  background:rgba(255,255,255,.06);color:var(--mut);border:1px solid transparent;transition:.2s;
}
.sort.active{background:rgba(46,230,168,.14);color:var(--acc);border-color:rgba(46,230,168,.32)}
.list{flex:1;overflow-y:auto;padding:2px 12px 12px;-webkit-overflow-scrolling:touch}
.list::-webkit-scrollbar{width:0}
.sheet-foot{
  flex:0 0 auto;padding:8px 18px calc(12px + var(--safeB));
  font-size:10.5px;color:var(--mut2);text-align:center;border-top:1px solid var(--line);
}

/* 목록 카드 */
.row{
  display:flex;gap:12px;align-items:center;padding:12px;border-radius:var(--r2);
  background:rgba(255,255,255,.035);border:1px solid transparent;
  margin-bottom:8px;transition:.22s var(--sp);
}
.row:active{transform:scale(.985);background:rgba(255,255,255,.07)}
.row.on{border-color:rgba(46,230,168,.4);background:rgba(46,230,168,.07)}
.row-rank{
  flex:0 0 auto;width:20px;text-align:center;font-size:12px;font-weight:800;color:var(--mut2)
}
.row-body{flex:1;min-width:0}
.row-top{display:flex;align-items:baseline;gap:6px}
.row-name{font-size:15px;font-weight:800;letter-spacing:-.3px}
.row-reg{font-size:10.5px;color:var(--mut2);white-space:nowrap}
.row-verdict{
  font-size:12px;color:#b8d2e2;line-height:1.45;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.row-chips{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.grade{
  flex:0 0 auto;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  font-size:16px;font-weight:800;color:#04121c;line-height:1;
}
.g-S{background:linear-gradient(140deg,#2ee6a8,#0fb98a)}
.g-A{background:linear-gradient(140deg,#b9f04a,#84cc16)}
.g-B{background:linear-gradient(140deg,#fcd34d,#f59e0b)}
.g-C{background:linear-gradient(140deg,#fdba74,#f97316)}
.g-D{background:linear-gradient(140deg,#fca5a5,#ef4444)}
.grade small{display:block;font-size:8.5px;font-weight:700;opacity:.72;margin-top:1px}

/* 스켈레톤 */
.sk{height:70px;border-radius:var(--r2);margin-bottom:8px;
  background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.10) 50%,rgba(255,255,255,.04) 70%);
  background-size:220% 100%;animation:shim 1.5s infinite}
@keyframes shim{to{background-position:-120% 0}}

/* ── 상세 ─────────────────────────────── */
.detail{position:fixed;inset:0;z-index:40}
.detail-scrim{position:absolute;inset:0;background:rgba(2,10,16,.68);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .3s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.detail-panel{
  position:absolute;left:0;right:0;bottom:0;max-height:94vh;
  border-radius:var(--r) var(--r) 0 0;border-bottom:0;overflow:hidden;
  display:flex;flex-direction:column;animation:up .42s var(--sp);
  background:var(--glass2);
}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.detail-panel.drag{transition:none}
#detailBody{overflow-y:auto;padding:4px 18px calc(24px + var(--safeB));flex:1}
#detailBody::-webkit-scrollbar{width:0}

.dt-head{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.dt-head h2{font-size:23px;font-weight:800;letter-spacing:-.7px}
.dt-head p{font-size:11.5px;color:var(--mut);margin-top:2px}
.dt-verdict{
  font-size:15px;line-height:1.6;font-weight:600;padding:15px;border-radius:var(--r2);
  background:linear-gradient(135deg,rgba(46,230,168,.14),rgba(53,208,255,.07));
  border:1px solid rgba(46,230,168,.26);margin-bottom:14px;
}
.dt-verdict.bad{background:linear-gradient(135deg,rgba(248,113,113,.14),rgba(251,146,60,.07));border-color:rgba(248,113,113,.28)}
.sec{margin:18px 0 0}
.sec-t{font-size:11.5px;font-weight:800;color:var(--mut);letter-spacing:.4px;margin-bottom:9px;display:flex;align-items:center;gap:6px}
.sec-t::after{content:'';flex:1;height:1px;background:var(--line)}

/* 조석 그래프 */
.tidebox{border-radius:var(--r2);background:rgba(255,255,255,.04);border:1px solid var(--line);padding:12px 10px 6px}
.tidebox svg{width:100%;display:block;overflow:visible}
.tide-legend{display:flex;justify-content:space-between;font-size:10px;color:var(--mut2);padding:4px 2px 0}

/* 지표 바 */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-lb{flex:0 0 46px;font-size:11.5px;color:var(--mut);font-weight:600}
.bar-tr{flex:1;height:7px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden}
.bar-fl{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc2),var(--acc));
  width:0;transition:width .8s var(--sp)}
.bar-vl{flex:0 0 40px;text-align:right;font-size:11px;color:var(--mut2);font-variant-numeric:tabular-nums}

/* 정보 그리드 */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{border-radius:var(--r3);background:rgba(255,255,255,.045);border:1px solid var(--line);padding:10px 9px;text-align:center}
.cell b{display:block;font-size:15px;font-weight:800;letter-spacing:-.3px}
.cell span{display:block;font-size:9.5px;color:var(--mut2);margin-top:2px}

/* 주간 */
.week{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.week::-webkit-scrollbar{display:none}
.wd{
  flex:0 0 auto;width:62px;border-radius:var(--r3);padding:9px 5px;text-align:center;
  background:rgba(255,255,255,.045);border:1px solid var(--line);
}
.wd em{display:block;font-size:9.5px;color:var(--mut2);font-style:normal}
.wd b{display:block;font-size:12.5px;font-weight:700;margin:2px 0 5px}
.wd .wv{height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:4px}
.wd .wv i{display:block;height:100%;border-radius:4px}
.wd small{display:block;font-size:9px;color:var(--mut)}
.wd.today{border-color:rgba(46,230,168,.4);background:rgba(46,230,168,.07)}

.lines{display:flex;flex-direction:column;gap:7px}
.line{display:flex;gap:8px;font-size:12.5px;line-height:1.5;color:#c3dae8}
.line i{flex:0 0 auto;font-style:normal;font-size:12px}
.line.w{color:#fcb3b3}

.dt-actions{display:flex;gap:8px;margin-top:20px}
.act{
  flex:1;padding:13px;border-radius:15px;font-size:13.5px;font-weight:800;text-align:center;
  background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--txt);
  transition:.2s var(--sp);text-decoration:none;display:block;white-space:nowrap;
}
.act.primary{background:linear-gradient(100deg,var(--acc),var(--acc2));color:#04121c;border-color:transparent}
.act:active{transform:scale(.97)}

/* ── 토스트 / 부팅 ─────────────────────── */
.toast{
  position:fixed;z-index:60;left:50%;bottom:calc(34px + var(--safeB));transform:translateX(-50%);
  padding:11px 18px;border-radius:14px;background:rgba(10,28,42,.94);
  border:1px solid var(--line2);font-size:12.5px;font-weight:600;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:0 10px 30px rgba(0,0,0,.5);animation:toastIn .35s var(--sp);
  max-width:86vw;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.boot{
  position:fixed;inset:0;z-index:80;display:grid;place-items:center;text-align:center;
  background:radial-gradient(80% 60% at 50% 40%,#0a2233,#04121c);
  transition:opacity .5s,visibility .5s;
}
.boot.hide{opacity:0;visibility:hidden}
.boot p{font-size:13.5px;color:var(--mut);line-height:1.7;margin-top:22px}
.boot b{color:var(--acc);font-weight:800}
.boot-wave{display:flex;gap:7px;align-items:flex-end;height:44px;justify-content:center}
.boot-wave i{
  width:7px;border-radius:5px;background:linear-gradient(180deg,var(--acc2),var(--acc));
  animation:wv 1.1s ease-in-out infinite;
}
.boot-wave i:nth-child(1){height:20px;animation-delay:0s}
.boot-wave i:nth-child(2){height:38px;animation-delay:.15s}
.boot-wave i:nth-child(3){height:26px;animation-delay:.3s}
@keyframes wv{0%,100%{transform:scaleY(.42)}50%{transform:scaleY(1)}}

@media (min-width:720px){
  .topbar,.pick{left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 24px));right:auto}
  .pick{animation:none}
  .datestrip{justify-content:center}
