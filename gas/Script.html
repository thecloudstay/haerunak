<script>
(function(){
'use strict';

/* ══════════════ 상태 ══════════════ */
var S = {
  ds: BOOT.today, mode: 'haeru', rows: [], sort: 'score', filter: 'all', want: null,
  fmode: 'haeru', sel: null, me: null, markers: {}, loading: false, cur: null
};
var $ = function(id){ return document.getElementById(id); };
var el = function(t, c, h){ var e = document.createElement(t); if(c) e.className = c; if(h!=null) e.innerHTML = h; return e; };
var WD = ['일','월','화','수','목','금','토'];
var MODE_NAME = { haeru:'해루질', fish:'낚시' };

function toast(msg, ms){
  var t = $('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(t._h); t._h = setTimeout(function(){ t.hidden = true; }, ms||2400);
}
function hm(min){
  if (min === null || min === undefined) return '--:--';
  var m = ((min % 1440) + 1440) % 1440;
  return ('0'+Math.floor(m/60)).slice(-2) + ':' + ('0'+(m%60)).slice(-2);
}
function hmH(h){ return hm(Math.round(h*60)); }
function dstr(d){
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function parseDs(ds){ var a = ds.split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function dist(a, b, c, d){
  var R = 6371, r = Math.PI/180;
  var x = (c-a)*r, y = (d-b)*r;
  var h = Math.sin(x/2)*Math.sin(x/2) + Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);
  return 2*R*Math.asin(Math.sqrt(h));
}

/* ══════════════ 지도 ══════════════ */
var map = L.map('map', {
  center: [36.35, 127.3], zoom: 7, zoomControl: false,
  attributionControl: true, minZoom: 6, maxZoom: 19
});
/* ── 베이스맵 3종: 지도 / 위성 / 밝게 ── */
var BASES = {
  dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    {attribution:'지도 &copy; OpenStreetMap · CARTO | 물때 바다타임 · 기상 Open-Meteo', subdomains:'abcd', maxZoom:19, className:'basetiles'}),
  sat: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {attribution:'위성 Esri · Maxar | 물때 바다타임 · 기상 Open-Meteo', maxZoom:19, className:'basetiles'}),
  lite: L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {attribution:'지도 &copy; OpenStreetMap · CARTO | 물때 바다타임 · 기상 Open-Meteo', subdomains:'abcd', maxZoom:19, className:'basetiles'})
};
var SATLBL = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19, opacity:.92, className:'basetiles'});
var curBase = 'dark';
BASES.dark.addTo(map);
function setBase_(k){
  if (!BASES[k] || k === curBase) return;
  if (map.hasLayer(BASES[curBase])) map.removeLayer(BASES[curBase]);
  if (map.hasLayer(SATLBL)) map.removeLayer(SATLBL);
  BASES[k].addTo(map);
  if (k === 'sat') SATLBL.addTo(map);
  curBase = k;
  document.body.className = document.body.className.replace(/\s*map-sat\b/,'') + (k === 'sat' ? ' map-sat' : '');
  var bs = document.querySelectorAll('.basebtn');
  for (var i=0;i<bs.length;i++) bs[i].className = 'basebtn' + (bs[i].getAttribute('data-b') === k ? ' on' : '');
  try { localStorage.setItem('hrn_base', k); } catch(e){}
}
var baseCtl = L.control({position:'bottomleft'});
baseCtl.onAdd = function(){
  var d = L.DomUtil.create('div','basesw');
  d.innerHTML = '<button class="basebtn on" data-b="dark" type="button">지도</button>'
              + '<button class="basebtn" data-b="sat" type="button">위성</button>'
              + '<button class="basebtn" data-b="lite" type="button">밝게</button>';
  L.DomEvent.disableClickPropagation(d);
  L.DomEvent.on(d, 'click', function(e){
    var t = e.target;
    while (t && t !== d && !(t.className && String(t.className).indexOf('basebtn') >= 0)) t = t.parentNode;
    if (t && t !== d) setBase_(t.getAttribute('data-b'));
  });
  return d;
};
baseCtl.addTo(map);
try { var sv = localStorage.getItem('hrn_base'); if (sv && sv !== 'dark') setBase_(sv); } catch(e){}

function pinIcon(r, isTop, small){
  return L.divIcon({
    className: '',
    html: '<div class="pin pin-'+r.grade+(small?' sm':'')+(isTop?' pin-top':'')+'" style="position:relative">'+r.score+'</div>',
    iconSize: small ? [26,26] : [38,38],
    iconAnchor: small ? [13,13] : [19,19]
  });
}
function drawPins(){
  Object.keys(S.markers).forEach(function(k){ map.removeLayer(S.markers[k]); });
  S.markers = {};
  var z = map.getZoom();
  var placed = [];                       // 큰 핀이 이미 차지한 화면 좌표
  var MIN = z >= 11 ? 0 : (z >= 9 ? 30 : 38);
  S.rows.forEach(function(r, idx){
    var pt = map.latLngToLayerPoint([r.la, r.lo]);
    var small = false;
    for (var k=0;k<placed.length;k++){
      var dx = placed[k].x - pt.x, dy = placed[k].y - pt.y;
      if (dx*dx + dy*dy < MIN*MIN){ small = true; break; }
    }
    if (!small) placed.push(pt);
    var m = L.marker([r.la, r.lo], { icon: pinIcon(r, idx === 0, small), zIndexOffset: 1000 - idx });
    m.on('click', function(){ openDetail(r.i); });
    m.addTo(map);
    S.markers[r.i] = m;
  });
}
map.on('zoomend', function(){ if (S.rows.length) drawPins(); });

/* ══════════════ 데이터 ══════════════ */
function load(){
  if (S.loading) return;
  S.loading = true;
  $('btnReload').classList.add('spin');
  renderSkeleton();
  google.script.run
    .withSuccessHandler(function(res){
      S.loading = false;
      $('btnReload').classList.remove('spin');
      $('boot').classList.add('hide');
      if (!res || !res.rows){ toast('데이터를 불러오지 못했습니다'); return; }
      if (res.empty || !res.rows.length){
        S.rows = []; render();
        toast(res.msg || '조건에 맞는 자리가 없습니다', 3200);
        return;
      }
      S.rows = res.rows;
      S.shown = res.shown; S.total = res.total;
      S.gen = res.generated;
      render();
    })
    .withFailureHandler(function(e){
      S.loading = false;
      $('btnReload').classList.remove('spin');
      $('boot').classList.add('hide');
      toast('오류: ' + (e && e.message ? e.message : '불러오기 실패'));
    })
    .apiBoard(S.ds, S.mode, {
      want: S.want,
      isl: S.filter === 'isl' || S.filter === 'car' ? true : (S.filter === 'land' ? false : null),
      car: S.filter === 'car'
    });
}

/* ══════════════ 렌더 ══════════════ */
function sorted(){
  var a = S.rows.slice();
  if (S.sort === 'near' && S.me){
    a.forEach(function(r){ r._d = dist(S.me[0], S.me[1], r.la, r.lo); });
    a.sort(function(x,y){ return x._d - y._d; });
  } else if (S.sort === 'time'){
    a.sort(function(x,y){
      var xa = x.win ? x.win[0] : 99999, ya = y.win ? y.win[0] : 99999;
      return xa - ya;
    });
  } else {
    a.sort(function(x,y){ return y.raw - x.raw; });
  }
  var f = favs();
  if (f.length){
    a.sort(function(x,y){ return (f.indexOf(y.i) >= 0 ? 1 : 0) - (f.indexOf(x.i) >= 0 ? 1 : 0); });
  }
  return a;
}

function syncPick(){
  var open = $('sheet').classList.contains('open');
  $('pick').classList.toggle('fade', open);
  if (!pickClosed()) $('pickRestore').hidden = true;
  else $('pickRestore').style.opacity = open ? '0' : '1';
}
function render(){
  drawPins();
  renderPick();
  renderList();
  $('tagline').textContent = MODE_NAME[S.mode] + ' · ' + S.rows.length + '곳'
    + (S.total && S.rows.length < S.total ? ' / ' + S.total : '') + ' 분석';
  $('wantbar').hidden = !S.want;
  $('pick').classList.toggle('hasWant', !!S.want);
  if (S.want) $('wantbarT').textContent = S.want + ' 기준으로 순위를 냈습니다';
  syncPick();
  $('sheetFoot').innerHTML = (S.gen || '') + ' 기준 · 물때 바다타임 · 기상 Open-Meteo · 점수는 참고용이며 안전 판단은 직접 하세요'
    + '<br>제휴·광고 문의 <a href="mailto:thecloudstay@gmail.com" style="color:var(--acc);text-decoration:none">thecloudstay@gmail.com</a>'
    + ' · <a href="#" id="redeemLink" style="color:var(--mut);text-decoration:underline">' + (isPremium() ? '프리미엄 이용 중' : '이용권 등록') + '</a>'
    + ' · <a href="#" id="partnerLink" style="color:var(--mut);text-decoration:underline">파트너 모집</a>';
  var rl = document.getElementById('redeemLink');
  if (rl) rl.onclick = function(e){ e.preventDefault(); if (!isPremium()) openRedeem(); };
  var pl = document.getElementById('partnerLink');
  if (pl) pl.onclick = function(e){ e.preventDefault(); openPartner(); };
}

function renderPick(){
  var top = S.rows.slice().sort(function(a,b){ return b.raw - a.raw; })[0];
  if (!top){ $('pick').hidden = true; $('pickRestore').hidden = true; return; }
  S.cur = top;
  if (pickClosed()){ $('pick').hidden = true; $('pickRestore').hidden = false; $('pickRestore').classList.toggle('hasWant', !!S.want); }
  else { $('pick').hidden = false; $('pickRestore').hidden = true; }
  $('pickScore').textContent = top.score;
  $('pickRing').style.setProperty('--v', top.score);
  $('pickRing').style.background = 'conic-gradient(var(--'+top.grade+') calc('+top.score+'*1%),rgba(255,255,255,.08) 0)';
  $('pickName').textContent = top.n;
  $('pickVerdict').textContent = top.verdict;
  var c = $('pickChips'); c.innerHTML = '';
  c.appendChild(el('span','chip', top.r));
  c.appendChild(el('span','chip hot', top.mul + ' · 조차 ' + top.range + 'm'));
  if (top.win) c.appendChild(el('span','chip hot', hm(top.win[0]) + '~' + hm(top.win[1])));
  if (S.mode === 'haeru' && top.vis != null)
    c.appendChild(el('span','chip', '시야 ' + (top.vis >= 1 ? top.vis.toFixed(1) + 'm' : Math.round(top.vis*100) + 'cm')));
  if (S.mode === 'fish' && top.cur != null)
    c.appendChild(el('span','chip', '조류 ' + top.cur.toFixed(1) + '노트'));
  if (top.isl && top.fr) c.appendChild(el('span','chip', '배 ' + top.fr[0] + ' ' + top.fr[1] + '분'));
  (top.targets||[]).slice(0,3).forEach(function(t){ c.appendChild(el('span','chip', t)); });
  (top.banned||[]).slice(0,1).forEach(function(t){ c.appendChild(el('span','chip warn', t + ' 금어기')); });
  if (top.warn && top.warn.length) c.appendChild(el('span','chip warn', top.warn[0]));
  $('pickCta').onclick = function(){ openDetail(top.i); };
  var bd = $('pick').querySelector('.pick-badge');
  bd.dataset.n = top.n; bd.dataset.s = top.score;
  if (!S._moved){ S._moved = true; map.setView([top.la - 0.55, top.lo], 8, { animate:true }); }
}

function renderSkeleton(){
  var l = $('list'); l.innerHTML = '';
  for (var k=0;k<6;k++) l.appendChild(el('div','sk'));
}

function renderList(){
  var l = $('list'); l.innerHTML = '';
  var arr = sorted();
  $('sheetTitle').textContent = MODE_NAME[S.mode] + ' ' +
    (S.sort==='near' ? '가까운 순' : S.sort==='time' ? '시간 빠른 순' : '추천 순위');
  arr.forEach(function(r, i){
    var row = el('div','row' + (S.sel===r.i?' on':''));
    row.appendChild(el('div','row-rank', String(i+1)));

    var body = el('div','row-body');
    var top = el('div','row-top');
    if (favs().indexOf(r.i) >= 0) top.appendChild(el('span','row-fav','★'));
    top.appendChild(el('span','row-name', r.n));
    if (r.isl) top.appendChild(el('span','row-isl', r.fr ? '배 '+r.fr[1]+'분' : '섬'));
    top.appendChild(el('span','row-reg', r.r + (r._d!=null ? ' · '+Math.round(r._d)+'km' : '')));
    body.appendChild(top);
    body.appendChild(el('div','row-verdict', r.verdict));

    var ch = el('div','row-chips');
    if (r.win) ch.appendChild(el('span','chip hot', hm(r.win[0])+'~'+hm(r.win[1])));
    ch.appendChild(el('span','chip', r.mul));
    if (S.mode === 'haeru' && r.vis != null)
      ch.appendChild(el('span','chip', '시야 ' + (r.vis >= 1 ? r.vis.toFixed(1)+'m' : Math.round(r.vis*100)+'cm')));
    (r.targets||[]).slice(0,2).forEach(function(t){ ch.appendChild(el('span','chip', t)); });
    (r.banned||[]).slice(0,1).forEach(function(t){ ch.appendChild(el('span','chip warn', t+' 금어기')); });
    if (r.warn && r.warn.length) ch.appendChild(el('span','chip warn', r.warn[0].length>14 ? r.warn[0].slice(0,13)+'…' : r.warn[0]));
    body.appendChild(ch);
    row.appendChild(body);

    row.appendChild(el('div','grade g-'+r.grade, r.grade + '<small>'+r.score+'</small>'));
    row.onclick = function(){ openDetail(r.i); };
    l.appendChild(row);
  });
  if (!arr.length) l.appendChild(el('div','row-verdict',
    (S.want ? S.want + '을(를) 노릴 자리가 조건에 없습니다. 필터를 넓혀보세요.' : '조건에 맞는 자리가 없습니다.')));
}

/* ══════════════ 상세 ══════════════ */
function openDetail(id){
  refEvent('open');
  S.sel = id;
  var d = $('detail'); d.hidden = false;
  $('detailBody').innerHTML = '<div class="sk" style="height:120px"></div><div class="sk" style="height:180px"></div><div class="sk" style="height:120px"></div>';
  google.script.run
    .withSuccessHandler(renderDetail)
    .withFailureHandler(function(){ $('detailBody').innerHTML = '<p class="row-verdict" style="padding:30px 0;text-align:center">정보를 불러오지 못했습니다.</p>'; })
    .apiPoint(id, S.ds, S.want, isPremium() ? 15 : 7);
  var m = S.markers[id];
  if (m){ map.panTo([m.getLatLng().lat - 0.35, m.getLatLng().lng], { animate:true }); }
}
function closeDetail(){
  var p = $('detailPanel');
  p.style.transition = 'transform .3s var(--sp)';
  p.style.transform = 'translateY(100%)';
  setTimeout(function(){ $('detail').hidden = true; p.style.transform = ''; p.style.transition = ''; }, 280);
}
$('detailScrim').onclick = closeDetail;

function renderDetail(d){
  if (!d || d.error){ $('detailBody').innerHTML = '<p style="padding:30px 0;text-align:center;color:#8ba6b8">'+((d&&d.error)||'오류')+'</p>'; return; }
  var m = S.mode === 'fish' ? d.fish : d.haeru;
  var o = S.mode === 'fish' ? d.haeru : d.fish;
  var meta = d.meta, w = meta.wx || {};
  var b = $('detailBody'); b.innerHTML = '';

  /* 헤더 */
  var head = el('div','dt-head');
  var ring = el('div','ring', '<span>'+m.score+'</span>');
  ring.style.background = 'conic-gradient(var(--'+m.grade+') calc('+m.score+'*1%),rgba(255,255,255,.08) 0)';
  head.appendChild(ring);
  head.appendChild(el('div','', '<h2>'+d.point.n+'</h2><p>'+d.point.r+' · '+d.point.floor+' · '+(d.point.tag||'')+'</p>'));
  var fav = el('button','fav-btn' + (favs().indexOf(d.point.i) >= 0 ? ' on' : ''), '★');
  fav.onclick = function(){
    var on = toggleFav(d.point.i);
    fav.classList.toggle('on', on);
    toast(on ? '즐겨찾기에 담았습니다 — 목록 맨 위에 고정됩니다' : '즐겨찾기 해제');
    renderList();
  };
  head.appendChild(fav);
  b.appendChild(head);

  /* 결론 */
  b.appendChild(el('div','dt-verdict' + (m.score < 46 ? ' bad' : ''), m.verdict));

  /* 세부 포인트 (국민포인트) */
  {
    var sp0 = el('div','sec');
    sp0.appendChild(el('div','sec-t','어디로 들어가나 — 세부 포인트'));
    (d.spots || []).forEach(function(x, i){
      var card = el('div','spot' + (i === 0 ? ' best' : ''));
      card.innerHTML = '<div class="spot-h">' + (i === 0 ? '<span class="spot-star">★ 추천 진입</span>' : '') + '<b>' + x.n + '</b></div>'
        + '<div class="spot-t">' + (x.t||[]).map(function(y){ return '<span class="chip">' + y + '</span>'; }).join('') + '</div>'
        + '<p class="spot-d">' + x.d + '</p>'
        + (x.w ? '<p class="spot-w">⚠ ' + x.w + '</p>' : '');
      sp0.appendChild(card);
    });
    if (!(d.spots || []).length)
      sp0.appendChild(el('div','gauge-l','아직 등록된 세부 포인트가 없습니다. 아시는 자리가 있으면 제보해 주세요 — 검토 후 모두에게 공개됩니다.'));
    else
      sp0.appendChild(el('div','gauge-l','어장 경계·규제는 수시로 바뀝니다. 현장 팻말과 지역 고시가 항상 우선입니다.'));
    var sgBtn = el('button','act','이 자리 세부 포인트 제보하기');
    sgBtn.style.marginTop = '8px';
    sgBtn.onclick = function(){ openSuggestForm(sp0, d); };
    sp0.appendChild(sgBtn);
    b.appendChild(sp0);
  }

  /* 조석 그래프 */
  var s1 = el('div','sec');
  s1.appendChild(el('div','sec-t', S.ds.slice(5).replace('-','월 ')+'일 물때 · '+meta.mul+' · 조차 '+meta.range+'m'
    + ' <span style="font-weight:600;color:var(--mut2)">('+(meta.src==='badatime'?'바다타임':meta.src==='khoa'?'해양조사원':'자체 추정')+')</span>'));
  var tb = el('div','tidebox');
  tb.appendChild(tideSVG(meta, m.window));
  var lg = el('div','tide-legend');
  lg.innerHTML = '<span>00시</span><span>06시</span><span>12시</span><span>18시</span><span>24시</span>';
  tb.appendChild(lg);
  s1.appendChild(tb);
  b.appendChild(s1);

  /* 만조·간조 목록 */
  var s2 = el('div','sec');
  s2.appendChild(el('div','sec-t','만조 · 간조'));
  var g = el('div','grid');
  (meta.events||[]).slice(0,6).forEach(function(e){
    g.appendChild(el('div','cell', '<b style="color:'+(e.k==='H'?'#35d0ff':'#2ee6a8')+'">'+hmH(e.t)+'</b><span>'+(e.k==='H'?'만조':'간조')+' '+e.lv+'cm</span>'));
  });
  s2.appendChild(g);
  b.appendChild(s2);

  /* 어종 지정 결과 */
  if (d.want && d.want.has){
    var wb = el('div','sec');
    wb.appendChild(el('div','sec-t', S.want + ' 기준'));
    wb.appendChild(el('div','dt-verdict' + (d.want.ban && d.want.ban.banned ? ' bad' : ''),
      d.want.reason + (d.want.thermal != null ? ' · 수온 적합도 ' + d.want.thermal + '%' : '')));
    b.appendChild(wb);
  }

  /* 금어기 경고 */
  var bt = (m.bannedTargets || []);
  if (bt.length){
    var bw = el('div','sec');
    bw.appendChild(el('div','sec-t','지금 잡으면 안 되는 것'));
    bt.forEach(function(t){
      var bn = t.ban || {};
      var box = el('div','banbox');
      box.innerHTML = '<h4>⛔ ' + t.n + ' 금어기</h4><p>'
        + (bn.from ? bn.from + ' ~ ' + bn.to + ' (' + bn.scope + ') 포획·채취가 금지됩니다.' : '포획이 제한됩니다.')
        + (bn.size ? ' 기간이 아니어도 ' + bn.size + (bn.unit ? bn.unit : '') + ' 미만은 잡을 수 없습니다.' : '')
        + (bn.note ? ' ' + bn.note : '') + '</p>';
      bw.appendChild(box);
    });
    var mt = meta.banMeta || {};
    bw.appendChild(el('div','banbox', '<p class="src">근거: ' + (mt.basis||'') + ' (' + (mt.asOf||'') + ' 기준)<br>'
      + (mt.warn||'') + '</p>'));
    b.appendChild(bw);
  }

  /* 수중 시야 */
  if (S.mode === 'haeru'){
    var vs = el('div','sec');
    vs.appendChild(el('div','sec-t','수중 시야 추정'));
    var vv = meta.vis, vpct = Math.max(4, Math.min(100, Math.round(Math.log(1+vv)/Math.log(1+8)*100)));
    var vcol = vv >= 2.5 ? '#2ee6a8' : vv >= 1.2 ? '#a3e635' : vv >= 0.5 ? '#fbbf24' : '#f87171';
    var g = el('div','gauge');

  /* 반대 모드 */

/* 낚싯배 예약 문의 양식 */
function openBookForm(box, d, partner){
  var old = box.querySelector('.catch-form');
  if (old){ old.remove(); return; }
  var f = el('div','catch-form');
  f.innerHTML =
    '<div class="gauge-l" style="padding:0 2px 4px"><b style="color:var(--txt)">' + partner.n + '</b> 예약 문의 — 출조일 ' + S.ds + '</div>'
    + '<div class="cf-row"><span>인원</span><input id="bkPax" maxlength="4" inputmode="numeric" placeholder="2"></div>'
    + '<div class="cf-row"><span>연락처</span><input id="bkTel" maxlength="16" inputmode="tel" placeholder="010-0000-0000"></div>'
    + '<div class="cf-row"><span>요청</span><input id="bkMemo" maxlength="80" placeholder="대상어·시간대 등 (선택)"></div>'
    + '<button class="act primary" id="bkSave">문의 보내기</button>'
    + '<div class="gauge-l">확인 후 업체 또는 해루낚에서 연락드립니다. 기상으로 출항이 취소될 수 있습니다.</div>';
  box.appendChild(f);
  f.querySelector('#bkSave').onclick = function(){
    var tel = f.querySelector('#bkTel').value.trim();
    if (!tel){ toast('연락처를 적어주세요'); return; }
    f.querySelector('#bkSave').textContent = '보내는 중…';
    google.script.run.withSuccessHandler(function(r){
      toast(r && r.ok ? '문의가 접수됐습니다. 곧 연락드리겠습니다' : (r && r.msg) || '전송 실패');
      f.remove();
    }).withFailureHandler(function(){ toast('보내지 못했습니다. ' + (partner.tel ? '전화(' + partner.tel + ')로 문의해주세요' : '')); f.querySelector('#bkSave').textContent = '문의 보내기'; })
      .apiBookRequest({ ds: S.ds, point: d.point.n, partner: partner.n, pid: partner.id,
        pax: f.querySelector('#bkPax').value, tel: tel,
        memo: f.querySelector('#bkMemo').value, ref: refCode() || '', uid: myUid() });
  };
}

    + '<div class="detail-panel glass" style="max-height:none;padding-bottom:calc(20px + var(--safeB))">'

    + '<div class="dt-actions"><button class="act primary" id="rdGo">등록</button><button class="act" id="rdX">닫기</button></div>'

      if (r && r.ok){

        toast('프리미엄이 켜졌습니다. 감사합니다!');
        wrap.remove(); load();
      } else { toast((r && r.msg) || '코드 확인 실패'); wrap.querySelector('#rdGo').textContent = '등록'; }

      .apiRedeem(code, myUid());
  };
}

/* 조석 곡선 SVG */
function tideSVG(meta, win){
  var W = 320, H = 108, PT = 10, PB = 20;
  var ev = (meta.events||[]).slice().sort(function(a,b){ return a.t-b.t; });
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if (!ev.length) return svg;

  // 앞뒤로 가상 극점을 붙여 0~24시를 모두 덮는다
  var pts = ev.slice();
  var P = 6.2103;
  while (pts[0].t > 0)      pts.unshift({ k: pts[0].k==='H'?'L':'H', t: pts[0].t - P, lv: oppLv(pts, pts[0]) });
  while (pts[pts.length-1].t < 24){
    var last = pts[pts.length-1];
    pts.push({ k: last.k==='H'?'L':'H', t: last.t + P, lv: oppLv(pts, last) });
  }
  function oppLv(list, ref){
    for (var k=0;k<list.length;k++){ if (list[k].k !== ref.k) return list[k].lv; }
    return ref.lv;
  }
  var lvs = pts.map(function(p){ return p.lv; });
  var mn = Math.min.apply(null,lvs), mx = Math.max.apply(null,lvs);
  if (mx - mn < 10) mx = mn + 10;
  var X = function(t){ return t/24*W; };
  var Y = function(l){ return PT + (1 - (l-mn)/(mx-mn)) * (H-PT-PB); };

  function level(t){
    for (var k=0;k<pts.length-1;k++){
      if (t >= pts[k].t && t <= pts[k+1].t){
        var a = pts[k], b2 = pts[k+1];
        var f = (t - a.t)/(b2.t - a.t);
        return (a.lv + b2.lv)/2 + (a.lv - b2.lv)/2 * Math.cos(Math.PI*f);
      }
    }
    return pts[pts.length-1].lv;
  }
  var dpath = '', apath = '';
  for (var t=0; t<=24; t+=0.25){
    var x = X(t).toFixed(1), y = Y(level(t)).toFixed(1);
    dpath += (t===0 ? 'M' : 'L') + x + ' ' + y;
  }
  apath = dpath + 'L'+W+' '+(H-PB)+'L0 '+(H-PB)+'Z';

  // 그라데이션
  var defs = document.createElementNS(ns,'defs');
  defs.innerHTML = '<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#35d0ff" stop-opacity=".38"/>'+
    '<stop offset="100%" stop-color="#35d0ff" stop-opacity="0"/></linearGradient>';
  svg.appendChild(defs);

  // 야간 음영
  function shade(a, b2){
    if (b2 <= a) return;
    var r = document.createElementNS(ns,'rect');
    r.setAttribute('x', X(a)); r.setAttribute('y', 0);
    r.setAttribute('width', X(b2)-X(a)); r.setAttribute('height', H-PB);
    r.setAttribute('fill','rgba(2,10,18,.45)');
    svg.appendChild(r);
  }
  if (meta.sunrise != null) shade(0, meta.sunrise);
  if (meta.sunset != null)  shade(meta.sunset, 24);

  // 추천 시간창
  function drawWin(a2, b3){
    if (b3 > a2){
      var hi = document.createElementNS(ns,'rect');
      hi.setAttribute('x', X(a2)); hi.setAttribute('y', 0);
      hi.setAttribute('width', X(b3)-X(a2)); hi.setAttribute('height', H-PB);
      hi.setAttribute('fill','rgba(46,230,168,.16)');
      hi.setAttribute('stroke','rgba(46,230,168,.5)'); hi.setAttribute('stroke-width','1');
      svg.appendChild(hi);
      var lb = document.createElementNS(ns,'text');
      lb.setAttribute('x', (X(a2)+X(b3))/2); lb.setAttribute('y', H-PB-5);
      lb.setAttribute('text-anchor','middle'); lb.setAttribute('font-size','9');
      lb.setAttribute('fill','#2ee6a8'); lb.setAttribute('font-weight','800');
      lb.textContent = '추천';
      svg.appendChild(lb);
    }
  }
  if (win){
    var wa = win[0], wb = win[1];
    drawWin(Math.max(0, wa), Math.min(24, wb));
    if (wb > 24) drawWin(0, wb - 24);        // 자정을 넘긴 부분
    if (wa < 0)  drawWin(24 + wa, 24);
  }

  var area = document.createElementNS(ns,'path');
  area.setAttribute('d', apath); area.setAttribute('fill','url(#tg)');
  svg.appendChild(area);
  var line = document.createElementNS(ns,'path');
  line.setAttribute('d', dpath); line.setAttribute('fill','none');
  line.setAttribute('stroke','#35d0ff'); line.setAttribute('stroke-width','2'); line.setAttribute('stroke-linecap','round');
  svg.appendChild(line);

  // 극점 표시
  ev.forEach(function(e){
    var c = document.createElementNS(ns,'circle');
    c.setAttribute('cx', X(e.t)); c.setAttribute('cy', Y(e.lv)); c.setAttribute('r', 3.2);
    c.setAttribute('fill', e.k==='H' ? '#35d0ff' : '#2ee6a8');
    svg.appendChild(c);
    var tx = document.createElementNS(ns,'text');
    tx.setAttribute('x', Math.min(W-16, Math.max(16, X(e.t))));
    tx.setAttribute('y', Y(e.lv) + (e.k==='H' ? -8 : 14));
    tx.setAttribute('text-anchor','middle'); tx.setAttribute('font-size','9');
    tx.setAttribute('fill', e.k==='H' ? '#8fd8f5' : '#8fe6c8'); tx.setAttribute('font-weight','700');
    tx.textContent = hmH(e.t);
    svg.appendChild(tx);
  });

  // 현재 시각
  if (S.ds === BOOT.today){
    var now = new Date(); var nt = now.getHours() + now.getMinutes()/60;
    var nl = document.createElementNS(ns,'line');
    nl.setAttribute('x1', X(nt)); nl.setAttribute('x2', X(nt));
    nl.setAttribute('y1', 0); nl.setAttribute('y2', H-PB);
    nl.setAttribute('stroke','#fff'); nl.setAttribute('stroke-width','1');
    nl.setAttribute('stroke-dasharray','3 3'); nl.setAttribute('opacity','.55');
    svg.appendChild(nl);
  }
  // 기준선
  var base = document.createElementNS(ns,'line');
  base.setAttribute('x1',0); base.setAttribute('x2',W);
  base.setAttribute('y1',H-PB); base.setAttribute('y2',H-PB);
  base.setAttribute('stroke','rgba(255,255,255,.12)'); base.setAttribute('stroke-width','1');
  svg.appendChild(base);
  return svg;
}

/* ══════════════ 바텀시트 드래그 ══════════════ */
(function(){
  var sheet = $('sheet'), h = $('handle');
  var closedY = null, startY = 0, cur = 0, dragging = false;
  function closed(){
    return sheet.classList.contains('open') ? 0 : sheet.offsetHeight - 148 - (window.__sb||0);
  }
  function setY(y){ sheet.style.setProperty('--sy', y + 'px'); }
  function down(e){
    dragging = true; sheet.classList.add('drag');
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    cur = sheet.classList.contains('open') ? 0 : sheet.offsetHeight - 148;
    e.preventDefault();
  }
  function move(e){
    if (!dragging) return;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - startY + cur;
    y = Math.max(0, Math.min(sheet.offsetHeight - 100, y));
    setY(y);
  }
  function up(){
    if (!dragging) return;
    dragging = false; sheet.classList.remove('drag');
    var y = parseFloat(getComputedStyle(sheet).getPropertyValue('--sy')) || 0;
    var open = y < (sheet.offsetHeight - 148) / 2;
    sheet.style.removeProperty('--sy');
    sheet.classList.toggle('open', open);
    syncPick();
  }
  h.addEventListener('touchstart', down, { passive:false });
  h.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('mouseup', up);
  h.addEventListener('click', function(){
    if (!dragging){ sheet.classList.toggle('open'); syncPick(); }
  });
})();

/* 상세 패널 아래로 밀어 닫기 */
(function(){
  var p = $('detailPanel'), h = $('detailHandle');

  function down(e){ on = true; sy = (e.touches?e.touches[0].clientY:e.clientY); p.classList.add('drag'); e.preventDefault(); }
  function move(e){
    if (!on) return;
    var dy = Math.max(0, (e.touches?e.touches[0].clientY:e.clientY) - sy);
    p.style.transform = 'translateY(' + dy + 'px)';
  }
  function up(e){
    if (!on) return; on = false; p.classList.remove('drag');
    var dy = parseFloat((p.style.transform.match(/([\d.]+)px/)||[0,0])[1]) || 0;
    p.style.transform = '';
    if (dy > 110) closeDetail();
  }
  h.addEventListener('touchstart', down, { passive:false });
  h.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('mouseup', up);
})();

}
function setPickClosed(v){
  try { v ? localStorage.setItem('hrn_pickoff','1') : localStorage.removeItem('hrn_pickoff'); } catch(e){}
  $('pick').hidden = v || !S.rows.length;
  $('pickRestore').hidden = !v || !S.rows.length;
  $('pickRestore').classList.toggle('hasWant', !!S.want);
}
$('pickClose').onclick = function(e){
  e.stopPropagation();
  setPickClosed(true);
  toast('원픽 카드를 닫았습니다. 위의 ★ 단추로 다시 열 수 있어요');
};
$('pickRestore').onclick = function(){ setPickClosed(false); };
$('pickMin').onclick = function(e){ e.stopPropagation(); setPickMini(!$('pick').classList.contains('mini')); };
$('pick').querySelector('.pick-inner').addEventListener('click', function(){
  if ($('pick').classList.contains('mini')) setPickMini(false);
});
map.on('dragstart', function(){ setPickMini(true); });   // 지도를 만지면 비켜준다

/* ══════════════ 접근 방식 필터 ══════════════ */
$('filters').addEventListener('click', function(e){
  var b = e.target.closest('.fchip');
  if (!b || b.classList.contains('on')) return;
  $('filters').querySelectorAll('.fchip').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  S.filter = b.dataset.f;
  S._moved = false;
  load();
});

/* ══════════════ 어종·지점 찾기 ══════════════ */
function movePillIn(seg){
  var act = seg.querySelector('.seg-btn.active'), pill = seg.querySelector('.seg-pill');
  if (!act || !pill) return;
  pill.style.width = act.offsetWidth + 'px';
  pill.style.transform = 'translateX(' + (act.offsetLeft - 4) + 'px)';
}
function openFinder(){
  $('finder').hidden = false;
  S.fmode = S.mode;
  $('fseg').querySelectorAll('.seg-btn').forEach(function(x){
    x.classList.toggle('active', x.dataset.fmode === S.fmode);
  });
  setTimeout(function(){ movePillIn($('fseg')); }, 30);
  loadSpecies();
}
function closeFinder(){ $('finder').hidden = true; }
$('btnSearch').onclick = openFinder;
$('finderScrim').onclick = closeFinder;
$('finderHandle').onclick = closeFinder;
$('fseg').addEventListener('click', function(e){
  var b = e.target.closest('.seg-btn');
  if (!b || b.classList.contains('active')) return;
  $('fseg').querySelectorAll('.seg-btn').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active'); movePillIn($('fseg'));
  S.fmode = b.dataset.fmode;
  loadSpecies();
});

function loadSpecies(){
  var body = $('finderBody');
  body.innerHTML = '<div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div>';
  google.script.run
    .withSuccessHandler(function(list){ renderSpecies(list || []); })
    .withFailureHandler(function(){ body.innerHTML = '<p class="gauge-l" style="padding:20px 4px">목록을 불러오지 못했습니다.</p>'; })
    .apiSpecies(S.ds, S.fmode);
}
function renderSpecies(list){
  var body = $('finderBody'); body.innerHTML = '';
  var g = el('div','spgrid');
  var any = el('div','spcard' + (S.want ? '' : ' on'), '<b>전체</b><span>대상 지정 없음</span>');
  any.onclick = function(){ pickWant(null); };
  g.appendChild(any);
  list.forEach(function(x){
    var cls = 'spcard' + (x.banned ? ' ban' : (x.season >= 2 ? ' peak' : '')) + (S.want === x.n ? ' on' : '');
    var sub = x.banned ? '금어기'
            : x.season >= 3 ? '제철 · ' + x.spots + '곳'
            : x.season === 2 ? '시즌 · ' + x.spots + '곳'
            : x.season > 0  ? x.spots + '곳'
            : '철 아님';
    var c = el('div', cls, '<b>' + x.n + '</b><span>' + sub + '</span>');
    c.onclick = function(){
      if (x.banned){
        var bn = x.ban || {};
        toast(x.n + '은(는) ' + (bn.from ? bn.from + '~' + bn.to + ' ' : '') + '금어기입니다', 3600);
        return;
      }
      pickWant(x.n);
    };
    g.appendChild(c);
  });
  body.appendChild(g);
  var note = el('div','gauge-l','철이 아닌 대상은 아래쪽에 있습니다. 금어기는 눌러도 선택되지 않습니다.');
  note.style.padding = '12px 4px 4px';
  body.appendChild(note);
}
function pickWant(name){
  S.want = name;
  if (name && S.fmode !== S.mode){
    S.mode = S.fmode;
    $('seg').querySelectorAll('.seg-btn').forEach(function(x){
      x.classList.toggle('active', x.dataset.mode === S.mode);
    });
    movePill();
  }
  closeFinder();
  S._moved = false;
  load();
  if (name) toast(name + ' 기준으로 다시 계산합니다');
}
$('wantbarX').onclick = function(){ S.want = null; S._moved = false; load(); };

/* 지점 이름 검색 */
(function(){
  var inp = $('spotQ'), res = $('spotRes'), t = null;
  inp.addEventListener('input', function(){
    clearTimeout(t);
    var q = inp.value.trim();
    if (q.length < 1){ res.innerHTML = ''; return; }
    t = setTimeout(function(){
      google.script.run.withSuccessHandler(function(list){
        res.innerHTML = '';
        if (!list || !list.length){ res.appendChild(el('div','sres','찾는 이름이 없습니다')); return; }
        list.slice(0, 25).forEach(function(x){
          var r = el('div','sres');
          r.innerHTML = '<b>' + x.n + '</b>'
            + (x.curated ? '<span class="badge">정밀</span>' : '<span class="badge auto">자동</span>')
            + '<em>' + (x.r || ({W:'서해',S:'남해',E:'동해',J:'제주'}[x.s] || '')) + '</em>';
          r.onclick = function(){ closeFinder(); openDetail(x.i); };
          res.appendChild(r);
        });
      }).withFailureHandler(function(){ res.innerHTML = ''; }).apiSearch(q);
    }, 260);
  });
})();

})();
</script>
