# 해루낚 — 기상 자료를 미리 받아 저장소에 넣어 둔다.
#
# 왜 필요한가
#   방문자 브라우저가 직접 Open-Meteo 를 부르면 사람이 몰릴 때 하루 한도(10,000회)에 걸린다.
#   여기서 3시간마다 한 번만 받아 data/wx 에 저장해 두면,
#   방문자는 우리 저장소의 파일 하나만 읽으면 되고 외부 호출이 0 이 된다.
#
# 비용
#   이 작업이 쓰는 호출은 1회 갱신당 6회, 하루 48회다.

name: 기상 자료 갱신

on:
  schedule:
    - cron: '0 20,23,2,5,8,11,14,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 기상 받아서 data/wx 만들기
        run: node scripts/fetch-weather.js

      - name: 바뀌었으면 저장
        run: |
          if [ -n "$(git status --porcelain data/wx)" ]; then
            git config user.name  "haerunak-bot"
            git config user.email "bot@haerunak.com"
            git add -A data/wx
            git commit -m "기상 자료 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "바뀐 것 없음"
          fi
