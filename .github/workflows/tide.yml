# 해루낚 — 국립해양조사원 공식 조석예보를 미리 받아 저장소에 넣어 둔다.
#
# 두 단계
#   ① scan-tide-points.js  예보지점(SO_xxxx) 목록을 번호로 훑어 찾는다. 다 찾으면 그다음부턴 바로 끝난다.
#   ② fetch-tide.js        관측소 + 우리 포인트 근처 예보지점의 15일치 만조·간조를 받는다.
#                          이미 받은 것은 다시 안 부르고, 하루 호출 한도 안에서 없는 것만 채운다.
#
# 하루 두 번 돌리는 이유: 처음 며칠은 예보지점 찾기와 15일치 채우기에 호출이 많이 든다.
# 한도에 닿으면 스스로 멈추고 다음 회차에 이어 한다. 다 차고 나면 하루에 새 날짜 하나만 받는다.

name: 물때 자료 갱신

on:
  schedule:
    - cron: '30 19 * * *'     # 세계표준시 19:30 = 한국시각 04:30
    - cron: '30 7 * * *'      # 세계표준시 07:30 = 한국시각 16:30 (채우는 동안 한 번 더)
  push:
    branches: [main]
    paths:                    # 수집 방식을 고치면 바로 한 번 돌려 확인한다
      - 'scripts/fetch-tide.js'
      - 'scripts/scan-tide-points.js'
      - '.github/workflows/tide.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tide
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 예보지점 목록 찾기(다 찾을 때까지만)
        env:
          DATA_GO_KEY: ${{ secrets.DATA_GO_KEY }}
          SCAN_BUDGET: '1600'   # 한 번에 다 훑는다. 한도에 닿으면 스스로 멈추고 다음에 이어 한다
        run: node scripts/scan-tide-points.js

      - name: 물때 받아서 data/tide 채우기
        env:
          DATA_GO_KEY: ${{ secrets.DATA_GO_KEY }}
          FETCH_BUDGET: '3000'  # 지점이 늘어난 만큼 넉넉히. 한도에 닿으면 멈춘다
        run: node scripts/fetch-tide.js

      - name: 이웃끼리 맞춰 보고 이상한 지점 알리기
        run: node scripts/check-tide.js

      - name: 바뀌었으면 저장
        run: |
          if [ -n "$(git status --porcelain data/tide data/tide-points.json)" ]; then
            git config user.name  "haerunak-bot"
            git config user.email "bot@haerunak.com"
            git add -A data/tide data/tide-points.json
            git commit -m "물때 자료 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "바뀐 것 없음"
          fi
