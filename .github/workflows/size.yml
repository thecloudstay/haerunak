name: 전송량 점검

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'scripts/check-size.js'
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * 0'      # 매주 월요일 06:00 (한국시각)

permissions:
  contents: write

concurrency:
  group: size
  cancel-in-progress: false

jobs:
  check:
    name: 점검
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 크기 재고 한계 방문 수 계산
        run: node scripts/check-size.js
      - name: 결과 저장
        if: always()
        run: |
          git config user.name  "haerunak-bot"
          git config user.email "bot@haerunak.com"
          if [ -n "$(git status --porcelain 전송량점검.md)" ]; then
            git add 전송량점검.md
            git commit -m "전송량 점검 갱신"
            # 「사이트 빌드」와 같은 push 로 함께 돌아 서로 튕길 수 있다 — 되풀이해 올린다
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push; then exit 0; fi
              git rebase --abort 2>/dev/null || true
              sleep $((i * 6))
            done
            echo "다섯 번 올려 봤지만 실패"; exit 1
          fi
