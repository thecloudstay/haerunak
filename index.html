/** 매월 1일 아침 — 레퍼럴·제휴 성과를 시트에 쓰고 메일로 보낸다 */
function moneyLoop(){
  var props = PropertiesService.getScriptProperties();
  var all = props.getProperties();
  var lines = [], sheetRows = [];
  var month = Utilities.formatDate(new Date(Date.now() - 86400000 * 2), CFG.TZ, 'yyyy-MM');

  // 레퍼럴 — 분배율 자동 산정
  for (var k in all){
    if (k.indexOf('ref_') !== 0) continue;
    var d; try { d = JSON.parse(all[k]); } catch(e){ continue; }
    var code = k.slice(4);
    var visits = d.visit || 0, convs = (d.open || 0) + (d.nav || 0);
    var amount = d.amount || 0;
    var rate = visits >= 1000 ? MONEY.REF_SHARE_T2 : visits >= 100 ? MONEY.REF_SHARE_T1 : MONEY.REF_SHARE_BASE;
    var share = Math.round(amount * rate);
    lines.push('· ' + code + ' — 유입 ' + visits + ' / 전환 ' + convs +
               (amount ? ' / 매출 ' + amount + '원 → 분배 ' + share + '원 (' + Math.round(rate*100) + '%)' : ' / 매출 없음'));
    sheetRows.push([month, '레퍼럴', code, visits, convs, amount, Math.round(rate*100) + '%', share]);
    // 다음 달을 위해 방문 수는 리셋, 누적 금액은 정산했으면 0으로
    d.visit = 0; d.open = 0; d.nav = 0; if (amount) d.amount = 0;
    props.setProperty(k, JSON.stringify(d));
  }
  // 제휴·광고 성과
  for (var k2 in all){
    if (k2.indexOf('biz_') !== 0) continue;
    var b; try { b = JSON.parse(all[k2]); } catch(e){ continue; }
    lines.push('· 제휴 ' + k2.slice(4) + ' — 노출 ' + (b.imp||0) + ' / 클릭 ' + (b.click||0) +
               (b.boat ? ' / 예약문의 ' + b.boat : ''));
    sheetRows.push([month, '제휴', k2.slice(4), b.imp||0, b.click||0, '', '', '']);
    props.setProperty(k2, '{}');
  }

  if (sheetRows.length){
    try {
      var sh = logSheet_().getParent().getSheetByName('정산') ||
               logSheet_().getParent().insertSheet('정산');
      if (sh.getLastRow() === 0)
        sh.appendRow(['월','구분','코드/업체','유입·노출','전환·클릭','매출','요율','분배액']);
      sheetRows.forEach(function(r){ sh.appendRow(r); });
    } catch(e){}
    try {
      MailApp.sendEmail(LOOP.OWNER_EMAIL, '[해루낚] ' + month + ' 월간 정산',
        '이번 달 성과입니다. 시트 「정산」 탭에도 기록했습니다.\n\n' + lines.join('\n') +
        '\n\n분배율: 기본 30% / 월 유입 100명↑ 35% / 1,000명↑ 40% / 예약 수수료의 20%');
    } catch(e){}
  }
}

/** 파트너가 자기 코드로 성과를 직접 확인한다 — 정산 투명성의 실체 */
function apiRefLookup(code){
  code = String(code || '').replace(/[^\w-]/g,'').slice(0,24);
  if (!code) return { ok: false };
  var props = PropertiesService.getScriptProperties();
  var d; try { d = JSON.parse(props.getProperty('ref_' + code) || 'null'); } catch(e){ d = null; }
  if (!d) return { ok: false, msg: '아직 집계가 없는 코드입니다. 링크가 한 번이라도 열리면 생깁니다.' };
  var visits = d.visit || 0;
  var rate = visits >= 1000 ? MONEY.REF_SHARE_T2 : visits >= 100 ? MONEY.REF_SHARE_T1 : MONEY.REF_SHARE_BASE;
  return { ok: true, code: code, visit: visits, open: d.open || 0, nav: d.nav || 0,
           amount: d.amount || 0, rate: Math.round(rate * 100), first: d.first || '', last: d.last || '' };
}

/* ══════════ 준비물 제휴 링크 ══════════
 * 도구 이름을 상품군으로 정규화한 뒤 data/gear.json 의 shop 에서 링크를 찾는다.
 * 링크가 없으면 null 을 돌려주고 화면은 글자만 보여준다 — 빈 링크를 누르게 두지 않는다. */
function shopFor_(names){
  var j = remoteJson_('gear') || {};
  var shop = j.shop || {};
  var out = [], seen = {};
  (names || []).forEach(function(n){
    var k = (typeof gearKey_ === 'function') ? gearKey_(n) : n;
    if (!k || seen[k]) return;
    seen[k] = 1;
    var s = shop[k];
    out.push({ n: k, u: (s && s.u) ? s.u : '', why: (s && s.why) ? s.why : '' });
  });
  return out;
}

/** 제휴 링크가 하나라도 걸려 있으면 고지 문구를 돌려준다.
 *  대가를 받는 사실을 알리는 것은 공정거래위원회 추천·보증 심사지침상 의무다. */
function shopDisclosure_(items){
  var has = (items || []).some(function(x){ return x && x.u; });
  if (!has) return '';
  var j = remoteJson_('gear') || {};
  return j.disclosure || '이 링크로 구매하시면 해루낚이 수수료를 받습니다. 가격은 같습니다.';
}

/* ══════════ 대상물별 '잡는 법' 영상 ══════════
 * 유튜버에게 노출 자리를 주는 것이 곧 대가다. 현금 없이 제휴가 성립한다.
 * 등록된 영상이 없으면 유튜브 검색 링크를 만든다 — 이건 언제나 유효하다. */
function videosFor_(names, mode){
  var j = remoteJson_('videos') || {};
  var all = j.items || [];
  var out = [];
  (names || []).slice(0, 4).forEach(function(n){
    var hit = all.filter(function(v){ return v && v.target === n; });
    // 대가를 받은 노출을 위로 올린다
    hit.sort(function(a, b){ return (b.paid ? 1 : 0) - (a.paid ? 1 : 0); });
    if (hit.length){
      var v = hit[0];
      out.push({ target:n, id:v.id || '', ch:v.ch || '', t:v.t || '', paid:!!v.paid,
                 u: v.id ? ('https://www.youtube.com/watch?v=' + v.id) : (v.u || ''),
                 thumb: v.id ? ('https://img.youtube.com/vi/' + v.id + '/mqdefault.jpg') : '' });
    } else {
      var q = n + ' ' + (mode === 'fish' ? '낚시' : '잡는법');
      out.push({ target:n, id:'', ch:'', t:'', paid:false, search:true,
                 u: 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q), thumb:'' });
    }
  });
  return out;
}

/** 원격 rigs.json 병합 후 이름으로 조회 */
function rigOf_(name){
  var ex = (typeof remoteJson_ === 'function') ? remoteJson_('rigs') : null;
  if (ex && ex[name]) return ex[name];
  return RIGS[name] || null;
}

/** 대상 목록 → 채비 카드 목록 (상위 3개) */
function rigsFor_(targets, mode){
  var out = [];
  (targets || []).slice(0, 3).forEach(function(t){
    var name = t.n || t;
    var r = rigOf_(mode === 'fish' && name === '주꾸미' ? '주꾸미(낚시)' : name);
    if (r) out.push({ n: name, t: r.t || [], b: r.b || '', tip: r.tip || '', warn: r.warn || '' });
  });
  return out;
}

/** 해루질 공통 안전 장비 — 어떤 대상이든 항상 붙는다 */
var SAFE_KIT = ['구명조끼(자동팽창형 권장)', '휴대폰 방수팩', '호루라기', '보조 랜턴(주 랜턴 방전 대비)', '물때표 캡처', '동행 1인 이상'];

/* ══════════ 도구 이름 → 상품군 정규화 ══════════
 * '장갑'·'두꺼운 장갑'·'목장갑'은 결국 같은 물건을 산다.
 * 상품군으로 묶어야 제휴 링크 하나가 여러 대상물을 덮는다. */
var GEAR_NORM = {
  '망':'채집망', '망태기':'채집망', '채집망':'채집망',
  '장갑':'작업 장갑', '두꺼운 장갑':'작업 장갑', '목장갑':'작업 장갑', '네오프렌 장갑':'네오프렌 장갑',
  '장화':'갯벌 장화', '긴 장화':'갯벌 장화',
  '랜턴':'방수 랜턴', '보조 랜턴':'방수 랜턴', '헤드랜턴':'헤드랜턴',
  '뜰채':'뜰채', '긴 뜰채':'뜰채', '소형 통발형 뜰채':'뜰채',
  '갈퀴':'갯벌 갈퀴', '갈퀴(그레)':'갯벌 갈퀴',
  '호미':'갯벌 호미',
  '집게':'집게',
  '통':'채집통',
  '맛소금':'맛소금', '소금':'맛소금',
  '조새(굴칼)':'조새',
  '칼':'작업칼', '일자 드라이버나 칼':'작업칼',
  '구명조끼(자동팽창형 권장)':'구명조끼',
  '휴대폰 방수팩':'방수팩',
  '호루라기':'호루라기'
};

/** 도구 이름을 상품군으로 바꾼다. 매칭 없으면 원래 이름 그대로. */
function gearKey_(name){
  if (!name) return '';
  var n = String(name).trim();
  if (GEAR_NORM[n]) return GEAR_NORM[n];
  // 부분 일치 — '두꺼운 방수 장갑' 같은 변형도 잡는다
  for (var k in GEAR_NORM){
    if (n.indexOf(k) >= 0) return GEAR_NORM[k];
  }
  return n;
}

/**
 * 해루낚 — 진입점과 화면 연동 API
 * 배포: 배포 > 새 배포 > 웹 앱 / 실행: 나 / 액세스: 모든 사용자
 */

var CFG = {
  TZ: 'Asia/Seoul',
  BOARD_CACHE_SEC: 1800,
  PRECISE_TOP: 10
};

function doGet(e){
  // 레퍼럴 유입 기록 — ?ref=유튜버코드
  var ref = e && e.parameter && e.parameter.ref ? String(e.parameter.ref).replace(/[^\w-]/g,'').slice(0,24) : '';
  if (ref) trackRef_(ref, 'visit');

  var t = HtmlService.createTemplateFromFile('Index');
  t.BOOT = JSON.stringify({
    today: todayStr_(),
    count: POINTS.length,
    indexCount: allIndex_().length,
    species: { haeru: allSpecies_('haeru'), fish: allSpecies_('fish') },
    ban: (typeof banMetaNow_==='function' ? banMetaNow_() : BAN_META),
    nonpro: NONPRO,
    ferry: (typeof ferryInfo_==='function' ? ferryInfo_() : null),
    ref: ref
  });
  return t.evaluate()
    .setTitle('해루낚 — 오늘 어디서 뭘 잡지')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover')
    .addMetaTag('theme-color', '#05141f')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
}
function include(f){ return HtmlService.createHtmlOutputFromFile(f).getContent(); }
function todayStr_(){ return Utilities.formatDate(new Date(), CFG.TZ, 'yyyy-MM-dd'); }

/**
 * 지도 보드
 * @param opts {want:'낙지', isl:true|false|null, car:true}
 */
function apiBoard(ds, mode, opts){
  ds = ds || todayStr_();
  mode = (mode === 'fish') ? 'fish' : 'haeru';
  opts = opts || {};
  var cache = CacheService.getScriptCache();
  var ck = 'b5_' + ds + '_' + mode + '_' + (opts.want || '') + '_' + (opts.isl === null || opts.isl === undefined ? 'a' : (opts.isl ? 'i' : 'l')) + (opts.car ? 'c' : '');
  var hit = cache.get(ck);
  if (hit){ try { return JSON.parse(hit); } catch(e){} }

  var pool = (typeof pool_==='function' ? pool_() : POINTS).filter(function(p){
    if (opts.isl === true  && !p.isl) return false;
    if (opts.isl === false &&  p.isl) return false;
    // 다리로 이어진 섬은 배편 정보가 없다 — 그것도 차로 가는 섬이다
    if (opts.car && p.isl && p.fr && !p.fr[2]) return false;
    if (opts.want){
      var arr = speciesOf_(p, mode);
      if (arr.indexOf(opts.want) < 0) return false;
    }
    return true;
  });
  if (!pool.length) return { ds: ds, mode: mode, rows: [], empty: true,
                             msg: opts.want ? (opts.want + '을(를) 노릴 포인트가 조건에 없습니다') : '조건에 맞는 포인트가 없습니다' };

  var wx = fetchWeather_(pool, ds);
  var rows = pool.map(function(p){
    var tide = tideOf_(p, ds, false);
    return packRow_(p, analyze_(p, ds, tide, wx[gridKey_(p.la, p.lo)], opts.want), mode);
  });
  // 실제 조황 기록으로 미세 보정 (기록 3건 이상 지점만, ±4점)
  try {
    var bm = catchBoostMap_();
    rows.forEach(function(r){
      var b = bm[r.i + '|' + mode];
      if (b){ r.score = Math.max(0, Math.min(100, r.score + b)); r.raw += b; r.boost = b; }
    });
  } catch(e){}
  rows.sort(function(a,b){ return b.raw - a.raw; });

  // 상위 지점만 바다타임으로 정밀 보정
  var top = rows.slice(0, CFG.PRECISE_TOP);
  try {
    var resp = UrlFetchApp.fetchAll(top.map(function(r){
      return { url: 'https://m.badatime.com/' + r.i + '.html', muteHttpExceptions: true, followRedirects: true,
               headers: { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' } };
    }));
    resp.forEach(function(res, k){
      if (res.getResponseCode() !== 200) return;
      var parsed;
      try { parsed = parseBadatime_(res.getContentText('UTF-8')); } catch(e){ return; }
      if (!parsed || !parsed[ds]) return;
      try { cache.put('bt_' + top[k].i, JSON.stringify(parsed), 21600); } catch(e){}
      var p = pointById_(top[k].i);
      if (!p) return;
      var fresh = packRow_(p, analyze_(p, ds, parsed[ds], wx[gridKey_(p.la, p.lo)], opts.want), mode);
      for (var key in fresh) top[k][key] = fresh[key];
    });
  } catch(e){}
  rows.sort(function(a,b){ return b.raw - a.raw; });

  var out = { ds: ds, mode: mode, want: opts.want || null, rows: rows,
              total: POINTS.length, shown: rows.length,
              generated: Utilities.formatDate(new Date(), CFG.TZ, 'HH:mm') };
  try { cache.put(ck, JSON.stringify(out), CFG.BOARD_CACHE_SEC); } catch(e){}
  return out;
}

function packRow_(p, an, mode){
  var m = mode === 'fish' ? an.fish : an.haeru;
  return {
    i: p.i, n: p.n, r: p.r, s: p.s, la: p.la, lo: p.lo, tag: p.tag || '',
    isl: p.isl ? 1 : 0, fr: p.fr || null,
    score: m.score, raw: m.raw, grade: m.grade,
    win: m.window ? [Math.round(m.window[0]*60), Math.round(m.window[1]*60)] : null,
    targets: m.targets.map(function(t){ return t.n; }),
    banned: (m.bannedTargets || []).map(function(t){ return t.n; }),
    verdict: m.verdict, why: (m.why||[]).slice(0,2), warn: (m.warn||[]).slice(0,2),
    mul: an.meta.mul, range: an.meta.range, src: an.meta.src,
    vis: an.meta.vis, cur: an.meta.curPeak,
    other: (mode === 'fish' ? an.haeru.score : an.fish.score),
    wantReason: an.want ? an.want.reason : null
  };
}

/** 지점 상세 — 항상 정밀 소스 */
function apiPoint(id, ds, want, days){
  ds = ds || todayStr_();
  var p = anyPoint_(id);
  if (!p) return { error: '지점을 찾을 수 없습니다.' };
  var tide = tideOf_(p, ds, true);
  var wx = fetchWeather_([p], ds);
  var an = analyze_(p, ds, tide, wx[gridKey_(p.la, p.lo)], want);
  return {
    point: { i:p.i, n:p.n, r:p.r||'', s:p.s, la:p.la, lo:p.lo, tag:p.tag||'',
             floor: FLOOR_KO[p.f], isl: p.isl?1:0, fr: p.fr||null,
             auto: !!p.auto, approxCoord: !!p.approxCoord },
    ds: ds, meta: an.meta, haeru: an.haeru, fish: an.fish, want: an.want,
    spots: spotsOf_(p.i),
    partners: (typeof apiPartners === 'function') ? apiPartners(p.i) : [],
    ad: (typeof pickAd_ === 'function')
      ? pickAd_(p.r || '', ds, 'haeru', (an.meta.banned.haeru || []).concat(an.meta.banned.fish || []).map(function(x){ return x.n; }))
      : null,
    gear: (typeof gearFor_ === 'function') ? gearFor_(an.meta, 'haeru', p.f) : [],
    rigs: (typeof rigsFor_ === 'function')
      ? { haeru: rigsFor_(an.haeru.targets, 'haeru'), fish: rigsFor_(an.fish.targets, 'fish'),
          safe: SAFE_KIT }
      : null,
    // 준비물에 걸린 제휴 링크 — 도구 이름을 상품군으로 묶어 한 번에 내려준다
    shop: (function(){
      if (typeof shopFor_ !== 'function' || typeof rigsFor_ !== 'function') return null;
      var names = [];
      ['haeru','fish'].forEach(function(m){
        (rigsFor_(m === 'haeru' ? an.haeru.targets : an.fish.targets, m) || [])
          .forEach(function(r){ (r.t || []).forEach(function(t){ names.push(t); }); });
      });
      SAFE_KIT.forEach(function(t){ names.push(t); });
      var items = shopFor_(names);
      return { items: items, disclosure: shopDisclosure_(items) };
    })(),
    videos: (typeof videosFor_ === 'function')
      ? { haeru: videosFor_((an.haeru.targets||[]).map(function(x){return x.n;}), 'haeru'),
          fish:  videosFor_((an.fish.targets ||[]).map(function(x){return x.n;}), 'fish') }
      : null,
    week: apiWeek_(p, ds, want, Math.min(15, Math.max(7, Number(days) || 7)))
  };
}

function apiWeek_(p, ds, want, days){
  var bt = fetchBadatime_(p.i);
  var days = [], base = new Date(ds + 'T00:00:00+09:00');
  for (var k = 0; k < (days || 7); k++)
    days.push(Utilities.formatDate(new Date(base.getTime() + k*86400000), CFG.TZ, 'yyyy-MM-dd'));
  var rec = fetchWeather_([p], ds)[gridKey_(p.la, p.lo)];
  return days.map(function(dd){
    var tide = (bt && bt[dd]) ? bt[dd]
      : (function(){ var a = dd.split('-'); return calcTide_(p, +a[0], +a[1], +a[2]); })();
    var an = analyze_(p, dd, tide, dd === ds ? rec : null, want);
    return { ds: dd, mul: an.meta.mul, range: an.meta.range,
             h: an.haeru.score, f: an.fish.score,
             vis: dd === ds ? an.meta.vis : null,   // 기상 예보가 있는 당일만 시야를 낸다
             hw: an.haeru.window ? [Math.round(an.haeru.window[0]*60), Math.round(an.haeru.window[1]*60)] : null,
             fw: an.fish.window ? [Math.round(an.fish.window[0]*60), Math.round(an.fish.window[1]*60)] : null };
  });
}

/** 전체 색인 검색 — 정식 포인트를 위로 올린다 */
function apiSearch(q){
  var hits = searchIndex_(q, 60);
  return hits.map(function(h){
    var p = pointById_(h.i);
    return { i: h.i, n: h.n, s: h.s, curated: !!p, r: p ? p.r : '', isl: p && p.isl ? 1 : 0 };
  }).sort(function(a,b){ return (b.curated?1:0) - (a.curated?1:0); });
}

/** 어종 목록 — 제철·금어기 상태를 붙여서 준다 */
function apiSpecies(ds, mode){
  ds = ds || todayStr_();
  var a = ds.split('-'), mo = +a[1], d = +a[2];
  var table = mode === 'fish' ? SEASON_FX : SEASON_SP;
  return allSpecies_(mode === 'fish' ? 'fish' : 'haeru').map(function(n){
    var st = banStatus_(n, mo, d, '전국');
    var spots = 0;
    POINTS.forEach(function(p){ if (speciesOf_(p, mode === 'fish' ? 'fish' : 'haeru').indexOf(n) >= 0) spots++; });
    return { n: n, season: table[n] ? table[n][mo-1] : 1, spots: spots,
             banned: !!(st && st.banned),
             ban: st ? { from: st.from, to: st.to, size: st.size, unit: st.unit, scope: st.scope } : null };
  }).filter(function(x){ return x.spots > 0; })
    .sort(function(x,y){ return (y.season - x.season) || (y.spots - x.spots); });
}

/* ── 레퍼럴 집계 ─────────────────────────────────────
 * 파트너 코드별 유입·전환을 스크립트 속성에 쌓는다.
 * 나중에 결제·예약이 붙으면 conv 이벤트에 금액을 실어 정산 근거가 된다. */
function trackRef_(code, ev, amount){
  try {
    var props = PropertiesService.getScriptProperties();
    var k = 'ref_' + code;
    var d; try { d = JSON.parse(props.getProperty(k) || '{}'); } catch(e){ d = {}; }
    var day = todayStr_();
    d.first = d.first || day;
    d.last = day;
    d[ev] = (d[ev] || 0) + 1;

function wxFor(p,ds){

  var wave=Math.max(0.15,base.wave+(sd-0.5)*0.9), wind=Math.max(1,base.wind+(sd-0.5)*7);
  var A=function(v){return Array(24).fill(v);}, t=26-(p.la-33)*0.6;

          wind:A(wind),gust:A(wind*1.5),wdir:A(Math.round(sd*360)),pres:A(0).map(function(_,i){return 1013+(i-12)*((sd-0.5)*8)/12;}),

        if (map.hasLayer(tl)) map.removeLayer(tl);
        nx.addTo(map); nx.bringToBack();
        LIVE[kind] = nx;
      }
    }
  });
  return tl;
}

function getBase_(kind){
  if (!LIVE[kind]) LIVE[kind] = makeTile_(kind, 0);
  return LIVE[kind];
}

getBase_('dark').addTo(map);

function setBase_(k){
  if (!TILE_SRC[k] || k === curBase) return;
  var old = LIVE[curBase];
  if (old && map.hasLayer(old)) map.removeLayer(old);
  if (map.hasLayer(SATLBL)) map.removeLayer(SATLBL);
  var nx = getBase_(k);
  nx.addTo(map); nx.bringToBack();
  if (k === 'sat') SATLBL.addTo(map);
  curBase = k;
  document.body.className = document.body.className.replace(/\s*map-sat\b/,'') + (k === 'sat' ? ' map-sat' : '');
  var bs = document.querySelectorAll('.basebtn');
  for (var i=0;i<bs.length;i++) bs[i].className = 'basebtn' + (bs[i].getAttribute('data-b') === k ? ' on' : '');
  try { localStorage.setItem('hrn_base', k); } catch(e){}
}

function pinIcon(r, isTop, small){
  return L.divIcon({
    className: '',
    html: '<div class="pin pin-'+r.grade+(small?' sm':'')+(isTop?' pin-top':'')+'" style="position:relative">'+r.score+'</div>',
    iconSize: small ? [26,26] : [38,38],
    iconAnchor: small ? [13,13] : [19,19]
  });
}
function drawPins(){
  Object.keys(S.markers).forEach(function(k){ map.removeLayer(S.markers[k]); });
  S.markers = {};
  var z = map.getZoom();
  var placed = [];                       // 큰 핀이 이미 차지한 화면 좌표
  var MIN = z >= 11 ? 0 : (z >= 9 ? 30 : 38);
  S.rows.forEach(function(r, idx){
    var pt = map.latLngToLayerPoint([r.la, r.lo]);
    var small = false;
    for (var k=0;k<placed.length;k++){
      var dx = placed[k].x - pt.x, dy = placed[k].y - pt.y;
      if (dx*dx + dy*dy < MIN*MIN){ small = true; break; }
    }
    if (!small) placed.push(pt);
    var m = L.marker([r.la, r.lo], { icon: pinIcon(r, idx === 0, small), zIndexOffset: 1000 - idx });
    m.on('click', function(){ openDetail(r.i); });
    m.addTo(map);
    S.markers[r.i] = m;
  });
}
map.on('zoomend', function(){ if (S.rows.length) drawPins(); });

function sorted(){
  var a = S.rows.slice();
  if (S.sort === 'near' && S.me){
    a.forEach(function(r){ r._d = dist(S.me[0], S.me[1], r.la, r.lo); });
    a.sort(function(x,y){ return x._d - y._d; });
  } else if (S.sort === 'time'){
    a.sort(function(x,y){
      var xa = x.win ? x.win[0] : 99999, ya = y.win ? y.win[0] : 99999;
      return xa - ya;
    });
  } else {
    a.sort(function(x,y){ return y.raw - x.raw; });
  }
  var f = favs();
  if (f.length){
    a.sort(function(x,y){ return (f.indexOf(y.i) >= 0 ? 1 : 0) - (f.indexOf(x.i) >= 0 ? 1 : 0); });
  }
  return a;
}

/* 낚싯배 예약 문의 양식 */
function openBookForm(box, d, partner){
  var old = box.querySelector('.catch-form');
  if (old){ old.remove(); return; }
  var f = el('div','catch-form');
  f.innerHTML =
    '<div class="gauge-l" style="padding:0 2px 4px"><b style="color:var(--txt)">' + partner.n + '</b> 예약 문의 — 출조일 ' + S.ds + '</div>'
    + '<div class="cf-row"><span>인원</span><input id="bkPax" maxlength="4" inputmode="numeric" placeholder="2"></div>'
    + '<div class="cf-row"><span>연락처</span><input id="bkTel" maxlength="16" inputmode="tel" placeholder="010-0000-0000"></div>'
    + '<div class="cf-row"><span>요청</span><input id="bkMemo" maxlength="80" placeholder="대상어·시간대 등 (선택)"></div>'
    + '<button class="act primary" id="bkSave">문의 보내기</button>'
    + '<div class="gauge-l">확인 후 업체 또는 해루낚에서 연락드립니다. 기상으로 출항이 취소될 수 있습니다.</div>';
  box.appendChild(f);
  f.querySelector('#bkSave').onclick = function(){
    var tel = f.querySelector('#bkTel').value.trim();
    if (!tel){ toast('연락처를 적어주세요'); return; }
    f.querySelector('#bkSave').textContent = '보내는 중…';
    google.script.run.withSuccessHandler(function(r){
      toast(r && r.ok ? '문의가 접수됐습니다. 곧 연락드리겠습니다' : (r && r.msg) || '전송 실패');
      f.remove();
    }).withFailureHandler(function(){ toast('보내지 못했습니다. ' + (partner.tel ? '전화(' + partner.tel + ')로 문의해주세요' : '')); f.querySelector('#bkSave').textContent = '문의 보내기'; })
      .apiBookRequest({ ds: S.ds, point: d.point.n, partner: partner.n, pid: partner.id,
        pax: f.querySelector('#bkPax').value, tel: tel,
        memo: f.querySelector('#bkMemo').value, ref: refCode() || '', uid: myUid() });
  };
}

/* 이용권 등록 — prompt() 는 구글 iframe·일부 브라우저에서 차단되므로 자체 창을 쓴다 */
function openRedeem(){
  var old = document.getElementById('redeemBox');
  if (old){ old.remove(); return; }
  var wrap = el('div','detail');
  wrap.id = 'redeemBox';
  wrap.innerHTML = '<div class="detail-scrim"></div>'
    + '<div class="detail-panel glass" style="max-height:none;padding-bottom:calc(20px + var(--safeB))">'
    + '<div class="handle"><i></i></div>'
    + '<div style="padding:4px 18px 8px">'
    + '<h3 style="font-size:17px;font-weight:800;margin-bottom:6px">이용권 등록</h3>'
    + '<p class="gauge-l" style="margin-bottom:12px">프리미엄: 15일 전망 · 광고 없음 · 1년</p>'
    + '<div class="cf-row"><span>코드</span><input id="rdCode" maxlength="24" autocapitalize="characters" placeholder="HRN-XXXX"></div>'
    + '<div class="dt-actions"><button class="act primary" id="rdGo">등록</button><button class="act" id="rdX">닫기</button></div>'
    + '</div></div>';
  document.body.appendChild(wrap);
  wrap.querySelector('.detail-scrim').onclick = function(){ wrap.remove(); };
  wrap.querySelector('#rdX').onclick = function(){ wrap.remove(); };
  wrap.querySelector('#rdGo').onclick = function(){
    var code = wrap.querySelector('#rdCode').value.trim();
    if (!code){ toast('코드를 입력하세요'); return; }
    wrap.querySelector('#rdGo').textContent = '확인 중…';
    google.script.run.withSuccessHandler(function(r){
      if (r && r.ok){
        try { localStorage.setItem('hrn_premium', JSON.stringify({ until: r.until })); } catch(e){}
        toast('프리미엄이 켜졌습니다. 감사합니다!');
        wrap.remove(); load();
      } else { toast((r && r.msg) || '코드 확인 실패'); wrap.querySelector('#rdGo').textContent = '등록'; }
    }).withFailureHandler(function(){ toast('확인하지 못했습니다'); wrap.querySelector('#rdGo').textContent = '등록'; })
      .apiRedeem(code, myUid());
  };
}

/* 조석 곡선 SVG */
function tideSVG(meta, win){
  var W = 320, H = 108, PT = 10, PB = 20;
  var ev = (meta.events||[]).slice().sort(function(a,b){ return a.t-b.t; });
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if (!ev.length) return svg;

  // 앞뒤로 가상 극점을 붙여 0~24시를 모두 덮는다
  var pts = ev.slice();
  var P = 6.2103;
  while (pts[0].t > 0)      pts.unshift({ k: pts[0].k==='H'?'L':'H', t: pts[0].t - P, lv: oppLv(pts, pts[0]) });
  while (pts[pts.length-1].t < 24){
    var last = pts[pts.length-1];
    pts.push({ k: last.k==='H'?'L':'H', t: last.t + P, lv: oppLv(pts, last) });
  }
  function oppLv(list, ref){
    for (var k=0;k<list.length;k++){ if (list[k].k !== ref.k) return list[k].lv; }
    return ref.lv;
  }
  var lvs = pts.map(function(p){ return p.lv; });
  var mn = Math.min.apply(null,lvs), mx = Math.max.apply(null,lvs);
  if (mx - mn < 10) mx = mn + 10;
  var X = function(t){ return t/24*W; };
  var Y = function(l){ return PT + (1 - (l-mn)/(mx-mn)) * (H-PT-PB); };

  function level(t){
    for (var k=0;k<pts.length-1;k++){
      if (t >= pts[k].t && t <= pts[k+1].t){
        var a = pts[k], b2 = pts[k+1];
        var f = (t - a.t)/(b2.t - a.t);
        return (a.lv + b2.lv)/2 + (a.lv - b2.lv)/2 * Math.cos(Math.PI*f);
      }
    }
    return pts[pts.length-1].lv;
  }
  var dpath = '', apath = '';
  for (var t=0; t<=24; t+=0.25){
    var x = X(t).toFixed(1), y = Y(level(t)).toFixed(1);
    dpath += (t===0 ? 'M' : 'L') + x + ' ' + y;
  }
  apath = dpath + 'L'+W+' '+(H-PB)+'L0 '+(H-PB)+'Z';

  // 그라데이션
  var defs = document.createElementNS(ns,'defs');
  defs.innerHTML = '<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#35d0ff" stop-opacity=".38"/>'+
    '<stop offset="100%" stop-color="#35d0ff" stop-opacity="0"/></linearGradient>';
  svg.appendChild(defs);

  // 야간 음영
  function shade(a, b2){
    if (b2 <= a) return;
    var r = document.createElementNS(ns,'rect');
    r.setAttribute('x', X(a)); r.setAttribute('y', 0);
    r.setAttribute('width', X(b2)-X(a)); r.setAttribute('height', H-PB);
    r.setAttribute('fill','rgba(2,10,18,.45)');
    svg.appendChild(r);
  }
  if (meta.sunrise != null) shade(0, meta.sunrise);
  if (meta.sunset != null)  shade(meta.sunset, 24);

  // 추천 시간창
  function drawWin(a2, b3){
    if (b3 > a2){
      var hi = document.createElementNS(ns,'rect');
      hi.setAttribute('x', X(a2)); hi.setAttribute('y', 0);
      hi.setAttribute('width', X(b3)-X(a2)); hi.setAttribute('height', H-PB);
      hi.setAttribute('fill','rgba(46,230,168,.16)');
      hi.setAttribute('stroke','rgba(46,230,168,.5)'); hi.setAttribute('stroke-width','1');
      svg.appendChild(hi);
      var lb = document.createElementNS(ns,'text');
      lb.setAttribute('x', (X(a2)+X(b3))/2); lb.setAttribute('y', H-PB-5);
      lb.setAttribute('text-anchor','middle'); lb.setAttribute('font-size','9');
      lb.setAttribute('fill','#2ee6a8'); lb.setAttribute('font-weight','800');
      lb.textContent = '추천';
      svg.appendChild(lb);
    }
  }
  if (win){
    var wa = win[0], wb = win[1];
    drawWin(Math.max(0, wa), Math.min(24, wb));
    if (wb > 24) drawWin(0, wb - 24);        // 자정을 넘긴 부분
    if (wa < 0)  drawWin(24 + wa, 24);
  }

  var area = document.createElementNS(ns,'path');
  area.setAttribute('d', apath); area.setAttribute('fill','url(#tg)');
  svg.appendChild(area);
  var line = document.createElementNS(ns,'path');
  line.setAttribute('d', dpath); line.setAttribute('fill','none');
  line.setAttribute('stroke','#35d0ff'); line.setAttribute('stroke-width','2'); line.setAttribute('stroke-linecap','round');
  svg.appendChild(line);

  // 극점 표시
  ev.forEach(function(e){
    var c = document.createElementNS(ns,'circle');
    c.setAttribute('cx', X(e.t)); c.setAttribute('cy', Y(e.lv)); c.setAttribute('r', 3.2);
    c.setAttribute('fill', e.k==='H' ? '#35d0ff' : '#2ee6a8');
    svg.appendChild(c);
    var tx = document.createElementNS(ns,'text');
    tx.setAttribute('x', Math.min(W-16, Math.max(16, X(e.t))));
    tx.setAttribute('y', Y(e.lv) + (e.k==='H' ? -8 : 14));
    tx.setAttribute('text-anchor','middle'); tx.setAttribute('font-size','9');
    tx.setAttribute('fill', e.k==='H' ? '#8fd8f5' : '#8fe6c8'); tx.setAttribute('font-weight','700');
    tx.textContent = hmH(e.t);
    svg.appendChild(tx);
  });

  // 현재 시각
  if (S.ds === BOOT.today){
    var now = new Date(); var nt = now.getHours() + now.getMinutes()/60;
    var nl = document.createElementNS(ns,'line');
    nl.setAttribute('x1', X(nt)); nl.setAttribute('x2', X(nt));
    nl.setAttribute('y1', 0); nl.setAttribute('y2', H-PB);
    nl.setAttribute('stroke','#fff'); nl.setAttribute('stroke-width','1');
    nl.setAttribute('stroke-dasharray','3 3'); nl.setAttribute('opacity','.55');
    svg.appendChild(nl);
  }
  // 기준선
  var base = document.createElementNS(ns,'line');
  base.setAttribute('x1',0); base.setAttribute('x2',W);
  base.setAttribute('y1',H-PB); base.setAttribute('y2',H-PB);
  base.setAttribute('stroke','rgba(255,255,255,.12)'); base.setAttribute('stroke-width','1');
  svg.appendChild(base);
  return svg;
}

/* ══════════════ 바텀시트 드래그 ══════════════ */
(function(){
  var sheet = $('sheet'), h = $('handle');
  var closedY = null, startY = 0, cur = 0, dragging = false;
  function closed(){
    return sheet.classList.contains('open') ? 0 : sheet.offsetHeight - 148 - (window.__sb||0);
  }
  function setY(y){ sheet.style.setProperty('--sy', y + 'px'); }
  function down(e){
    dragging = true; sheet.classList.add('drag');
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    cur = sheet.classList.contains('open') ? 0 : sheet.offsetHeight - 148;
    e.preventDefault();
  }
  function move(e){
    if (!dragging) return;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - startY + cur;
    y = Math.max(0, Math.min(sheet.offsetHeight - 100, y));
    setY(y);
  }
  function up(){
    if (!dragging) return;
    dragging = false; sheet.classList.remove('drag');
    var y = parseFloat(getComputedStyle(sheet).getPropertyValue('--sy')) || 0;
    var open = y < (sheet.offsetHeight - 148) / 2;
    sheet.style.removeProperty('--sy');
    sheet.classList.toggle('open', open);
    syncPick();
  }
  h.addEventListener('touchstart', down, { passive:false });
  h.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('mouseup', up);
  h.addEventListener('click', function(){
    if (!dragging){ sheet.classList.toggle('open'); syncPick(); }
  });
})();

/* 상세 패널 아래로 밀어 닫기 */
(function(){
  var p = $('detailPanel'), h = $('detailHandle');
  var sy = 0, on = false;
  function down(e){ on = true; sy = (e.touches?e.touches[0].clientY:e.clientY); p.classList.add('drag'); e.preventDefault(); }
  function move(e){
    if (!on) return;
    var dy = Math.max(0, (e.touches?e.touches[0].clientY:e.clientY) - sy);
    p.style.transform = 'translateY(' + dy + 'px)';
  }
  function up(e){
    if (!on) return; on = false; p.classList.remove('drag');
    var dy = parseFloat((p.style.transform.match(/([\d.]+)px/)||[0,0])[1]) || 0;
    p.style.transform = '';
    if (dy > 110) closeDetail();
  }
  h.addEventListener('touchstart', down, { passive:false });
  h.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('mouseup', up);
})();

function lsGet(k, d){ try { return localStorage.getItem(k) || d || ''; } catch(e){ return d || ''; } }
function favs(){
  try { return JSON.parse(localStorage.getItem('hrn_fav') || '[]'); } catch(e){ return []; }
}
function toggleFav(id){
  var f = favs(), k = f.indexOf(id);
  if (k >= 0) f.splice(k, 1); else f.push(id);
  try { localStorage.setItem('hrn_fav', JSON.stringify(f)); } catch(e){}
  return k < 0;
}
function isPremium(){
  try {
    var p = JSON.parse(localStorage.getItem('hrn_premium') || 'null');
    return !!(p && p.until > Date.now());
  } catch(e){ return false; }
}
function bizClick(id, kind){
  if (!id) return;
  try { google.script.run.apiBizClick(id, kind); } catch(e){}
}
function myUid(){
  try {
    var u = localStorage.getItem('hrn_uid');
    if (!u){ u = 'u' + Math.random().toString(36).slice(2, 12); localStorage.setItem('hrn_uid', u); }
    return u;
  } catch(e){ return 'u0'; }
}
function refCode(){
  try {
    var d = JSON.parse(localStorage.getItem('hrn_ref') || 'null');
    if (d && Date.now() - d.t < 30*86400000) return d.c;   // 30일 귀속 창
  } catch(e){}
  return null;
}

/* 준비물 칩 — 제휴 링크가 걸린 도구만 누를 수 있게 만든다 */
function shopChip(name){
  var esc = function(v){ return String(v).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var d = window.__detail;
  var hit = null;
  if (d && d.shop && d.shop.items){
    for (var i = 0; i < d.shop.items.length; i++){
      var it = d.shop.items[i];
      if (!it.u) continue;
      if (name === it.n || String(name).indexOf(it.n) >= 0 || String(it.n).indexOf(name) >= 0){ hit = it; break; }
    }
  }
  if (!hit) return '<span class="chip">' + esc(name) + '</span>';
  return '<a class="chip buy" href="' + esc(hit.u) + '" target="_blank" rel="noopener sponsored nofollow">'
       + esc(name) + ' <em>사기</em></a>';
}

function refEvent(ev){
  var c = refCode();
  if (c && window.google && google.script) try { google.script.run.apiRefEvent(c, ev); } catch(e){}
}
$('bootCount').textContent = BOOT.count;
renderDates();
movePill();
window.addEventListener('resize', movePill);
setTimeout(load, 120);

/* ══════════════ 원픽 접기 — 지도를 가리지 않게 ══════════════ */
function setPickMini(v){ $('pick').classList.toggle('mini', v); }
function pickClosed(){
  try { return localStorage.getItem('hrn_pickoff') === '1'; } catch(e){ return false; }
}
function setPickClosed(v){
  try { v ? localStorage.setItem('hrn_pickoff','1') : localStorage.removeItem('hrn_pickoff'); } catch(e){}
  $('pick').hidden = v || !S.rows.length;
  $('pickRestore').hidden = !v || !S.rows.length;
  $('pickRestore').classList.toggle('hasWant', !!S.want);
}
$('pickClose').onclick = function(e){
  e.stopPropagation();
  setPickClosed(true);
  toast('원픽 카드를 닫았습니다. 위의 ★ 단추로 다시 열 수 있어요');
};
$('pickRestore').onclick = function(){ setPickClosed(false); };
$('pickMin').onclick = function(e){ e.stopPropagation(); setPickMini(!$('pick').classList.contains('mini')); };
$('pick').querySelector('.pick-inner').addEventListener('click', function(){
  if ($('pick').classList.contains('mini')) setPickMini(false);
});
map.on('dragstart', function(){ setPickMini(true); });   // 지도를 만지면 비켜준다

/* ══════════════ 접근 방식 필터 ══════════════ */
$('filters').addEventListener('click', function(e){
  var b = e.target.closest('.fchip');
  if (!b || b.classList.contains('on')) return;
  $('filters').querySelectorAll('.fchip').forEach(function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  S.filter = b.dataset.f;
  S._moved = false;
  load();
});

/* ══════════════ 어종·지점 찾기 ══════════════ */
function movePillIn(seg){
  var act = seg.querySelector('.seg-btn.active'), pill = seg.querySelector('.seg-pill');
  if (!act || !pill) return;
  pill.style.width = act.offsetWidth + 'px';
  pill.style.transform = 'translateX(' + (act.offsetLeft - 4) + 'px)';
}
function openFinder(){
  $('finder').hidden = false;
  S.fmode = S.mode;
  $('fseg').querySelectorAll('.seg-btn').forEach(function(x){
    x.classList.toggle('active', x.dataset.fmode === S.fmode);
  });
  setTimeout(function(){ movePillIn($('fseg')); }, 30);
  loadSpecies();
}
function closeFinder(){ $('finder').hidden = true; }
$('btnSearch').onclick = openFinder;
$('finderScrim').onclick = closeFinder;
$('finderHandle').onclick = closeFinder;
$('fseg').addEventListener('click', function(e){
  var b = e.target.closest('.seg-btn');
  if (!b || b.classList.contains('active')) return;
  $('fseg').querySelectorAll('.seg-btn').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active'); movePillIn($('fseg'));
  S.fmode = b.dataset.fmode;
  loadSpecies();
});

function loadSpecies(){
  var body = $('finderBody');
  body.innerHTML = '<div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div>';
  google.script.run
    .withSuccessHandler(function(list){ renderSpecies(list || []); })
    .withFailureHandler(function(){ body.innerHTML = '<p class="gauge-l" style="padding:20px 4px">목록을 불러오지 못했습니다.</p>'; })
    .apiSpecies(S.ds, S.fmode);
}
function renderSpecies(list){
  var body = $('finderBody'); body.innerHTML = '';
  var g = el('div','spgrid');
  var any = el('div','spcard' + (S.want ? '' : ' on'), '<b>전체</b><span>대상 지정 없음</span>');
  any.onclick = function(){ pickWant(null); };
  g.appendChild(any);
  list.forEach(function(x){
    var cls = 'spcard' + (x.banned ? ' ban' : (x.season >= 2 ? ' peak' : '')) + (S.want === x.n ? ' on' : '');
    var sub = x.banned ? '금어기'
            : x.season >= 3 ? '제철 · ' + x.spots + '곳'
            : x.season === 2 ? '시즌 · ' + x.spots + '곳'
            : x.season > 0  ? x.spots + '곳'
            : '철 아님';
    var c = el('div', cls, '<b>' + x.n + '</b><span>' + sub + '</span>');
    c.onclick = function(){
      if (x.banned){
        var bn = x.ban || {};
        toast(x.n + '은(는) ' + (bn.from ? bn.from + '~' + bn.to + ' ' : '') + '금어기입니다', 3600);
        return;
      }
      pickWant(x.n);
    };
    g.appendChild(c);
  });
  body.appendChild(g);
  var note = el('div','gauge-l','철이 아닌 대상은 아래쪽에 있습니다. 금어기는 눌러도 선택되지 않습니다.');
  note.style.padding = '12px 4px 4px';
  body.appendChild(note);
}
function pickWant(name){
  S.want = name;
  if (name && S.fmode !== S.mode){
    S.mode = S.fmode;
    $('seg').querySelectorAll('.seg-btn').forEach(function(x){
      x.classList.toggle('active', x.dataset.mode === S.mode);
    });
    movePill();
  }
  closeFinder();
  S._moved = false;
  load();
  if (name) toast(name + ' 기준으로 다시 계산합니다');
}
$('wantbarX').onclick = function(){ S.want = null; S._moved = false; load(); };

/* 지점 이름 검색 */
(function(){
  var inp = $('spotQ'), res = $('spotRes'), t = null;
  inp.addEventListener('input', function(){
    clearTimeout(t);
    var q = inp.value.trim();
    if (q.length < 1){ res.innerHTML = ''; return; }
    t = setTimeout(function(){
      google.script.run.withSuccessHandler(function(list){
        res.innerHTML = '';
        if (!list || !list.length){ res.appendChild(el('div','sres','찾는 이름이 없습니다')); return; }
        list.slice(0, 25).forEach(function(x){
          var r = el('div','sres');
          r.innerHTML = '<b>' + x.n + '</b>'
            + (x.curated ? '<span class="badge">정밀</span>' : '<span class="badge auto">자동</span>')
            + '<em>' + (x.r || ({W:'서해',S:'남해',E:'동해',J:'제주'}[x.s] || '')) + '</em>';
          r.onclick = function(){ closeFinder(); openDetail(x.i); };
          res.appendChild(r);
        });
      }).withFailureHandler(function(){ res.innerHTML = ''; }).apiSearch(q);
    }, 260);
  });
})();

})();
