/* Tooltip */
/* Base styles for the element that has a tooltip */

<style>
:root{
  --bg:#04121c; --bg2:#071c2a;
  --glass:rgba(10,28,42,.72); --glass2:rgba(14,36,52,.86);
  --line:rgba(120,190,225,.16); --line2:rgba(120,190,225,.28);
  --txt:#eaf4fb; --mut:#8ba6b8; --mut2:#5f7d8f;
  --acc:#2ee6a8; --acc2:#35d0ff;
  --S:#2ee6a8; --A:#a3e635; --B:#fbbf24; --C:#fb923c; --D:#f87171;
  --r:26px; --r2:18px; --r3:12px;
  --sp:cubic-bezier(.22,1.2,.36,1);
  --safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:'Pretendard Variable',Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--txt);
  font-feature-settings:'tnum';
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0}
h1,h2,h3,h4,p{margin:0}
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--line);
}

/* ── 지도 ─────────────────────────────── */
#map{position:fixed;inset:0;background:var(--bg);z-index:0}
.leaflet-container{background:#04121c;font-family:inherit}
.leaflet-control-attribution{
  background:rgba(4,18,28,.6)!important;color:var(--mut2)!important;
  font-size:9px!important;border-radius:8px 0 0 0;
}
.leaflet-control-attribution a{color:var(--mut)!important}
.leaflet-control-zoom{display:none}

/* 베이스맵 전환 (지도·위성·밝게) — 바텀시트 접힌 높이(148px) 위 */
.leaflet-bottom.leaflet-left{z-index:650}
.leaflet-bottom.leaflet-left .leaflet-control.basesw{
  margin:0 0 calc(162px + var(--safeB)) 12px;
}
.basesw{
  display:flex;gap:3px;padding:4px;
  background:#0a1e2b;border:1px solid rgba(140,200,235,.3);
  border-radius:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.25);
}
.basebtn{
  -webkit-appearance:none;appearance:none;border:0;cursor:pointer;
  padding:8px 13px;border-radius:10px;background:transparent;
  color:#cadeeb;font-family:inherit;font-size:12.5px;font-weight:700;line-height:1;
  letter-spacing:-.2px;transition:background .16s,color .16s;
}
.basebtn:hover{color:#fff;background:rgba(255,255,255,.09)}
.basebtn.on{
  background:linear-gradient(100deg,var(--acc),var(--acc2));color:#04121c;font-weight:800;
  box-shadow:0 2px 9px rgba(46,230,168,.4);
}

/* 위성 모드: 배경이 밝아 핀 테두리·비네트를 강하게 */
body.map-sat .vignette{
  background:
    radial-gradient(120% 58% at 50% 0%,rgba(2,10,16,.82) 0%,transparent 52%),
    radial-gradient(140% 52% at 50% 100%,rgba(2,10,16,.86) 0%,transparent 56%);
}
body.map-sat .pin{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 3px 12px rgba(0,0,0,.6)}
body.map-sat .leaflet-container{background:#0b1a22}

.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 0%,rgba(4,18,28,.9) 0%,transparent 55%),
    radial-gradient(140% 55% at 50% 100%,rgba(4,18,28,.92) 0%,transparent 60%);
}

/* 마커 */
.pin{
  width:38px;height:38px;display:grid;place-items:center;
  border-radius:50%;font-size:12.5px;font-weight:800;letter-spacing:-.3px;
  color:#04121c;border:2px solid rgba(255,255,255,.35);

  position:absolute;left:0;right:0;bottom:0;max-height:92vh;
  border-radius:var(--r) var(--r) 0 0;border-bottom:0;overflow:hidden;
  display:flex;flex-direction:column;animation:up .42s var(--sp);background:var(--glass2);

.seg.mini .seg-btn{padding:6px 15px;font-size:12px}
.finder-body{flex:1;overflow-y:auto;padding:0 14px 8px;min-height:120px}
.finder-body::-webkit-scrollbar{width:0}
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px}
.spcard{
  border-radius:13px;padding:10px 8px;text-align:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.2s var(--sp);
  position:relative;overflow:hidden;
}

.spcard span{display:block;font-size:9.5px;color:var(--mut2);margin-top:3px}

.spcard.ban b{color:#fca5a5;text-decoration:line-through;text-decoration-thickness:1.5px}
.spcard.ban span{color:#fca5a5}

.spcard.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(46,230,168,.28)}

.spotres{max-height:150px;overflow-y:auto;margin-top:8px}

/* ══════════ 상세를 열 때의 움직임 ══════════
   값을 바꾸는 게 아니라 값이 정해지는 과정을 보여준다.
   움직임을 끄도록 설정한 사람에게는 맨 아래에서 전부 무력화한다. */

/* 각 구획이 아래에서 떠오른다 */
@keyframes riseIn{
  from{ opacity:0; transform:translateY(14px) }
  to  { opacity:1; transform:none }
}
.sec.rise,.verdict.rise,.dt-head.rise,.wade.rise,.risk.rise{
  animation:riseIn .75s cubic-bezier(.16,1,.3,1) both;
}

/* 점수 링 — 테두리와 숫자가 함께 차오른다 (그리기는 자바스크립트가 한다) */
@keyframes ringPop{
  0%  { transform:scale(.86) }
  60% { transform:scale(1.04) }
  100%{ transform:scale(1) }
}
.ring.ring-go{ animation:ringPop .95s cubic-bezier(.16,1,.3,1) both }

/* 막대는 전부 0에서 자란다 */
.gauge-t i{ width:0; transition:width 1.4s cubic-bezier(.16,1,.3,1) }
.wade-bar i{ width:0; transition:width 1.6s cubic-bezier(.16,1,.3,1) .18s }

/* 진입·퇴로 시각이 툭 나타난다 */
@keyframes timePop{
  0%  { opacity:0; transform:translateY(6px) scale(.96) }
  100%{ opacity:1; transform:none }
}
.wade-t b.pop{ animation:timePop .75s cubic-bezier(.16,1,.3,1) both }

/* 물때 곡선이 왼쪽부터 그려진다 */
@keyframes drawLine{ to{ stroke-dashoffset:0 } }
.tide-line{
  stroke-dasharray:1400; stroke-dashoffset:1400;
  animation:drawLine 2.3s cubic-bezier(.35,.9,.3,1) .15s forwards;
}
@keyframes fadeUpSvg{ from{ opacity:0 } to{ opacity:1 } }
.tide-area{ animation:fadeUpSvg 1.6s ease .75s both }

/* 추천 구간이 가운데에서 펼쳐진다 */
@keyframes winOpen{
  from{ opacity:0; transform:scaleX(.2) }
  to  { opacity:1; transform:none }
}
.tide-win{ transform-origin:center; animation:winOpen .9s cubic-bezier(.16,1,.3,1) 1.5s both }
.tide-win-lb{ animation:fadeUpSvg .75s ease 1.95s both }

/* 점수표 막대 — 이미 폭이 움직이므로 결만 맞춘다 */
.bar-fl{ transition:width 1.35s cubic-bezier(.16,1,.3,1) }

/* 위험도 숫자에 시선을 한 번 준다 */
@keyframes riskGlow{
  0%,100%{ box-shadow:0 0 0 0 rgba(252,165,165,0) }
  35%    { box-shadow:0 0 0 5px rgba(252,165,165,.16) }
}
.risk.r4.rise .risk-g>div:first-child{ animation:riskGlow 2.2s ease 1.1s 2 }

/* 손이 닿는 곳은 눌리는 느낌을 준다 */
.row{ transition:transform .16s ease, background .16s ease }
.row:active{ transform:scale(.985) }
.joinbox-a,.btn,.chip.buy{ transition:transform .14s ease, filter .14s ease }
.joinbox-a:active,.btn:active,.chip.buy:active{ transform:scale(.96) }

@media (prefers-reduced-motion:reduce){
  .sec.rise,.verdict.rise,.dt-head.rise,.wade.rise,.risk.rise,
  .ring.ring-go,.tide-line,.tide-area,.tide-win,.tide-win-lb,
  .wade-t b.pop,.risk.r4.rise .risk-g>div:first-child{ animation:none!important }
  .gauge-t i,.wade-bar i,.bar-fl{ transition:none!important }
  .tide-line{ stroke-dashoffset:0!important }
}

/* ══════════ 속보 줄 — 최상단, 사이트 톤 ══════════ */

  var out = [];

    if (v > 0) out.push({ n:list[k], v:v });

/**
 * 해루낚 — 조석 · 천문 엔진
 * 1순위: 바다타임(m.badatime.com) 파싱
 * 2순위: 국립해양조사원 오픈API (스크립트 속성에 KHOA_KEY 저장 시)
 * 3순위: 내장 조화 근사 계산 (외부 호출 없음, 항상 동작)
 */

var SYN = 29.530588853;      // 삭망월(일)
var LUNI_DAY = 24.8412;      // 태음일(시간)
var SEMI = 12.4206;          // 반일주조 주기(시간)
var MULTTAE = ['7물','8물','9물','10물','11물','12물','13물','조금','무시','1물','2물','3물','4물','5물','6물'];

function toJD_(d){ return d.getTime()/86400000 + 2440587.5; }

/** 해당 날짜 09시(한국시) 기준 월령 */
function moonAge_(y,m,d){
  var dt = new Date(Date.UTC(y, m-1, d, 3, 0, 0)); // KST 12시 = UTC 03시
  var age = ((toJD_(dt) - 2451550.26) % SYN + SYN) % SYN;
  return age;
}

/** 물때(서해 기준) */
function multtae_(age, sea){
  var lunarDay = Math.round(age) + 1;          // 음력 일자 근사(삭 당일=1일)
  if (lunarDay > 30) lunarDay = 30;
  var idx = (lunarDay - 1) % 15;
  if (sea && sea !== 'W') idx = (idx + 1) % 15;   // 남해·동해·제주는 한 물 앞선 표기
  return { name: MULTTAE[idx], idx: idx, lunarDay: lunarDay };
}

/** 달 밝기 0(그믐)~1(보름) */
function moonBright_(age){
  return (1 - Math.cos(2*Math.PI*age/SYN)) / 2;
}

/** 일출·일몰(한국시 소수 시간) */
function sunTimes_(y,m,d,lat,lon){
  var rad = Math.PI/180;
  var jd = toJD_(new Date(Date.UTC(y, m-1, d, 0,0,0)));
  var lw = -lon;
  var n = Math.round(jd - 2451545.0 - 0.0009 - lw/360);
  var Js = 2451545.0 + 0.0009 + lw/360 + n;
  var M = (357.5291 + 0.98560028*(Js - 2451545.0)) % 360;
  var C = 1.9148*Math.sin(M*rad) + 0.0200*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  var lam = (M + C + 180 + 102.9372) % 360;
  var Jt = Js + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*lam*rad);
  var dec = Math.asin(Math.sin(lam*rad) * Math.sin(23.44*rad));
  var cosW = (Math.sin(-0.833*rad) - Math.sin(lat*rad)*Math.sin(dec)) / (Math.cos(lat*rad)*Math.cos(dec));
  if (cosW > 1) return { rise:null, set:null, noon:12 };     // 극야
  if (cosW < -1) return { rise:0, set:24, noon:12 };         // 백야
  var w = Math.acos(cosW)/rad;
  var f = function(J){ return ((J - Math.floor(jd)) * 24 + 9 + 12) % 24; }; // KST 변환
  return { rise: f(Jt - w/360), set: f(Jt + w/360), noon: f(Jt) };
}

/** 달 남중(한국시 소수 시간) */
function moonTransit_(age, lon){
  var solarNoon = 12 + (135 - lon)/15;
  return ((solarNoon + age * (LUNI_DAY - 24)) % LUNI_DAY + LUNI_DAY) % LUNI_DAY;
}

/**
 * 내장 조석 근사 — 하루치 만조·간조 목록
 * @return {events:[{k:'H'|'L', t:시각(소수), lv:조위cm}], range:조차(m), src:'calc'}
 */
function calcTide_(p, y, mo, d){
  var age = moonAge_(y, mo, d);
  // 조석 지연(age of tide): 사리는 삭·망 당일이 아니라 약 하루 뒤에 온다
  var eff = age - 1.0;
  var phase = 2*Math.PI*eff/SYN;
  var sf = 1 + 0.447*Math.cos(2*phase);                       // 실측 대조로 보정한 계수
  var anom = 1 + 0.05*Math.cos(2*Math.PI*(eff+3)/27.5545);    // 근지점 보정(근사)
  var range = p.mr * sf * anom * 0.94;                        // m
  var msl = p.mr * 100 * 0.78;                           // 평균해면 cm
  var half = range * 100 / 2;

  var base = moonTransit_(age, p.lo) + p.hi;             // 첫 만조
  var ev = [];
  for (var k = -2; k <= 3; k++){
    var th = base + k*SEMI;
    if (th >= 0 && th < 24) ev.push({k:'H', t:th, lv: Math.round(msl + half)});
    var tl = base + k*SEMI + SEMI/2;
    if (tl >= 0 && tl < 24) ev.push({k:'L', t:tl, lv: Math.round(msl - half)});
  }
  ev.sort(function(a,b){ return a.t - b.t; });
  return { events: ev, range: range, src: 'calc' };
}

/** 바다타임 월간 물때표 파싱 → { 'YYYY-MM-DD': {events, range, src:'badatime', mul, weather} } */
function fetchBadatime_(pointId){
  var cache = CacheService.getScriptCache();
  var key = 'bt_' + pointId;
  var hit = cache.get(key);
  if (hit) { try { return JSON.parse(hit); } catch(e){} }

  // 상태 점검 루프가 세운 우회 깃발 — 죽은 소스에 12시간 동안 재시도하지 않는다
  try {
    var down = PropertiesService.getScriptProperties().getProperty('BT_DOWN');
    if (down && Date.now() - Number(down) < 43200000) return null;
  } catch(e){}

  var html;
  try {
    var res = UrlFetchApp.fetch('https://m.badatime.com/' + pointId + '.html', {
      muteHttpExceptions: true,
      followRedirects: true,
      headers: { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' }
    });
    if (res.getResponseCode() !== 200) return null;
    html = res.getContentText('UTF-8');
  } catch(e){ return null; }

  var out = parseBadatime_(html);
  if (!out || !Object.keys(out).length) return null;
  try { cache.put(key, JSON.stringify(out), 21600); } catch(e){}
  return out;
}

    var lv = pairs.map(function(x){ return x.lv; });
    var mid = (Math.max.apply(null,lv) + Math.min.apply(null,lv)) / 2;
    var events = pairs.map(function(x){ return { k: (x.lv >= mid ? 'H' : 'L'), t: x.t, lv: x.lv }; });
    events.sort(function(a,b){ return a.t - b.t; });

    var hi = Math.max.apply(null, lv), lo = Math.min.apply(null, lv);
    var ds = year + '-' + ('0'+month).slice(-2) + '-' + ('0'+day).slice(-2);
    out[ds] = { events: events, range: (hi-lo)/100, src: 'badatime', mul: mulName };
  }
  return out;
}

/** 국립해양조사원 오픈API (선택) */
function fetchKhoa_(p, ds){
  var key = PropertiesService.getScriptProperties().getProperty('KHOA_KEY');
  if (!key || !p.khoa) return null;
  try {
    var url = 'http://www.khoa.go.kr/api/oceangrid/tideObsPreTab/search.do?ServiceKey=' + key +
              '&ObsCode=' + p.khoa + '&Date=' + ds.replace(/-/g,'') + '&ResultType=json';
    var r = UrlFetchApp.fetch(url, {muteHttpExceptions:true});
    if (r.getResponseCode() !== 200) return null;
    var j = JSON.parse(r.getContentText());
    var list = j.result && j.result.data;
    if (!list || !list.length) return null;
    var ev = list.map(function(x){
      var hm = String(x.tph_time).split(' ')[1] || '00:00';
      var a = hm.split(':');
      return { k: (x.hl_code === '고조' || x.hl_code === 'H') ? 'H' : 'L',
               t: parseInt(a[0],10) + parseInt(a[1],10)/60, lv: Math.round(Number(x.tph_level)) };
    });
    ev.sort(function(a,b){ return a.t-b.t; });
    var lv = ev.map(function(x){return x.lv;});
    return { events: ev, range: (Math.max.apply(null,lv)-Math.min.apply(null,lv))/100, src:'khoa' };
  } catch(e){ return null; }
}

/** 지점·날짜 조석 (정밀 요청 시 외부 소스 사용) */
function tideOf_(p, ds, precise){
  if (precise){
    var bt = fetchBadatime_(p.i);
    if (bt && bt[ds]) return bt[ds];
    var kh = fetchKhoa_(p, ds);
    if (kh) return kh;
  }
  var a = ds.split('-');
  return calcTide_(p, +a[0], +a[1], +a[2]);
}


/* ══ Model.gs ══ */
/**
 * 해루낚 — 물리·생태 모형 엔진
 *
 * 점수를 감으로 매기지 않고 아래 모형을 실제로 계산해서 낸다.
 *  1. 선형파 이론      — 파랑이 바닥을 얼마나 흔드는가
 *  2. 재부유 임계      — 그 바닥이 실제로 뜨는가
 *  3. 광 감쇠          — 뜬 흙이 물속 시야를 얼마나 잡아먹는가
 *  4. 조류 유속        — 조차와 조석 위상으로 유속을 낸다
 *  5. 달 위치·솔루나   — 달 남중·하중·월출·월몰의 활성 주기
 *  6. 월광 조도        — 밤에 실제로 얼마나 밝은가 (럭스)
 *  7. 어종 수온 적정   — 종별 사다리꼴 적합도 곡선
 *  8. 기압 경향        — 하강 국면에서 활성이 오른다
 *  9. 갯벌 노출 폭     — 조위 낙차와 갯벌 경사로 드러나는 거리
 * 10. 박명            — 피딩타임의 실제 경계
 */

var G_ACC = 9.80665;

/* ══════════ 1. 선형파 이론 ══════════ */
/** 분산관계 ω² = g·k·tanh(kh) 를 뉴턴 반복으로 풀어 파장을 구한다 */
function waveLength_(T, h){
  if (!T || T <= 0 || !h || h <= 0) return 0;
  var w = 2*Math.PI/T;
  var k = w*w/G_ACC;                       // 심해 근사에서 출발
  for (var n = 0; n < 30; n++){
    var th = Math.tanh(k*h);
    var f  = G_ACC*k*th - w*w;
    var df = G_ACC*th + G_ACC*k*h*(1 - th*th);
    if (Math.abs(df) < 1e-12) break;
    var dk = f/df;
    k -= dk;
    if (k <= 0){ k = w*w/G_ACC; break; }
    if (Math.abs(dk) < 1e-10) break;
  }
  return 2*Math.PI/k;
}
/** 해저 최대 궤도속도 u_b = πH / (T·sinh(kh))  [m/s] */
function bedOrbitalVel_(H, T, h){
  if (!H || H <= 0 || !T || T <= 0 || !h || h <= 0) return 0;
  var L = waveLength_(T, h);
  if (!L) return 0;
  var s = Math.sinh(2*Math.PI*h/L);
  if (s < 1e-6) return 0;
  return Math.PI*H/(T*s);
}

/* ══════════ 2. 재부유 임계 ══════════ */
/** 바닥질별 재부유 임계 유속(m/s) — 조간대 생물막을 감안해 실험값보다 높게 잡았다 */
var U_CRIT   = { mud:0.20, mix:0.25, sand:0.26, rock:0.50, none:0.24 };
/** 잔잔할 때의 기본 부유물 농도(mg/L) — 남해 기준 표다 */
var SSC_BASE = { mud:30,   mix:14,   sand:8,    rock:2.5,  none:11  };
/** 해역 보정 — 같은 갯바위라도 서해와 제주는 물이 다르다.
 *  해양환경정보포털 수질평가지수의 해역별 투명도 기준값
 *  (동해 8.5m · 대한해협 2.5m · 서해중부 1.0m · 제주 8.0m)을
 *  소광식으로 역산해 부유물질 농도로 환산한 비율이다.
 *  환산된 서해 24.2mg/L 는 서해안 갯벌 해역 실측 평균 24.3mg/L 와 거의 같다. */
var SEA_TURB = { W:2.8, S:1.0, E:0.15, J:0.18 };
/** 해역별 시야 상한(m) — 계수가 어긋나도 헛소리가 나가지 않게 마지막에 거는 빗장 */
var VIS_CAP  = { W:5, S:12, E:20, J:25 };
/** 세키 깊이 → 수평 시야 환산. 탁할수록 수평이 더 나빠진다 */
function horizRatio_(secchi){
  var t = Math.max(0, Math.min(1, (secchi - 1) / 9));
  return 0.46 + 0.30 * t;                 // 탁수 0.46 ~ 청수 0.76
}
/** 조간대 작업 수심(m) — 해루질은 무릎~허리 */
var WORK_DEPTH = { mud:1.0, mix:1.2, sand:1.2, rock:1.8, none:1.5 };

function resuspendIdx_(ub, floor){
  return ub / (U_CRIT[floor] || 0.24);
}

/* ══════════ 3. 수중 시야 ══════════ */
/**
 * 부유물 농도에서 광 감쇠를 거쳐 다이버 수평 시정을 추정한다.
 *   Kd = 0.04 + 0.045·SSC        (하방 감쇠계수)
 *   시정 ≈ 1.77 / Kd             (빔 감쇠 c ≈ 2.6·Kd, 시정 ≈ 4.6/c)
 * @param o {wave, period, floor, current, rain24, month, depth}
 * @return {vis, ssc, ub, R, kd, grade, word}
 */
function underwaterVis_(o){
  var floor = o.floor || 'mix';
  var h  = o.depth || WORK_DEPTH[floor] || 1.2;
  var H  = (o.wave === null || o.wave === undefined) ? 0.4 : o.wave;
  var T  = o.period || 5;
  var ub = bedOrbitalVel_(H, T, h);
  var R  = resuspendIdx_(ub, floor);

  var stir  = 1 + 3.5*Math.pow(Math.max(0, R - 1), 1.3);      // 바닥이 뜨는 정도
  var cur   = 1 + 0.55*Math.min(2.5, (o.current || 0)/0.35);  // 조류가 흙을 실어 나른다
  var rain  = 1 + Math.min(2.5, (o.rain24 || 0)/12);          // 육상 유출
  var m = o.month || 6;
  var bloom = (m >= 6 && m <= 9) ? 1.30 : (m >= 4 && m <= 5) ? 1.15 : 1.0;  // 부유생물·적조기

  var sea = o.sea || 'S';
  var ssc = (SSC_BASE[floor] || 11) * (SEA_TURB[sea] || 1) * stir * cur * rain * bloom;
  // 영국 연안 실측 회귀식 kd = 0.1155 + 0.0654·부유물질 (Devlin 외 2009)
  var kd  = 0.12 + 0.065*ssc;
  // 1.7/kd 는 수평 시야가 아니라 세키(투명도) 깊이다. 수평은 그보다 짧다
  var secchi = 1.7/kd;
  var vis = Math.max(0.10, Math.min(VIS_CAP[sea] || 12, secchi * horizRatio_(secchi)));

  var grade, word;
  if (vis >= 6)        { grade = 'S'; word = '훤히 보임'; }
  else if (vis >= 2.5) { grade = 'A'; word = '맑음'; }
  else if (vis >= 1.2) { grade = 'B'; word = '보통'; }
  else if (vis >= 0.5) { grade = 'C'; word = '탁함'; }
  else                 { grade = 'D'; word = '거의 안 보임'; }

  return { vis: vis, secchi: secchi, ssc: ssc, ub: ub, R: R, kd: kd, grade: grade, word: word };
}

/* ══════════ 4. 조류 유속 ══════════ */
/**
 * 연안 정상파 가정 — 만조·간조 순간에 0, 그 중간에서 최대.
 * V최대(m/s) ≈ 0.055 × 조차(m) × 지형계수(kf)
 * kf 는 지점 데이터에 있으면 쓰고, 없으면 2.0 (열린 연안).
 */
function currentAt_(p, tide, hour){
  var ev = (tide.events || []).slice().sort(function(a,b){ return a.t - b.t; });
  if (ev.length < 2) return 0;
  var P = 6.2103, prev = null, next = null;
  for (var k = 0; k < ev.length - 1; k++){
    if (hour >= ev[k].t && hour <= ev[k+1].t){ prev = ev[k]; next = ev[k+1]; break; }
  }
  if (!prev){
    if (hour < ev[0].t){ prev = { t: ev[0].t - P }; next = ev[0]; }
    else { prev = ev[ev.length-1]; next = { t: prev.t + P }; }
  }
  var span = next.t - prev.t;
  if (span <= 0) return 0;
  var ph = (hour - prev.t)/span;
  var vmax = 0.055 * (tide.range || 0) * (p.kf || 2.0);
  return vmax * Math.sin(Math.PI*ph);          // m/s
}
function toKnot_(ms){ return ms * 1.943844; }

/* ══════════ 5. 달 위치와 솔루나 ══════════ */
var RAD = Math.PI/180;
/** 저정밀 달 적경·적위 (Meeus 축약형) */
function moonEq_(jd){
  var d = jd - 2451545.0;
  var L = (218.316 + 13.176396*d) * RAD;
  var M = (134.963 + 13.064993*d) * RAD;
  var F = ( 93.272 + 13.229350*d) * RAD;
  var lam = L + 6.289*RAD*Math.sin(M);
  var bet = 5.128*RAD*Math.sin(F);
  var dist = 385001 - 20905*Math.cos(M);
  var e = 23.4397*RAD;
  var ra  = Math.atan2(Math.sin(lam)*Math.cos(e) - Math.tan(bet)*Math.sin(e), Math.cos(lam));
  var dec = Math.asin(Math.sin(bet)*Math.cos(e) + Math.cos(bet)*Math.sin(e)*Math.sin(lam));
  return { ra: ra, dec: dec, dist: dist };
}
function gmst_(jd){ return (280.16 + 360.9856235*(jd - 2451545.0)) * RAD; }
/** 달 고도(라디안) — 대기굴절 근사 포함 */
function moonAlt_(jd, lat, lon){
  var m = moonEq_(jd);
  var H = gmst_(jd) + lon*RAD - m.ra;
  var la = lat*RAD;
  var sinAlt = Math.sin(la)*Math.sin(m.dec) + Math.cos(la)*Math.cos(m.dec)*Math.cos(H);
  var alt = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  if (alt > -0.05) alt += 0.0029/Math.tan(alt + 0.0032/(alt + 0.089));  // 굴절
  return alt;
}
/** 한국시 소수시각 → 율리우스일 */
function jdOf_(y, mo, d, kstHour){
  return Date.UTC(y, mo-1, d, 0, 0, 0)/86400000 + 2440587.5 + (kstHour - 9)/24;
}
/**
 * 하루치 달 궤적을 훑어 남중·하중·월출·월몰을 찾는다.
 * @return {transit, antiTransit, rise, set}  (한국시 소수시각, 없으면 null)
 */
function moonEvents_(y, mo, d, lat, lon){
  var alt = [], k;
  for (k = 0; k <= 48; k++) alt.push(moonAlt_(jdOf_(y, mo, d, k/2), lat, lon));
  var rise = null, set = null, transit = null, anti = null, best = -9, worst = 9;
  for (k = 0; k < 48; k++){
    var a = alt[k], b = alt[k+1];
    if (a < 0 && b >= 0 && rise === null) rise = (k + (-a)/(b-a))/2;
    if (a >= 0 && b < 0 && set  === null) set  = (k + a/(a-b))/2;
    if (a > best){ best = a; transit = k/2; }
    if (a < worst){ worst = a; anti = k/2; }
  }
  // 극점을 이웃 값으로 다듬는다
  function refine(t){
    if (t === null) return null;
    var lo = Math.max(0, t - 0.5), hi = Math.min(24, t + 0.5), bt = t, bv = -9;
    for (var x = lo; x <= hi; x += 0.05){
      var v = moonAlt_(jdOf_(y, mo, d, x), lat, lon);
      if (v > bv){ bv = v; bt = x; }
    }
    return bt;
  }
  return { rise: rise, set: set, transit: refine(transit), antiTransit: anti };
}
/**
 * 솔루나 — 달 남중·하중이 주 활성기(±1시간), 월출·월몰이 보조 활성기(±0.6시간).
 * 삭·망 근처일수록 강도가 올라간다.
 */
function solunar_(y, mo, d, lat, lon, age){
  var e = moonEvents_(y, mo, d, lat, lon);
  var major = [], minor = [];
  if (e.transit !== null)     major.push([e.transit - 1.0, e.transit + 1.0]);
  if (e.antiTransit !== null) major.push([e.antiTransit - 1.0, e.antiTransit + 1.0]);
  if (e.rise !== null) minor.push([e.rise - 0.6, e.rise + 0.6]);
  if (e.set  !== null) minor.push([e.set  - 0.6, e.set  + 0.6]);
  // 삭(0) 또는 망(14.77)에 가까울수록 1에 근접
  var toNew  = Math.min(age, SYN - age);
  var toFull = Math.abs(age - SYN/2);
  var near   = Math.min(toNew, toFull);
  var strength = Math.max(0.35, 1 - near/5.5);
  return { major: major, minor: minor, strength: strength, ev: e };
}
/** 특정 시각이 활성기에 얼마나 걸쳐 있는가 0~1 */
function solunarAt_(sol, hour){
  var best = 0;
  function chk(w, weight){
    for (var k = 0; k < w.length; k++){
      var a = w[k][0], b = w[k][1];
      for (var sh = -24; sh <= 24; sh += 24){
        var h = hour + sh;
        if (h >= a && h <= b){
          var mid = (a+b)/2, half = (b-a)/2;
          var v = (1 - Math.abs(h - mid)/half*0.45) * weight;
          if (v > best) best = v;
        }
      }
    }
  }
  chk(sol.major, 1.0);
  chk(sol.minor, 0.62);
  return best * sol.strength;
}

/* ══════════ 6. 월광 조도 ══════════ */
/** 밤하늘 조도(럭스). 보름달 천정이 약 0.32럭스, 별빛 바닥은 0.0015럭스 */
function moonLux_(y, mo, d, hour, lat, lon, age){
  var jd = jdOf_(y, mo, d, hour);
  var alt = moonAlt_(jd, lat, lon);
  if (alt <= 0) return 0.0015;
  var f = (1 - Math.cos(2*Math.PI*age/SYN))/2;              // 밝은 면 비율
  var dist = moonEq_(jd).dist;
  var lux = 0.32 * Math.pow(f, 2.0) * Math.sin(alt) * Math.pow(384400/dist, 2);
  return Math.max(0.0015, lux);
}
function luxWord_(lux){
  if (lux >= 0.15) return '보름달급 — 랜턴 없이도 걷는다';
  if (lux >= 0.05) return '반달급 — 지형은 보인다';
  if (lux >= 0.01) return '어스름 — 랜턴 필수';
  return '칠흑 — 문어·낙지에 유리';
}

  '붉바리':[5,12,26,34], '피뿔고둥':[4,18,26,35]
};
/** 0~1 사다리꼴 적합도 */
function thermalFit_(name, sst){
  if (sst === null || sst === undefined) return 0.65;
  var t = THERMAL[name];
  if (!t) return 0.65;
  if (sst <= t[0] || sst >= t[3]) return 0;
  if (sst >= t[1] && sst <= t[2]) return 1;
  if (sst < t[1]) return (sst - t[0])/(t[1] - t[0]);
  return (t[3] - sst)/(t[3] - t[2]);
}

/* ══════════ 8. 기압 경향 ══════════ */
/** 하루 배열에서 해당 시각 앞뒤 기울기(hPa/12h). 음수면 하강 국면 */
function pressTrend_(arr, hour){
  if (!arr || !arr.length) return 0;
  var i = Math.max(0, Math.min(arr.length-1, Math.round(hour)));
  var a = arr[Math.max(0, i-6)], b = arr[Math.min(arr.length-1, i+6)];
  if (a === null || b === null || a === undefined || b === undefined) return 0;
  return b - a;
}
/** 완만한 하강이 가장 좋다. 급강하는 악천후라 오히려 나쁘다 */
function pressScore_(dp){
  if (dp === null || dp === undefined) return 0.6;
  if (dp <= -9) return 0.25;
  if (dp <= -2) return 1.0;
  if (dp <= 0)  return 0.85;
  if (dp <= 3)  return 0.6;
  return 0.4;
}

/* ══════════ 9. 갯벌 노출 폭 ══════════ */
/** 바닥질별 평균 경사 (수직/수평) */
/* 문헌 실측에서 도출한 값으로 고쳤다 (2026-08).
 *   펄   0.0013  곰소만 6m/6km=0.0010 과 강화 남단 9.3m/6km=0.0016 의 사이
 *   혼합 0.0027  천수만 황도 4.41m/1.65km, 보령 학성리 1.7m/600m
 *   모래 0.0060  모래갯벌 폭 약 1km, 서해 중부 대조 조차 약 6m
 *   암반 0.020   직접 실측 근거를 못 찾음. 종전값 유지
 * 근거: MDPI Water 17(23) 3361 · JMSE 11(9) 1697 · 한국해양학회지 학성리
 *       · 서울대 해양저서생태학연구실 · 해양환경정보포털 */
var FLAT_SLOPE = { mud:0.0013, mix:0.0027, sand:0.0060, rock:0.020, none:0.05 };
/* 안전 계산 전용 — 물가가 밀려오는 속도는 경사가 완만할수록 빠르다.
 * 퇴로 시각과 위험도는 「가장 불리한 쪽」으로 잡아야 하므로 종전의 완만한 값을 그대로 쓴다.
 * 드러나는 폭은 위의 실측값으로, 빠져나올 시간은 이 값으로 — 둘을 일부러 갈라 놓았다. */
var SAFE_SLOPE = { mud:0.0009, mix:0.0022, sand:0.0040, rock:0.020, none:0.05 };
function safeSlope_(floor){ return SAFE_SLOPE[floor] || FLAT_SLOPE[floor] || 0.003; }
/** 평균해면에서 저조위까지 떨어질 때 드러나는 수평 거리(m) */
function flatWidth_(mslCm, lowCm, floor){
  var drop = Math.max(0, (mslCm - lowCm))/100;
  return drop / (FLAT_SLOPE[floor] || 0.003);
}

/* ══════════ 9-2. 진입·퇴로 시각 ══════════
 *  갯벌은 "몇 시가 좋다"만으로는 안전하지 않다.
 *  물가까지 걸어 나가는 데 시간이 걸리고, 돌아올 때는 물이 쫓아온다.
 *  그래서 조위 곡선과 걷는 속도를 함께 풀어 진입 시각과 퇴로 시각을 낸다.
 *
 *  조위(저조 기준 상승고)  h(Δt) = (R/2)(1 − cos(π·Δt / 6.21))
 *  드러난 거리            E(t)  = max(0, (H − h) / 경사)
 *  사람 위치              pos(t) = 걷기속도 × 경과시간
 *  안전 조건              언제나  pos(t) + 여유 ≤ E(t)
 */

/** 바닥질별 도보 속도 (m/h) — 펄은 발이 빠져 느리다 */
var WADE_SPEED = { mud:2000, mix:2600, sand:3200, rock:1600, none:2600 };
/** 물가와 유지할 여유 거리(m) */
var WADE_CLEAR = 25;

/** 저조로부터 Δt 시간 떨어진 시점의 조위 상승고(m) */
function tideRise_(dtH, rangeM){
  var T = 6.21;                                  // 저조→만조 반주기(시간)
  var x = Math.min(1, Math.abs(dtH) / T);
  return (rangeM / 2) * (1 - Math.cos(Math.PI * x));
}

/**
 * 진입·퇴로 계산
 * @param lowT   저조 시각(소수 시간, 0~24)
 * @param rangeM 그날 조차(m)
 * @param floor  바닥질 키 (mud/mix/sand/rock)
 * @param widthM 저조 때 드러나는 폭(m)
 * @return {inT, outT, dist, speed, walkMin, workMin, tight, why}
 */
/** 목표 작업 시간(분) — 이만큼도 못 있을 거면 그 거리는 의미가 없다 */
var WADE_TARGET = 90;
var WADE_DMIN   = 80;

function wadePlan_(lowT, rangeM, floor, widthM){
  if (lowT === null || lowT === undefined) return null;
  var v     = WADE_SPEED[floor] || 2600;
  var slope = safeSlope_(floor);            // 퇴로는 불리한 쪽으로 잡는다
  var H     = Math.max(0, widthM) * slope;
  if (!(H > 0)) return null;

  function E(t){
    var h = tideRise_(t - lowT, rangeM);
    return Math.max(0, (H - h) / slope);
  }
  var STEP = 1/12;

  /* 거리 D 를 정하면 진입·퇴로 시각이 정해진다 */
  function windowFor(D){
    function backOk(td){
      for (var t = td; t <= td + 6; t += STEP){
        var pos = D - v * (t - td);
        if (pos <= 0) return true;
        if (pos + WADE_CLEAR > E(t)) return false;
      }
      return true;
    }
    var outT = null;
    for (var td = lowT + 6; td >= lowT - 0.5; td -= STEP){ if (backOk(td)){ outT = td; break; } }

    function outOk(ti){
      for (var t = ti; t <= ti + 6; t += STEP){
        var pos = v * (t - ti);
        if (pos >= D) return true;
        if (pos + WADE_CLEAR > E(t)) return false;
      }
      return true;
    }
    var inT = null;
    for (var ti = lowT - 6; ti <= lowT + 0.5; ti += STEP){ if (outOk(ti)){ inT = ti; break; } }
    if (inT === null || outT === null) return null;

    var walkMin = Math.round(D / v * 60);
    var margin  = Math.min(0.5, 0.25 + walkMin / 600);
    outT = outT - margin;
    if (outT <= inT) return null;
    return {
      D: D, inT: inT, outT: outT, walkMin: walkMin, margin: margin,
      workMin: Math.round((outT - inT) * 60) - walkMin * 2
    };
  }

  /* ── 순서가 중요하다 ──
     예전에는 "걸어서 갈 수 있는 최대 거리"를 먼저 정하고 시간을 계산했다.
     그러면 갯벌 폭이 좁은 곳에서 맨 끝까지 나가라고 해 놓고
     "실제로 잡을 수 있는 시간 13분" 같은 말이 나온다. 쓸모가 없다.

     지금은 거꾸로 한다. 목표 작업 시간(90분)이 나오는
     '가장 먼' 거리를 고른다. 멀리 갈수록 좋지만 시간이 먼저다.        */
  var cap = Math.max(WADE_DMIN, Math.min(widthM, v * 0.42));
  var best = null, chosen = null;
  for (var D = cap; D >= WADE_DMIN; D -= 20){
    var w = windowFor(D);
    if (!w) continue;
    if (!best || w.workMin > best.workMin) best = w;
    if (w.workMin >= WADE_TARGET){ chosen = w; break; }
  }
  var r = chosen || best;
  if (!r) return null;

  var km = function(x){ return x >= 1000 ? (x/1000).toFixed(1) + 'km' : Math.round(x) + 'm'; };
  var why = '편도 ' + km(r.D) + ' 기준 · 걷는 데 한쪽 ' + r.walkMin + '분 · 안전 여유 '
          + Math.round(r.margin * 60) + '분을 뺐습니다';
  if (r.D < cap - 10)
    why += ' (저조 때는 ' + km(widthM) + '까지 드러나지만, 그만큼 나가면 머물 시간이 없어 '
         + km(r.D) + ' 로 잡았습니다)';
  else if (widthM > r.D * 1.25)
    why += ' (저조 때는 ' + km(widthM) + '까지 드러나지만 그렇게 멀리 나가면 물때에 걸립니다)';

  return {
    inT: (r.inT + 24) % 24,
    outT: (r.outT + 24) % 24,
    dist: Math.round(r.D),
    maxWidth: Math.round(widthM),
    speed: v,
    walkMin: r.walkMin,
    workMin: Math.max(0, r.workMin),
    tight: r.workMin < 40,
    why: why
  };
}

/* ══════════ 9-3. 지점 위험도 ══════════
 *  갯벌 고립사고가 왜 뻘에서만 나는지는 물리로 설명된다.
 *
 *  물이 드는 속도(수직)는 어디나 비슷하지만, 물가가 육지 쪽으로
 *  밀려오는 속도(수평)는 바닥 경사에 반비례한다.
 *  뻘은 경사가 1/1000 수준이라, 수직으로 1m 차는 동안
 *  물가는 수평으로 1km를 온다. 모래밭의 네 배가 넘는다.
 *
 *      h(t)  = (R/2)(1 - cos(pi·t/T))        조석 상승
 *      dh/dt = (R·pi / 2T)·sin(pi·t/T)       중간 물때에 최대
 *      물가 전진 속도 = (dh/dt) / 경사
 *
 *  이 값을 사람 걸음 속도로 나눈 것이 rho 다.
 *  rho 가 1을 넘으면 물이 들기 시작한 뒤에 걸어 나와서는 늦는다.
 *  서해 뻘은 조차 7m를 넘으면 rho 가 1을 넘는다. 인천·강화 대조가 여기다.
 *
 *  이 수치는 화면 경고에도 쓰고, 지점별 위험등급 자료로도 내보낸다.
 */
function riskOf_(rangeM, floor){
  var slope = safeSlope_(floor);            // 위험도도 불리한 쪽으로
  var walk  = WADE_SPEED[floor];
  if (!slope || !walk || !(rangeM > 0)) return null;

  var T = 6.21;
  var vWater = rangeM * Math.PI / (2 * T * slope);   // 물가 최대 전진 속도 (m/h)
  var rho    = vWater / walk;

  var grade, label, say;
  if (rho >= 1.0){
    grade = 4; label = '매우 높음';
    say = '중간 물때에는 물가가 걸음보다 빠릅니다. 물이 들기 시작하면 이미 늦습니다.';
  } else if (rho >= 0.6){
    grade = 3; label = '높음';
    say = '물가가 걸음 속도의 ' + Math.round(rho * 100) + '%로 따라옵니다. 여유를 넉넉히 두세요.';
  } else if (rho >= 0.3){
    grade = 2; label = '보통';
    say = '걸어서 빠져나올 수 있는 속도지만 갯골은 먼저 잠깁니다.';
  } else {
    grade = 1; label = '낮음';
    say = '경사가 있어 물가가 천천히 옵니다.';
  }

  return {
    rho: Math.round(rho * 100) / 100,
    water: Math.round(vWater),      // m/h
    walk: walk,                     // m/h
    slope: slope,
    grade: grade,                   // 1~4
    label: label,
    say: say
  };
}

/* ══════════ 9-4. 갯바위 처오름 ══════════
 *  갯바위 사고는 갯벌보다 많다. 최근 5년 638건, 사망 71명.
 *  그런데 원인이 다르다. 갯벌은 물때고, 갯바위는 너울이다.
 *
 *  사람들이 "갑자기 큰 파도가 왔다"고 하는 것은 착각이 아니다.
 *  파고는 유의파고(상위 1/3의 평균)라 개별 파는 그보다 크다.
 *  레일리 분포에서 1000파 중 최대파는 유의파고의 약 1.86배다.
 *
 *      Hmax ≈ 1.86 · Hs
 *      L0   = g·T² / 2π                      심해 파장
 *      ξ    = tanβ / √(Hmax/L0)              이리바렌 수
 *      R    = Hmax · ξ                        헌트(1959) 급경사 밀려오름
 *
 *  핵심은 주기다. 같은 파고 1m라도 주기 6초면 처오름 2.0m,
 *  14초면 4.8m가 된다. 파고만 보는 앱이 놓치는 자리가 여기다.
 *
 *  Hunt, I.A. (1959) Design of seawalls and breakwaters
 *  Longuet-Higgins, M.S. (1952) 파고의 통계 분포
 */
var ROCK_BETA = 0.20;        // 갯바위 앞면 경사 (약 11도)
var WAVE_MAX_RATIO = 1.86;   // 1000파 중 최대파 / 유의파고

function runupOf_(waveM, periodS){
  if (waveM === null || waveM === undefined) return null;
  if (periodS === null || periodS === undefined || !(periodS > 0)) return null;
  if (!(waveM > 0)) waveM = 0.1;

  var Hmax = WAVE_MAX_RATIO * waveM;
  var L0   = 9.81 * periodS * periodS / (2 * Math.PI);
  var xi   = ROCK_BETA / Math.sqrt(Hmax / L0);
  var R    = Hmax * Math.min(xi, 3.0);

  var grade, label, say;
  if (R >= 4.0){
    grade = 4; label = '매우 높음';
    say = '큰 파 하나가 ' + R.toFixed(1) + 'm까지 올라옵니다. 갯바위에 서 있을 높이가 아닙니다.';
  } else if (R >= 2.5){
    grade = 3; label = '높음';
    say = '드물게 오는 큰 파가 ' + R.toFixed(1) + 'm까지 칩니다. 발밑까지 옵니다.';
  } else if (R >= 1.5){
    grade = 2; label = '보통';
    say = '큰 파는 ' + R.toFixed(1) + 'm까지 올라옵니다. 낮은 자리는 피하세요.';
  } else {
    grade = 1; label = '낮음';
    say = '처오름 ' + R.toFixed(1) + 'm. 갯바위 높이면 대체로 넘지 않습니다.';
  }

  return {
    runup: Math.round(R * 10) / 10,        // 처오름 높이 (m)
    hs: Math.round(waveM * 100) / 100,     // 유의파고
    hmax: Math.round(Hmax * 10) / 10,      // 최대파
    period: Math.round(periodS * 10) / 10,
    wavelen: Math.round(L0),
    xi: Math.round(xi * 100) / 100,
    grade: grade,
    label: label,
    say: say,
    swell: periodS >= 9,                   // 장주기 너울
    ratio: Math.round(R / Math.max(0.1, waveM) * 10) / 10
  };
}
/* ══════════ 10. 해안 방위와 바람 방향 ══════════ */
/**
 * 그 자리가 바라보는 바다 방향(방위각, 도).
 * 지점에 az 가 있으면 그것을, 없으면 해역별 근사값을 쓴다.
 * 제주는 섬 중심에서 바깥쪽을 향한 각도로 계산한다.
 */
function shoreAz_(p){
  if (p.az !== undefined && p.az !== null) return p.az;
  if (p.s === 'J'){
    var dy = p.la - 33.37, dx = p.lo - 126.53;
    return ((Math.atan2(dx, dy) * 180/Math.PI) + 360) % 360;   // 중심→지점 = 바다쪽
  }
  return { W: 270, S: 180, E: 90 }[p.s] || 180;
}
/**
 * 바람이 그 자리에 어떻게 걸리는가.
 * wdir 는 바람이 "불어오는" 방향이므로, 바다쪽(az)에서 불어오면 맞바람(온쇼어)이다.
 * @return { on: -1(등바람)~+1(맞바람), word }
 */
function windOnshore_(p, wdir){
  if (wdir === null || wdir === undefined) return { on: 0, word: '' };
  var az = shoreAz_(p);
  var diff = Math.abs(((wdir - az) % 360 + 540) % 360 - 180);  // 0=같은 방향(바다쪽), 180=정반대
  var on = Math.cos(diff * Math.PI/180);                       // +1 맞바람, -1 등바람
  var word = on > 0.5 ? '맞바람' : on < -0.5 ? '등바람' : '옆바람';
  return { on: on, word: word };
}
/**
 * 낚시 관점 바람 종합.
 *  - 등바람: 캐스팅 편하고 발밑 잔잔 — 체감 풍속을 깎아준다
 *  - 약한 맞바람(2~6m/s): 용존산소·베이트가 몰려 활성에 오히려 가점
 *  - 강한 맞바람: 파도가 발밑을 때리고 채비가 안 날아간다 — 크게 감점
 * @return { eff: 체감 풍속, bonus: 활성 가점 0~1, wo }
 */
function windEffect_(p, wind, wdir){
  var wo = windOnshore_(p, wdir);
  if (wind === null || wind === undefined) return { eff: wind, bonus: 0.5, wo: wo };
  var eff = wind * (0.55 + 0.45 * (wo.on + 1) / 2 * 1.6);      // 등바람 0.55배 ~ 맞바람 1.27배
  var bonus = 0.5;
  if (wo.on > 0.3 && wind >= 2 && wind <= 6) bonus = 0.85;      // 알맞은 맞바람
  else if (wo.on > 0.3 && wind > 9) bonus = 0.15;               // 사나운 맞바람
  else if (wo.on < -0.3) bonus = 0.45;                          // 등바람 — 편하지만 활성 무풍
  return { eff: eff, bonus: bonus, wo: wo };
}

/* ══════════ 11. 박명 ══════════ */
/** 태양 고도 alt(도)에 해당하는 시각. -0.833 일출·일몰, -6 시민박명 */
function sunAtAlt_(y, m, d, lat, lon, altDeg){
  var jd = toJD_(new Date(Date.UTC(y, m-1, d, 0,0,0)));
  var lw = -lon;
  var n = Math.round(jd - 2451545.0 - 0.0009 - lw/360);
  var Js = 2451545.0 + 0.0009 + lw/360 + n;
  var M = (357.5291 + 0.98560028*(Js - 2451545.0)) % 360;
  var C = 1.9148*Math.sin(M*RAD) + 0.0200*Math.sin(2*M*RAD) + 0.0003*Math.sin(3*M*RAD);
  var lam = (M + C + 180 + 102.9372) % 360;
  var Jt = Js + 0.0053*Math.sin(M*RAD) - 0.0069*Math.sin(2*lam*RAD);
  var dec = Math.asin(Math.sin(lam*RAD)*Math.sin(23.44*RAD));
  var cosW = (Math.sin(altDeg*RAD) - Math.sin(lat*RAD)*Math.sin(dec)) / (Math.cos(lat*RAD)*Math.cos(dec));
  if (cosW > 1 || cosW < -1) return { rise: null, set: null };
  var w = Math.acos(cosW)/RAD;
  var f = function(J){ return ((J - Math.floor(jd)) * 24 + 9 + 12) % 24; };
  return { rise: f(Jt - w/360), set: f(Jt + w/360) };
}

/* ══════════ 12. 하늘 상태 — 세계기상기구 기상코드 해석 ══════════ */
/**
 * 코드가 험할수록 순위가 높다. 하루 요약에서 "가장 험한 하늘"을 뽑는 데 쓴다.
 * 0 맑음 / 1~3 구름 / 45,48 안개 / 51~57 이슬비 / 61~65 비 / 66,67 얼어붙는 비
 * 71~77 눈 / 80~82 소나기 / 85,86 눈소나기 / 95,96,99 뇌우
 */
var SKY_RANK = {
  0:0, 1:1, 2:2, 3:3,
  45:6, 48:7,
  51:2, 53:3, 55:4, 56:6, 57:7,
  61:3, 63:5, 65:8, 66:8, 67:9,
  71:4, 73:6, 75:8, 77:5,
  80:4, 81:6, 82:9,
  85:6, 86:8,
  95:14, 96:15, 99:16
};

/**
 * 기상코드·시정·강수로 활동 위험을 판정한다.
 * @param code 세계기상기구 코드
 * @param vism 수평 시정(m)
 * @param rainH 그 시각 강수량(mm/h)
 * @param snowH 그 시각 적설(cm)
 * @return {storm, fog, freeze, snow, shower, word, level}
 */
function skyRisk_(code, vism, rainH, snowH){
  var c = (code === null || code === undefined) ? -1 : code;
  var r = {
    storm:  (c >= 95),
    freeze: (c === 66 || c === 67 || c === 56 || c === 57),
    snow:   (c >= 71 && c <= 77) || c === 85 || c === 86 || (snowH || 0) >= 0.3,
    shower: (c >= 80 && c <= 82),
    fog:    (c === 45 || c === 48) || (vism !== null && vism !== undefined && vism < 1000),
    word: '', level: 0
  };
  r.level = SKY_RANK[c] !== undefined ? SKY_RANK[c] : 0;
  if (r.fog && r.level < 6) r.level = 6;

  var rh = rainH || 0;
  if (r.storm)       r.word = '뇌우';
  else if (r.freeze) r.word = '얼어붙는 비';
  else if (r.snow)   r.word = '눈';
  else if (r.fog)    r.word = (vism !== null && vism < 500) ? '짙은 안개' : '안개';
  else if (rh >= 7)  r.word = '강한 비';
  else if (rh >= 2.5)r.word = '비';
  else if (rh >= 0.3)r.word = '약한 비';
  else if (c >= 51 && c <= 57) r.word = '이슬비';
  else r.word = '';
  return r;
}

/* ══════════ 13. 젖은 체감온도 ══════════ */
/**
 * 비를 맞으면 옷이 젖고 증발 냉각이 더해져 체감이 실제보다 훨씬 떨어진다.
 * 갯벌은 바람을 막아줄 것이 없어 이 효과가 그대로 온다.
 *   젖음도 w = 강수 강도로 포화되는 0~1 값
 *   추가 냉각 = w × (2.0 + 1.15×풍속)   [℃]
 * 물속에 들어가는 해루질은 하체가 이미 젖어 있어 기본 젖음도를 깔아준다.
 * @param feel 체감온도(℃)
 * @param wind 풍속(m/s)
 * @param rainH 강수량(mm/h)
 * @param wading 물속 작업 여부
 */
function wetChill_(feel, wind, rainH, wading){
  if (feel === null || feel === undefined) return null;
  var w = 1 - Math.exp(-(rainH || 0) / 1.6);          // 1.6mm/h면 약 절반 젖음
  if (wading) w = Math.max(w, 0.45);                   // 갯벌·물속은 기본 젖음
  var v = (wind === null || wind === undefined) ? 2 : wind;
  var drop = w * (2.0 + 1.15 * Math.min(v, 14));
  return feel - drop;
}

/**
 * 낚시에서 비의 두 얼굴.
 * 약한 비는 수면 파문으로 경계심을 낮추고 육상 먹이를 흘려보내 활성을 올린다.
 * 강한 비는 염분을 흐트러뜨리고 흙탕을 만들어 오히려 입질을 끊는다.
 * @return -1~+1 (활성 보정)
 */
function rainBite_(rainH, cloudPct){
  var r = rainH || 0;
  var b;
  if (r <= 3.0)       b = 0.55 * Math.sin(Math.PI * (r / 3.0));   // 1.5mm/h 부근에서 최고, r=0이면 0
  else if (r <= 8.0)  b = -0.7 * ((r - 3.0) / 5.0);   /* 3mm/h에서 0으로 연속 */
  else                b = -0.7;
  // 흐린 날은 광량이 낮아 경계심이 준다 (농어·감성돔·우럭)
  var cl = (cloudPct === null || cloudPct === undefined) ? 50 : cloudPct;
  b += 0.22 * Math.max(0, (cl - 55) / 45);
  return Math.max(-1, Math.min(1, b));
}

/* ══════════ 14. 섬 들어가는 길 ══════════ */
/**
 * 해루질의 핵심 시간은 간조 전후다. 그런데 섬은 배가 끊긴다.
 * 이 둘이 어긋나는지를 미리 알려주는 것이 이 함수의 목적이다.
 *
 * 연안여객선 운항대는 항로마다 다르므로 보수적인 공통값만 쓴다.
 * 실제 시간표는 예약처에서 확인하라고 안내한다 — 추정한 시각을 단정해서 보여주면
 * 그 시각에 맞춰 나갔다가 배를 놓친다.
 *
 * @param lowT  간조 시각 (시, 소수)
 * @param wave  파고(m)
 * @param wind  풍속(m/s)
 * @param carOk 차량 선적 가능 여부
 * @return {mode, word, risk, riskWord, needStay}
 */
var FERRY_FIRST = 7.5;      // 첫 배 통상 하한
var FERRY_LAST  = 17.5;     // 막배 통상 상한 (겨울은 더 이르다)

function ferryPlan_(lowT, wave, wind, carOk){
  var r = { mode:'', word:'', risk:0, riskWord:'', needStay:false };

  /* 1) 물때와 배 시간이 맞는가 */
  if (lowT === null || lowT === undefined){
    r.mode = 'unknown';
    r.word = '간조 시각을 먼저 확인하세요.';
  } else {
    var lt   = ((lowT % 24) + 24) % 24;
    var from = lt - 1.5, to = lt + 1.5;          // 작업 창
    var inOk  = from >= FERRY_FIRST + 1.0;        // 들어가서 자리 잡을 여유
    var outOk = to   <= FERRY_LAST  - 1.0;        // 나올 배를 탈 여유
    if (inOk && outOk){
      r.mode = 'day';
      r.word = '당일치기가 됩니다. 간조 ' + fmtH_(lt) + ' 전후로 작업하고 오후 배로 나오면 됩니다.';
    } else if (lt >= 19 || lt <= 5){
      r.mode = 'stay';
      r.needStay = true;
      r.word = '간조가 ' + fmtH_(lt) + '입니다. 해루질엔 좋은 시각이지만 그 시간엔 배가 없습니다 — 1박을 잡거나 다른 날을 고르세요.';
    } else {
      r.mode = 'tight';
      r.needStay = true;
      r.word = '간조 ' + fmtH_(lt) + '이라 당일 배로는 빠듯합니다. 첫 배·막배 시각을 확인하고 안 되면 1박 하세요.';
    }
  }

  /* 2) 뜰 수 있는 날인가 — 결항은 파고가 좌우한다 */
  if (wave !== null && wave !== undefined){
    if (wave >= 2.5)      { r.risk = 3; r.riskWord = '결항 가능성이 큽니다'; }
    else if (wave >= 1.5) { r.risk = 2; r.riskWord = '결항될 수 있습니다'; }
    else if (wave >= 1.0) { r.risk = 1; r.riskWord = '운항 여부를 꼭 확인하세요'; }
  }
  if (wind !== null && wind !== undefined && wind >= 14 && r.risk < 3){
    r.risk = 3; r.riskWord = '강풍 — 결항 가능성이 큽니다';
  }

  /* 3) 나가는 배가 끊기면 갇힌다 */
  if (r.risk >= 2 && !r.needStay){
    r.word += ' 들어갔다가 못 나올 수 있으니 돌아오는 배편까지 확인하세요.';
  }
  if (carOk === 0 || carOk === false){
    r.word += ' 차는 두고 들어가야 합니다.';
  }
  return r;
}

/** 날짜가 [from,to] 구간 안인가 — 연말을 넘어가는 구간도 처리 */
function inBanRange_(m, d, from, to){
  var cur = m*100 + d, a = from[0]*100 + from[1], b = to[0]*100 + to[1];
  return a <= b ? (cur >= a && cur <= b) : (cur >= a || cur <= b);
}
function mdText_(x){ return x[0] + '월 ' + x[1] + '일'; }

/**
 * 대상물 하나의 금어기 상태.
 * @param name 채집물·어종 이름
 * @param mo,d 월·일
 * @param region 지점 행정구역 문자열 (예: '인천 옹진')
 * @return null 이면 해당 규정 없음
 *         {banned, from, to, size, unit, note, scope}
 */
function banStatus_(name, mo, d, region){
  region = region || '';
  var rules = (typeof effBans_ === 'function') ? effBans_().list : BANS;
  var local = null, national = null;
  for (var k = 0; k < rules.length; k++){
    var r = rules[k];
    var hit = (r.n === name) || (r.a && r.a.indexOf(name) >= 0);
    if (!hit) continue;
    if (r.rg === '전국'){ if (!national) national = r; }
    else if (region.indexOf(r.rg) >= 0){ local = r; }
  }
  var use = local || national;
  if (!use) return null;
  var banned = use.b ? inBanRange_(mo, d, use.b[0], use.b[1]) : false;
  return {
    banned: banned,
    from: use.b ? mdText_(use.b[0]) : null,
    to:   use.b ? mdText_(use.b[1]) : null,
    size: use.z, unit: use.u,
    note: use.note || '',
    scope: (local ? use.rg : '전국')
  };
}

/** 목록에서 금어기인 것과 아닌 것을 갈라준다 */
function splitByBan_(targets, mo, d, region){
  var ok = [], no = [];
  for (var k = 0; k < targets.length; k++){
    var t = targets[k];
    var st = banStatus_(t.n, mo, d, region);
    t.ban = st;
    if (st && st.banned) no.push(t); else ok.push(t);
  }
  return { ok: ok, banned: no };
}

/**
 * 해루낚 — 원격 데이터 계층
 *
 * 금어기·세부 포인트·지점 정보를 코드가 아니라 저장소의 data/*.json 에서 읽는다.
 * 깃허브에서 JSON 만 고치면 재배포 없이 반영된다 (앱스판 6시간 캐시, 사이트판 즉시).
 *
 * 설정: 스크립트 속성 DATA_BASE 에 사이트 주소를 넣는다.
 *   예) https://<계정>.github.io/haerunak
 * 비어 있으면 이 계층은 조용히 꺼지고 내장 자료만 쓴다.
 */

var REMOTE_CACHE_SEC = 21600;   // 6시간

function dataBase_(){
  try { return PropertiesService.getScriptProperties().getProperty('DATA_BASE') || ''; }
  catch(e){ return ''; }
}

function remoteJson_(name){
  var base = dataBase_();
  if (!base) return null;
  var cache = CacheService.getScriptCache(), k = 'rj_' + name;
  var hit = cache.get(k);
  if (hit){ try { return JSON.parse(hit); } catch(e){} }
  try {
    var r = UrlFetchApp.fetch(base.replace(/\/+$/,'') + '/data/' + name + '.json', { muteHttpExceptions: true });
    if (r.getResponseCode() !== 200) return null;
    var j = JSON.parse(r.getContentText('UTF-8'));
    try { cache.put(k, JSON.stringify(j), REMOTE_CACHE_SEC); } catch(e){}
    return j;
  } catch(e){ return null; }
}

/** 지점 추가·수정 — data/points-extra.json {"points":[{i,n,la,lo,...}]}
 *  같은 번호가 있으면 내장 지점 위에 덮어쓴다(부분 수정 가능). */
function pool_(){
  var j = remoteJson_('points-extra');
  var ex = (j && j.points) || [];
  if (!ex.length) return POINTS;
  var map = {}, out = [];
  POINTS.forEach(function(p){ map[p.i] = p; });
  ex.forEach(function(p){
    if (!p || !p.i) return;
    map[p.i] = map[p.i] ? Object.assign({}, map[p.i], p) : p;
  });
  for (var k in map){
    var p = map[k];
    if (p.la && p.lo && p.mr !== undefined) out.push(p);
  }
  return out;
}

/** 금어기 보정 — data/ban-extra.json {"add":[규칙],"remove":["이름"],"meta":{asOf,warn}} */
function effBans_(){
  var ex = remoteJson_('ban-extra');
  if (!ex) return { list: BANS, meta: BAN_META };
  var rm = ex.remove || [];
  var list = BANS.filter(function(r){ return rm.indexOf(r.n) < 0; }).concat(ex.add || []);
  return { list: list, meta: Object.assign({}, BAN_META, ex.meta || {}) };
}

/* ══ Weather.gs ══ */
/**
 * 해루낚 — 기상·해상 정보
 * Open-Meteo (인증키 불필요, 다지점 일괄 조회 지원)
 * 좌표를 0.4도 격자로 묶어 호출 수를 줄인다.
 */

var WX_CACHE_SEC = 3600;

function gridKey_(la, lo){
  return (Math.round(la/0.4)*0.4).toFixed(1) + ',' + (Math.round(lo/0.4)*0.4).toFixed(1);
}

/**
 * @param points [{la,lo}]
 * @param ds 'YYYY-MM-DD'
 * @return { '격자키': {hourly:{...}, daily:{...}} }
 */
function fetchWeather_(points, ds){
  var cache = CacheService.getScriptCache();
  var cells = {}, order = [];
  points.forEach(function(p){
    var k = gridKey_(p.la, p.lo);
    if (!cells[k]) { cells[k] = { la: +k.split(',')[0], lo: +k.split(',')[1] }; order.push(k); }
  });

  // 캐시 조회
  var need = [];
  var cached = cache.getAll(order.map(function(k){ return 'wx_' + ds + '_' + k; })) || {};
  var out = {};
  order.forEach(function(k){
    var c = cached['wx_' + ds + '_' + k];
    if (c) { try { out[k] = JSON.parse(c); return; } catch(e){} }
    need.push(k);
  });
  if (!need.length) return out;

  // 30개씩 묶어 일괄 조회
  for (var s = 0; s < need.length; s += 30){
    var chunk = need.slice(s, s + 30);
    var lats = chunk.map(function(k){ return cells[k].la; }).join(',');
    var lons = chunk.map(function(k){ return cells[k].lo; }).join(',');
    var land = null, sea = null;

    try {
      var r1 = UrlFetchApp.fetch('https://api.open-meteo.com/v1/forecast'
        + '?latitude=' + lats + '&longitude=' + lons
        + '&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability,weather_code,visibility,snowfall,cloud_cover,wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure'
        + '&timezone=Asia%2FSeoul&start_date=' + ds + '&end_date=' + ds
        + '&wind_speed_unit=ms', { muteHttpExceptions: true });
      if (r1.getResponseCode() === 200) land = JSON.parse(r1.getContentText());
    } catch(e){}

    try {
      var r2 = UrlFetchApp.fetch('https://marine-api.open-meteo.com/v1/marine'
        + '?latitude=' + lats + '&longitude=' + lons
        + '&hourly=wave_height,wave_period,sea_surface_temperature'
        + '&timezone=Asia%2FSeoul&start_date=' + ds + '&end_date=' + ds, { muteHttpExceptions: true });
      if (r2.getResponseCode() === 200) sea = JSON.parse(r2.getContentText());
    } catch(e){}

    var landArr = land ? (Array.isArray(land) ? land : [land]) : [];
    var seaArr  = sea  ? (Array.isArray(sea)  ? sea  : [sea])  : [];

    chunk.forEach(function(k, idx){
      var L = landArr[idx], S = seaArr[idx];
      var rec = {
        temp:  L && L.hourly ? L.hourly.temperature_2m      : null,
        feel:  L && L.hourly ? L.hourly.apparent_temperature : null,
        rain:  L && L.hourly ? L.hourly.precipitation        : null,
        rainP: L && L.hourly ? L.hourly.precipitation_probability : null,
        code:  L && L.hourly ? L.hourly.weather_code         : null,
        vism:  L && L.hourly ? L.hourly.visibility           : null,
        snow:  L && L.hourly ? L.hourly.snowfall             : null,
        cloud: L && L.hourly ? L.hourly.cloud_cover          : null,
        wind:  L && L.hourly ? L.hourly.wind_speed_10m       : null,
        gust:  L && L.hourly ? L.hourly.wind_gusts_10m       : null,
        wdir:  L && L.hourly ? L.hourly.wind_direction_10m   : null,
        pres:  L && L.hourly ? L.hourly.surface_pressure     : null,
        wave:  S && S.hourly ? S.hourly.wave_height          : null,
        wper:  S && S.hourly ? S.hourly.wave_period          : null,
        sst:   S && S.hourly ? S.hourly.sea_surface_temperature : null
      };
      out[k] = rec;
      try { cache.put('wx_' + ds + '_' + k, JSON.stringify(rec), WX_CACHE_SEC); } catch(e){}
    });
  }
  return out;
}

/** 특정 시각(정수 시)의 값 뽑기 — 없으면 하루 평균 */
function wxAt_(rec, hour){
  if (!rec) return {};
  var h = Math.max(0, Math.min(23, Math.round(hour)));
  var g = function(arr){
    if (!arr || !arr.length) return null;
    var v = arr[h];
    if (v === null || v === undefined){
      var s = 0, c = 0;
      for (var k=0;k<arr.length;k++){ if (arr[k] !== null && arr[k] !== undefined){ s += arr[k]; c++; } }
      return c ? s/c : null;
    }
    return v;
  };
  /* 기상코드는 평균 내면 안 되는 범주값 — 해당 시각 값을 그대로 쓴다 */
  var pick = function(arr){
    if (!arr || !arr.length) return null;
    var v = arr[h];
    return (v === null || v === undefined) ? null : v;
  };
  var wind = g(rec.wind);
  var wave = g(rec.wave);
  // 파고 데이터가 없는 연안 격자는 풍속으로 추정
  if (wave === null && wind !== null) wave = Math.max(0.1, Math.pow(wind, 1.6) / 26);
  return {
    temp: g(rec.temp), feel: g(rec.feel), rain: g(rec.rain), cloud: g(rec.cloud),
    rainP: g(rec.rainP), code: pick(rec.code), vism: g(rec.vism), snow: g(rec.snow),
    wind: wind, gust: g(rec.gust), wdir: g(rec.wdir), pres: g(rec.pres),
    wave: wave, wper: g(rec.wper), sst: g(rec.sst)
  };
}

/** 하루 최대/합계 요약 */
function wxDay_(rec){
  if (!rec) return {};
  var mx = function(a){ if(!a||!a.length) return null; var m=-1e9; a.forEach(function(v){ if(v!=null&&v>m)m=v; }); return m===-1e9?null:m; };
  var sm = function(a){ if(!a||!a.length) return null; var s=0; a.forEach(function(v){ if(v!=null)s+=v; }); return s; };
  var worst = function(a){                        /* 가장 험한 기상코드 */
    if (!a || !a.length) return null;
    var m = -1;
    a.forEach(function(v){ if (v != null && SKY_RANK[v] !== undefined && SKY_RANK[v] > m) m = SKY_RANK[v]; });
    return m < 0 ? null : m;
  };
  var mn = function(a){ if(!a||!a.length) return null; var m=1e12; a.forEach(function(v){ if(v!=null&&v<m)m=v; }); return m===1e12?null:m; };
  return { rainSum: sm(rec.rain), windMax: mx(rec.wind), gustMax: mx(rec.gust), waveMax: mx(rec.wave),
           snowSum: sm(rec.snow), skyWorst: worst(rec.code), visMin: mn(rec.vism) };
}

var WDIR = ['북','북북동','북동','동북동','동','동남동','남동','남남동','남','남남서','남서','서남서','서','서북서','북서','북북서'];
function dirName_(deg){
  if (deg === null || deg === undefined) return '';
  return WDIR[Math.round(deg/22.5) % 16];
}


/* ══ Score.gs ══ */
/**
 * 해루낚 — 매력도 종합 분석
 *
 * Model.gs 의 물리·생태 모형을 실제로 계산해서 점수를 낸다.
 * 사용자는 숫자를 해석할 필요가 없다. 결론 문장과 시간창만 보면 된다.
 */

function clamp01_(v){ return v < 0 ? 0 : (v > 1 ? 1 : v); }
function lerpDown_(v, good, bad){
  if (v === null || v === undefined) return 0.6;
  return clamp01_((bad - v) / (bad - good));
}
function band_(v, lo, hi, soft){
  if (v === null || v === undefined) return 0.6;
  if (v >= lo && v <= hi) return 1;
  var d = v < lo ? (lo - v) : (v - hi);
  return clamp01_(1 - d/soft);
}
function fmtH_(h){
  h = ((h % 24) + 24) % 24;
  var m = Math.round(h % 1 * 60), hh = Math.floor(h);
  if (m === 60){ m = 0; hh = (hh + 1) % 24; }
  return ('0'+hh).slice(-2) + ':' + ('0'+m).slice(-2);
}
function fmtRange_(a, b){ return fmtH_(a) + '~' + fmtH_(b); }

var FLOOR_KO = { mud:'펄갯벌', mix:'혼합갯벌', sand:'모래갯벌', rock:'갯바위·돌밭', none:'갯벌 없음' };
var FLOOR_K  = { mud:1.00, mix:1.00, sand:0.92, rock:0.80, none:0.22 };

/** 야간 해루질 기준 간조 하나를 고른다 */
function pickNightLow_(events, sunset){
  var lows = events.filter(function(e){ return e.k === 'L'; });
  if (!lows.length) return null;
  var best = null, bestScore = -1;
  lows.forEach(function(e){
    var t = e.t, sc, after = t - sunset;
    if (after >= -1 && after <= 5) sc = 100 - Math.abs(after - 2) * 6;
    else if (t >= 0 && t < 4.5)    sc = 74 - t * 3;
    else if (t > sunset + 5)       sc = 60;
    else                           sc = 25 - Math.abs(t - 13) * 1.2;
    if (sc > bestScore){ bestScore = sc; best = e; }
  });
  return { ev: best, timing: clamp01_(bestScore/100) };
}

/** 조석 이벤트 ±2시간과 박명 기준 피딩타임의 겹침 */
function feedOverlap_(events, dawn, dusk, sunrise, sunset){
  var win = [];
  if (dawn !== null && sunrise !== null) win.push([dawn, sunrise + 1.2]);
  if (sunset !== null && dusk !== null)  win.push([sunset - 1.2, dusk]);
  var best = { ov: 0, from: null, to: null, ev: null };
  events.forEach(function(e){
    var a = e.t - 2, b = e.t + 2;
    win.forEach(function(w){
      var lo = Math.max(a, w[0]), hi = Math.min(b, w[1]);
      if (hi - lo > best.ov) best = { ov: hi - lo, from: lo, to: hi, ev: e };
    });
  });
  if (!best.ev && events.length){
    var e0 = events[0];
    events.forEach(function(e){ if (Math.abs(e.t - 17) < Math.abs(e0.t - 17)) e0 = e; });
    best = { ov: 0, from: e0.t - 1.5, to: e0.t + 1.5, ev: e0 };
  }
  return best;
}

/** 시간창 안에서 조류 유속이 낚시에 알맞은 정도 */
function flowFit_(p, tide, from, to){
  var best = 0, sum = 0, n = 0;
  for (var t = from; t <= to; t += 0.25){
    var kn = toKnot_(currentAt_(p, tide, ((t % 24) + 24) % 24));
    var f = band_(kn, 0.35, 1.4, 1.1);       // 0.35~1.4노트가 알맞다
    sum += f; n++;
    if (kn > best) best = kn;
  }
  return { fit: n ? sum/n : 0.6, peak: best };
}

/* ══════════════ 핵심 채점기 ══════════════ */
function analyze_(p, ds, tide, wxRec, want){
  var a = ds.split('-'), y = +a[0], mo = +a[1], d = +a[2];
  var sun  = sunTimes_(y, mo, d, p.la, p.lo);
  var tw   = sunAtAlt_(y, mo, d, p.la, p.lo, -6);        // 시민박명
  var age  = moonAge_(y, mo, d);
  var mul  = tide.mul ? { name: tide.mul } : multtae_(age, p.s);
  var ev   = tide.events || [];
  var range = tide.range || 0;
  var relRange = p.mr > 0.05 ? clamp01_(range / (p.mr * 1.48)) : 0;
  var floorK = FLOOR_K[p.f] || 0.7;
  var day = wxDay_(wxRec);

  /* ── 해루질 ─────────────────────────────── */
  var nl   = pickNightLow_(ev, sun.set);
  var lowT = nl ? nl.ev.t : null;
  var hWx  = wxAt_(wxRec, lowT === null ? 21 : lowT);
  var hCur = lowT === null ? 0 : currentAt_(p, tide, lowT);

  // 갯벌 노출 — 조위 낙차와 경사로 실제 드러나는 폭을 낸다
  var msl   = p.mr * 100 * 0.78;
  var lowLv = nl ? nl.ev.lv : msl;
  var width = flatWidth_(msl, lowLv, p.f);
  var wIdx  = clamp01_(Math.log(1 + width/120) / Math.log(1 + 2500/120));
  var expo  = clamp01_((relRange - 0.42) / 0.58);
  var sExpoBase = (0.42*wIdx + 0.34*expo + 0.24*clamp01_(range/3.2)) * floorK;

  // 수중 시야 — 파랑이 바닥을 흔들고, 조류·강우가 흙을 실어 나른다
  var vis = underwaterVis_({
    wave: hWx.wave, period: hWx.wper, floor: p.f, sea: p.s,
    current: Math.abs(hCur), rain24: day.rainSum, month: mo
  });
  /* 시야가 해루질의 성패를 가른다 — 배점에서 가장 큰 자리를 준다.
     다만 절대 미터로 재면 서해는 영원히 꼴찌가 된다. 서해 물은 원래 탁하고,
     서해 사람에게 「제주가 맑다」는 말은 쓸모가 없다. 그래서 그 해역에서
     기대할 수 있는 폭 안에서 오늘이 어느 자리인지로 잰다. */
  var VIS_BAND = { W:[0.10, 2.0], S:[0.20, 5.0], E:[0.60, 12], J:[0.60, 12] };
  var vb = VIS_BAND[p.s] || VIS_BAND.S;
  var visQ = clamp01_((Math.log(vis.vis) - Math.log(vb[0])) / (Math.log(vb[1]) - Math.log(vb[0])));
  /* 시야가 중요한 정도는 바닥질에 따라 다르다.
     갯바위에서 문어·소라를 눈으로 찾는 일은 시야가 전부지만,
     갯벌에서 조개를 파는 일은 물이 빠진 뒤라 시야가 거의 상관없다.
     시야에 안 쓴 배점은 「얼마나 드러나느냐」로 넘긴다 — 그쪽이 성패를 가르기 때문이다. */
  var VIS_W = { rock:1.0, mix:0.75, sand:0.45, mud:0.30, none:0.6 };
  var vw = VIS_W[p.f] !== undefined ? VIS_W[p.f] : 0.7;
  var sVis = 32 * vw * visQ;

  var sTime = 18 * (nl ? nl.timing : 0.3);

  var hWe = windEffect_(p, hWx.wind, hWx.wdir);
  // 작업 시간대의 실제 하늘 — 하루 총량이 아니라 그 시각 값을 본다
  var hSky  = skyRisk_(hWx.code, hWx.vism, hWx.rain, hWx.snow);
  var hChil = wetChill_(hWx.feel, hWx.wind, hWx.rain, true);   // 갯벌은 젖은 채로 선다
  var sSafe = 16 * (0.30*lerpDown_(hWe.eff, 4, 13)
                  + 0.25*lerpDown_(hWx.wave, 0.25, 1.1)
                  + 0.22*band_(hChil === null ? hWx.feel : hChil, 8, 30, 12)
                  + 0.13*lerpDown_(Math.abs(toKnot_(hCur)), 0.6, 2.4)
                  + 0.10*lerpDown_(hSky.level, 2, 9));

  // 대상 활성 — 수온 적정 + 제철 + 야행성 보정
  var hAll = speciesOf_(p, 'haeru');
  var hSeason = inSeason_(hAll, mo, SEASON_SP);
  var hTherm = 0;
  hSeason.forEach(function(t){ var v = thermalFit_(t.n, hWx.sst); if (v > hTherm) hTherm = v; });
  var lux = moonLux_(y, mo, d, lowT === null ? 21 : lowT, p.la, p.lo, age);
  // 구름이 달을 가리면 실제 노출 조도는 크게 떨어진다 (야행성 대상에 유리)
  if (hWx.cloud !== null && hWx.cloud !== undefined) lux *= (1 - 0.78 * Math.min(1, hWx.cloud/100));
  var nocturn = clamp01_(1 - Math.min(1, lux/0.22)*0.45) ;   // 어두울수록 문어·낙지 유리
  var sLive = 8 * (0.5*hTherm + 0.28*clamp01_((hSeason.length ? hSeason[0].v : 1)/3) + 0.22*nocturn);

  // 시야에서 남은 배점을 노출로 옮긴다 — 총점은 100 그대로다
  var sExpo = (26 + 32*(1 - vw)) * sExpoBase;
  var hRaw = sExpo + sVis + sTime + sSafe + sLive;

  // 안전 게이트
  var hCap = 100;
  if (hWx.wave !== null){
    if (hWx.wave >= 1.5) hCap = Math.min(hCap, 26);
    else if (hWx.wave >= 1.1) hCap = Math.min(hCap, 44);
    else if (hWx.wave >= 0.8) hCap = Math.min(hCap, 60);
  }
  if (hWx.wind !== null){
    if (hWe.eff >= 12) hCap = Math.min(hCap, 28);
    else if (hWe.eff >= 9) hCap = Math.min(hCap, 50);
  }
  if (Math.abs(toKnot_(hCur)) >= 2.2) hCap = Math.min(hCap, 38);
  if (day.rainSum !== null && day.rainSum >= 20) hCap = Math.min(hCap, 40);
  if (hWx.rain !== null && hWx.rain >= 4) hCap = Math.min(hCap, 34);     // 작업 시간에 쏟아짐
  // 뇌우 — 갯벌 한가운데서는 사람이 가장 높은 물체다. 점수가 아니라 금지에 가깝다
  if (hSky.storm) hCap = Math.min(hCap, 8);
  // 안개 — 갯벌 고립 사고의 첫째 원인은 방향 상실이다
  if (hSky.fog) hCap = Math.min(hCap, hWx.vism !== null && hWx.vism < 500 ? 18 : 32);
  if (hSky.freeze) hCap = Math.min(hCap, 20);
  if (hSky.snow) hCap = Math.min(hCap, 38);
  if (hChil !== null && hChil <= 0) hCap = Math.min(hCap, 26);           // 젖은 채 저체온
  if (hWx.feel !== null && hWx.feel <= 2) hCap = Math.min(hCap, 42);
  /* 시야 게이트는 「물속에 들어가 눈으로 찾는」 방식에만 건다.
     물 빠진 갯벌에서 조개를 파는 데는 시야가 상관없고,
     서해 물은 원래 탁해서 여기에 절대 기준을 걸면 서해가 통째로 막힌다.
     그래서 그 해역에서 기대할 수 있는 폭의 아래쪽에 걸렸을 때만 잠근다. */
  if ((p.f === 'rock' || p.f === 'mix') && vis.vis < vb[0] * 1.6)
    hCap = Math.min(hCap, 45);
  if (p.f === 'none') hCap = Math.min(hCap, 28);
  var hScore = Math.round(Math.min(hRaw, hCap));

  var hWhy = [], hWarn = [];
  if (wIdx > 0.7) hWhy.push('갯벌이 ' + (width >= 1000 ? (width/1000).toFixed(1) + 'km' : Math.round(width/10)*10 + 'm') + ' 가량 드러남');
  if (expo > 0.72) hWhy.push('사리 물때 (' + mul.name + ')');
  else if (expo < 0.3) hWarn.push('조금 물때 — 얕게만 빠짐');
  if (nl && nl.timing > 0.8) hWhy.push('간조가 밤 시간대에 딱 걸림');
  else if (nl && nl.timing < 0.45) hWarn.push('간조가 낮이라 야간 작업 창이 짧음');
  if (vis.vis >= 2) hWhy.push('수중 시야 ' + vis.vis.toFixed(1) + 'm — ' + vis.word);
  else if (vis.vis < 0.6) hWarn.push('수중 시야 ' + Math.round(vis.vis*100) + 'cm — ' + vis.word);
  if (vis.R > 1.4) hWarn.push('파랑이 바닥을 흔들어 흙탕물');
  if (lux < 0.02) hWhy.push('달 없는 밤 — 문어·낙지 활동 좋음');
  else if (lux > 0.18) hWarn.push('달이 밝아 야행성 대상이 숨음');
  // 낮 물때에 야행성 대상을 노리고 나가면 헛걸음이다 — 분명히 적는다
  if (daylightAt_(lowT, sun) >= 1)
    hWarn.push('간조가 대낮 — 낙지·문어·주꾸미·꽃게는 이 시각엔 숨어 있습니다');
  if (Math.abs(toKnot_(hCur)) >= 1.6) hWarn.push('조류 ' + Math.abs(toKnot_(hCur)).toFixed(1) + '노트 — 발 밑 조심');
  if (hWx.wind !== null && hWe.eff >= 9) hWarn.push((hWe.wo.word||'바람') + ' ' + Math.round(hWx.wind) + 'm/s — 체온 손실·물결 주의');
  if (p.f === 'none') hWarn.push('조차가 작아 갯벌 노출이 거의 없음');
  // 하늘 — 작업 시간대 기준
  if (hSky.storm) hWarn.unshift('뇌우 예보 — 갯벌에서는 사람이 가장 높은 물체입니다. 나가지 마세요');
  else if (hSky.fog) hWarn.unshift('안개' + (hWx.vism !== null ? ' (시정 ' + Math.round(hWx.vism) + 'm)' : '')
                                   + ' — 갯벌에서 방향을 잃으면 고립됩니다');
  else if (hSky.freeze) hWarn.unshift('얼어붙는 비 — 갯바위·경사로 결빙');
  else if (hSky.snow) hWarn.push('눈 — 발판이 미끄럽고 갯벌 경계가 안 보임');
  else if (hWx.rain !== null && hWx.rain >= 4) hWarn.push('작업 시간에 시간당 ' + hWx.rain.toFixed(1) + 'mm 비 — 젖고 흙탕물 짐');
  else if (hWx.rain !== null && hWx.rain >= 0.3) hWarn.push(hSky.word + ' 예보 — 여벌 옷과 방수 준비');
  if (hChil !== null && hWx.feel !== null && hChil <= hWx.feel - 3){
    hWarn.push('젖으면 체감 ' + Math.round(hChil) + '도까지 떨어짐 (기상 체감 ' + Math.round(hWx.feel) + '도)');
  }
  if (day.rainSum !== null && day.rainSum >= 10 && (hWx.rain === null || hWx.rain < 1)){
    hWarn.push('낮에 ' + Math.round(day.rainSum) + 'mm 내려 흙탕물 유입 — 시야는 기대 이하');
  }
  // 안전 경고는 반드시 '왜'를 달고 나간다 — 이유 없는 경고는 무시당한다
  if (hCap <= 45){
    var hRsn = hSky.storm ? '뇌우'
             : hSky.fog ? '안개'
             : hSky.freeze ? '결빙'
             : (hWx.wave !== null && hWx.wave >= 0.8) ? '파고 ' + hWx.wave.toFixed(1) + 'm'
             : (hWx.wind !== null && hWe.eff >= 9) ? '바람 ' + Math.round(hWe.eff) + 'm/s'
             : (Math.abs(toKnot_(hCur)) >= 2.2) ? '조류 ' + Math.abs(toKnot_(hCur)).toFixed(1) + '노트'
             : (hChil !== null && hChil <= 0) ? '저체온'
             : (day.rainSum !== null && day.rainSum >= 20) ? '비 ' + Math.round(day.rainSum) + 'mm'
             : hSky.snow ? '눈'
             : ((p.f === 'rock' || p.f === 'mix') && vis.vis < vb[0] * 1.6) ? '시야 없음' : '';
    hWarn.unshift('안전 경고' + (hRsn ? ' (' + hRsn + ')' : '') + ' — 오늘 이 지점 입수는 권하지 않습니다');
  }

  /* ── 낚시 ───────────────────────────────── */
  var fo   = feedOverlap_(ev, tw.rise, tw.set, sun.rise, sun.set);
  var fMid = (fo.from + fo.to)/2;
  var fWx  = wxAt_(wxRec, ((fMid % 24) + 24) % 24);
  var sol  = solunar_(y, mo, d, p.la, p.lo, age);
  var solV = solunarAt_(sol, ((fMid % 24) + 24) % 24);
  var flow = flowFit_(p, tide, fo.from, fo.to);
  var visF = underwaterVis_({ wave: fWx.wave, period: fWx.wper, floor: p.f, sea: p.s,
                              current: flow.peak/1.94, rain24: day.rainSum, month: mo, depth: 3 });

  var fSky  = skyRisk_(fWx.code, fWx.vism, fWx.rain, fWx.snow);
  var fBite = rainBite_(fWx.rain, fWx.cloud);   // 약한 비·흐림은 오히려 가점
  var sFeed = 28 * clamp01_(0.30 + (fo.ov > 0 ? fo.ov/3.2*0.40 : 0) + solV*0.30 + fBite*0.16);
  var sFlow = 18 * (p.mr > 0.4 ? (0.6*flow.fit + 0.4*band_(relRange, 0.5, 0.92, 0.42)) : 0.68);
  // 바람은 방향까지 본다 — 등바람은 체감을 깎고, 알맞은 맞바람은 활성 가점
  var we = windEffect_(p, fWx.wind, fWx.wdir);
  var fChil = wetChill_(fWx.feel, fWx.wind, fWx.rain, false);   // 낚시는 물에 안 들어간다
  var sSea  = 20 * (0.48*lerpDown_(fWx.wave, 0.25, 1.8)
                  + 0.28*lerpDown_(we.eff, 3.5, 13)
                  + 0.10*we.bonus
                  + 0.14*band_(fChil === null ? fWx.feel : fChil, 4, 30, 10));

  var fAll = speciesOf_(p, 'fish');
  var fSeason = inSeason_(fAll, mo, SEASON_FX);
  var fTherm = 0, fBestName = null;
  fSeason.forEach(function(t){
    var v = thermalFit_(t.n, fWx.sst) * (0.6 + t.v*0.1333);
    if (v > fTherm){ fTherm = v; fBestName = t.n; }
  });
  var sSst = 16 * clamp01_(fTherm);

  var dp = pressTrend_(wxRec ? wxRec.pres : null, fMid);
  var sPres = 8 * pressScore_(dp);
  // 물색 — 맑을수록 좋다 (0.3m에서 0점, 6m 이상이면 만점)
  var sTurb = 10 * clamp01_((Math.log(Math.max(0.05, visF.vis)) - Math.log(0.3)) / (Math.log(6) - Math.log(0.3)));

  var fRaw = sFeed + sFlow + sSea + sSst + sPres + sTurb;
  var fCap = 100;
  if (fWx.wave !== null){
    if (fWx.wave >= 2.5) fCap = Math.min(fCap, 20);
    else if (fWx.wave >= 1.8) fCap = Math.min(fCap, 36);
    else if (fWx.wave >= 1.3) fCap = Math.min(fCap, 54);
  }
  if (fWx.wind !== null){
    if (we.eff >= 14) fCap = Math.min(fCap, 28);
    else if (we.eff >= 11) fCap = Math.min(fCap, 48);
  }
  if (day.rainSum !== null && day.rainSum >= 30) fCap = Math.min(fCap, 42);
  if (fWx.rain !== null && fWx.rain >= 8) fCap = Math.min(fCap, 38);
  // 낚싯대는 탄소 — 뇌우에는 들지 않는다
  if (fSky.storm) fCap = Math.min(fCap, 10);
  if (fSky.fog) fCap = Math.min(fCap, fWx.vism !== null && fWx.vism < 500 ? 30 : 52);
  if (fSky.freeze) fCap = Math.min(fCap, 24);   // 갯바위 결빙
  if (fChil !== null && fChil <= -2) fCap = Math.min(fCap, 32);
  var fScore = Math.round(Math.min(fRaw, fCap));

  var fWhy = [], fWarn = [];
  if (fo.ov > 1.2) fWhy.push('물돌이와 피딩타임이 겹침');
  else if (fo.ov > 0) fWhy.push('물돌이가 여명·황혼에 걸림');
  else fWarn.push('물돌이와 피딩타임이 어긋남');
  if (solV > 0.62) fWhy.push('달 활동기(솔루나)와 겹침');
  if (flow.fit > 0.72) fWhy.push('조류 ' + flow.peak.toFixed(1) + '노트 — 알맞음');
  else if (flow.peak > 2.2) fWarn.push('조류 ' + flow.peak.toFixed(1) + '노트 — 채비가 안 섬');
  else if (flow.peak < 0.25 && p.mr > 0.4) fWarn.push('조류 거의 없음 — 입질 뜸함');
  if (fBestName && fTherm > 0.75) fWhy.push('수온이 ' + fBestName + '에 맞음');
  if (fWx.sst !== null && fTherm < 0.35) fWarn.push('수온 ' + fWx.sst.toFixed(1) + '도 — 대상어 적정에서 벗어남');
  if (dp <= -2 && dp > -9) fWhy.push('기압 하강 국면 — 활성 상승');
  else if (dp <= -9) fWarn.push('기압 급강하 — 날씨가 무너지는 중');
  if (fWx.wave !== null && fWx.wave >= 1.5) fWarn.push('파고 ' + fWx.wave.toFixed(1) + 'm — 갯바위 출조 금지 수준');
  else if (fWx.wave !== null && fWx.wave <= 0.5) fWhy.push('바다 잔잔함');
  if (we.wo.word && fWx.wind !== null && fWx.wind >= 3){
    if (we.wo.on > 0.3 && fWx.wind >= 8) fWarn.push('맞바람 ' + Math.round(fWx.wind) + 'm/s — 파도가 발밑을 때리고 채비가 안 날아감');
    else if (we.wo.on > 0.3 && fWx.wind <= 6) fWhy.push('알맞은 맞바람 — 베이트가 연안으로 몰림');
    else if (we.wo.on < -0.3 && fWx.wind >= 8) fWhy.push('등바람이라 체감 바람 덜함, 캐스팅 편함');
  }
  if (fWx.wind !== null && we.eff >= 11) fWarn.push('체감 바람 ' + Math.round(we.eff) + 'm/s — 캐스팅 어려움');
  if (visF.vis >= 3) fWhy.push('물색 맑음 (시야 ' + visF.vis.toFixed(1) + 'm)');
  else if (visF.vis < 0.6) fWarn.push('물이 탁함 (시야 ' + Math.round(visF.vis*100) + 'cm) — 루어 시인성 낮음');
  // 하늘 — 피딩타임 기준
  if (fSky.storm) fWarn.unshift('뇌우 예보 — 낚싯대는 탄소 도체입니다. 출조 금지');
  else if (fSky.fog) fWarn.unshift('안개' + (fWx.vism !== null ? ' (시정 ' + Math.round(fWx.vism) + 'm)' : '')
                                   + ' — 선상·갯바위 모두 위험');
  else if (fSky.freeze) fWarn.unshift('얼어붙는 비 — 갯바위 결빙, 진입 금지');
  else if (fSky.snow) fWarn.push('눈 — 발판 미끄러움');
  if (fBite > 0.35) fWhy.push(fWx.rain >= 0.3 ? '약한 비 — 수면이 깨져 경계심이 낮아짐' : '흐린 하늘 — 광량이 낮아 활성 좋음');
  else if (fWx.rain !== null && fWx.rain >= 8) fWarn.push('시간당 ' + fWx.rain.toFixed(1) + 'mm 폭우 — 염분이 흐트러지고 입질이 끊김');
  else if (fWx.rain !== null && fWx.rain >= 3) fWarn.push('제법 내리는 비 — 물색 탁해짐');
  if (fChil !== null && fWx.feel !== null && fChil <= fWx.feel - 3){
    fWarn.push('비바람에 체감 ' + Math.round(fChil) + '도 — 방한·방수 필수');
  }
  if (fCap <= 40){
    var fRsn = fSky.storm ? '뇌우'
             : fSky.freeze ? '갯바위 결빙'
             : fSky.fog ? '안개'
             : (fWx.wave !== null && fWx.wave >= 1.3) ? '파고 ' + fWx.wave.toFixed(1) + 'm'
             : (fWx.wind !== null && we.eff >= 11) ? '바람 ' + Math.round(we.eff) + 'm/s'
             : (fWx.rain !== null && fWx.rain >= 8) ? '폭우'
             : (day.rainSum !== null && day.rainSum >= 30) ? '비 ' + Math.round(day.rainSum) + 'mm'
             : (fChil !== null && fChil <= -2) ? '한파' : '';
    fWarn.unshift('안전 경고' + (fRsn ? ' (' + fRsn + ')' : '') + ' — 갯바위·선상 모두 위험 수준');
  }

  /* ── 대상물과 금어기 ────────────────────── */
  /* 야행성 대상은 낮 물때에 앞세우면 안 된다.
     낙지·문어·주꾸미·꽃게는 낮에 펄과 돌 밑에 숨어 있어, 물이 아무리 잘 빠져도
     대낮에 걸어다녀서는 나오지 않는다. 점수에만 반영하고 목록은 그대로 두면
     "낮 10시에 꽃게" 같은 헛걸음 추천이 나간다. */
  var hSplit = splitByBan_(demoteNocturnal_(hSeason, lowT, sun).slice(0, 6), mo, d, p.r);
  var fSplit = splitByBan_(fSeason.slice(0, 6), mo, d, p.r);
  var hTargets = hSplit.ok.slice(0, 4), fTargets = fSplit.ok.slice(0, 4);
  if (!hTargets.length && hSplit.banned.length) hTargets = [];
  if (!hTargets.length && !hSplit.banned.length) hTargets = hAll.slice(0,2).map(function(n){return {n:n,v:1};});
  if (!fTargets.length && !fSplit.banned.length) fTargets = fAll.slice(0,2).map(function(n){return {n:n,v:1};});

  // 금어기라 못 잡는 게 있으면 그만큼 매력이 떨어진다
  if (hSplit.banned.length && !hTargets.length) hScore = Math.min(hScore, 34);
  if (fSplit.banned.length && !fTargets.length) fScore = Math.min(fScore, 34);

  var hWindow = lowT === null ? null : [lowT - 1.5, lowT + 1.5];
  var fWindow = [fo.from, fo.to];

  /* ── 어종 지정 검색 보정 ────────────────── */
  var wantInfo = null;
  if (want){
    wantInfo = applyWant_(p, want, mo, d, hAll, fAll, hWx, fWx, hSeason, fSeason);
    if (wantInfo.kind === 'haeru'){ hScore = Math.round(hScore * wantInfo.mul); }
    else if (wantInfo.kind === 'fish'){ fScore = Math.round(fScore * wantInfo.mul); }
  }

  return {
    meta: {
      date: ds, mul: mul.name, lunarDay: multtae_(age, p.s).lunarDay,
      moonBright: Math.round(moonBright_(age)*100), moonLux: Math.round(lux*1000)/1000,
      luxWord: luxWord_(lux),
      range: Math.round(range*100)/100, src: tide.src,
      sunrise: sun.rise, sunset: sun.set, dawn: tw.rise, dusk: tw.set,
      events: ev, floor: FLOOR_KO[p.f] || '',
      ferry: p.isl ? ferryPlan_(lowT, hWx.wave, hWx.wind, p.fr ? p.fr[2] : 1) : null,
      vis: Math.round(vis.vis*100)/100, visWord: vis.word, ssc: Math.round(vis.ssc),
      flatWidth: Math.round(width),
      wade: (typeof wadePlan_ === 'function') ? wadePlan_(lowT, range, p.f, width) : null,
      risk: (typeof riskOf_ === 'function') ? riskOf_(range, p.f) : null,
      runup: (typeof runupOf_ === 'function') ? runupOf_(fWx.wave, fWx.wper) : null,
      curPeak: Math.round(flow.peak*100)/100,
      solunar: { major: sol.major, minor: sol.minor, strength: Math.round(sol.strength*100),
                 moonrise: sol.ev.rise, moonset: sol.ev.set, transit: sol.ev.transit },
      press: Math.round(dp*10)/10,
      wx: { temp: hWx.temp, wind: fWx.wind, wave: fWx.wave, sst: fWx.sst,
            cloud: fWx.cloud, rain: fWx.rain, wdir: dirName_(fWx.wdir),
            onshore: we.wo.word, effWind: we.eff !== null && we.eff !== undefined ? Math.round(we.eff*10)/10 : null,
            sky: fSky.word, skyH: hSky.word, storm: hSky.storm || fSky.storm, fog: hSky.fog || fSky.fog,
            rainDay: day.rainSum === null ? null : Math.round(day.rainSum*10)/10,
            rainP: fWx.rainP === null || fWx.rainP === undefined ? null : Math.round(fWx.rainP),
            vism: fWx.vism === null || fWx.vism === undefined ? null : Math.round(fWx.vism),
            chillH: hChil === null ? null : Math.round(hChil*10)/10,
            chillF: fChil === null ? null : Math.round(fChil*10)/10 },
      banned: { haeru: hSplit.banned, fish: fSplit.banned },
      banMeta: (typeof banMetaNow_==='function' ? banMetaNow_() : BAN_META)
    },
    haeru: {
      score: Math.max(0, Math.min(100, hScore)), raw: Math.round(Math.min(hRaw,hCap)*100)/100,
      grade: grade_(hScore), window: hWindow, lowTime: lowT, lowLevel: nl ? nl.ev.lv : null,
      why: hWhy, warn: hWarn, targets: hTargets, bannedTargets: hSplit.banned,
      parts: { 시야: Math.round(sVis), 노출: Math.round(sExpo), 타이밍: Math.round(sTime),
               안전: Math.round(sSafe), 활성: Math.round(sLive) },
      verdict: verdictHaeru_(p, hScore, hWindow, hTargets, vis, hSplit.banned)
    },
    fish: {
      score: Math.max(0, Math.min(100, fScore)), raw: Math.round(Math.min(fRaw,fCap)*100)/100,
      grade: grade_(fScore), window: fWindow, pivot: fo.ev ? { k: fo.ev.k, t: fo.ev.t } : null,
      why: fWhy, warn: fWarn, targets: fTargets, bannedTargets: fSplit.banned,
      parts: { 피딩: Math.round(sFeed), 조류: Math.round(sFlow), 해상: Math.round(sSea),
               수온: Math.round(sSst), 기압: Math.round(sPres), 물색: Math.round(sTurb) },
      verdict: verdictFish_(p, fScore, fWindow, fTargets, fo, flow)
    },
    want: wantInfo
  };
}

/** 어종을 지정했을 때의 배수와 설명 */
function applyWant_(p, want, mo, d, hAll, fAll, hWx, fWx, hSeason, fSeason){
  var isH = hAll.indexOf(want) >= 0, isF = fAll.indexOf(want) >= 0;
  if (!isH && !isF) return { kind:null, mul:0.12, has:false, reason: want + '을(를) 노릴 자리가 아닙니다' };
  var kind = isH ? 'haeru' : 'fish';
  var table = isH ? SEASON_SP : SEASON_FX;
  var sst = isH ? hWx.sst : fWx.sst;
  var seasonV = table[want] ? table[want][mo-1] : 1;
  var th = thermalFit_(want, sst);
  var ban = banStatus_(want, mo, d, p.r);
  var mul = (0.35 + 0.45*clamp01_(seasonV/3) + 0.20*th);
  var reason;
  if (ban && ban.banned){
    mul = 0.05;
    reason = want + '은(는) ' + ban.from + '~' + ban.to + ' 금어기입니다 (' + ban.scope + ')';
  } else if (seasonV === 0) reason = want + ' 철이 아닙니다';
  else if (seasonV >= 3)    reason = want + ' 제철';
  else                      reason = want + ' 시즌 초입';
  return { kind: kind, mul: mul, has: true, season: seasonV, thermal: Math.round(th*100),
           ban: ban, reason: reason, name: want };
}

function grade_(s){
  if (s >= 88) return 'S';
  if (s >= 76) return 'A';
  if (s >= 62) return 'B';
  if (s >= 46) return 'C';
  return 'D';
}

/* ══════════ 야행성 보정 ══════════
 * 작업 시간대(간조 앞뒤)가 훤한 낮이면 야행성 대상을 뒤로 미룬다.
 * 아예 지우지는 않는다 — 물때가 밤으로 넘어가는 날을 고르라는 뜻이지
 * 그 자리에 아예 없다는 뜻은 아니기 때문이다. */
var NOCTURNAL = { '낙지':1, '문어':1, '주꾸미':1, '꽃게':1, '박하지':1,
                  '왕밤송이게':1, '톱날꽃게':1, '갯가재':1, '대수리':1 };
function isNocturnal_(n){ return !!NOCTURNAL[n]; }

/* 간조 시각이 낮 한복판이면 1, 완전한 밤이면 0 */
function daylightAt_(t, sun){
  if (t === null || t === undefined || !sun) return 0;
  var rise = sun.rise, set = sun.set;
  if (rise === null || set === null) return 0;
  if (t <= rise - 0.7 || t >= set + 0.7) return 0;          // 확실한 밤
  if (t >= rise + 1.0 && t <= set - 1.0) return 1;          // 확실한 낮
  return 0.5;                                              // 여명·땅거미
}
function demoteNocturnal_(list, lowT, sun){
  var dl = daylightAt_(lowT, sun);
  if (dl <= 0) return list;                                 // 밤 물때면 손대지 않는다
  var out = list.map(function(t){
    if (!isNocturnal_(t.n)) return t;
    return { n: t.n, v: Math.max(0.4, t.v * (dl >= 1 ? 0.34 : 0.7)), night: 1 };
  });
  out.sort(function(a, b){ return b.v - a.v; });
  return out;
}

/** 앱에서 고를 수 있는 대상 목록 (검색 화면용) */
function allSpecies_(kind){
  var seen = {}, out = [];
  var tables = kind === 'fish'
    ? [FX_DEFAULT, (typeof FX_BY === 'object' ? FX_BY : {})]
    : [SP_DEFAULT];
  tables.forEach(function(table){
    for (var k in table) table[k].forEach(function(n){ if (!seen[n]){ seen[n] = 1; out.push(n); } });
  });
  (typeof pool_==='function' ? pool_() : POINTS).forEach(function(p){
    var arr = kind === 'fish' ? p.fx : p.sp;
    if (arr) arr.forEach(function(n){ if (!seen[n]){ seen[n] = 1; out.push(n); } });
  });
  return out;
}


/* ══ Calib.gs ══ */
/**
 * 해루낚 — 지점 자동 보정
 *
 * 정식 포인트가 아닌 지점(전체 색인 1,571곳)을 사용자가 고르면
 * 바다타임 월간 물때표에서 평균 조차와 고조간격을 역산하고
 * 지도 페이지에서 좌표를 받아 그 자리에서 분석 가능한 포인트로 만든다.
 * 결과는 스크립트 속성에 남겨 다음부터는 바로 쓴다.
 */

/** 지점명으로 바닥질을 추정한다 — 정확하진 않지만 없는 것보다 낫다 */
function guessFloor_(name){
  if (/방파제|항$|港|부두|등대|여|초$|암$|바위/.test(name)) return 'rock';
  if (/갯벌|포구|만$|천$|하구/.test(name)) return 'mud';
  if (/해변|해수욕장|사장|모래/.test(name)) return 'sand';
  if (/도$|섬/.test(name)) return 'mix';
  return 'mix';
}
/** 해역별 기본 고조간격 */
var HI_DEFAULT = { W:5.0, S:9.2, E:9.0, J:10.4 };

/**
 * 바다타임 월간표에서 지점 파라미터를 역산한다.
 * @return {mr, hi, samples} 또는 null
 */
function calibrate_(id, sea, lon){
  var bt = fetchBadatime_(id);
  if (!bt) return null;
  var days = Object.keys(bt).sort();
  if (days.length < 8) return null;

  var ranges = [], lags = [];
  for (var k = 0; k < days.length; k++){
    var rec = bt[days[k]];
    if (!rec || !rec.range) continue;
    ranges.push(rec.range);
    var a = days[k].split('-');
    var age = moonAge_(+a[0], +a[1], +a[2]);
    var mt  = moonTransit_(age, lon);
    var highs = (rec.events||[]).filter(function(e){ return e.k === 'H'; });
    for (var j = 0; j < highs.length; j++){
      var lag = ((highs[j].t - mt) % SEMI + SEMI) % SEMI;   // 달 남중 이후 만조까지
      lags.push(lag);
    }
  }
  if (!ranges.length) return null;

  // 평균 조차 — 모형의 sf 평균이 1 이므로 관측 평균이 곧 mr
  var mr = ranges.reduce(function(a,b){ return a+b; }, 0)/ranges.length / 0.94;

  // 고조간격 — 원형 평균으로 낸다 (12.42시간 주기라 단순 평균은 틀린다)
  var sx = 0, sy = 0;
  lags.forEach(function(L){
    var th = 2*Math.PI*L/SEMI;
    sx += Math.cos(th); sy += Math.sin(th);
  });
  var hi = HI_DEFAULT[sea] || 5;
  if (lags.length){
    var th2 = Math.atan2(sy, sx);
    hi = ((th2/(2*Math.PI)*SEMI) % SEMI + SEMI) % SEMI;
    // 해역 기본값과 반주기 어긋난 해를 고른다
    var alt = (hi + SEMI) % (2*SEMI);
    var base = HI_DEFAULT[sea] || 5;
    if (Math.abs(alt - base) < Math.abs(hi - base)) hi = alt;
  }
  return { mr: Math.round(mr*100)/100, hi: Math.round(hi*100)/100, samples: ranges.length };
}

/** 바다타임 지도 페이지에서 좌표를 긁는다 */
function fetchCoord_(id){
  try {
    var r = UrlFetchApp.fetch('https://m.badatime.com/m-' + id + '.html', {
      muteHttpExceptions: true,
      headers: { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' }
    });
    if (r.getResponseCode() !== 200) return null;
    var h = r.getContentText('UTF-8');
    // 위도 32~39, 경도 123~132 범위의 숫자 쌍을 찾는다
    var m = h.match(/(3[2-8]\.\d{3,8})\s*[,\s]\s*(1(?:2[3-9]|3[0-2])\.\d{3,8})/);
    if (m) return { la: +m[1], lo: +m[2] };
    m = h.match(/(1(?:2[3-9]|3[0-2])\.\d{3,8})\s*[,\s]\s*(3[2-8]\.\d{3,8})/);
    if (m) return { la: +m[2], lo: +m[1] };
    return null;
  } catch(e){ return null; }
}

/**
 * 색인 지점을 분석 가능한 포인트로 승격시킨다.
 * 좌표를 못 구하면 같은 해역 정식 포인트 중 이름이 가장 비슷한 곳의 좌표를 빌린다.
 */
function promote_(id){
  var props = PropertiesService.getScriptProperties();
  var saved = props.getProperty('pt_' + id);
  if (saved){ try { return JSON.parse(saved); } catch(e){} }

  var idx = indexById_(id);
  if (!idx) return null;

  var co = fetchCoord_(id);
  if (!co){
    // 같은 해역의 정식 포인트 중 하나를 임시 좌표로 쓴다
    var near = null;
    for (var k = 0; k < POINTS.length; k++){
      if (POINTS[k].s === idx.s){ near = POINTS[k]; break; }
    }
    if (!near) return null;
    co = { la: near.la, lo: near.lo, approx: true };
  }
  var cal = calibrate_(id, idx.s, co.lo) || { mr: (idx.s === 'W' ? 4.5 : idx.s === 'S' ? 1.9 : idx.s === 'J' ? 1.5 : 0.2),
                                              hi: HI_DEFAULT[idx.s] || 5, samples: 0 };
  var p = {
    i: idx.i, n: idx.n, r: '', s: idx.s, la: co.la, lo: co.lo,
    mr: cal.mr, hi: cal.hi, f: guessFloor_(idx.n), kf: 2.0,
    tag: cal.samples > 0
      ? '자동 보정 지점 (' + cal.samples + '일치 물때에서 역산)'
      : '해역 평균값 사용 — 첫 정밀 조회 때 바다타임으로 자동 보정됩니다',
    auto: true, approxCoord: !!co.approx, calibAt: Date.now()
  };
  try { props.setProperty('pt_' + id, JSON.stringify(p)); } catch(e){}
  return p;
}

/** 정식 포인트를 먼저 찾고, 없으면 색인에서 승격시킨다 */
function anyPoint_(id){
  var p = pointById_(id);
  if (p) return p;
  if (typeof pool_ === 'function'){
    var pl = pool_();
    for (var k = 0; k < pl.length; k++) if (pl[k].i === id) return pl[k];
  }
  return promote_(id);
}

/** 저장해 둔 자동 보정 결과를 지운다 (개발용) */
function clearPromoted(){
  var props = PropertiesService.getScriptProperties();
  var all = props.getProperties(), n = 0;
  for (var k in all) if (k.indexOf('pt_') === 0){ props.deleteProperty(k); n++; }
  Logger.log('자동 보정 ' + n + '건 삭제');
}

 * 조건에 맞는 광고 하나를 고른다. 없으면 null — 빈 슬롯은 그냥 비워둔다.
 * 금어기 필터: 광고의 대상물(sp)이 그날 그 지역 금어기면 절대 내보내지 않는다.
 */
function pickAd_(region, ds, mode, bannedNames){
  var j = remoteJson_('ads');
  var ads = (j && j.ads) || [];
  if (!ads.length) return null;
  var a = ds.split('-'), mo = +a[1], d = +a[2];
  var pool = ads.filter(function(ad){
    if (ad.off) return false;
    if (ad.rg && region.indexOf(ad.rg) < 0) return false;
    if (ad.months && ad.months.indexOf(mo) < 0) return false;
    if (ad.mode && ad.mode !== mode) return false;
    if (ad.sp){
      if ((bannedNames || []).indexOf(ad.sp) >= 0) return false;       // 화면상 금어기 목록
      var st = banStatus_(ad.sp, mo, d, region);                        // 규정 직접 재확인
      if (st && st.banned) return false;
    }
    return true;
  });
  if (!pool.length) return null;
  // 일자별 순환 — 같은 날은 같은 광고 (캐시 일관성)
  var pick = pool[(mo * 31 + d) % pool.length];
  if (pick.id) bizCount_(pick.id, 'imp');
  return { id: pick.id || '', t: pick.t || '', d: pick.d || '', url: pick.url || '', tag: '제휴' };
}

/**
 * 그날 조건이 만들어내는 실제 필요에만 장비를 붙인다 — 광고가 아니라 이어지는 말이 되도록.
 * gear.json 의 키: visLow(시야 나쁨) night(야간) mud(펄) rock(갯바위) cold(추움) rain(비)
 */
function gearFor_(meta, mode, floor){
  var j = remoteJson_('gear');
  if (!j) return [];
  var keys = [];
  if (mode === 'haeru'){
    if (meta.vis !== undefined && meta.vis < 0.9) keys.push('visLow');
    if (meta.moonLux !== undefined && meta.moonLux < 0.05) keys.push('night');
    if (floor === 'mud') keys.push('mud');
    if (floor === 'rock') keys.push('rock');
  }
  if (meta.wx && meta.wx.temp !== null && meta.wx.temp !== undefined && meta.wx.temp <= 8) keys.push('cold');
  if (meta.wx && meta.wx.rain !== null && meta.wx.rain >= 1) keys.push('rain');
  var out = [], seen = {};
  keys.forEach(function(k){
    (j[k] || []).forEach(function(g){
      if (seen[g.n] || out.length >= 4) return;
      seen[g.n] = 1;
      out.push({ n: g.n, url: g.url || '', why: g.why || '', id: g.id || '' });
    });
  });
  return out;
}

function apiRedeem(code, uid){

  if (last < 2) return { ok: false, msg: '유효하지 않은 코드입니다' };

      Utilities.formatDate(until, CFG.TZ, 'yyyy-MM-dd')
    ]]);
