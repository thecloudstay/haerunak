/** 매월 1일 아침 — 레퍼럴·제휴 성과를 시트에 쓰고 메일로 보낸다 */
function moneyLoop(){
  var props = PropertiesService.getScriptProperties();
  var all = props.getProperties();
  var lines = [], sheetRows = [];
  var month = Utilities.formatDate(new Date(Date.now() - 86400000 * 2), CFG.TZ, 'yyyy-MM');

  // 레퍼럴 — 분배율 자동 산정
  for (var k in all){
    if (k.indexOf('ref_') !== 0) continue;
    var d; try { d = JSON.parse(all[k]); } catch(e){ continue; }
    var code = k.slice(4);
    var visits = d.visit || 0, convs = (d.open || 0) + (d.nav || 0);
    var amount = d.amount || 0;
    var rate = visits >= 1000 ? MONEY.REF_SHARE_T2 : visits >= 100 ? MONEY.REF_SHARE_T1 : MONEY.REF_SHARE_BASE;
    var share = Math.round(amount * rate);
    lines.push('· ' + code + ' — 유입 ' + visits + ' / 전환 ' + convs +
               (amount ? ' / 매출 ' + amount + '원 → 분배 ' + share + '원 (' + Math.round(rate*100) + '%)' : ' / 매출 없음'));
    sheetRows.push([month, '레퍼럴', code, visits, convs, amount, Math.round(rate*100) + '%', share]);
    // 다음 달을 위해 방문 수는 리셋, 누적 금액은 정산했으면 0으로
    d.visit = 0; d.open = 0; d.nav = 0; if (amount) d.amount = 0;
    props.setProperty(k, JSON.stringify(d));
  }
  // 제휴·광고 성과
  for (var k2 in all){
    if (k2.indexOf('biz_') !== 0) continue;
    var b; try { b = JSON.parse(all[k2]); } catch(e){ continue; }
    lines.push('· 제휴 ' + k2.slice(4) + ' — 노출 ' + (b.imp||0) + ' / 클릭 ' + (b.click||0) +
               (b.boat ? ' / 예약문의 ' + b.boat : ''));
    sheetRows.push([month, '제휴', k2.slice(4), b.imp||0, b.click||0, '', '', '']);
    props.setProperty(k2, '{}');
  }

  if (sheetRows.length){
    try {
      var sh = logSheet_().getParent().getSheetByName('정산') ||
               logSheet_().getParent().insertSheet('정산');
      if (sh.getLastRow() === 0)
        sh.appendRow(['월','구분','코드/업체','유입·노출','전환·클릭','매출','요율','분배액']);
      sheetRows.forEach(function(r){ sh.appendRow(r); });
    } catch(e){}
    try {
      MailApp.sendEmail(LOOP.OWNER_EMAIL, '[해루낚] ' + month + ' 월간 정산',
        '이번 달 성과입니다. 시트 「정산」 탭에도 기록했습니다.\n\n' + lines.join('\n') +
        '\n\n분배율: 기본 30% / 월 유입 100명↑ 35% / 1,000명↑ 40% / 예약 수수료의 20%');
    } catch(e){}
  }
}

/** 파트너가 자기 코드로 성과를 직접 확인한다 — 정산 투명성의 실체 */
function apiRefLookup(code){
  code = String(code || '').replace(/[^\w-]/g,'').slice(0,24);
  if (!code) return { ok: false };
  var props = PropertiesService.getScriptProperties();
  var d; try { d = JSON.parse(props.getProperty('ref_' + code) || 'null'); } catch(e){ d = null; }
  if (!d) return { ok: false, msg: '아직 집계가 없는 코드입니다. 링크가 한 번이라도 열리면 생깁니다.' };
  var visits = d.visit || 0;
  var rate = visits >= 1000 ? MONEY.REF_SHARE_T2 : visits >= 100 ? MONEY.REF_SHARE_T1 : MONEY.REF_SHARE_BASE;
  return { ok: true, code: code, visit: visits, open: d.open || 0, nav: d.nav || 0,
           amount: d.amount || 0, rate: Math.round(rate * 100), first: d.first || '', last: d.last || '' };
}

/* ══════════ 준비물 제휴 링크 ══════════
 * 도구 이름을 상품군으로 정규화한 뒤 data/gear.json 의 shop 에서 링크를 찾는다.
 * 링크가 없으면 null 을 돌려주고 화면은 글자만 보여준다 — 빈 링크를 누르게 두지 않는다. */
function shopFor_(names){
  var j = remoteJson_('gear') || {};
  var shop = j.shop || {};
  var out = [], idx = {};
  (names || []).forEach(function(n){
    var k = (typeof gearKey_ === 'function') ? gearKey_(n) : n;
    if (!k) return;
    if (idx[k] === undefined){
      var s = shop[k];
      idx[k] = out.length;
      // src 에 원본 도구 이름을 모아둔다 — 화면에서 '긴 장화' 같은 변형도 링크를 찾게
      out.push({ n: k, u: (s && s.u) ? s.u : '', why: (s && s.why) ? s.why : '', src: [] });
    }
    if (out[idx[k]].src.indexOf(n) < 0) out[idx[k]].src.push(n);
  });
  return out;
}

/** 제휴 링크가 하나라도 걸려 있으면 고지 문구를 돌려준다.
 *  대가를 받는 사실을 알리는 것은 공정거래위원회 추천·보증 심사지침상 의무다. */
function shopDisclosure_(items){
  var has = (items || []).some(function(x){ return x && x.u; });
  if (!has) return '';
  var j = remoteJson_('gear') || {};
  return j.disclosure || '이 링크로 구매하시면 해루낚이 수수료를 받습니다. 가격은 같습니다.';
}

/* ══════════ 대상물별 '잡는 법' 영상 ══════════
 * 유튜버에게 노출 자리를 주는 것이 곧 대가다. 현금 없이 제휴가 성립한다.
 * 등록된 영상이 없으면 유튜브 검색 링크를 만든다 — 이건 언제나 유효하다. */
/** 오늘의 원픽에 걸 영상 하나.
 *  이 자리가 유튜버에게 주는 대가다 — 앱에서 가장 눈에 띄는 곳이다.
 *  지점 전용 영상이 1순위, 없으면 그날 대상물 영상, 그것도 없으면 걸지 않는다.
 *  (원픽에는 검색 링크를 걸지 않는다 — 빈손인 자리를 광고 자리처럼 보이게 하지 않는다) */
function pickVideo_(pointId, pointName, names, mode){
  var j = remoteJson_('videos') || {};
  var all = j.items || [];
  var mk = function(v){
    return { id:v.id||'', ch:v.ch||'', t:v.t||'', paid:!!v.paid, target:v.target||pointName,
             u: v.id ? ('https://www.youtube.com/watch?v=' + v.id) : (v.u || ''),
             thumb: v.id ? ('https://img.youtube.com/vi/' + v.id + '/mqdefault.jpg') : '' };
  };
  // 1순위 — 이 지점 전용
  var spot = all.filter(function(v){
    return v && (String(v.spot) === String(pointId) || v.spot === pointName);
  });
  spot.sort(function(a,b){ return (b.paid?1:0) - (a.paid?1:0); });
  if (spot.length) return mk(spot[0]);

  // 2순위 — 그날 대상물
  for (var i = 0; i < (names || []).length; i++){
    var hit = all.filter(function(v){ return v && v.target === names[i]; });
    hit.sort(function(a,b){ return (b.paid?1:0) - (a.paid?1:0); });
    if (hit.length) return mk(hit[0]);
  }
  return null;
}

function videosFor_(names, mode){
  var j = remoteJson_('videos') || {};
  var all = j.items || [];
  var out = [];
  (names || []).slice(0, 4).forEach(function(n){
    var hit = all.filter(function(v){ return v && v.target === n; });
    // 대가를 받은 노출을 위로 올린다
    hit.sort(function(a, b){ return (b.paid ? 1 : 0) - (a.paid ? 1 : 0); });
    if (hit.length){
      var v = hit[0];
      out.push({ target:n, id:v.id || '', ch:v.ch || '', t:v.t || '', paid:!!v.paid,
                 u: v.id ? ('https://www.youtube.com/watch?v=' + v.id) : (v.u || ''),
                 thumb: v.id ? ('https://img.youtube.com/vi/' + v.id + '/mqdefault.jpg') : '' });
    } else {
      var q = n + ' ' + (mode === 'fish' ? '낚시' : '잡는법');
      out.push({ target:n, id:'', ch:'', t:'', paid:false, search:true,
                 u: 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q), thumb:'' });
    }
  });
  return out;
}

/** 원격 rigs.json 병합 후 이름으로 조회 */
function rigOf_(name){
  var ex = (typeof remoteJson_ === 'function') ? remoteJson_('rigs') : null;
  if (ex && ex[name]) return ex[name];
  return RIGS[name] || null;
}

/** 대상 목록 → 채비 카드 목록 (상위 3개) */
function rigsFor_(targets, mode){
  var out = [];
  (targets || []).slice(0, 3).forEach(function(t){
    var name = t.n || t;
    var r = rigOf_(mode === 'fish' && name === '주꾸미' ? '주꾸미(낚시)' : name);
    if (r) out.push({ n: name, t: r.t || [], b: r.b || '', tip: r.tip || '', warn: r.warn || '' });
  });
  return out;
}

/** 해루질 공통 안전 장비 — 어떤 대상이든 항상 붙는다 */
var SAFE_KIT = ['구명조끼(자동팽창형 권장)', '휴대폰 방수팩', '호루라기', '보조 랜턴(주 랜턴 방전 대비)', '물때표 캡처', '동행 1인 이상', '식초 한 병(해파리 쏘임용) — 5~12월'];

/* ══════════ 도구 이름 → 상품군 정규화 ══════════
 * '장갑'·'두꺼운 장갑'·'목장갑'은 결국 같은 물건을 산다.
 * 상품군으로 묶어야 제휴 링크 하나가 여러 대상물을 덮는다. */
var GEAR_NORM = {
  '망':'채집망', '망태기':'채집망', '채집망':'채집망',
  '장갑':'작업 장갑', '두꺼운 장갑':'작업 장갑', '목장갑':'작업 장갑', '네오프렌 장갑':'네오프렌 장갑',
  '장화':'갯벌 장화', '긴 장화':'갯벌 장화',
  '랜턴':'방수 랜턴', '보조 랜턴':'방수 랜턴', '헤드랜턴':'헤드랜턴',
  '뜰채':'뜰채', '긴 뜰채':'뜰채', '소형 통발형 뜰채':'뜰채',
  '갈퀴':'갯벌 갈퀴', '갈퀴(그레)':'갯벌 갈퀴',
  '호미':'갯벌 호미',
  '집게':'집게',
  '통':'채집통',
  '맛소금':'맛소금', '소금':'맛소금',
  '조새(굴칼)':'조새',
  '칼':'작업칼', '일자 드라이버나 칼':'작업칼',
  '구명조끼(자동팽창형 권장)':'구명조끼',

  '호루라기':'호루라기'
};

/** 도구 이름을 상품군으로 바꾼다. 매칭 없으면 원래 이름 그대로. */
function gearKey_(name){
  if (!name) return '';
  var n = String(name).trim();
  if (GEAR_NORM[n]) return GEAR_NORM[n];
  // 부분 일치 — '두꺼운 방수 장갑' 같은 변형도 잡는다
  for (var k in GEAR_NORM){
    if (n.indexOf(k) >= 0) return GEAR_NORM[k];
  }
  return n;
}

/**

var CFG = {
  TZ: 'Asia/Seoul',

function doGet(e){

  var ref = e && e.parameter && e.parameter.ref ? String(e.parameter.ref).replace(/[^\w-]/g,'').slice(0,24) : '';
  if (ref) trackRef_(ref, 'visit');

  var t = HtmlService.createTemplateFromFile('Index');
  t.BOOT = JSON.stringify({
    today: todayStr_(),
    count: (typeof pool_==='function' ? pool_().length : POINTS.length),
    indexCount: allIndex_().length,
    species: { haeru: allSpecies_('haeru'), fish: allSpecies_('fish') },
    ban: (typeof banMetaNow_==='function' ? banMetaNow_() : BAN_META),
    nonpro: NONPRO,
    ferry: (typeof ferryInfo_==='function' ? ferryInfo_() : null),

  });

    .setTitle('해루낚 — 오늘 어디서 뭘 잡지')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover')
    .addMetaTag('theme-color', '#05141f')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);

function include(f){ return HtmlService.createHtmlOutputFromFile(f).getContent(); }
function todayStr_(){ return Utilities.formatDate(new Date(), CFG.TZ, 'yyyy-MM-dd'); }

/**
 * 지도 보드
 * @param opts {want:'낙지', isl:true|false|null, car:true}
 */
function apiBoard(ds, mode, opts){
  ds = ds || todayStr_();
  mode = (mode === 'fish') ? 'fish' : 'haeru';
  opts = opts || {};
  var cache = CacheService.getScriptCache();
  var ck = 'b5_' + ds + '_' + mode + '_' + (opts.want || '') + '_' + (opts.isl === null || opts.isl === undefined ? 'a' : (opts.isl ? 'i' : 'l')) + (opts.car ? 'c' : '');
  var hit = cache.get(ck);
  if (hit){ try { return JSON.parse(hit); } catch(e){} }

  var pool = (typeof pool_==='function' ? pool_() : POINTS).filter(function(p){
    if (opts.isl === true  && !p.isl) return false;
    if (opts.isl === false &&  p.isl) return false;
    // 다리로 이어진 섬은 배편 정보가 없다 — 그것도 차로 가는 섬이다
    if (opts.car && p.isl && p.fr && !p.fr[2]) return false;
    if (opts.want){
      var arr = speciesOf_(p, mode);
      if (arr.indexOf(opts.want) < 0) return false;
    }
    return true;
  });
  if (!pool.length) return { ds: ds, mode: mode, rows: [], empty: true,
                             msg: opts.want ? (opts.want + '을(를) 노릴 포인트가 조건에 없습니다') : '조건에 맞는 포인트가 없습니다' };

  var wx = fetchWeather_(pool, ds);
  var rows = pool.map(function(p){
    var tide = tideOf_(p, ds, false);
    return packRow_(p, analyze_(p, ds, tide, wx[gridKey_(p.la, p.lo)], opts.want), mode);
  });
  // 실제 조황 기록으로 미세 보정 (기록 3건 이상 지점만, ±4점)
  try {
    var bm = catchBoostMap_();
    rows.forEach(function(r){
      var b = bm[r.i + '|' + mode];
      if (b){ r.score = Math.max(0, Math.min(100, r.score + b)); r.raw += b; r.boost = b; }
    });
  } catch(e){}
  rows.sort(function(a,b){ return b.raw - a.raw; });

  // 상위 지점만 바다타임으로 정밀 보정
  var top = rows.slice(0, CFG.PRECISE_TOP);
  try {
    var resp = UrlFetchApp.fetchAll(top.map(function(r){
      return { url: 'https://m.badatime.com/' + r.i + '.html', muteHttpExceptions: true, followRedirects: true,
               headers: { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148 Safari/604.1' } };
    }));
    resp.forEach(function(res, k){
      if (res.getResponseCode() !== 200) return;
      var parsed;
      try { parsed = parseBadatime_(res.getContentText('UTF-8')); } catch(e){ return; }
      if (!parsed || !parsed[ds]) return;
      try { cache.put('bt_' + top[k].i, JSON.stringify(parsed), 21600); } catch(e){}
      var p = pointById_(top[k].i);
      if (!p) return;
      var fresh = packRow_(p, analyze_(p, ds, parsed[ds], wx[gridKey_(p.la, p.lo)], opts.want), mode);
      for (var key in fresh) top[k][key] = fresh[key];
    });
  } catch(e){}
  rows.sort(function(a,b){ return b.raw - a.raw; });

  var out = { ds: ds, mode: mode, want: opts.want || null, rows: rows,
              total: (typeof pool_==='function' ? pool_().length : POINTS.length), shown: rows.length,
              generated: Utilities.formatDate(new Date(), CFG.TZ, 'HH:mm') };
  try { cache.put(ck, JSON.stringify(out), CFG.BOARD_CACHE_SEC); } catch(e){}
  return out;
}

function packRow_(p, an, mode){
  var m = mode === 'fish' ? an.fish : an.haeru;
  return {
    i: p.i, n: p.n, r: p.r, s: p.s, la: p.la, lo: p.lo, tag: p.tag || '',
    isl: p.isl ? 1 : 0, fr: p.fr || null,
    score: m.score, raw: m.raw, grade: m.grade,
    win: m.window ? [Math.round(m.window[0]*60), Math.round(m.window[1]*60)] : null,
    targets: m.targets.map(function(t){ return t.n; }),
    banned: (m.bannedTargets || []).map(function(t){ return t.n; }),
    verdict: m.verdict, why: (m.why||[]).slice(0,2), warn: (m.warn||[]).slice(0,2),
    mul: an.meta.mul, range: an.meta.range, src: an.meta.src,
    vis: an.meta.vis, cur: an.meta.curPeak,
    other: (mode === 'fish' ? an.haeru.score : an.fish.score),
    wantReason: an.want ? an.want.reason : null,
    // 원픽 자리에 걸 영상 — 유튜버에게 주는 대가이자 나중의 광고 자리
    vid: (typeof pickVideo_ === 'function')
      ? pickVideo_(p.i, p.n, m.targets.map(function(t){ return t.n; }), mode)
      : null
  };
}

/** 지점 상세 — 항상 정밀 소스 */
function apiPoint(id, ds, want, days){
  ds = ds || todayStr_();
  var p = anyPoint_(id);
  if (!p) return { error: '지점을 찾을 수 없습니다.' };
  var tide = tideOf_(p, ds, true);
  var wx = fetchWeather_([p], ds);
  var an = analyze_(p, ds, tide, wx[gridKey_(p.la, p.lo)], want);
  return {
    point: { i:p.i, n:p.n, r:p.r||'', s:p.s, la:p.la, lo:p.lo, tag:p.tag||'',
             floor: FLOOR_KO[p.f], isl: p.isl?1:0, fr: p.fr||null,
             auto: !!p.auto, approxCoord: !!p.approxCoord },
    ds: ds, meta: an.meta, haeru: an.haeru, fish: an.fish, want: an.want,
    spots: spotsOf_(p.i),
    partners: (typeof apiPartners === 'function') ? apiPartners(p.i) : [],
    ad: (typeof pickAd_ === 'function')
      ? pickAd_(p.r || '', ds, 'haeru', (an.meta.banned.haeru || []).concat(an.meta.banned.fish || []).map(function(x){ return x.n; }))
      : null,
    gear: (typeof gearFor_ === 'function') ? gearFor_(an.meta, 'haeru', p.f) : [],
    rigs: (typeof rigsFor_ === 'function')
      ? { haeru: rigsFor_(an.haeru.targets, 'haeru'), fish: rigsFor_(an.fish.targets, 'fish'),
          safe: SAFE_KIT }
      : null,
    // 준비물에 걸린 제휴 링크 — 도구 이름을 상품군으로 묶어 한 번에 내려준다
    shop: (function(){
      if (typeof shopFor_ !== 'function' || typeof rigsFor_ !== 'function') return null;
      var names = [];
      ['haeru','fish'].forEach(function(m){
        (rigsFor_(m === 'haeru' ? an.haeru.targets : an.fish.targets, m) || [])
          .forEach(function(r){ (r.t || []).forEach(function(t){ names.push(t); }); });
      });
      SAFE_KIT.forEach(function(t){ names.push(t); });
      var items = shopFor_(names);
      return { items: items, disclosure: shopDisclosure_(items) };
    })(),
    videos: (typeof videosFor_ === 'function')
      ? { haeru: videosFor_((an.haeru.targets||[]).map(function(x){return x.n;}), 'haeru'),
          fish:  videosFor_((an.fish.targets ||[]).map(function(x){return x.n;}), 'fish') }
      : null,
    week: apiWeek_(p, ds, want, Math.min(15, Math.max(7, Number(days) || 7)))
  };
}

function apiWeek_(p, ds, want, days){
  var bt = fetchBadatime_(p.i);
  var days = [], base = new Date(ds + 'T00:00:00+09:00');
  for (var k = 0; k < (days || 7); k++)
    days.push(Utilities.formatDate(new Date(base.getTime() + k*86400000), CFG.TZ, 'yyyy-MM-dd'));
  var rec = fetchWeather_([p], ds)[gridKey_(p.la, p.lo)];
  return days.map(function(dd){
    var tide = (bt && bt[dd]) ? bt[dd]
      : (function(){ var a = dd.split('-'); return calcTide_(p, +a[0], +a[1], +a[2]); })();
    var an = analyze_(p, dd, tide, dd === ds ? rec : null, want);
    return { ds: dd, mul: an.meta.mul, range: an.meta.range,
             h: an.haeru.score, f: an.fish.score,
             vis: dd === ds ? an.meta.vis : null,   // 기상 예보가 있는 당일만 시야를 낸다
             hw: an.haeru.window ? [Math.round(an.haeru.window[0]*60), Math.round(an.haeru.window[1]*60)] : null,
             fw: an.fish.window ? [Math.round(an.fish.window[0]*60), Math.round(an.fish.window[1]*60)] : null };
  });
}

/** 전체 색인 검색 — 정식 포인트를 위로 올린다 */
function apiSearch(q){
  var hits = searchIndex_(q, 60);
  return hits.map(function(h){
    var p = pointById_(h.i);
    return { i: h.i, n: h.n, s: h.s, curated: !!p, r: p ? p.r : '', isl: p && p.isl ? 1 : 0 };
  }).sort(function(a,b){ return (b.curated?1:0) - (a.curated?1:0); });
}

/** 어종 목록 — 제철·금어기 상태를 붙여서 준다 */
function apiSpecies(ds, mode){
  ds = ds || todayStr_();
  var a = ds.split('-'), mo = +a[1], d = +a[2];
  var table = mode === 'fish' ? SEASON_FX : SEASON_SP;
  var PL_ = (typeof pool_==='function' ? pool_() : POINTS);
  return allSpecies_(mode === 'fish' ? 'fish' : 'haeru').map(function(n){
    var st = banStatus_(n, mo, d, '전국');
    var spots = 0;
    PL_.forEach(function(p){ if (speciesOf_(p, mode === 'fish' ? 'fish' : 'haeru').indexOf(n) >= 0) spots++; });
    return { n: n, season: table[n] ? table[n][mo-1] : 1, spots: spots,
             banned: !!(st && st.banned),
             pop: (typeof popRank_ === 'function') ? popRank_(n, mode) : 999,
             a: (typeof nicksOf_ === 'function') ? nicksOf_(n) : [],
             ban: st ? { from: st.from, to: st.to, size: st.size, unit: st.unit, scope: st.scope } : null };
  }).filter(function(x){ return x.spots > 0; })
    // 사람들이 실제로 노리는 순서로 세운다.
    // 다만 금어기와 철 아닌 것은 아래로 내린다 — 눌러도 소용이 없기 때문이다.
    .sort(function(x, y){
      var xb = x.banned ? 1 : 0, yb = y.banned ? 1 : 0;
      if (xb !== yb) return xb - yb;
      var xo = x.season > 0 ? 0 : 1, yo = y.season > 0 ? 0 : 1;
      if (xo !== yo) return xo - yo;
      return (x.pop - y.pop) || (y.season - x.season) || (y.spots - x.spots);
    });
}

/* ── 레퍼럴 집계 ─────────────────────────────────────
 * 파트너 코드별 유입·전환을 스크립트 속성에 쌓는다.
 * 나중에 결제·예약이 붙으면 conv 이벤트에 금액을 실어 정산 근거가 된다. */
function trackRef_(code, ev, amount){
  try {
    var props = PropertiesService.getScriptProperties();
    var k = 'ref_' + code;
    var d; try { d = JSON.parse(props.getProperty(k) || '{}'); } catch(e){ d = {}; }
    var day = todayStr_();
    d.first = d.first || day;
    d.last = day;
    d[ev] = (d[ev] || 0) + 1;
    if (amount) d.amount = (d.amount || 0) + amount;
    props.setProperty(k, JSON.stringify(d));
  } catch(e){}
}
/** 화면에서 전환 이벤트를 보낸다 (상세 열람·길찾기 등) */
function apiRefEvent(code, ev){
  if (!code || !ev) return;
  code = String(code).replace(/[^\w-]/g,'').slice(0,24);
  if (['open','nav','share'].indexOf(ev) < 0) return;
  trackRef_(code, ev);
}
/** 주인용 — 파트너별 집계표 */
function refStats(){
  var props = PropertiesService.getScriptProperties();
  var all = props.getProperties(), out = [];
  for (var k in all){
    if (k.indexOf('ref_') !== 0) continue;
    var d; try { d = JSON.parse(all[k]); } catch(e){ continue; }
    d.code = k.slice(4);
    out.push(d);
  }
  out.sort(function(a,b){ return (b.visit||0) - (a.visit||0); });
  Logger.log(JSON.stringify(out, null, 2));
  return out;
}

function clearCache(){
  var c = CacheService.getScriptCache();
  c.removeAll((typeof pool_==='function' ? pool_() : POINTS).map(function(p){ return 'bt_' + p.i; }));
  Logger.log('캐시 삭제 완료');
}


/* ══ 기상 — 브라우저가 Open-Meteo 에서 직접 받아온다 (실패 시 예시값) ══ */
var WXC = {};                  // ds|셀 → 기상 레코드
var WX_REAL = {};              // ds → 실측 여부
function wxFor(p,ds){

var TILE_TAIL = ' | 물때 자체 조석계산 · 기상 Open-Meteo';

  dark: [
    { u:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',

var SATLBL = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
  { maxZoom:19, maxNativeZoom:19, opacity:.92, className:'basetiles' });

var LIVE = {};          // 현재 붙어 있는 레이어

function makeTile_(kind, idx){
  var c = TILE_SRC[kind] && TILE_SRC[kind][idx];
  if (!c) return null;
  var opt = { attribution: c.a + TILE_TAIL, maxZoom: 19, maxNativeZoom: c.mz, className: 'basetiles' };
  if (c.sd) opt.subdomains = c.sd;
  var tl = L.tileLayer(c.u, opt);
  var good = 0, bad = 0;
  tl.on('tileload',  function(){ good++; });
  tl.on('tileerror', function(){
    bad++;
    // 한 장도 못 받은 채 연달아 실패하면 그 공급원은 죽은 것으로 본다
    if (good === 0 && bad >= 5 && !tl._swapped && TILE_SRC[kind][idx + 1]){
      tl._swapped = true;
      var nx = makeTile_(kind, idx + 1);
      if (nx && curBase === kind){
        if (map.hasLayer(tl)) map.removeLayer(tl);
        nx.addTo(map); nx.bringToBack();
        LIVE[kind] = nx;
      }
    }
  });
  return tl;
}

function getBase_(kind){
  if (!LIVE[kind]) LIVE[kind] = makeTile_(kind, 0);
  return LIVE[kind];
}

/* 기본은 내장 해안선이다 — 외부 요청이 0이라 공급사가 죽든 유료화하든 영향이 없다.
   세밀한 지도가 필요하면 사용자가 '위성'·'지도'를 눌렀을 때만 타일을 부른다.
   해안선이 내장되지 않은 판(앱스 스크립트)에서는 밝은 지도를 기본으로 쓴다. */
var HAS_COAST = (typeof COAST_LAYER !== 'undefined' && COAST_LAYER);
var curBase = HAS_COAST ? 'base' : 'lite';

/* 타일을 켜면 내장 해안선은 숨긴다 — 위성 사진 위에 선이 덮이면 안 된다 */
function coastVis_(show){
  if (!HAS_COAST) return;
  if (show){ if (!map.hasLayer(COAST_LAYER)) COAST_LAYER.addTo(map); }
  else { if (map.hasLayer(COAST_LAYER)) map.removeLayer(COAST_LAYER); }
}

function setBase_(k){
  if (k === curBase) return;
  if (k !== 'base' && !TILE_SRC[k]) return;
  var old = LIVE[curBase];
  if (old && map.hasLayer(old)) map.removeLayer(old);
  if (map.hasLayer(SATLBL)) map.removeLayer(SATLBL);
  if (k !== 'base'){                       // 'base' 는 내장 해안선만 쓴다
    var nx = getBase_(k);
    nx.addTo(map); nx.bringToBack();
    if (k === 'sat') SATLBL.addTo(map);
    coastVis_(false);
  } else {
    coastVis_(true);
  }
  curBase = k;
  document.body.className = document.body.className.replace(/\s*map-sat\b/,'') + (k === 'sat' ? ' map-sat' : '');
  var bs = document.querySelectorAll('.basebtn');
  for (var i=0;i<bs.length;i++) bs[i].className = 'basebtn' + (bs[i].getAttribute('data-b') === k ? ' on' : '');
  try { localStorage.setItem('hrn_base', k); } catch(e){}
}

/* 핀 — 원은 좌표 위에 뜨고, 꼬리 끝과 흰 점이 실제 좌표를 가리킨다.

var PIN_TAIL = 13, PIN_TAIL_SM = 10;
function pinIcon(r, isTop, small){
  var w = small ? 26 : 38, tail = small ? PIN_TAIL_SM : PIN_TAIL;
  return L.divIcon({
    className: '',
    html: '<div class="pin '+(tideOnly_()?'pin-tide':'pin-'+r.grade)+(small?' sm':'')+(isTop&&!tideOnly_()?' pin-top':'')+'" style="position:relative">'
        + (tideOnly_() ? '≈' : r.score) + (isTop && !tideOnly_() ? '<i class="halo"></i>' : '') + '</div>',
    iconSize: [w, w + tail],
    iconAnchor: [w/2, w + tail]
  });
}
function drawPins(){
  Object.keys(S.markers).forEach(function(k){ map.removeLayer(S.markers[k]); });
  S.markers = {};
  var z = map.getZoom();
  var placed = [];                       // 큰 핀이 이미 차지한 화면 좌표
  var MIN = z >= 11 ? 0 : (z >= 9 ? 30 : 38);
  S.rows.forEach(function(r, idx){
    var pt = map.latLngToLayerPoint([r.la, r.lo]);
    var small = false;
    for (var k=0;k<placed.length;k++){
      var dx = placed[k].x - pt.x, dy = placed[k].y - pt.y;
      if (dx*dx + dy*dy < MIN*MIN){ small = true; break; }
    }
    if (!small) placed.push(pt);
    var m = L.marker([r.la, r.lo], { icon: pinIcon(r, idx === 0, small), zIndexOffset: 1000 - idx });
    m.on('click', function(){ openDetail(r.i); });
    m.addTo(map);
    S.markers[r.i] = m;
  });
}
map.on('zoomend', function(){ if (S.rows.length) drawPins(); });

/* ══════════════ 주소로 바로 들어오기 ══════════════
 * 유튜버가 "영흥도 편" 영상에 링크를 걸면 그 지점이 바로 열려야 한다.
 * 홈으로만 보내면 사용자가 직접 찾아야 하고, 대부분 거기서 이탈한다.
 *   ?spot=151        지점 상세 바로 열기
 *   ?sp=낙지         그 대상을 노릴 수 있는 자리만 추려서 보기
 *   ?d=2026-08-30    날짜 지정
 *   ?ref=haeru_tv    레퍼럴 코드 (기존)
 * 해시 형태도 받는다: #/spot/151 · #/species/낙지
 */
function parseRoute_(){
  var q = {};
  (location.search || '').replace(/^\?/, '').split('&').forEach(function(kv){
    if (!kv) return;
    var i = kv.indexOf('=');
    var k = i < 0 ? kv : kv.slice(0, i);
    var v = i < 0 ? '' : kv.slice(i + 1).replace(/\+/g, ' ');
    try { q[k] = decodeURIComponent(v); } catch(e){ q[k] = v; }
  });
  var h = (location.hash || '').replace(/^#\/?/, '');
  if (h){
    var seg = h.split('/');
    try {
      if (seg[0] === 'spot' && seg[1]) q.spot = decodeURIComponent(seg[1]);
      if ((seg[0] === 'species' || seg[0] === 'sp') && seg[1]) q.sp = decodeURIComponent(seg[1]);
    } catch(e){}
  }
  return q;
}

/* 주소를 지금 보고 있는 화면에 맞춘다 — 뒤로가기로 상세가 닫히게 한다 */
function pushRoute_(kind, val){
  if (!window.history || !history.pushState) return;
  var ref = '';
  try { var rj = JSON.parse(localStorage.getItem('hrn_ref') || 'null'); if (rj && rj.c) ref = rj.c; } catch(e){}
  var qs = [];
  if (kind === 'spot' && val) qs.push('spot=' + encodeURIComponent(val));
  if (kind === 'sp' && val)   qs.push('sp=' + encodeURIComponent(val));
  if (S.ds && S.ds !== todayStr_()) qs.push('d=' + S.ds);
  if (ref) qs.push('ref=' + encodeURIComponent(ref));
  var url = location.pathname + (qs.length ? '?' + qs.join('&') : '');
  try { history.pushState({ k: kind, v: val }, '', url); } catch(e){}
}

/* 지금 화면의 공유 주소 */
function shareUrl_(kind, val){
  var ref = '';
  try { var rj = JSON.parse(localStorage.getItem('hrn_ref') || 'null'); if (rj && rj.c) ref = rj.c; } catch(e){}
  var qs = [];
  if (kind === 'spot' && val) qs.push('spot=' + encodeURIComponent(val));
  if (kind === 'sp' && val)   qs.push('sp=' + encodeURIComponent(val));
  if (ref) qs.push('ref=' + encodeURIComponent(ref));
  return location.origin + location.pathname + (qs.length ? '?' + qs.join('&') : '');
}

/* 첫 로딩이 끝난 뒤 주소대로 화면을 연다 */
function applyRoute_(){
  var q = parseRoute_();
  if (q.sp && !S.want){
    S.want = q.sp;
    if (typeof renderWant === 'function') try { renderWant(); } catch(e){}
  }
  if (q.spot){
    var id = parseInt(q.spot, 10);
    if (!isNaN(id)) setTimeout(function(){ openDetail(id); }, 260);
  }
}

function load(){
  if (S.loading) return;
  S.loading = true;
  $('btnReload').classList.add('spin');
  renderSkeleton();
  google.script.run
    .withSuccessHandler(function(res){
      S.loading = false;
      $('btnReload').classList.remove('spin');
      $('boot').classList.add('hide');
      if (!res || !res.rows){ toast('데이터를 불러오지 못했습니다'); return; }
      if (res.empty || !res.rows.length){
        S.rows = []; render();
        toast(res.msg || '조건에 맞는 자리가 없습니다', 3200);
        return;
      }
      S.rows = res.rows;
      S.shown = res.shown; S.total = res.total;
      S.gen = res.generated;
      render();
      if (FEED === null) loadFeed_(); else buildTicker_();
      if (!S._routed){ S._routed = true; applyRoute_(); }
    })
    .withFailureHandler(function(e){
      S.loading = false;
      $('btnReload').classList.remove('spin');
      $('boot').classList.add('hide');
      toast('오류: ' + (e && e.message ? e.message : '불러오기 실패'));
    })
    .apiBoard(S.ds, S.mode, {
      want: S.want,
      isl: S.filter === 'isl' || S.filter === 'car' ? true : (S.filter === 'land' ? false : null),
      car: S.filter === 'car'
    });
}

/* ══════════════ 렌더 ══════════════ */
function sorted(){
  var a = S.rows.slice();
  if (S.sort === 'near' && S.me){
    a.forEach(function(r){ r._d = dist(S.me[0], S.me[1], r.la, r.lo); });
    a.sort(function(x,y){ return x._d - y._d; });
  } else if (S.sort === 'time'){
    a.sort(function(x,y){
      var xa = x.win ? x.win[0] : 99999, ya = y.win ? y.win[0] : 99999;
      return xa - ya;
    });
  } else if (S.sort === 'vis'){
    // 시야가 같으면 추천 점수로 가른다. 시야를 못 낸 자리는 뒤로 보낸다
    a.sort(function(x,y){
      var xv = (x.vis == null ? -1 : x.vis), yv = (y.vis == null ? -1 : y.vis);
      return (yv - xv) || (y.raw - x.raw);
    });
  } else {
    a.sort(function(x,y){ return y.raw - x.raw; });
  }
  var f = favs();
  if (f.length){
    a.sort(function(x,y){ return (f.indexOf(y.i) >= 0 ? 1 : 0) - (f.indexOf(x.i) >= 0 ? 1 : 0); });
  }
  return a;
}

function syncPick(){
  var open = $('sheet').classList.contains('open');
  $('pick').classList.toggle('fade', open);
  if (!pickClosed()) $('pickRestore').hidden = true;
  else $('pickRestore').style.opacity = open ? '0' : '1';
}

/* ══════════ 속보 줄 ══════════
   한 번에 한 건만 보여준다. 10분에 한 건씩, 하루 단위로 섞은 순서로
   번갈아 나온다. 20건이면 한 바퀴가 약 3시간 20분 — 하루 종일 같은 줄이
   붙어 있지 않고, 그렇다고 정신없이 흐르지도 않는다.
   ① 제보  ② 위판 역산(항구에서 많이 잡히면 그 앞바다에 있다)  ③ 기사
   자료가 하나도 없으면 오늘의 1~3위가 대신 돈다.                        */
var FEED = null;

function kmBetween_(la1, lo1, la2, lo2){
  var R = 6371, d2r = Math.PI/180;
  var dLa = (la2-la1)*d2r, dLo = (lo2-lo1)*d2r;
  var a = Math.sin(dLa/2)*Math.sin(dLa/2)
        + Math.cos(la1*d2r)*Math.cos(la2*d2r)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

/** 위판 한 건 → 근처 지점 추천 문장 */
function tickFromCatch_(c){
  if (!c || !c.항구) return null;
  var near = [];
  if (c.la != null && c.lo != null && typeof POINTS !== 'undefined'){
    var best = null, bd = 1e9;
    for (var i = 0; i < POINTS.length; i++){
      var d = kmBetween_(c.la, c.lo, POINTS[i].la, POINTS[i].lo);
      if (d < bd){ bd = d; best = POINTS[i]; }
    }
    if (best && bd <= 40) near = [best];
  }
  var t = c.항구 + ' 위판에 ' + c.품목 + (c.양 ? ' ' + c.양 : '');
  if (near.length)
    return { tag:'위판', cls:'t-gi', text: t + ' — 근처 ' + near[0].n + ' 앞바다에 붙었다는 뜻', i: near[0].i };
  return { tag:'위판', cls:'t-gi', text: t + ' — 그 앞바다가 살아 있습니다', i: null };
}

function tickerPool_(){
  var pool = [];
  if (FEED && FEED.제보) FEED.제보.forEach(function(r){
    if (r && r.글) pool.push({ tag:'제보', cls:'t-bo',
      text: (r.지점 ? r.지점 + ' · ' : '') + r.글, i: r.번호 || null });
  });
  if (FEED && FEED.위판) FEED.위판.forEach(function(c){
    var t = tickFromCatch_(c); if (t) pool.push(t);
  });
  if (FEED && FEED.기사) FEED.기사.forEach(function(a){
    if (a && a.제목) pool.push({ tag:'기사', cls:'t-gi',
      text: '「' + a.제목 + '」' + (a.출처 ? ' — ' + a.출처 : ''),
      i: a.번호 || null, url: a.url || null });
  });
  if (!pool.length && S.rows && S.rows.length){
    S.rows.slice().sort(function(x,y){ return y.raw - x.raw; }).slice(0,3)
      .forEach(function(r, k){
        pool.push({ tag:(k+1)+'위', cls:'t-nu', text: r.n + ' ' + r.score + '점 — ' + (r.verdict||''), i: r.i });
      });
  }
  return pool;
}

/** 하루 단위 고정 셔플 — 같은 날엔 누구나 같은 순서를 본다 */
function dayShuffle_(arr){
  var d = new Date(), seed = d.getFullYear()*372 + (d.getMonth()+1)*31 + d.getDate();
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    seed = (seed * 9301 + 49297) % 233280;
    var j = Math.floor(seed / 233280 * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

var TK_SLOT_MIN = 10;
function tickerShow_(){
  var tk = $('ticker'), tr = $('tkTrack');
  if (!tk || !tr) return;
  var pool = dayShuffle_(tickerPool_());
  if (!pool.length){ tk.hidden = true; document.body.classList.remove('has-ticker'); return; }
  tk.hidden = false; document.body.classList.add('has-ticker');

  var now = new Date();
  var slot = Math.floor((now.getHours()*60 + now.getMinutes()) / TK_SLOT_MIN);
  if (window.__tkSlot != null) slot = window.__tkSlot;      // 검증용
  var it = pool[slot % pool.length];
  if (tk._key === it.text) return;                          // 같은 건이면 그대로
  tk._key = it.text;

  var sp = el('span','tk-it' + ((it.i != null || it.url) ? ' go' : ''),
    '<i class="tk-tag ' + it.cls + '">' + it.tag + '</i>' + it.text);
  if (it.i != null) sp.onclick = function(){ openDetail(it.i); };
  else if (it.url) sp.onclick = function(){ try { window.open(it.url, '_blank', 'noopener'); } catch(e){} };

  tr.innerHTML = ''; tr.classList.add('still'); tr.appendChild(sp);
  if (!NOMO){
    sp.classList.add('tk-in');
    /* 줄보다 길면 천천히 한 번 갔다 온다 — 목록 전체가 흐르는 게 아니라 이 한 건만 */
    nextFrame_(function(){
      var over = tr.scrollWidth - tr.parentNode.clientWidth;
      if (over > 8){
        tr.style.setProperty('--ov', over + 'px');
        tr.style.animationDuration = Math.max(10, Math.round(over / 22)) + 's';
        tr.classList.add('pong');
      } else { tr.classList.remove('pong'); }
    });
  }
}

function buildTicker_(){
  tickerShow_();
  var tk = $('ticker');
  if (tk && !tk._clock) tk._clock = setInterval(tickerShow_, 30000);   // 슬롯이 바뀌었나 30초마다 본다
}

/* ── 화면이 살아나는 느낌 ──
   숫자가 갑자기 튀어나오는 것보다, 차오르는 걸 눈으로 보는 편이
   "계산해서 낸 값"이라는 인상을 준다. 값 자체는 건드리지 않는다.
   움직임을 싫어하는 사람(운영체제 설정)에게는 전부 끈다. */
var NOMO = false;
try { NOMO = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}

/** 다음 프레임에 실행 — 브라우저가 시작값을 먼저 그리게 한다 */
function nextFrame_(fn){
  if (NOMO) { fn(); return; }
  requestAnimationFrame(function(){ requestAnimationFrame(fn); });
}

/** 숫자가 올라가는 효과 */
function countUp_(node, to, ms){
  if (NOMO || !node) { if (node) node.textContent = to; return; }
  var from = 0, t0 = null;
  function step(t){
    if (t0 === null) t0 = t;
    var k = Math.min(1, (t - t0) / (ms || 900));
    var e = 1 - Math.pow(1 - k, 3);                 // 끝에서 부드럽게 멈춘다
    node.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/** 상세를 열 때마다 등장 효과를 다시 태운다 */
function fillBars_(root){
  if (!root) return;
  var bs = root.querySelectorAll('.gauge-t i[data-w], .wade-bar i[data-w]');
  nextFrame_(function(){
    for (var i = 0; i < bs.length; i++) bs[i].style.width = bs[i].getAttribute('data-w') + '%';
  });
}

function playIn_(root){
  if (!root) return;
  fillBars_(root);
  var secs = root.querySelectorAll('.sec, .verdict, .dt-head, .wade, .risk');
  for (var i = 0; i < secs.length; i++){
    secs[i].classList.remove('rise');
    if (!NOMO) secs[i].style.animationDelay = Math.min(i * 70, 780) + 'ms';
  }
  nextFrame_(function(){
    for (var j = 0; j < secs.length; j++) secs[j].classList.add('rise');
  });
}

function renderDetail(d){
  window.__detail = d;            // shopChip 이 제휴 링크를 찾을 때 쓴다
  if (!d || d.error){ $('detailBody').innerHTML = '<p style="padding:30px 0;text-align:center;color:#8ba6b8">'+((d&&d.error)||'오류')+'</p>'; return; }
  var m = S.mode === 'fish' ? d.fish : d.haeru;
  var o = S.mode === 'fish' ? d.haeru : d.fish;
  var meta = d.meta, w = meta.wx || {};
  var b = $('detailBody'); b.innerHTML = '';

  /* 헤더 */
  var head = el('div','dt-head');
  var ring = el('div','ring', '<span>' + (NOMO ? m.score : 0) + '</span>');
  var rcol = 'var(--' + m.grade + ')';
  function paintRing_(pct){
    ring.style.background = 'conic-gradient(' + rcol + ' ' + pct + '%,rgba(255,255,255,.08) 0)';
  }
  paintRing_(NOMO ? m.score : 0);
  if (tideOnly_()){
    ring.innerHTML = '<span class="tide-mark">≈</span>';
    ring.style.background = 'conic-gradient(rgba(120,190,225,.4) 100%,rgba(255,255,255,.08) 0)';
  }
  head.appendChild(ring);
  if (!NOMO && !tideOnly_()){
    /* 숫자와 테두리를 같은 프레임에서 함께 올린다 — 따로 돌면 어긋나 보인다 */
    ring.classList.add('ring-go');
    var rspan = ring.querySelector('span'), t0 = null, DUR = 1500;
    requestAnimationFrame(function tick(t){
      if (t0 === null) t0 = t;
      var k = Math.min(1, (t - t0) / DUR);
      var e = 1 - Math.pow(1 - k, 3);
      var v = m.score * e;
      paintRing_(v);
      rspan.textContent = Math.round(v);
      if (k < 1) requestAnimationFrame(tick);
      else { paintRing_(m.score); rspan.textContent = m.score; }
    });
  }
  /* 세부 자리(서브 로케이션) — 실제로 어디로 들어가는지가 이 앱에서 가장 중요한 정보다.
     등록된 세부 포인트가 있으면 그 이름을, 없으면 지점 설명을 크게 올린다. */
  var subNames = (d.spots || []).map(function(x){ return x.n; }).filter(Boolean);
  var labeled = subNames.length > 0;
  var subs = labeled
    ? subNames.slice(0, 4)
    : String(d.point.tag || '').split(/[·,]/).map(function(x){ return x.trim(); }).filter(Boolean);
  var more = labeled && subNames.length > 4 ? ' 외 ' + (subNames.length - 4) + '곳' : '';
  head.appendChild(el('div','',
      '<h2>' + d.point.n + '</h2>'
    + '<p>' + d.point.r + ' · ' + d.point.floor + '</p>'
    + (subs.length
        ? '<span class="dt-sub">'
            + (labeled ? '<span class="lb">세부 자리</span>' : '')
            + subs.join('<span class="sep">·</span>') + more
          + '</span>'
        : '')));
  var fav = el('button','fav-btn' + (favs().indexOf(d.point.i) >= 0 ? ' on' : ''), '★');
  fav.onclick = function(){
    var on = toggleFav(d.point.i);
    fav.classList.toggle('on', on);
    toast(on ? '즐겨찾기에 담았습니다 — 목록 맨 위에 고정됩니다' : '즐겨찾기 해제');
    renderList();
  };
  head.appendChild(fav);
  b.appendChild(head);

  /* 결론 */
  b.appendChild(tideOnly_()
    ? el('div','dt-verdict tide-note',
        '<b>물때만 보는 날짜입니다.</b> 기상 예보가 닿지 않아 <b>정확한 점수는 7일 이내</b>만 제공됩니다. '
      + '아래 물때·만조 간조·진입/퇴로 시각은 조석 계산이라 그대로 믿으셔도 됩니다.')

    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(u).then(done, function(){ prompt('복사하세요', u); });

      var ta = document.createElement('textarea');

      try { document.execCommand('copy'); done(); } catch(e){}
      document.body.removeChild(ta);
    }
  };

  var cl = el('button','act','닫기'); cl.onclick = closeDetail;
  act.appendChild(cl);

  if (tideOnly_()){
    var KILL = ['수중 시야', '바다와 하늘', '점수를 이렇게', '파도가 어디까지', '근거와 주의', '같은 날 낚시는', '조건 맞춤 장비'];

      for (var q2 = 0; q2 < KILL.length; q2++)
        if (tt.textContent.indexOf(KILL[q2]) >= 0){ secs2[q].remove(); break; }
    }
  }

  b.scrollTop = 0;
  playIn_(b);
}

  };

/* 조석 곡선 SVG */
function tideSVG(meta, win){
  var W = 320, H = 108, PT = 10, PB = 20;
  var ev = (meta.events||[]).slice().sort(function(a,b){ return a.t-b.t; });
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  if (!ev.length) return svg;

  // 앞뒤로 가상 극점을 붙여 0~24시를 모두 덮는다
  var pts = ev.slice();
  var P = 6.2103;
  while (pts[0].t > 0)      pts.unshift({ k: pts[0].k==='H'?'L':'H', t: pts[0].t - P, lv: oppLv(pts, pts[0]) });
  while (pts[pts.length-1].t < 24){
    var last = pts[pts.length-1];
    pts.push({ k: last.k==='H'?'L':'H', t: last.t + P, lv: oppLv(pts, last) });
  }
  function oppLv(list, ref){
    for (var k=0;k<list.length;k++){ if (list[k].k !== ref.k) return list[k].lv; }
    return ref.lv;
  }
  var lvs = pts.map(function(p){ return p.lv; });
  var mn = Math.min.apply(null,lvs), mx = Math.max.apply(null,lvs);
  if (mx - mn < 10) mx = mn + 10;
  var X = function(t){ return t/24*W; };
  var Y = function(l){ return PT + (1 - (l-mn)/(mx-mn)) * (H-PT-PB); };

  function level(t){
    for (var k=0;k<pts.length-1;k++){
      if (t >= pts[k].t && t <= pts[k+1].t){
        var a = pts[k], b2 = pts[k+1];
        var f = (t - a.t)/(b2.t - a.t);
        return (a.lv + b2.lv)/2 + (a.lv - b2.lv)/2 * Math.cos(Math.PI*f);
      }
    }
    return pts[pts.length-1].lv;
  }
  var dpath = '', apath = '';
  for (var t=0; t<=24; t+=0.25){
    var x = X(t).toFixed(1), y = Y(level(t)).toFixed(1);
    dpath += (t===0 ? 'M' : 'L') + x + ' ' + y;
  }
  apath = dpath + 'L'+W+' '+(H-PB)+'L0 '+(H-PB)+'Z';

  // 그라데이션
  var defs = document.createElementNS(ns,'defs');
  defs.innerHTML = '<linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="#35d0ff" stop-opacity=".38"/>'+
    '<stop offset="100%" stop-color="#35d0ff" stop-opacity="0"/></linearGradient>';
  svg.appendChild(defs);

  // 야간 음영
  function shade(a, b2){
    if (b2 <= a) return;
    var r = document.createElementNS(ns,'rect');
    r.setAttribute('x', X(a)); r.setAttribute('y', 0);
    r.setAttribute('width', X(b2)-X(a)); r.setAttribute('height', H-PB);
    r.setAttribute('fill','rgba(2,10,18,.45)');
    svg.appendChild(r);
  }
  if (meta.sunrise != null) shade(0, meta.sunrise);
  if (meta.sunset != null)  shade(meta.sunset, 24);

  // 추천 시간창
  function drawWin(a2, b3){
    if (b3 > a2){
      var hi = document.createElementNS(ns,'rect');
      hi.setAttribute('x', X(a2)); hi.setAttribute('y', 0);
      hi.setAttribute('width', X(b3)-X(a2)); hi.setAttribute('height', H-PB);
      hi.setAttribute('fill','rgba(46,230,168,.16)');
      hi.setAttribute('stroke','rgba(46,230,168,.5)'); hi.setAttribute('stroke-width','1');
      hi.setAttribute('class','tide-win');
      svg.appendChild(hi);
      var lb = document.createElementNS(ns,'text');
      lb.setAttribute('x', (X(a2)+X(b3))/2); lb.setAttribute('y', H-PB-5);
      lb.setAttribute('text-anchor','middle'); lb.setAttribute('font-size','9');
      lb.setAttribute('fill','#2ee6a8'); lb.setAttribute('font-weight','800');
      lb.setAttribute('class','tide-win-lb');
      lb.textContent = '추천';
      svg.appendChild(lb);
    }
  }
  if (win){
    var wa = win[0], wb = win[1];
    drawWin(Math.max(0, wa), Math.min(24, wb));
    if (wb > 24) drawWin(0, wb - 24);        // 자정을 넘긴 부분
    if (wa < 0)  drawWin(24 + wa, 24);
  }

  var area = document.createElementNS(ns,'path');
  area.setAttribute('d', apath); area.setAttribute('fill','url(#tg)');
  area.setAttribute('class','tide-area');
  svg.appendChild(area);
  var line = document.createElementNS(ns,'path');
  line.setAttribute('d', dpath); line.setAttribute('fill','none');
  line.setAttribute('class','tide-line');
  line.setAttribute('stroke','#35d0ff'); line.setAttribute('stroke-width','2'); line.setAttribute('stroke-linecap','round');
  svg.appendChild(line);

  // 극점 표시
  ev.forEach(function(e){
    var c = document.createElementNS(ns,'circle');
    c.setAttribute('cx', X(e.t)); c.setAttribute('cy', Y(e.lv)); c.setAttribute('r', 3.2);
    c.setAttribute('fill', e.k==='H' ? '#35d0ff' : '#2ee6a8');
    svg.appendChild(c);
    var tx = document.createElementNS(ns,'text');
    tx.setAttribute('x', Math.min(W-16, Math.max(16, X(e.t))));
    tx.setAttribute('y', Y(e.lv) + (e.k==='H' ? -8 : 14));
    tx.setAttribute('text-anchor','middle'); tx.setAttribute('font-size','9');
    tx.setAttribute('fill', e.k==='H' ? '#8fd8f5' : '#8fe6c8'); tx.setAttribute('font-weight','700');
    tx.textContent = hmH(e.t);
    svg.appendChild(tx);
  });

  // 현재 시각
  if (S.ds === BOOT.today){
    var now = new Date(); var nt = now.getHours() + now.getMinutes()/60;
    var nl = document.createElementNS(ns,'line');
    nl.setAttribute('x1', X(nt)); nl.setAttribute('x2', X(nt));
    nl.setAttribute('y1', 0); nl.setAttribute('y2', H-PB);
    nl.setAttribute('stroke','#fff'); nl.setAttribute('stroke-width','1');
    nl.setAttribute('stroke-dasharray','3 3'); nl.setAttribute('opacity','.55');
    svg.appendChild(nl);
  }
  // 기준선
  var base = document.createElementNS(ns,'line');
  base.setAttribute('x1',0); base.setAttribute('x2',W);
  base.setAttribute('y1',H-PB); base.setAttribute('y2',H-PB);
  base.setAttribute('stroke','rgba(255,255,255,.12)'); base.setAttribute('stroke-width','1');
  svg.appendChild(base);
  return svg;
}

/* ══════════════ 날짜 ══════════════ */
/* ── 물때만 날짜 ──
   기상 예보는 7일이 한계다. 그 너머 날짜는 점수를 지어내지 않고
   물때·진입/퇴로처럼 조석만으로 계산되는 것만 보여준다. */
var WX_DAYS = 6;                       // 오늘 포함 7일 (오늘+6)
function tideOnlyDs_(ds){
  try {
    var b = parseDs(BOOT.today), d = parseDs(ds);
    return Math.round((d - b) / 86400000) > WX_DAYS;
  } catch(e){ return false; }
}

function renderDates(){

    var ds = dstr(d);
    var far = k > WX_DAYS;

    }; })(ds, far);

/* ══════════════ 바텀시트 드래그 ══════════════ */
(function(){
  var sheet = $('sheet'), h = $('handle');
  var closedY = null, startY = 0, cur = 0, dragging = false;
  function closed(){
    return sheet.classList.contains('open') ? 0 : sheet.offsetHeight - 148 - (window.__sb||0);
  }
  function setY(y){ sheet.style.setProperty('--sy', y + 'px'); }
  function down(e){
    dragging = true; sheet.classList.add('drag');
    startY = (e.touches ? e.touches[0].clientY : e.clientY);
    cur = sheet.classList.contains('open') ? 0 : sheet.offsetHeight - 148;
    e.preventDefault();
  }
  function move(e){
    if (!dragging) return;
    var y = (e.touches ? e.touches[0].clientY : e.clientY) - startY + cur;
    y = Math.max(0, Math.min(sheet.offsetHeight - 100, y));
    setY(y);
  }
  function up(){
    if (!dragging) return;
    dragging = false; sheet.classList.remove('drag');
    var y = parseFloat(getComputedStyle(sheet).getPropertyValue('--sy')) || 0;
    var open = y < (sheet.offsetHeight - 148) / 2;
    sheet.style.removeProperty('--sy');
    sheet.classList.toggle('open', open);
    syncPick();
  }
  h.addEventListener('touchstart', down, { passive:false });
  h.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('mouseup', up);
  h.addEventListener('click', function(){
    if (!dragging){ sheet.classList.toggle('open'); syncPick(); }
  });
})();

/* 상세 패널 아래로 밀어 닫기 */
(function(){
  var p = $('detailPanel'), h = $('detailHandle');

  function down(e){ on = true; sy = (e.touches?e.touches[0].clientY:e.clientY); p.classList.add('drag'); e.preventDefault(); }
  function move(e){
    if (!on) return;
    var dy = Math.max(0, (e.touches?e.touches[0].clientY:e.clientY) - sy);
    p.style.transform = 'translateY(' + dy + 'px)';
  }
  function up(e){
    if (!on) return; on = false; p.classList.remove('drag');
    var dy = parseFloat((p.style.transform.match(/([\d.]+)px/)||[0,0])[1]) || 0;
    p.style.transform = '';
    if (dy > 110) closeDetail();
  }
  h.addEventListener('touchstart', down, { passive:false });
  h.addEventListener('mousedown', down);
  window.addEventListener('touchmove', move, { passive:false });
  window.addEventListener('mousemove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('mouseup', up);
})();

   "우리 번호로 몇 통 왔냐"에 답할 수 있어야 업체에서 돈을 받을 수 있다.
   앱스판은 서버가 받고, 정적판은 data/track.json 에 적힌 곳으로 흘려보낸다.
   보낼 곳이 없으면 이 기기에만 쌓아 두었다가 나중에 올린다. */
function bizClick(id, kind, extra){
  if (!id) return;
  var rec = { id:id, kind:kind||'partner', t:Date.now(),
              spot:(window.__detail && window.__detail.point) ? window.__detail.point.i : null,
              ref:(typeof refCode==='function' ? refCode() : ''),
              uid:(typeof myUid==='function' ? myUid() : ''),
              extra: extra||'' };
  /* 앱스 스크립트판 */
  try { if (window.google && google.script && google.script.run) google.script.run.apiBizClick(id, rec.kind); } catch(e){}
  /* 이 기기 기록 — 보낼 곳이 없어도 잃지 않는다 */
  try {
    var q = JSON.parse(localStorage.getItem('hrn_biz') || '[]');
    q.push(rec); if (q.length > 500) q = q.slice(-500);
    localStorage.setItem('hrn_biz', JSON.stringify(q));
  } catch(e){}
  bizFlush_();
}
var BIZ_CFG = null, BIZ_SENDING = false;
function bizFlush_(){
  if (BIZ_SENDING) return;
  var go = function(cfg){
    if (!cfg || !cfg.url) return;
    var q = [];
    try { q = JSON.parse(localStorage.getItem('hrn_biz') || '[]'); } catch(e){}
    if (!q.length) return;
    BIZ_SENDING = true;
    var send = function(r){
      if (cfg.form){
        /* 구글 폼으로 보내는 방식 — 서버 없이도 시트에 쌓인다 */
        var fd = new FormData();
        var f = cfg.form;
        if (f.id)   fd.append(f.id,   r.id);
        if (f.kind) fd.append(f.kind, r.kind);
        if (f.spot) fd.append(f.spot, r.spot === null ? '' : String(r.spot));
        if (f.ref)  fd.append(f.ref,  r.ref || '');
        if (f.uid)  fd.append(f.uid,  r.uid || '');
        if (f.t)    fd.append(f.t,    new Date(r.t).toISOString());
        return fetch(cfg.url, { method:'POST', mode:'no-cors', body:fd });
      }
      return fetch(cfg.url, { method:'POST', mode:'no-cors',
        headers:{'content-type':'text/plain'}, body: JSON.stringify(r) });
    };
    Promise.all(q.map(function(r){ return send(r).catch(function(){}); }))
      .then(function(){ try { localStorage.setItem('hrn_biz','[]'); } catch(e){} })
      .catch(function(){})
      .then(function(){ BIZ_SENDING = false; });
  };
  if (BIZ_CFG !== null) return go(BIZ_CFG);
  fetch('data/track.json', {cache:'default'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ BIZ_CFG = (j && j.url) ? j : {}; go(BIZ_CFG); })
    .catch(function(){ BIZ_CFG = {}; });
}
function myUid(){
  try {
    var u = localStorage.getItem('hrn_uid');
    if (!u){ u = 'u' + Math.random().toString(36).slice(2, 12); localStorage.setItem('hrn_uid', u); }
    return u;
  } catch(e){ return 'u0'; }
}
function refCode(){
  try {
    var d = JSON.parse(localStorage.getItem('hrn_ref') || 'null');
    if (d && Date.now() - d.t < 30*86400000) return d.c;   // 30일 귀속 창
  } catch(e){}
  return null;
}

/* 준비물 칩 — 제휴 링크가 걸린 도구만 누를 수 있게 만든다 */

/* 금지체장 표기 — size 는 숫자, unit 은 재는 기준(전장·각장·두동장 등)
   'g' 로 끝나는 기준은 무게다 */
function sizeText_(bn){
  if (!bn || !bn.size) return '';
  var u = String(bn.unit || '');
  if (/무게|중량|g$/.test(u)) return bn.size + 'g';
  return (u ? u + ' ' : '') + bn.size + 'cm';
}
function measureHow_(unit){
  var M = {
    '전장': '주둥이 끝부터 꼬리 끝까지',
    '체장': '주둥이 끝부터 꼬리자루까지',
    '항문장': '입에서 항문까지 (전장 아님)',
    '각장': '껍데기의 가장 긴 쪽',
    '각고': '껍데기 높이',
    '두동장': '몸통(머리) 길이',
    '갑장': '등딱지 너비',
    '두흉갑장': '등딱지 길이',
    '무게': '손질하지 않은 상태의 무게'
  };
  var u = String(unit || '');
  for (var k in M) if (u.indexOf(k) >= 0) return M[k] + ' 기준';
  return u ? u + ' 기준' : '';
}


/* 쿠팡 파트너스 대가성 고지 — 공정위 추천·보증 심사지침상 링크가 보이는 자리에 함께 떠야 한다.
   숨기거나 접어두면 고지로 인정되지 않는다. */

  + '이를 통해 일정액의 수수료를 제공받습니다. 구매자가 더 내는 금액은 없습니다.');
}

/* 제휴 권유 상자 — 이 화면을 보고 있는 사람이 곧 그 자리의 업자이거나 촬영자다.
   가장 반응이 좋은 자리에만 놓는다. 아무 데나 붙이면 광고가 된다. */
function joinBox_(kind, title, body, href, cta){
  var box = el('div','joinbox ' + (kind === 'biz' ? 'jb-biz' : 'jb-ch'));
  box.innerHTML = '<b>' + title + '</b><p>' + body + '</p>';
  var a = el('a','joinbox-a', cta + ' →');
  a.href = href;
  box.appendChild(a);
  return box;
}

function shopChip(name){
  var esc = function(v){ return String(v).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var d = window.__detail;
  var hit = null;
  if (d && d.shop && d.shop.items){
    var items = d.shop.items;
    // 1순위 — 이 도구가 실제로 묶인 상품군
    for (var i = 0; i < items.length && !hit; i++){
      if (items[i].u && items[i].src && items[i].src.indexOf(name) >= 0) hit = items[i];
    }
    // 2순위 — 이름이 같거나 서로를 포함
    for (var j = 0; j < items.length && !hit; j++){
      var it = items[j];
      if (!it.u) continue;
      if (name === it.n || String(name).indexOf(it.n) >= 0 || String(it.n).indexOf(name) >= 0) hit = it;
    }
  }
  if (!hit) return '<span class="chip">' + esc(name) + '</span>';
  return '<a class="chip buy" href="' + esc(hit.u) + '" target="_blank" rel="noopener sponsored nofollow">'
       + esc(name) + ' <em>사기</em></a>';
}

function refEvent(ev){
  var c = refCode();

/* ══════════════ 원픽 접기 — 지도를 가리지 않게 ══════════════ */
function setPickMini(v){ $('pick').classList.toggle('mini', v); }
function pickClosed(){

}

$('pick').querySelector('.pick-inner').addEventListener('click', function(){

});

/* ══════════════ 접근 방식 필터 ══════════════ */
$('filters').addEventListener('click', function(e){
  var b = e.target.closest('.fchip');
  if (!b || b.classList.contains('on')) return;
  $('filters').querySelectorAll('.fchip').forEach(function(x){ x.classList.remove('on'); });

  S.filter = b.dataset.f;
  S._moved = false;

});

/* ══════════════ 어종·지점 찾기 ══════════════ */
function movePillIn(seg){
  var act = seg.querySelector('.seg-btn.active'), pill = seg.querySelector('.seg-pill');
  if (!act || !pill) return;
  pill.style.width = act.offsetWidth + 'px';
  pill.style.transform = 'translateX(' + (act.offsetLeft - 4) + 'px)';
}
function openFinder(){
  $('finder').hidden = false;
  S.fmode = S.mode;
  $('fseg').querySelectorAll('.seg-btn').forEach(function(x){
    x.classList.toggle('active', x.dataset.fmode === S.fmode);
  });
  setTimeout(function(){ movePillIn($('fseg')); }, 30);
  loadSpecies();
}
function closeFinder(){ $('finder').hidden = true; }
$('btnSearch').onclick = openFinder;
$('finderScrim').onclick = closeFinder;
$('finderHandle').onclick = closeFinder;
$('fseg').addEventListener('click', function(e){
  var b = e.target.closest('.seg-btn');
  if (!b || b.classList.contains('active')) return;
  $('fseg').querySelectorAll('.seg-btn').forEach(function(x){ x.classList.remove('active'); });
  b.classList.add('active'); movePillIn($('fseg'));
  S.fmode = b.dataset.fmode;
  if ($('wantQ')){ $('wantQ').value = ''; $('wantQX').hidden = true; }
  loadSpecies();
});

function loadSpecies(){
  var body = $('finderBody');
  body.innerHTML = '<div class="sk" style="height:96px"></div><div class="sk" style="height:96px"></div>';
  google.script.run
    .withSuccessHandler(function(list){ renderSpecies(list || []); })
    .withFailureHandler(function(){ body.innerHTML = '<p class="gauge-l" style="padding:20px 4px">목록을 불러오지 못했습니다.</p>'; })
    .apiSpecies(S.ds, S.fmode);
}
var SPLIST = [];
function renderSpecies(list){
  SPLIST = list || [];
  drawSpecies_();
}
/* 대상 검색 — 이름과 다른 이름(별명)을 함께 훑는다 */
function spMatch_(x, q){
  if (!q) return true;
  if (x.n.indexOf(q) >= 0) return true;
  var al = x.a || [];
  for (var k = 0; k < al.length; k++) if (al[k].indexOf(q) >= 0) return true;
  return false;
}
function drawSpecies_(){
  var q = ($('wantQ') && $('wantQ').value || '').trim();
  var list = SPLIST.filter(function(x){ return spMatch_(x, q); });
  var body = $('finderBody'); body.innerHTML = '';
  var g = el('div','spgrid');
  var any = el('div','spcard' + (S.want ? '' : ' on'), '<b>전체</b><span>대상 지정 없음</span>');
  any.onclick = function(){ pickWant(null); };
  g.appendChild(any);
  list.forEach(function(x){
    var cls = 'spcard' + (x.banned ? ' ban' : (x.season >= 2 ? ' peak' : '')) + (S.want === x.n ? ' on' : '');
    var sub = x.banned ? '금어기'
            : x.season >= 3 ? '제철 · ' + x.spots + '곳'
            : x.season === 2 ? '시즌 · ' + x.spots + '곳'
            : x.season > 0  ? x.spots + '곳'
            : '철 아님';
    var c = el('div', cls, '<b>' + x.n + '</b><span>' + sub + '</span>');
    c.onclick = function(){
      if (x.banned){
        var bn = x.ban || {};
        toast(x.n + '은(는) ' + (bn.from ? bn.from + '~' + bn.to + ' ' : '') + '금어기입니다', 3600);
        return;
      }
      pickWant(x.n);
    };
    g.appendChild(c);
  });
  body.appendChild(g);
  if (!list.length){
    var no = el('div','gauge-l','「' + q + '」에 맞는 대상이 없습니다.');
    no.style.padding = '20px 4px'; body.appendChild(no);
  }
  var note = el('div','gauge-l', q
    ? list.length + '개 찾았습니다.'
    : '많이 찾는 순서로 세웠습니다. 철이 아닌 대상과 금어기는 아래쪽에 있습니다.');
  note.style.padding = '12px 4px 4px';
  body.appendChild(note);
}
/* 검색창 */
(function(){
  var q = $('wantQ'), x = $('wantQX');
  if (!q) return;
  q.addEventListener('input', function(){
    x.hidden = !q.value;
    if (SPLIST.length) drawSpecies_();
  });
  x.onclick = function(){ q.value = ''; x.hidden = true; drawSpecies_(); q.focus(); };
})();
function pickWant(name){
  S.want = name;
  if (name && S.fmode !== S.mode){
    S.mode = S.fmode;
    $('seg').querySelectorAll('.seg-btn').forEach(function(x){
      x.classList.toggle('active', x.dataset.mode === S.mode);
    });
    movePill();
  }
  closeFinder();
  S._moved = false;
  load();
  if (name) toast(name + ' 기준으로 다시 계산합니다');
}
$('wantbarX').onclick = function(){ S.want = null; S._moved = false; load(); };

/* 지점 이름 검색 */
(function(){
  var inp = $('spotQ'), res = $('spotRes'), t = null;
  inp.addEventListener('input', function(){
    clearTimeout(t);
    var q = inp.value.trim();

      google.script.run.withSuccessHandler(function(list){

        list.slice(0, 25).forEach(function(x){

            + '<em>' + (x.r || ({W:'서해',S:'남해',E:'동해',J:'제주'}[x.s] || '')) + '</em>';
          r.onclick = function(){ closeFinder(); openDetail(x.i); };
          res.appendChild(r);
        });
      }).withFailureHandler(function(){ res.innerHTML = ''; }).apiSearch(q);
    }, 260);
  });
})();
